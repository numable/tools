name: Idea / 想法
description: Something a tool should show or do · 希望某个工具能显示或做到的事
labels: [idea]
body:
  - type: input
    id: tool
    attributes:
      label: Tool / 工具
      placeholder: weather
  - type: textarea
    id: idea
    attributes:
      label: What you would like / 你希望的样子
    validations:
      required: true

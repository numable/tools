name: Bug / 问题
description: A tool shows wrong data or breaks · 某个工具数据不对或用不了
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version / 工具与版本
      description: "Folder name and version from the README table · README 表里的文件夹名和版本"
      placeholder: weather v80
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 你期望的结果
  - type: input
    id: env
    attributes:
      label: Where / 在哪里
      placeholder: iPhone app 1.2 · numable CLI 0.1.12
  - type: markdown
    attributes:
      value: "Please do not paste tokens or API keys · 请不要贴出令牌或 API 密钥"

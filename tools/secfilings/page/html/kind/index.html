  --src:#91AEE8;--srcSoft:rgba(145,174,232,.16);--warn:#F5A524;--shadow:none}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--sub);font-size:13px;margin:0 0 4px;min-height:19px}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 2px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.lnk{color:var(--src);font-size:13px;font-weight:700;padding:8px 2px;margin:-8px 0}
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.warn{color:var(--warn);font-size:12px;margin:10px 2px 0}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.foot b{color:var(--fg);font-weight:600}
.foot a{color:var(--src);text-decoration:none;font-weight:600}
/* 类型胶囊:与组件上的同一颗(源色浅底 + 源色字) */
.fm{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.25;padding:2px 7px;border-radius:7px;
  background:var(--srcSoft);color:var(--src);white-space:nowrap}

.addf{display:flex;gap:8px}
.addf input{flex:1 1 auto;min-width:0;font-size:16px;height:44px;border-radius:12px;border:1px solid var(--line);
  padding:0 14px;background:var(--card);color:var(--fg);outline:none;-webkit-appearance:none;text-transform:uppercase}
.addf input::placeholder{text-transform:none;color:var(--faint)}
.addf button{flex:0 0 auto;min-width:72px;height:44px;border-radius:22px;background:var(--srcSoft);color:var(--src);
  font-weight:700;font-size:14px;padding:0 16px}
.addf button:disabled{opacity:.5}
.msg{min-height:18px;font-size:12px;color:var(--sub);margin:8px 2px 0}
.msg:empty{display:none}
.msg.bad{color:var(--warn)}
/* 常见公司:点一个就关注 */
.pre{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pre button{min-height:36px;min-width:64px;padding:0 14px;border-radius:18px;background:var(--srcSoft);color:var(--src);
  font-size:13px;font-weight:700}
.pre button.on{background:var(--tile);color:var(--sub)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:62px;text-align:left;position:relative}
.opt+.opt::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.opt .tx{flex:1 1 auto;min-width:0}
.opt b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.opt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.opt .ck{flex:0 0 auto;width:22px;height:22px;border-radius:11px;border:2px solid var(--line)}
.opt.on .ck{border:6px solid var(--src)}

.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* SEC 的表格名称里偶有 &amp; —— 先解回原字符,再 esc 一次写进 DOM。 */
function dec(s){ return String(s == null ? "" : s).replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"'); }
/* SEC 公司名(全大写 + 法律后缀)→ 读法:去末尾连续的 CO / CORP / INC / LTD …,全大写的逐词首字母大写(与 latest.df 同一规则) */
var NAME_SUF = {CO:1,COM:1,CORP:1,CORPORATION:1,INC:1,INCORPORATED:1,LTD:1,LIMITED:1,PLC:1,LLC:1,LP:1,SA:1,NV:1,AG:1,SE:1,"&":1};
function nice(s){
  s = dec(s).trim(); if (!s) return s;
  var w = s.split(/\s+/), up = s === s.toUpperCase();
  while (w.length > 1){ var l = w[w.length - 1].replace(/[.,]/g, "").toUpperCase(); if (NAME_SUF[l] || l.charAt(0) === "/") w.pop(); else break; }
  return w.map(function(x){ x = x.replace(/,$/, ""); return (up && x.indexOf("&") < 0) ? x.charAt(0) + x.slice(1).toLowerCase() : x; }).join(" ");
}
/* 只放行 https://www.sec.gov 的链接:行里的 href 来自第三方响应,别让一个 `javascript:` 混进来。 */
function safeUrl(u){ u = String(u || ""); return /^https:\/\/www\.sec\.gov\//i.test(u) ? u : ""; }
/* 桥的 call 型方法四端一律 resolve {code,msg,data}、从不 reject(G49)—— 统一在这里拆信封。 */
function un(r){ if (r && typeof r === "object" && "code" in r){ if (r.code !== 0) throw new Error(r.msg || ("code " + r.code)); return r.data; } return r; }
function toast(s){ try { xbridge.toast(s); } catch(e){} }
function applyTheme(th){
  var dark = th ? th === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
async function ready(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  return !!window.xbridge;
}
async function env(){
  /* 先认宿主 documentStart 写好的 <html data-lang>,appInfo 回来再以它为准;都拿不到 = 英文(overseas-first §1)。 */
  var hl = document.documentElement.getAttribute("data-lang") || "";
  if (hl) LANG = nbLang(hl);
  try { var a = (await xbridge.appInfo().then(un)) || {};
    applyTheme(a.theme);
    if (a.language || a.locale) LANG = nbLang(a.language || a.locale);
  } catch(e){ applyTheme(); }
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
}
function paintStatic(){
  if (I18N[LANG] && I18N[LANG].title) document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k = el.dataset.i; if (/^foot|^step|^setupB/.test(k)) el.innerHTML = t(k); else el.textContent = t(k);
  });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.placeholder = t(el.dataset.ph); });
}
/* 并发上限:同时最多 n 个请求(SEC 公开限速 10 次/秒,超了按 IP 封 10 分钟)。 */
async function pool(items, n, fn){
  var i = 0;
  async function worker(){ while (i < items.length){ var k = i++; try { await fn(items[k], k); } catch(e){} } }
  var ws = []; for (var j = 0; j < Math.min(n, items.length); j++) ws.push(worker());
  await Promise.all(ws);
}

/* ── 关注列表(data.sec_list = [{t:"NVDA", n:"NVIDIA CORP"}, …],最多 8 家)── */
var MAXF = 8, LIST = [];
async function getList(){
  var v = null;
  try { v = await xbridge.getData("sec_list").then(un); } catch(e){ v = null; }
  if (typeof v === "string"){ try { v = JSON.parse(v); } catch(e){ v = null; } }
  var out = [], seen = {};
  (Array.isArray(v) ? v : []).forEach(function(x){
    var tk = String((x && x.t) || "").toUpperCase();
    if (tk && !seen[tk] && out.length < MAXF){ seen[tk] = 1; out.push({ t: tk, n: String((x && x.n) || "") }); }
  });
  return out;
}
async function saveList(){
  /* 整份数组交给 save.af 落盘(data.set + widget.refresh)。 */
  await xbridge.runActionFlow("save", { list: LIST.slice() }).then(un);
}
/* 代码规整:去空格、转大写、「BRK.B」→「BRK-B」(SEC 只认连字符)。 */
function normTicker(s){ return String(s || "").trim().toUpperCase().replace(/\s+/g, "").replace(/\./g, "-"); }
function validTicker(s){ return /^[A-Z][A-Z0-9-]{0,9}$/.test(s); }
/* 关注一家:先到 SEC 核一次这个代码(probe.df:1 有 / 0 没有 / 空 = 没连上),再落盘。
   返回 "ok" | "dup" | "full" | "bad" | "none" | "net"。只有成功才算数 —— 失败不锁任何按钮(§9.5 #22)。 */
async function addTicker(raw){
  var tk = normTicker(raw);
  if (!validTicker(tk)) return "bad";
  if (LIST.some(function(x){ return x.t === tk; })) return "dup";
  if (LIST.length >= MAXF) return "full";
  var d = null;
  try { d = await xbridge.runDataFlow("probe", { t: tk }).then(un); } catch(e){ d = null; }
  var st = d ? String(d.st == null ? "" : d.st) : "";
  if (st === "0") return "none";
  if (st !== "1") return "net";
  LIST = await getList();
  if (LIST.some(function(x){ return x.t === tk; })) return "dup";
  if (LIST.length >= MAXF) return "full";
  LIST.push({ t: tk, n: dec(d.nm || "") });
  try { await saveList(); } catch(e){ LIST = await getList(); return "net"; }
  return "ok";
}
function addMsg(code, tk){
  return ({ ok: t("mOk").replace("{t}", tk), dup: t("mDup").replace("{t}", tk), full: t("mFull"),
            bad: t("mBad"), none: t("mNone").replace("{t}", tk), net: t("mNet") })[code] || "";
}

var KINDS = ["all", "cur", "fin", "ins"];
var Q = new URLSearchParams(location.search), BRICK = String(Q.get("brickId") || Q.get("brick") || ""), CUR = String(Q.get("kind") || "all");
if (KINDS.indexOf(CUR) < 0) CUR = "all";
var BUSY = false;
function paint(){
  document.getElementById("opts").innerHTML = KINDS.map(function(k){
    return '<button class="opt' + (k === CUR ? " on" : "") + '" type="button" data-k="' + k + '"><span class="tx"><b>' + esc(t("k_" + k)) +
      "</b><small>" + esc(t("d_" + k)) + '</small></span><span class="ck"></span></button>';
  }).join("");
}
async function pick(k){
  if (BUSY) return;
  CUR = k; paint();
  if (!BRICK){ toast(t("noBrick")); return; }
  BUSY = true;
  /* updateParams 是逐键合并:写回即落盘 + 那个组件重渲,不用再补 widget.refresh */
  try { await xbridge.updateParams(BRICK, { kind: k }).then(un); } catch(e){ BUSY = false; toast(t("saveFail")); return; }
  xbridge.haptic && xbridge.haptic();
  setTimeout(function(){ try { xbridge.closePage(); } catch(e){} }, 320);
}
document.addEventListener("click", function(e){ var el = e.target.closest("[data-k]"); if (el) pick(el.dataset.k); });
(async function boot(){
  if (!(await ready())){ applyTheme(); paintStatic(); paint(); return; }
  await env(); paintStatic(); paint();
})();
</script>

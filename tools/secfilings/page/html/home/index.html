<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEC Filings</title>
<style>
/* 与组件同源(§4.2b):同一套块、同一个源色;页边距 14、卡片圆角 14、段标题 13/700(status / pkgstats 同款)。
   源色只做点 / 线 / 胶囊;平台 accent 绿只留给「添加组件」。 */
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--faint:#9AA0A6;--line:#E4E7EC;--tile:#E7E9EE;
  --src:#1C3F7A;--srcSoft:rgba(28,63,122,.12);--warn:#B45309;--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--faint:#5E636B;--line:#262A31;--tile:#20232A;
  --src:#91AEE8;--srcSoft:rgba(145,174,232,.16);--warn:#F5A524;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--sub);font-size:13px;margin:0 0 4px;min-height:19px}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 2px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.lnk{color:var(--src);font-size:13px;font-weight:700;padding:8px 2px;margin:-8px 0}
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.warn{color:var(--warn);font-size:12px;margin:10px 2px 0}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.foot b{color:var(--fg);font-weight:600}
.foot a{color:var(--src);text-decoration:none;font-weight:600}
/* 类型胶囊:与组件上的同一颗(源色浅底 + 源色字) */
.fm{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.25;padding:2px 7px;border-radius:7px;
  background:var(--srcSoft);color:var(--src);white-space:nowrap}
/* 添加代码:输入框字号必须 ≥16px(iOS 聚焦 <16px 的输入框会放大整页,G15) */
.addf{display:flex;gap:8px}
.addf input{flex:1 1 auto;min-width:0;font-size:16px;height:44px;border-radius:12px;border:1px solid var(--line);
  padding:0 14px;background:var(--card);color:var(--fg);outline:none;-webkit-appearance:none;text-transform:uppercase}
.addf input::placeholder{text-transform:none;color:var(--faint)}
.addf button{flex:0 0 auto;min-width:72px;height:44px;border-radius:22px;background:var(--srcSoft);color:var(--src);
  font-weight:700;font-size:14px;padding:0 16px}
.addf button:disabled{opacity:.5}
.msg{min-height:18px;font-size:12px;color:var(--sub);margin:8px 2px 0}
.msg:empty{display:none}
.msg.bad{color:var(--warn)}
/* 常见公司:点一个就关注 */
.pre{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pre button{min-height:36px;min-width:64px;padding:0 14px;border-radius:18px;background:var(--srcSoft);color:var(--src);
  font-size:13px;font-weight:700}
.pre button.on{background:var(--tile);color:var(--sub)}
/* 关注的公司:横向一排胶囊,点一个 = 只看这一家(再点一次 / 点「全部公司」回到合并视图) */
.cos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 2px}
.cos::-webkit-scrollbar{display:none}
.cos button{flex:0 0 auto;min-height:34px;padding:0 13px;border-radius:17px;background:var(--card);box-shadow:var(--shadow);
  font-size:13px;font-weight:700;color:var(--fg);white-space:nowrap}
html[data-theme="dark"] .cos button{background:var(--tile)}
.cos button.on{background:var(--src);color:#FFFFFF;box-shadow:none}
html[data-theme="dark"] .cos button.on{background:var(--src);color:#0B0C0E}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px;margin:12px 0 4px}
.seg button{flex:1 1 0;font-size:13px;min-height:34px;border-radius:8px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .seg button.on{background:#2C313A;box-shadow:none}
/* 时间线:按本机日期分组,一行 = 一份文件。整行是 <a href="SEC 文件索引页">(容器按外部页打开) */
.day{font-size:12px;font-weight:700;color:var(--sub);margin:16px 4px 6px}
.fl{display:flex;align-items:center;gap:11px;padding:11px 14px;min-height:60px;text-decoration:none;color:inherit;position:relative}
.fl+.fl::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.fl .fm{flex:0 0 auto;min-width:52px;text-align:center}
.fl .g{flex:1 1 auto;min-width:0}
.fl b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.fl small{display:block;color:var(--sub);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .tm{flex:0 0 auto;color:var(--sub);font-size:12px;align-self:flex-start;margin-top:2px}
.sk{height:60px;margin:0 14px;border-bottom:1px solid var(--line);position:relative}
.sk:last-child{border-bottom:0}
.sk i{position:absolute;left:0;top:22px;width:52px;height:18px;border-radius:7px;background:var(--tile)}
.sk b{position:absolute;left:63px;top:15px;width:46%;height:12px;border-radius:6px;background:var(--tile)}
.sk s{position:absolute;left:63px;top:34px;width:30%;height:10px;border-radius:5px;background:var(--tile)}
.more{color:var(--sub);font-size:12px;line-height:1.7;margin:10px 4px 0}
.showall{display:block;width:100%;min-height:44px;margin-top:10px;border-radius:12px;background:var(--tile);color:var(--src);
  font-size:13px;font-weight:700}
.more a{color:var(--src);font-weight:700;text-decoration:none;margin-right:10px;display:inline-block;padding:4px 0}
/* 新公告提醒入口 */
.alert{display:flex;align-items:center;gap:12px;width:100%;margin-top:22px;padding:12px 14px;text-align:left;
  background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.alert .ic{flex:0 0 auto;width:34px;height:34px;border-radius:17px;background:var(--srcSoft);color:var(--src);
  display:flex;align-items:center;justify-content:center}
.alert .ic svg{width:18px;height:18px;fill:currentColor}
.alert .tx{flex:1 1 auto;min-width:0}
.alert b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.alert small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.alert .go{flex:0 0 auto;color:var(--faint);font-size:18px;line-height:1}
/* 还没关注任何公司:一屏说清要做什么、做完得到什么(§7.1 未就绪态) */
.setup{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px 16px 16px;margin-top:10px}
.setup h2{font-size:17px;margin:0 0 6px;line-height:1.35}
.setup p{color:var(--sub);font-size:13px;margin:0 0 14px;line-height:1.6}
.step{display:flex;gap:10px;margin-top:14px}
.step .n{flex:0 0 auto;width:22px;height:22px;border-radius:11px;background:var(--src);color:#FFFFFF;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
html[data-theme="dark"] .step .n{color:#0B0C0E}
.step .c{flex:1 1 auto;min-width:0}
.step .c>b{display:block;font-size:14px;font-weight:600;line-height:1.45;margin-bottom:8px}
.setup .note{color:var(--sub);font-size:11.5px;line-height:1.6;margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */

var KIND = "all", CO = "", DATA = { all:{}, cur:{}, fin:{}, ins:{} }, ERR = { all:{}, cur:{}, fin:{}, ins:{} };
var BOOTED = false, BUSY = 0, PENDING = {}, SHOWALL = false, PAGE = 30;
var PRESETS = ["AAPL", "NVDA", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "AVGO"];

/* ── 释义:我们自己的词表(8-K 按事项编号,其余按类型);未知类型退回 SEC 的表格名称 ── */
function typeCode(f){
  if (!f) return 0;
  if (Object.prototype.hasOwnProperty.call(TB.tmap, f)) return TB.tmap[f];
  for (var i = 0; i < TB.tpre.length; i++) if (f.indexOf(TB.tpre[i][0]) === 0) return TB.tpre[i][1];
  return 99;
}
function tl(code){ var x = TB.types[String(code)]; return x ? x[LANG === "zh" ? 0 : 1] : ""; }
function isNoise(f){ return f === "FWP" || String(f || "").indexOf("424B") === 0; }
function labelOf(r){
  if (r.f === "8-K"){
    var nums = String(r.i || "").match(/\d+\.\d+/g) || [], out = [];
    TB.items.forEach(function(it){ if (nums.indexOf(it[0]) >= 0) out.push(it); });
    if (out.length > 1) out = out.filter(function(it){ return it[0] !== "9.01"; });
    if (out.length){
      if (LANG === "zh") return out.map(function(it){ return it[1]; }).join("、");
      /* 英文按句首大写:第二个起首字母小写(「Reg FD」与全大写缩写开头的不动) */
      return out.map(function(it, i){ var w = it[2]; return (i && !/^(Reg |[A-Z]{2})/.test(w)) ? w.charAt(0).toLowerCase() + w.slice(1) : w; }).join(", ");
    }
    return tl(1);
  }
  var c = typeCode(r.f);
  return (c && c !== 99) ? tl(c) : dec(r.n || "");
}
/* ── 时间:SEC 的受理时刻带偏移(-04:00),Date 直接解析成绝对时刻,再按本机时区显示 ── */
function msOf(r){ var m = Date.parse(r.u || ""); if (!isNaN(m)) return m; m = Date.parse((r.d || "") + "T12:00:00Z"); return isNaN(m) ? 0 : m; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function hm(ms){ var d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dayKey(ms){ var d = new Date(ms); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function dayLabel(ms, now){
  var d = new Date(ms), k = dayKey(ms);
  if (k === dayKey(now)) return t("today");
  if (k === dayKey(now - 86400000)) return t("yday");
  var wd = t("wd")[d.getDay()];
  if (LANG === "zh") return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + wd +
    (d.getFullYear() !== new Date(now).getFullYear() ? " · " + d.getFullYear() : "");
  return wd + ", " + t("mo")[d.getMonth()] + " " + d.getDate() +
    (d.getFullYear() !== new Date(now).getFullYear() ? ", " + d.getFullYear() : "");
}

/* ── 取数:一家 × 一个分段一次 runDataFlow(co.df 带三态缓存);同时最多 2 家 ── */
async function fetchCo(tk, kind, useCache){
  try { return await xbridge.runDataFlow("co", { t: tk, kind: kind, _cache: useCache ? 1 : 0 }).then(un); }
  catch(e){ return null; }
}
function okData(d){ return !!(d && d.nm && Array.isArray(d.rows)); }
async function load(kind, force){
  var ids = LIST.map(function(x){ return x.t; }), stale = [];
  ids.forEach(function(tk){ PENDING[kind + tk] = 1; });
  await pool(ids, 2, async function(tk){
    var d = await fetchCo(tk, kind, !force);
    delete PENDING[kind + tk];
    if (okData(d)){ DATA[kind][tk] = d; delete ERR[kind][tk]; if (!force && String(d._stale) === "1") stale.push(tk); }
    else if (!DATA[kind][tk]) ERR[kind][tk] = 1;                 /* 失败不覆盖已有的数据 */
    if (kind === KIND) paint();
  });
  /* 先出的是旧货(过了 5 分钟):后台真取一次,回来原地替换(G23) */
  await pool(stale, 2, async function(tk){
    var f = await fetchCo(tk, kind, false);
    if (okData(f)){ DATA[kind][tk] = f; if (kind === KIND) paint(); }
  });
}
async function refresh(force){
  if (force){ BUSY++; xbAt.busy("xbAt", true); }
  try { await load(KIND, force); } finally { if (force && --BUSY <= 0){ BUSY = 0; xbAt.busy("xbAt", false); } }
}

/* ── 画 ── */
function nameOf(tk){ for (var i = 0; i < LIST.length; i++) if (LIST[i].t === tk) return LIST[i].n; return ""; }
function paintCos(){
  var el = document.getElementById("cos");
  el.innerHTML = '<button type="button" data-co=""' + (CO ? "" : ' class="on"') + ">" + esc(t("allCo")) + "</button>" +
    LIST.map(function(x){ return '<button type="button" data-co="' + esc(x.t) + '"' + (CO === x.t ? ' class="on"' : "") + ">" + esc(x.t) + "</button>"; }).join("");
}
function paintSeg(){ document.querySelectorAll("#seg button").forEach(function(b){ b.classList.toggle("on", b.dataset.k === KIND); }); }
function skel(n){ var s = ""; for (var i = 0; i < n; i++) s += '<div class="sk"><i></i><b></b><s></s></div>'; return '<div class="grp">' + s + "</div>"; }
var SKT = 0;
function paint(){
  var setup = !LIST.length;
  document.getElementById("setup").hidden = !setup;
  document.getElementById("main").hidden = setup;
  document.getElementById("xbAt").hidden = setup;
  document.getElementById("foot").hidden = setup;           /* 未关注时教程卡里已有一句边界说明 */
  if (setup){ document.getElementById("sub").textContent = ""; paintPresets(); return; }
  if (CO && !LIST.some(function(x){ return x.t === CO; })) CO = "";
  paintCos(); paintSeg();
  var ids = CO ? [CO] : LIST.map(function(x){ return x.t; });
  var D = DATA[KIND], rows = [], seen = {}, cut = 0, got = [], full = [], flood = [], errs = [], pend = 0, now = Date.now();
  var CAP = KIND === "all" ? 20 : 10;          /* co.df:「全部」每家 20 份,其余 10 份 */
  ids.forEach(function(tk){
    var d = D[tk];
    if (!d){ if (ERR[KIND][tk] && !PENDING[KIND + tk]) errs.push(tk); else pend++; return; }
    got.push(Number(d.fetchedMs) || 0);
    var rs = (d.rows || []).filter(function(r){ return r && r.f && safeUrl(r.h); });
    var nz = 0, fold = {};
    rs.forEach(function(r){
      if (r.a && seen[r.a]) return;             /* 并购文件会同时挂在两家名下:按编号去重 */
      if (r.a) seen[r.a] = 1;
      var ms = msOf(r), nm = nice(d.nm || nameOf(tk));
      /* 「全部」里的发行说明书(424B*)与发行补充材料(FWP):银行一天几十份。同一家同一天的折成一行「× N」 */
      if (KIND === "all" && isNoise(r.f)){
        nz++;
        var fk = tk + "|" + dayKey(ms) + "|" + (r.f === "FWP" ? "F" : "P");
        if (fold[fk]){ fold[fk].n++; if (ms > fold[fk].ms) fold[fk].ms = ms; return; }
        fold[fk] = { tk: tk, nm: nm, ms: ms, r: r, n: 1 }; rows.push(fold[fk]); return;
      }
      rows.push({ tk: tk, nm: nm, ms: ms, r: r });
    });
    /* SEC 每家每次只给前 CAP 份:列表满了 = 更早的还有。多家合并时,只显示到「各家最早那份里最新的一个」为止,
       再往前那段不完整(某家更早的文件没取到),不画,改给一行「更早的去 SEC 看」。
       ⚠️ 例外:列表几乎全是发行说明书的发行人(银行)只覆盖得了几个小时,拿它截断会把别家都截没 ——
       它不参与截断,单独写一句它只看得到哪儿。 */
    if (rs.length >= CAP){
      full.push(tk);
      var mn = Math.min.apply(null, rs.map(msOf));
      if (KIND === "all" && nz >= rs.length * 0.8) flood.push({ tk: tk, ms: mn });
      else if (mn > cut) cut = mn;
    }
  });
  rows.sort(function(a, b){ return b.ms - a.ms; });
  var shown = ids.length > 1 ? rows.filter(function(x){ return x.ms >= cut; }) : rows;
  var hidden = (!SHOWALL && shown.length > PAGE + 5) ? shown.length - PAGE : 0;   /* 长列表先给 30 行,其余点一下再展开 */
  if (hidden) shown = shown.slice(0, PAGE);

  var sub = t(LIST.length === 1 ? "subPre1" : "subPre").replace("{n}", LIST.length);
  document.getElementById("sub").textContent = sub;
  xbAt.set(document.getElementById("xbAt"), got.length ? Math.min.apply(null, got) : null);

  var box = document.getElementById("list");
  clearTimeout(SKT);
  if (!shown.length){
    if (pend){ SKT = setTimeout(function(){ if (box.dataset.s !== "sk"){ box.dataset.s = "sk"; box.innerHTML = skel(4); } }, 150); }
    else if (errs.length < ids.length){ box.dataset.s = ""; box.innerHTML = '<div class="grp"><div class="state">' + esc(CO ? t("noneCo").replace("{t}", CO) : t("none")) + "</div></div>"; }
    else { box.dataset.s = ""; box.innerHTML = '<div class="grp"><div class="state">' + esc(t("fail")) + "</div></div>"; }
  } else {
    box.dataset.s = "";
    var html = "", cur = "";
    shown.forEach(function(x){
      var dk = dayKey(x.ms || now);
      if (dk !== cur){ if (cur) html += "</div>"; cur = dk; html += '<div class="day">' + esc(x.ms ? dayLabel(x.ms, now) : "") + '</div><div class="grp">'; }
      var small = CO ? x.nm : (x.tk + (x.nm ? " · " + x.nm : ""));
      var href = safeUrl(x.r.h), fm = x.r.f, lab = labelOf(x.r) || x.r.f;
      if (x.n){                                  /* 折叠行:点开 = SEC 上这家这一类的列表 */
        fm = x.r.f === "FWP" ? "FWP" : "424B";
        lab = tl(x.r.f === "FWP" ? 20 : 19) + (x.n > 1 ? " × " + x.n : "");
        href = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=" + encodeURIComponent(x.tk) +
               "&type=" + fm + "&dateb=&owner=exclude&count=40";
      }
      html += '<a class="fl" href="' + esc(href) + '"><span class="fm">' + esc(fm) + '</span><span class="g"><b>' +
        esc(lab) + "</b><small>" + esc(small) + '</small></span><span class="tm">' + esc(x.ms ? hm(x.ms) : "") + "</span></a>";
    });
    html += "</div>";
    if (hidden) html += '<button class="showall" id="showall" type="button">' + esc(t(hidden === 1 ? "showAll1" : "showAll").replace("{n}", hidden)) + "</button>";
    box.innerHTML = html;
  }
  document.getElementById("warn").innerHTML = errs.length ? '<div class="warn">' + esc(t("errT").replace("{t}", errs.join(LANG === "zh" ? "、" : ", "))) + "</div>" : "";
  /* 更早的文件:每家一个到 SEC 公司页的链接(带当前分段的筛选) */
  var q = ({ all:"&type=&owner=exclude", cur:"&type=8-K&owner=exclude", fin:"&type=10-&owner=exclude", ins:"&type=&owner=only" })[KIND];
  var mh = "";
  if (shown.length && full.length){
    mh = '<div class="more">' + esc(t("more").replace("{n}", CAP)) + "<br>" +
      ids.map(function(tk){ return '<a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=' + encodeURIComponent(tk) + q.replace(/&/g, "&amp;") + '">' + esc(tk) + " ›</a>"; }).join("") +
      flood.map(function(f){ return "<br>" + esc(t("flood").replace("{t}", f.tk).replace("{d}", dayLabel(f.ms, now) + " " + hm(f.ms))); }).join("") + "</div>";
  }
  document.getElementById("more").innerHTML = mh;
  document.getElementById("alertBtn").hidden = !(window.xbridge && typeof xbridge.alertAdd === "function");
}

/* ── 还没关注:常见公司一点即关注 + 输入代码 ── */
function paintPresets(){
  document.getElementById("pre").innerHTML = PRESETS.map(function(tk){
    var on = LIST.some(function(x){ return x.t === tk; });
    return '<button type="button" data-p="' + tk + '"' + (on ? ' class="on"' : "") + ">" + tk + "</button>";
  }).join("");
}
var ADDING = false;
async function doAdd(raw){
  if (ADDING) return;
  var tk = normTicker(raw), msg = document.getElementById("msg"), go = document.getElementById("tkGo");
  ADDING = true; go.disabled = true; msg.className = "msg"; msg.textContent = t("mChecking").replace("{t}", tk);
  var r = "net";
  try { r = await addTicker(raw); } finally { ADDING = false; go.disabled = false; }
  msg.className = "msg" + (r === "ok" ? "" : " bad"); msg.textContent = addMsg(r, tk);
  if (r === "ok"){ document.getElementById("tkIn").value = ""; xbridge.haptic && xbridge.haptic(); await resync(); }
}

async function addAlert(){
  xbridge.haptic && xbridge.haptic();
  try {
    var d = await xbridge.alertAdd({ id: "new", params: { ins: "0" } }).then(un);
    if (d === "ok") toast(t("aOk")); else if (d === "quota") toast(t("aQuota"));
  } catch(e){}
}

document.addEventListener("click", function(e){
  var el;
  if ((el = e.target.closest("#seg button"))){ if (el.dataset.k !== KIND){ KIND = el.dataset.k; SHOWALL = false; paint(); refresh(false); } return; }
  if ((el = e.target.closest("#cos button"))){ var c = el.dataset.co || ""; CO = (CO === c) ? "" : c; SHOWALL = false; paint(); return; }
  if (e.target.closest("#showall")){ SHOWALL = true; paint(); return; }
  if ((el = e.target.closest("#pre button"))){ if (!el.classList.contains("on")) doAdd(el.dataset.p); return; }
  if (e.target.closest("#tkGo")){ doAdd(document.getElementById("tkIn").value); return; }
  if (e.target.closest("#mg")){ xbridge.route("/manage"); return; }
  if (e.target.closest("#alertBtn")){ addAlert(); return; }
  if (e.target.closest("#xbAt")){ xbridge.haptic && xbridge.haptic(); refresh(true); return; }
  if (e.target.closest("#pickw")){
    /* 加组件入口 = 一个按钮(§8.1a):系统面板里挑,调用后不提示「已添加」 */
    xbridge.pickWidgets();
  }
});
document.addEventListener("keydown", function(e){ if (e.key === "Enter" && e.target.id === "tkIn"){ e.preventDefault(); doAdd(e.target.value); } });

/* 从管理页回来(或 App 回前台):重读关注列表,新关注的公司补取 */
async function resync(){
  LIST = await getList();
  paint();
  if (LIST.length) await refresh(false);
}
document.addEventListener("visibilitychange", function(){ if (BOOTED && document.visibilityState === "visible") resync(); });
addEventListener("pageshow", function(){ if (BOOTED) resync(); });

(async function boot(){
  if (!(await ready())){ applyTheme(); paintStatic(); document.getElementById("setup").hidden = false; return; }
  await env(); paintStatic();
  LIST = await getList();
  paint();
  if (LIST.length) await refresh(false);
  BOOTED = true;
})();
</script>

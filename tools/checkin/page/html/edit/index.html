<!DOCTYPE html>
<!--
  卡片参数编辑页(路由 /edit,.xwidget events.onEdit 指到这里):长按卡 →「编辑参数」→
  本页以 sheet 呈现,?brickId=<实例> 定位要改的那张卡。点某件事 →
  xbridge.updateParams(brickId, {itemId, alias}) 立即回写(改即生效,壳上的「完成」负责关闭)。

  没有这一页,一张卡跟的是哪件事就在「添加」那一刻焊死了,想换只能删了重加。

  桥上没有「读实例当前参数」的 API,故本页不预选中 —— 只展示可选项,点了才写。
  「今日打卡」那张卡不绑定具体事项,长按它不会到这里(它的 .xwidget 没有 onEdit)。

  ⚠️ 输入控件字号必须 ≥16px(memory [[ios-webview-focus-zoom-16px]])。
  CSP:离线 html 被注入 `default-src 'self'; connect-src 'none'` —— 本页全自包含。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edit widget</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --src:#2E9E6B;--srcOn:#FFFFFF}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--src:#45C793;--srcOn:#0E1A14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 20px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.it{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it .grow{flex:1 1 auto;min-width:0}
.it .grow b svg{width:14px;height:14px;vertical-align:-2px}
.it b{display:block;font-size:15px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.it small{color:var(--sub);font-size:12px}
.use{flex:0 0 auto;border:0;background:var(--src);color:var(--srcOn);font-size:13px;font-weight:600;
  border-radius:16px;padding:7px 16px;cursor:pointer}
.use.on{background:transparent;color:var(--src);padding:7px 4px}
.state{color:var(--sub);font-size:13px;padding:14px;text-align:center}
.foot{color:var(--sub);font-size:11px;margin-top:12px;line-height:1.6}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.it,.xb-tap{position:relative}
.it::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.it:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.use,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}
.use:active,.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */
@keyframes xb-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */
@keyframes xb-sheen{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .xb-sk{opacity:1!important;animation:none!important}
  .xb-in{animation:none!important}
}
/* xb:motion end */
</style></head>

  Array.prototype.forEach.call(box.querySelectorAll("[data-id]"),function(el){
    el.addEventListener("click",function(){
      if(!(xbridge.updateParams&&brickId)){ xbridge.toast&&xbridge.toast(t("noBrick")); return; }
      // ⚠️ alias 要一起**清空**（不是改成新名字）：卡上的名字与图标现在从 stat 里读
      // （days.df / streak.df 的 iname / icon），alias 只是「用户手写的覆盖名」。
      // 这里塞一个具体名字进去，日后在详情页改名，卡片就永远停在旧名上。
      xbridge.updateParams(brickId,{itemId:el.dataset.id,alias:""});
      xbridge.toast&&xbridge.toast(t("done").replace("{n}",el.dataset.n));
      Array.prototype.forEach.call(box.querySelectorAll(".use"),function(b){
        var on=b.parentNode===el; b.classList.toggle("on",on); b.textContent=t(on?"cur":"use"); });
    });
  });
})();
</script>
</body></html>

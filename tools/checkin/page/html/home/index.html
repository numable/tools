<!DOCTYPE html>
<!--
  首页(路由 /)。通用打卡:同时打多件事,每件事各自一份记录、自己的图标 / 主题色 / 每日目标。

  ⚠️ 2026-08-21 起首页**就是打卡的地方**(A 版):右侧那颗圆可点即记一笔。
  此前刻意不在首页打卡,理由是「列表行的默认语义是导航,同一行两种语义误触代价不对称」——
  那条顾虑成立,但结论下错了:正解不是取消打卡,而是给它**专用命中区**(44pt 见方的
  `.tapwrap`,与整行导航互不重叠)+ **撤销就在原地**。缺了后者只做前者,那条顾虑才真的成立。
  整行仍然是「进详情」。

  ⚠️ **两型分叉**(同轮):事项分「做了就算」(check,二值 toggle)与「要数次数」(count,+1)。
  此前所有事项共用一套「次 / 达标日」双口径,得配一段说明书才讲得清 —— 而需要解释的交互
  就是还没收敛。现在类型决定口径与文案:check 型从头到尾不出现「次」「达标日」「每日目标」。
  ⚠️ 老数据没有 `kind`,**读侧推断、不写盘迁移**:`goal>1 → count`,否则 check。
  check 型的 log 按天去重**只在读的时候做**(`effLog`)—— 历史里一天多条的记录原样留在盘上,
  改回 count 就又都在了。

  ⚠️ 为什么整包页面都是 html:写入之后必须重算派生量(连续天数、平均间隔、最长间隔都要遍历
  相邻的**达标日**),而 flow 没有 map/filter。

  ⚠️ 事项上限 8 件,来自平台:read.df 只能按固定下标摊开(没有 map)。改上限要同时改
  read.df(l0..l7)、today.df(6 行)与本文件的 MAX 三处。

  ⚠️ 输入控件字号必须 ≥16px:iOS WKWebView 聚焦会放大整页且不回弹(memory [[ios-webview-focus-zoom-16px]])。
  CSP:离线 html 被注入 `default-src 'self'; connect-src 'none'` —— 本页全自包含,零外部引用。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Check-in</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --tile:#E7E9EE;--tile2:#EEF0F4}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--tile:#20232A;--tile2:#252930}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
/* §1 页头三段:大标题 + 时效锚(右上角) / 副标 = 此刻的状态。
   本页的副标 `今天 09-10 · 已完成 0/8` 是 page-design-system §1.1 点名的范式,原样保留。 */
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
/* 右上角 = 只有图标的「重新读取」圆钮(`.xb-at.ic`),样式全在 xb:anchor 块(tools/infosource/mk_anchor.py)。
   本包零网络,没有「取数时间」可言(card-design-system §3:无时效意义不放假锚),故**不写时间**;
   按钮本身留着 —— 在桌面小组件上打过卡再回来,点它把盘上的最新记录重读一遍。 */
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
/* §2 段标题 = 左名字 + 右摘要,13pt/Medium/sub。 */
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 2px 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:14px;padding:6px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
html[data-theme="dark"] .card{box-shadow:none}
/* 一行 = 一件事，整行只做一件事:进详情。 */
.it{display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:12px;cursor:pointer}
.it+.it{margin-top:2px}
.ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:18px}
.ic svg{width:18px;height:18px;display:block}
.it .grow{flex:1 1 auto;min-width:0}
.it b{display:block;font-size:16px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.it .d{color:var(--sub);font-size:12px;margin-top:2px}
/* §0 结论行:与 streak 卡上第二行**同一句话**(见 concludeOf 的注)。
   卡片说「距最佳纪录还差 19 天」而页面上一个字都没有,是这一轮要根治的病。 */
.it .cc{color:var(--sub);font-size:11.5px;margin-top:3px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* —— 今天那一颗:**可点的按钮**，不再是只读指示 ——
   这是本轮最大的语义变化。整行仍然是「进详情」，而这颗有自己的命中区(44pt 见方，
   与整行导航互不重叠)；勾选型再点一次即撤销，计次型点一次 +1。
   ⚠️ 误触不靠确认框兜:一次误点的代价是「今天多了一条记录」，配确认框会让每天的正常打卡
   都变成两步。兜法是**撤销就在原地**(勾选型)或**4 秒撤销条**(计次型)。 */
.tapwrap{flex:0 0 auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.tap{width:38px;height:38px;border-radius:19px;border:0;padding:0;cursor:pointer;
  background:transparent;position:relative;display:flex;align-items:center;justify-content:center;
  font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.tap svg{position:absolute;inset:0;width:38px;height:38px;transform:rotate(-90deg)}
/* ⚠️ §4.1(2026-09-10):这颗圆是整页**唯一的主操作**,而它此前是一个**空心灰圈** ——
   无实底、无描边强调、无图标,判据「不读文字能不能认出它可点」直接不成立。
   现在未打卡态 = 源色淡底 + 源色描边 + 源色 ✓;已打卡态 = 源色实底 + 白 ✓。
   ⚠️ 两态必须能分,且**已打卡态不能看起来像禁用** —— 所以已打卡是最强的那一档(实底),
      不是把它调灰。灰=禁用是平台通用语义,拿它表达「做完了」正好说反。 */
.tap .trk{fill:none;stroke:currentColor;stroke-width:2.5;opacity:.42}
/* 淡底:圆有了「面」才像控件;它在 .on 时被 .fill 的实底整个盖住,不必单独藏。 */
.tap .base{position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-radius:16px;
  background:currentColor;opacity:.12;display:block}
/* 未打卡时那枚源色 ✓ —— 「点这里就是打勾」。打上之后交给 .mk 那枚白 ✓(带庆祝动画)。 */
.tap .gh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:currentColor;font-size:16px;font-weight:700;line-height:1;
  transition:transform .18s cubic-bezier(.32,.72,0,1),opacity .12s ease}
.tap.on .gh{opacity:0;transform:scale(.55)}
.tap .arc{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:106.8;stroke-dashoffset:106.8;
  transition:stroke-dashoffset .18s cubic-bezier(.4,0,.2,1)}
.tap .fill{position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-radius:16px;
  background:currentColor;transform:scale(.2);opacity:0;
  transition:transform .26s cubic-bezier(.32,.72,0,1),opacity .14s ease}
.tap .mk{position:relative;color:#FFF;font-size:17px;font-weight:700;line-height:1;
  transform:scale(.3);opacity:0;
  transition:transform .26s cubic-bezier(.32,.72,0,1) .08s,opacity .12s ease .08s}
.tap .cnt{position:relative;color:currentColor;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.tap .cnt s{text-decoration:none;font-size:9px;opacity:.6}
.tap.on .arc{stroke-dashoffset:0}
.tap.on .fill{transform:scale(1);opacity:1}
.tap.on .mk{transform:scale(1);opacity:1}
.tap.on .cnt{color:#FFF}
/* 撤销时反向且更快，且**不给 overshoot** —— 撤销不该被庆祝。 */
.tap.undoing .arc{transition-duration:.14s}
.tap.undoing .fill{transition:transform .16s ease,opacity .12s ease}
.tap.undoing .mk{transition:transform .1s ease,opacity .08s ease}

/* 近 14 天的点条 —— 替掉了原先那句描述文案。趋势不用读，扫一眼就有。 */
.strip{display:flex;gap:3px;margin-top:6px}
.strip i{width:6px;height:6px;border-radius:3px;background:var(--line);display:block}
.strip i.on{background:currentColor}
.strip i.half{background:currentColor;opacity:.42}
.strip i.today{box-shadow:0 0 0 1.5px var(--card),0 0 0 3px currentColor}

/* 今天已经记过的塌到列表后半段 —— 注意力落在还没做的事上。
   ⚠️ **刻意不把它调暗**:打完卡那一刻是正反馈,把成果调灰是反的;而且「记了 / 没记」
   靠那颗圆的实心 ✓ 与空心环已经分得很清,再叠一层透明度是重复计费。排序本身就够了。 */
.empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 8px}
/* §3 用法说明紧贴它所描述的那组元素之后,11pt —— 它是脚注不是内容。
   此前这几句和「不联网 / 不上传」挤在页尾同一段里,离那颗要解释的圆有整整一屏。 */
.use{color:var(--sub);font-size:11px;margin:8px 2px 0;line-height:1.6}
/* 列表尾部的「添加位」—— 与 today 卡的空槽同一个语汇（标准 §4.2a：空槽不是空白，是入口） */
.new{display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:12px;
  color:var(--sub);font-size:14px;cursor:pointer}
.new i{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-style:normal;
  line-height:1;color:var(--sub)}

/* —— 页内自绘 sheet ——
   ⚠️ 刻意**不**用平台弹窗、也不用 startPageForResult：页内自绘天然收在容器视图里
   （CLAUDE.md「浮层容器边界」§4），大屏上不会溢出到窗口。
   动画照同一条契约：遮罩独立淡入淡出，卡片贴底滑上滑下（进退对称）。 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;
  transition:opacity var(--xb-mask) ease;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:11;
  border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform var(--xb-sheet) var(--xb-ease-sheet);
  box-shadow:0 -8px 30px rgba(0,0,0,.14);max-height:86vh;overflow-y:auto}
html[data-theme="dark"] .sheet{box-shadow:0 -8px 30px rgba(0,0,0,.5)}
body.open .mask{opacity:1;pointer-events:auto}
body.open .sheet{transform:translateY(0)}
.sheet h2{font-size:17px;margin:0 0 4px;font-weight:700}
.sheet .d{color:var(--sub);font-size:12px;margin-bottom:14px}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:14px 0 8px}
/* font-size 必须 ≥16px：iOS WebView 聚焦小于 16px 的 input 会把整页放大且不回弹 */
.name{width:100%;border:1px solid var(--line);background:transparent;
  color:var(--fg);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:2px solid transparent;background:var(--tile);border-radius:8px;
  width:40px;height:40px;font-size:19px;line-height:1;cursor:pointer;padding:0;color:var(--fg)}
.pick button svg{width:20px;height:20px;display:block;margin:auto}
.pick button[aria-pressed="true"]{border-color:var(--fg)}
.pick .sw{border-radius:20px}
.acts{display:flex;gap:10px;margin-top:20px}
.btn{flex:1 1 0;border:0;color:#fff;font-size:16px;font-weight:700;
  border-radius:14px;padding:14px 16px;cursor:pointer}
.btn.ghost{background:var(--tile);color:var(--fg)}
.btn[disabled]{opacity:.5}
.foot{color:var(--sub);font-size:11px;margin-top:24px;line-height:1.7}

/* —— 4 秒撤销条(只服务计次型)——
   判据:**能原地逆的不给撤销条，不能原地逆的必须给**。勾选型再点一次就是撤销，按钮自己就是
   撤销入口，再摞一条 toast 只是噪音；而计次型 +1 之后同一颗圆已经被「再 +1」占住了，
   撤销无处安放，只好另找地方。倒计时环必须可见 —— 看不见的倒计时等于没有倒计时。 */
.undock{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9}
.undo{display:flex;align-items:center;gap:11px;background:var(--fg);color:var(--bg);
  border-radius:13px;padding:12px 14px;font-size:13px;
  transform:translateY(24px);opacity:0;pointer-events:none;
  transition:transform var(--xb-sheet) var(--xb-ease-sheet),opacity var(--xb-mask) ease;
  box-shadow:0 6px 22px rgba(0,0,0,.18)}
.undo.show{transform:translateY(0);opacity:1;pointer-events:auto}
.undo .msg{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo button{border:0;background:transparent;color:var(--bg);font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer;padding:4px 2px;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.undo .ring{width:17px;height:17px;flex:0 0 auto}
.undo .ring svg{width:17px;height:17px;transform:rotate(-90deg)}
.undo .ring circle{fill:none;stroke:currentColor;stroke-width:2.5;opacity:.4}
.undo .ring .c2{opacity:1;stroke-dasharray:44;stroke-dashoffset:0}

/* 新建 sheet 里的「怎么记」二选一 */
.kinds{display:flex;flex-direction:column;gap:8px}
.kind{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;
  border:1.5px solid var(--line);background:transparent;cursor:pointer;text-align:left;
  font-family:inherit;color:var(--fg);width:100%}
.kind[aria-pressed="true"]{border-color:var(--fg)}
.kind i{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--tile);
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
.kind .g{flex:1 1 auto;min-width:0}
.kind b{display:block;font-size:15px;font-weight:600}
.kind span{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
.kind em{flex:0 0 auto;width:18px;height:18px;border-radius:9px;border:1.5px solid var(--line);
  font-style:normal;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.kind[aria-pressed="true"] em{border-color:transparent;color:#FFF}
.step{display:flex;align-items:center;gap:14px;margin-top:12px}
/* ⚠️ `[hidden]` 只是 UA 的 `display:none`,**优先级低于类选择器** —— `.step{display:flex}`
   会把它盖掉,于是 `el.hidden=true` 设了跟没设一样(选「做了就算」时次数 stepper 照样露着,
   而 JS 里查 `.hidden` 又是 true,对不上)。凡是给带 display 的类加 hidden,都要补这一条。 */
.step[hidden]{display:none}
.step button{border:0;background:var(--tile);color:var(--fg);width:40px;height:40px;
  border-radius:20px;font-size:19px;line-height:1;cursor:pointer;font-family:inherit}
.step b{font-size:18px;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.step span{color:var(--sub);font-size:12px}
.state{color:var(--sub);font-size:13px;padding:14px;text-align:center}
/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */

/* xb:anchor v1 — 由 tools/infosource/mk_anchor.py 生成,别手改(页面时效锚 §1.1) */
:root{--xb-at-bg:rgba(14,17,22,.055);--xb-at-fg:#6B7280;--xb-at-live:#128F66;--xb-at-idle:#B8BDC6}
html[data-theme="dark"]{--xb-at-bg:rgba(243,244,246,.08);--xb-at-fg:#8E939B;--xb-at-live:#6FE8BE;--xb-at-idle:#4A4F58}
.xb-at{flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;box-sizing:border-box;height:26px;min-width:26px;padding:0 10px 0 8px;margin:0 0 0 auto;border:0;border-radius:13px;background:var(--xb-at-bg);color:var(--xb-at-fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform var(--xb-out,140ms) ease,opacity var(--xb-out,140ms) ease}
.xb-at:active{transform:scale(var(--xb-scale,.96));opacity:var(--xb-dim,.72);transition-duration:var(--xb-in,60ms)}
.xb-at svg{flex:0 0 auto;display:block;width:13px;height:13px;fill:currentColor}
.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的
   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */
.xb-at.hide,.xb-at[hidden]{display:none}
@keyframes xb-at-spin{to{transform:rotate(360deg)}}
.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.xb-at.busy svg{animation:none;opacity:.5}}
/* xb:anchor end */
/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,

  for(i=0;i<ITEMS.length;i++){
    var it=ITEMS[i], g=goalOf(it), s=computeStat(effLog(it),g);
    for(k in s.byDay){
      if(k<cut) continue;                       // yyyy-MM-dd 定长,字典序即时间序
      if(s.byDay[k]>=g) byDay[k]=(byDay[k]||0)+1;
    }
  }
  return {total:ITEMS.length, byDay:byDay};
}
async function saveLog(it){
  await xbridge.runFlow("save",{id:it.id,log:it.log,
    stat:computeStat(effLog(it),goalOf(it),
      {pal:it.pal,icon:icName(it.icon),name:it.name,kind:kindOf(it)}),
    // ⚠️ agg 必须在**调用点**现算:此时 it.log 已经改过了,聚合要反映这一笔。
    agg:computeAgg()});
}
async function saveItems(){
  await xbridge.runFlow("items",{items:ITEMS.map(function(x){
    return {id:x.id,name:x.name,icon:icName(x.icon),pal:x.pal,kind:kindOf(x),goal:goalOf(x),
            createdAt:x.createdAt};}),
    // 增删事项会改变 agg.total(以及被删那件事的 byDay 贡献),所以这条路也要写回。
    agg:computeAgg()});
}

/* —— 一行的右侧那颗圆 ——
   check:空心环 / 实心 ✓。count:环按 次数/目标 走 + 圆内数字,达标后实心 ✓。
   ⚠️ SVG 半径 17 → 周长 106.8,与 CSS 的 stroke-dasharray 必须同值,否则环永远画不满。 */
function tapHtml(it){
  var k=kindOf(it), g=goalOf(it), c=countToday(it), on=c>=g;
  var arc = on ? 0 : 106.8*(1-Math.min(k==="count"?c/g:0,1));
  /* §4.1:未打卡态也要有「面」与图标 —— 计次型内圈是数字(它本身就是内容),
     勾选型给一枚源色 ✓,打上之后由 .mk 那枚白 ✓ 接手。 */
  var inner = k==="count" && !on
    ? '<span class="cnt">'+c+'<s>/'+g+'</s></span>'
    : '<span class="gh">✓</span><span class="mk">✓</span>';
  return '<span class="tapwrap"><button class="tap'+(on?" on":"")+'" data-tap="'+esc(it.id)+'"'+
         ' aria-pressed="'+(on?"true":"false")+'" aria-label="'+esc(it.name)+'">'+
         '<svg viewBox="0 0 38 38"><circle class="trk" cx="19" cy="19" r="17"></circle>'+
         '<circle class="arc" cx="19" cy="19" r="17" style="stroke-dashoffset:'+arc.toFixed(1)+'"></circle></svg>'+
         '<span class="base"></span><span class="fill"></span>'+inner+"</button></span>";
}

/* 近 14 天点条。今天那颗带一圈描边 —— 它同时是右边那颗大圆的「缩影」,两者永远同态。 */
function stripHtml(it){
  var g=goalOf(it), h="", d0=dayMid(Date.now()), i;
  for(i=13;i>=0;i--){
    var ms=d0-i*864e5, c=countOn(it,ms);
    var cls = c>=g ? "on" : (c>0 ? "half" : "");
    if(i===0) cls += (cls?" ":"")+"today";
    h+='<i'+(cls?' class="'+cls+'"':"")+"></i>";
  }
  return '<div class="strip">'+h+"</div>";
}

/* 加卡入口 = **一个按钮**(§8.1a):打开系统「添加到仪表盘」面板,由**用户**在面板里挑。
   包内不画组件名录 —— 那是在手抄一份 .xwidget 目录(与真目录两份真源,新增组件忘了改就永远加不到),
   而面板已经做得更好(真 RCN 预览、轮播 ⇄ 网格、多选)。
   ⚠️ 候选只列**不吃 itemId** 的聚合卡。streak/recent/rhythm/overview 四张都要先指定是哪件事,
      摆在首页就得引入一个「当前选中项」—— 用户看不见它、也说不清加的是谁(§8.1 的判据)。
   ⚠️ **每次 paint 都重绑**(paint 会重渲整个列表),所以用 onclick 而不是 addEventListener,
      否则同一个按钮会叠上 N 个监听、一次点击开 N 次面板。
   ⚠️ 不提示「已添加」:落盘只发生在面板里的原生按钮上,用户完全可能翻两下就关掉。 */
function bindPick(){
  var b=document.getElementById("pickw");
  if(!b) return;
  b.onclick=function(){
    if(!(window.xbridge && xbridge.pickWidgets)) return;
    xbridge.pickWidgets(PICKS.map(function(id){ return {id:id}; }));
  };
}

function paint(){
  var done=0, i;
  for(i=0;i<ITEMS.length;i++) if(doneToday(ITEMS[i])) done++;
  document.getElementById("sub").textContent =
    t("today")+" "+fmtDay(Date.now()).slice(5)+" · "+
    t("doneOf").replace("{a}",done).replace("{b}",ITEMS.length);

  /* 一件事都没有 → 藏掉加卡区:那时候 today 卡渲出来是空的,加了也是白加
     (§8.1a 纪律 4「加不出数据的卡不进候选」/ G12「不得出现点了没反应的控件」)。 */
  document.getElementById("addWrap").hidden = !ITEMS.length;
  document.getElementById("useLine").hidden = !ITEMS.length;

  var box=document.getElementById("listBox");
  // 满 8 件就不画「添加位」—— 画一个点了只会弹 toast 的入口，比没有入口更糟。
  var addRow = ITEMS.length<MAX
    ? '<div class="new" id="newRow"><i>＋</i><span>'+esc(t("newRow"))+"</span></div>" : "";
  if(!ITEMS.length){ box.innerHTML='<div class="empty">'+esc(t("empty"))+"</div>"+addRow; }
  else{
    /* 恒按清单原有顺序渲染,**打卡不改变位置**。
       ⚠️ 曾按「未记在前、已记塌后」稳定分区 —— 点打卡那一下立即重绘,该项瞬移到底部,
       用户读成「没打上」(2026-08-26 用户反馈,已废除)。完成态只靠大圆填充表达。 */
    var ordered=ITEMS, h="";
    for(i=0;i<ordered.length;i++){
      var it=ordered[i], col=accent(it.pal), ok=doneToday(it);
      var cc=concludeOf(it);
      h+='<div class="it" style="color:'+col+'">'+
         '<span class="ic" data-open="'+esc(it.id)+'" data-name="'+esc(it.name)+'" style="background:'+col+'22;color:'+col+'">'+icSvg(it.icon)+"</span>"+
         '<div class="grow" data-open="'+esc(it.id)+'" data-name="'+esc(it.name)+'"><b style="color:var(--fg)">'+esc(it.name)+"</b>"+
         (cc?'<div class="cc">'+esc(cc)+"</div>":"")+
         stripHtml(it)+"</div>"+
         tapHtml(it)+"</div>";
    }
    box.innerHTML=h+addRow;
    // 整行仍然是「进详情」,但**大圆那 44pt 不是** —— 它有自己的命中区,两者互不重叠。
    Array.prototype.forEach.call(box.querySelectorAll("[data-open]"),function(el){
      el.addEventListener("click",function(){
        var nm=String(el.dataset.name||"").trim();
        go("numable://self/page/item?id="+encodeURIComponent(el.dataset.open)+(nm?"&name="+encodeURIComponent(nm):"")); });
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-tap]"),function(el){
      el.addEventListener("click",function(e){ e.stopPropagation(); onTap(el.dataset.tap); });
    });
  }
  var nr=document.getElementById("newRow");
  if(nr) nr.addEventListener("click",openSheet);
  bindPick();
}

/* —— 点那一下 ——
   check:toggle。已记 → 删掉今天**全部**记录(对二值型「今天」要么有要么无);未记 → 记一条。
   count:+1,并弹 4 秒撤销条。
   ⚠️ **写盘不挡 UI**:先改内存、先重绘,`saveLog` 在后面跑。零网络本地写失败率接近零,
   为它把动画卡住 300ms 是拿常态换异常。失败了下一次 reload 会把真相拉回来。 */
var TAPPING={};
async function onTap(id){
  var it=null, i;
  for(i=0;i<ITEMS.length;i++) if(ITEMS[i].id===id) it=ITEMS[i];
  if(!it||TAPPING[id]) return;
  TAPPING[id]=1;
  try{
    var k=kindOf(it), today=fmtDay(Date.now());
    if(k==="check"){
      if(countToday(it)>0){
        it.log=it.log.filter(function(x){ return fmtDay(x)!==today; });
        hideUndo();
      }else{
        it.log.push(Date.now()); it.log.sort(function(a,b){return b-a;});
      }
    }else{
      it.log.push(Date.now()); it.log.sort(function(a,b){return b-a;});
      showUndo(it, countToday(it));
    }
    paint();
    await saveLog(it);
  } finally { delete TAPPING[id]; }
}

/* —— 撤销条(只服务计次型)—— 撤掉的是**刚才那一条**,不是清空今天。
   这正是「撤销今天会把好的那几条一起抹掉」那条老顾虑的正解:粒度对齐到动作,不对齐到天。
   ⚠️ 连点只留一条:文案改成新的次数、计时重置,撤销仍然只撤最后一次。 */
var UNDO={id:null,ts:null,timer:null};
function showUndo(it,c){
  UNDO.id=it.id; UNDO.ts=it.log[0];
  document.getElementById("undoMsg").textContent =
    t("undoOne").replace("{n}",it.name).replace("{c}",c);
  var bar=document.getElementById("undo"), cd=document.getElementById("undoCd");
  bar.classList.add("show");
  cd.style.transition="none"; cd.style.strokeDashoffset="0";
  // 双 rAF:同帧内改回 transition 会被合并掉,倒计时环就不动了。
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    cd.style.transition="stroke-dashoffset 4000ms linear"; cd.style.strokeDashoffset="44"; }); });
  clearTimeout(UNDO.timer);
  UNDO.timer=setTimeout(hideUndo,4000);
}
function hideUndo(){
  clearTimeout(UNDO.timer);
  document.getElementById("undo").classList.remove("show");
  UNDO.id=null; UNDO.ts=null;
}
async function doUndo(){
  if(UNDO.id==null||UNDO.ts==null) return;
  var it=null, i;
  for(i=0;i<ITEMS.length;i++) if(ITEMS[i].id===UNDO.id) it=ITEMS[i];
  var ts=UNDO.ts;
  hideUndo();
  if(!it) return;
  // ⚠️ 删单条用 indexOf+splice,不用 filter —— 同一毫秒的重复值会被 filter 全删光。
  var k=it.log.indexOf(ts); if(k>=0) it.log.splice(k,1);
  paint();
  await saveLog(it);
}

/* sheet 开关。⚠️ 键盘弹起时 `position:fixed;bottom:0` 会被盖住 —— iOS WebView 不缩 layout
   viewport，只缩 visualViewport。这里把键盘高度顶到 sheet 底下；没有 visualViewport 的端
   （老 WebView）退化成不顶。 */
function liftSheet(){
  var vv=window.visualViewport, el=document.getElementById("sheet");
  var kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  el.style.bottom = kb ? kb+"px" : "";
  // ⚠️ 只把 sheet 顶到键盘上方是不够的:内容一多,**顶部会被推出屏幕**,名字输入框整个看不见
  // (iOS 模拟器实测,2026-08-21 —— 浏览器里没有软键盘,这条验不出来)。
  // 可用高必须扣掉键盘,不能只靠 CSS 的 86vh(vh 算的是 layout viewport,不随键盘缩)。
  el.style.maxHeight = ((vv ? vv.height : window.innerHeight) - 24) + "px";
}
function paintPicker(){
  var ib=document.getElementById("icons"), h="", i;
  for(i=0;i<ICONS.length;i++)
    h+='<button data-ic="'+esc(ICONS[i])+'" aria-pressed="'+(ICONS[i]===NEW.icon)+'">'+IC[ICONS[i]]+"</button>";
  ib.innerHTML=h;
  Array.prototype.forEach.call(ib.querySelectorAll("[data-ic]"),function(b){
    b.addEventListener("click",function(){ hap("selection"); NEW.icon=b.dataset.ic; paintPicker(); });
  });
  var cb=document.getElementById("cols"); h="";
  for(var p=1;p<=6;p++)
    h+='<button class="sw" data-pal="'+p+'" aria-pressed="'+(p===NEW.pal)+
       '" style="background:'+PAL[p][DARK?1:0]+'"></button>';
  cb.innerHTML=h;
  Array.prototype.forEach.call(cb.querySelectorAll("[data-pal]"),function(b){
    b.addEventListener("click",function(){ hap("selection"); NEW.pal=Number(b.dataset.pal); paintPicker(); });
  });
  document.getElementById("newBtn").style.background=accent(NEW.pal);
  paintKind();
}
/* 「怎么记」二选一 + 计次型的次数 stepper(只在选了计次时出现 —— 选了「做了就算」的人
   从头到尾不该看见「次 / 天」这三个字)。 */
function paintKind(){
  ["kCheck","kCount"].forEach(function(k){
    var b=document.getElementById(k), on=(b.dataset.kind===NEW.kind);
    b.setAttribute("aria-pressed",on?"true":"false");
    b.querySelector("em").style.background = on ? accent(NEW.pal) : "";
  });
  document.getElementById("goalStep").hidden = NEW.kind!=="count";
  document.getElementById("gVal").textContent=NEW.goal;
}
function openSheet(){
  // 图标与颜色按顺序轮着给 —— 新建的两件事默认同色看着像一件事的两半。
  // 默认 check:绝大多数打卡是二值的,让 80% 的人一次也不必碰到「次 / 目标」这些词。
  NEW={icon:ICONS[(ITEMS.length+1)%ICONS.length], pal:(ITEMS.length%6)+1, kind:"check", goal:2};
  document.getElementById("newName").value="";
  paintPicker();
  document.body.classList.add("open");
  // 聚焦要等转场起来之后，否则 iOS 上键盘和滑入动画抢同一帧，sheet 会跳一下
  setTimeout(function(){ document.getElementById("newName").focus(); }, 260);
}
function closeSheet(){
  document.body.classList.remove("open");
  document.getElementById("newName").blur();
}

async function reload(){
  hideUndo();          // 从详情页返回时那条计次撤销条已经没有意义了(数据可能已被改过)
  try{
    var r=await xbridge.runDataFlow("read",{});
    var dd=(r&&r.data)||{};
    var list=Array.isArray(dd.items)?dd.items:[];
    ITEMS=[];
    for(var i=0;i<list.length&&i<MAX;i++){
      var lg=dd["l"+i]; lg=Array.isArray(lg)?lg.slice():[];
      lg.sort(function(a,b){return b-a;});
      ITEMS.push({id:list[i].id,name:list[i].name,icon:icName(list[i].icon||"target"),
                  pal:Number(list[i].pal)||1,kind:list[i].kind,
                  goal:Number(list[i].goal)||1,
                  createdAt:list[i].createdAt,log:lg});
    }
  }catch(e){ /* 读不到就保持上一份，不要清空成「一件事都没有」 */ }
  paint();
  void syncAgg(dd && dd.agg);
}

/* 冷启动补写:三张聚合卡读的是落盘的 `agg`,而它只在打卡 / 增删事项时才被写。
   老用户从旧版包升上来时盘上**压根没有这个 key** —— 卡片会一直空着,直到他碰巧打一次卡。
   所以每次读完都比对一次「盘上的」与「算出来的」,不一致才补写。

   ⚠️ 走 agg.af(只 data.set)而**不是** save.af —— 后者末尾带 widget.refresh,
      那会让「打开一次首页」= 把盘上所有卡片重渲一轮,纯浪费。
   ⚠️ 比对用 JSON 串:两边都是「字符串键 → 整数」的扁平表,computeAgg 的 for-in 与
      JSON.stringify 的键序在同一份对象上是一致的,足够当指纹用。
   ⚠️ 失败不管:补写是锦上添花,失败最多让卡片晚一次打卡才更新,不该打断首页。 */
async function syncAgg(onDisk){
  try{
    var now=computeAgg();
    if(onDisk && JSON.stringify(onDisk)===JSON.stringify(now)) return;
    await xbridge.runFlow("agg",{agg:now});
  }catch(e){}
}

/* 启动顺序照 market boot()(doc/overseas-first.md §1–§2):先读宿主写好的 <html data-lang>,
   再等 appInfo(nbInfo 处理信封);**缺省英文**。 */
(async function boot(){
  var de=document.documentElement;
  if(de.getAttribute("data-lang")) LANG=nbLang(de.getAttribute("data-lang"));
  var d=await nbInfo();
  LANG=nbLang(d.language||d.locale);
  if(!window.xbridge){ applyTheme(de.getAttribute("data-theme")||undefined);
    document.body.insertAdjacentHTML("afterbegin",'<div class="state">'+esc(t("notX"))+"</div>"); return; }
  applyTheme(d.theme||de.getAttribute("data-theme")||undefined);
  document.title=t("title");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(el){
    el.textContent=t(el.dataset.i);});
  /* 右上角「重新读取」圆钮:只画图标(本包无时间可锚),无障碍名随语言。 */
  var fr=document.getElementById("fresh");
  xbAt.set(fr,null); fr.setAttribute("aria-label",t("reload"));
  document.getElementById("newName").placeholder=t("newPh");
  document.getElementById("newBtn").textContent=t("newBtn");
  document.getElementById("newCancel").textContent=t("newCancel");
  document.getElementById("newHint").textContent=t("newHint").replace("{n}",MAX);
  document.getElementById("gHint").textContent=t("gHint");
  document.getElementById("undoTxt").textContent=t("undoBtn");

  ["kCheck","kCount"].forEach(function(k){
    document.getElementById(k).addEventListener("click",function(){
      // 已经选中的那个再点一次 = 什么都没变,不该有反馈(离散选择的语义是「变了」)。
      if(NEW.kind!==this.dataset.kind) hap("selection");
      NEW.kind=this.dataset.kind; paintKind(); });
  });
  // ⚠️ 触觉分两态:值真的变了 = selection;**撞到上下限 = warning**。
  //    到边界完全不给反馈会让人以为「按钮没点上」而反复戳(屏幕上那个数字纹丝不动,
  //    没有任何东西告诉他这是拒绝而不是丢失);而给 selection 又是在撒谎 —— 什么都没变。
  document.getElementById("gDec").addEventListener("click",function(){
    if(NEW.goal>2){ hap("selection"); NEW.goal--; paintKind(); } else hap("warning"); });
  document.getElementById("gInc").addEventListener("click",function(){
    if(NEW.goal<20){ hap("selection"); NEW.goal++; paintKind(); } else hap("warning"); });
  document.getElementById("undoBtn").addEventListener("click",function(){ void doUndo(); });
  /* 右上角圆钮 = 重读一次盘、重算一遍(桌面小组件上打过卡再回来时用)。
     读盘是本地毫秒级,不接 xbAt.busy —— 转圈只会闪一下,按下态的缩放已经给了反馈。 */
  document.getElementById("fresh").addEventListener("click",function(){ void reload(); });

  var nb=document.getElementById("newBtn"), ni=document.getElementById("newName");
  async function submit(){
    var name=ni.value.trim();
    // 三条校验失败:toast 是**看**的,触觉是**感觉**的 —— 手指还压在按钮上、视线也还在按钮上时,
    // 顶部弹出来的那条 toast 未必被看见。warning 而非 error:没坏东西,只是这一下不成立。
    if(!name){ hap("warning"); toast(t("needName")); return; }
    if(ITEMS.length>=MAX){ hap("warning"); toast(t("full").replace("{n}",MAX)); return; }
    for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].name===name){ hap("warning"); toast(t("dup")); return; }
    nb.disabled=true;
    try{
      ITEMS.push({id:newId(),name:name,icon:NEW.icon,pal:NEW.pal,
                  kind:NEW.kind, goal:NEW.kind==="count"?NEW.goal:1,
                  createdAt:Date.now(),log:[]});
      await saveItems(); closeSheet(); paint();
    } finally { nb.disabled=false; }
  }
  nb.addEventListener("click",submit);
  ni.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
  document.getElementById("newCancel").addEventListener("click",closeSheet);
  document.getElementById("mask").addEventListener("click",closeSheet);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",liftSheet);
    window.visualViewport.addEventListener("scroll",liftSheet);
  }

  // ⚠️ html 栈页从子页返回不会自动重跑任何东西 —— 不接这条，从详情页改完回来看到的还是旧数字。
  // BOOTED 闸：pageshow 在首次加载时也会触发，不挡住就会和下面 boot 末尾那次 reload 撞成两次读。
  window.addEventListener("pageshow",function(){ if(BOOTED) reload(); });
  document.addEventListener("visibilitychange",function(){ if(BOOTED&&!document.hidden) reload(); });

  await reload();
  BOOTED=true;
})();
</script>
</body></html>

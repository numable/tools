<!DOCTYPE html>
<!--
  快速记一笔(路由 /quick?id=<事项 id>)。**没有界面** —— 打开即写、toast、自动退回。

  为什么需要这一页:卡片上点一下想直接记一笔,但**AF 没有数组追加原语**(action 表里只有
  data.get / set / remove / merge / has / keys / getAll / clear,没有任何 list push),
  而一条打卡记录就是往 `log_<id>` 这个时间戳数组里 push 一个数。所以「卡上静默写一条」在
  当前数据模型下**做不到**;能做的是让卡片跳到这一页,由 JS 完成写入(JS 有数组)。

  这条路同时服务两个消费者,不是为桌面单独造的:
    · 仪表盘卡上那颗圆 → 这里(RCN 无动画能力,原地写也没有过渡帧可言,差别只在多一次转场);
    · 桌面小组件 → 也只能这样(iOS 小组件只有整卡 .widgetURL,点不了单个元素)。

  ⚠️ **失败不许自动退**。写盘失败时留在页面上把话说清楚 —— 自动退回 + 一个一闪而过的 toast
  等于「看起来记上了,其实没有」,这比报错严重得多。
  ⚠️ 记完**不重复记**:check 型今天已经记过就只提示、不再追加(卡上连点两下不该变成两条)。
  ⚠️ 派生统计与两页逐字同源(kindOf / goalOf / effLog / computeStat)—— 改动时三处一起改
  (home / item / quick)。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log one</title>
<style>
:root{color-scheme:light dark;--bg:#F5F6F8;--fg:#0E1116;--sub:#6B7280}
html[data-theme="dark"]{--bg:#0B0C0E;--fg:#F3F4F6;--sub:#8E939B}

  font:14px/1.6 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.box{text-align:center;max-width:280px}
.box .big{font-size:44px;line-height:1;margin-bottom:14px}
.box .big svg{width:44px;height:44px;display:block;margin:0 auto}
.box h1{font-size:17px;margin:0 0 6px;font-weight:700}
.box p{margin:0;color:var(--sub);font-size:13px}
/* 失败态才需要一个「知道了」—— 成功态是自动退的,给按钮反而让人以为要点 */
.btn{margin-top:20px;border:0;border-radius:13px;padding:13px 22px;font-size:15px;font-weight:700;
  background:var(--fg);color:var(--bg);font-family:inherit;cursor:pointer}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}

   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .xb-sk{opacity:1!important;animation:none!important}
  .xb-in{animation:none!important}
}
/* xb:motion end */
</style></head>

  if(today-alive>864e5*1.5) return 0;
  return Math.round((dayMid(s.streakEnd)-s.streakStart)/864e5)+1;
}

  document.getElementById("d").textContent=desc||"";

    b.addEventListener("click",function(){ if(window.xbridge&&xbridge.closePage) xbridge.closePage(); });

  }
}

/* 启动顺序照 market boot()(doc/overseas-first.md §1–§2):先读宿主写好的 <html data-lang>,
   再等 appInfo(nbInfo 处理信封);**缺省英文**。 */
(async function boot(){
  var de=document.documentElement;
  if(de.getAttribute("data-lang")) LANG=nbLang(de.getAttribute("data-lang"));
  var d0=await nbInfo();
  LANG=nbLang(d0.language||d0.locale);
  document.title=LANG==="zh"?"记一笔":"Log one";
  var th=d0.theme||de.getAttribute("data-theme")||"";
  var dark = th ? th==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  if(!window.xbridge){ show("·", t("notX"), "", true); return; }

  var m=/[?&]id=([^&]*)/.exec(location.search||"");
  var ID=m?decodeURIComponent(m[1]):"";
  if(ID.indexOf("${")===0) ID="";   // 卡上的 ${w0} 没被求值 → 按「没给」处理,不去猜

  try{
    var r=await xbridge.runDataFlow("read",{});
    var dd=(r&&r.data)||{};
    var list=Array.isArray(dd.items)?dd.items:[];
    var idx=-1, i;
    for(i=0;i<list.length&&i<8;i++) if(list[i].id===ID) idx=i;
    // ⚠️ 找不到就**停在这里**,不回落到第一件事 —— 首页那种回落是为了「看错一件事」,
    // 而这里会**写数据**,写到别人头上是不可逆的。
    if(idx<0){ show("·", t("gone"), "", true); return; }

    var raw=dd["l"+idx]; raw=Array.isArray(raw)?raw.slice():[];
    raw.sort(function(a,b){return b-a;});
    var it={id:list[idx].id,name:list[idx].name,icon:icName(list[idx].icon||"target"),
            pal:Number(list[idx].pal)||1,kind:list[idx].kind,
            goal:Number(list[idx].goal)||1,log:raw};

    var k=kindOf(it), had=countOn(it,Date.now());
    if(k==="check" && had>0){
      // 已经记过 —— 只提示,不追加(卡上连点两下不该变成两条)。也不当失败,所以照常自动退。
      show(it.icon, it.name+" · "+t("dup"), t("streak").replace("{n}",streakOf(it)));
    }else{
      it.log.push(Date.now()); it.log.sort(function(a,b){return b-a;});
      await xbridge.runFlow("save",{id:it.id,log:it.log,
        stat:computeStat(effLog(it),goalOf(it),
          {pal:it.pal,icon:icName(it.icon),name:it.name,kind:kindOf(it)})});
      var n=countOn(it,Date.now());
      show(it.icon, it.name+" · "+t("done"),
           k==="count" ? t("added").replace("{n}",n) : t("streak").replace("{n}",streakOf(it)));
    }
    // 让人看清写的是哪件事、结果是什么,再退。太快等于没显示。
    setTimeout(function(){ if(window.xbridge&&xbridge.closePage) xbridge.closePage(); }, 900);
  }catch(e){
    // ⚠️ 到这里说明读或写炸了 —— **绝不自动退**。
    show("·", t("fail"), t("failD"), true);
  }
})();
</script>
</body></html>

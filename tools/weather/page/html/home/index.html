<!DOCTYPE html>
<!--
  城市管理页(路由 /city)。改版前这里是**旧首页**(搜索 + 一份「可添加的组件」列表);
  首页换成 XPage 卡片墙后,那份组件列表整个重复了,而「更换城市」点进来看到的却是加卡入口 ——
  入口名与行为对不上。现在它只做一件事:**管理我的城市**(排序 / 删除 / 搜索添加)。
  v66:删掉了「点一行 = 切换当前城市并关页」。首页 v49 起就是全部城市的列表,「当前城市」
  在界面上已不存在,点了只是改一个看不见的下标、页面一关、首页纹丝不动(2026-09-25 用户报
  「切换没有意义」)。换成上移/下移 —— 首页列表的顺序就是这份数组的顺序,这才是这页该给的操作。

  为什么数组增删放在这张 H5 页:VParser 没有数组追加/删除原语,而 H5 有完整 JS;
  桥的 runFlow 入参是**结构化**的(传数组进去就是数组),所以 JS 改完整份传给 cities-save.af
  原样写盘即可。首页那边只读不写(pick.af 只动下标)。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Cities</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --accent:#128F66;--accentStrong:#128F66;--danger:#FF5C4D}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--accentStrong:#6FE8BE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 16px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:20px}
.sec{font-size:12px;color:var(--sub);font-weight:600;margin:22px 0 10px;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
/* font-size 16px 是硬下限:iOS 聚焦 <16px 输入控件会自动放大整页 */
input.q{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
input.q:focus{border-color:var(--accent)}
/* 我的城市行:行本身**不可点**(v66 删了「设为当前」);右侧 ↑ ↓ ✕ 三个按钮。
   ⚠️ 三个按钮的命中区都撑到 44×44(iOS HIG 下限)。v65 之前 ✕ 只有 ≈25×29pt,手指点偏就落到
   整行的「设为当前 + closePage」上 =「点了 ✕ 页面直接关了」。行不再可点后这个陷阱消失,
   但三钮并排时热区仍要够大,否则点「下移」落到「删除」上。
   首行的 ↑、末行的 ↓ 置灰(disabled)而不隐藏:隐藏会让按钮列左右错位,扫一眼对不齐。 */
.mine{display:flex;align-items:center;gap:2px;padding:6px 4px 6px 14px;border-bottom:1px solid var(--line)}
.mine:last-child{border-bottom:0}
.mine .grow{flex:1 1 auto;min-width:0}
.mine b{display:block;font-size:15px;font-weight:600}
.mine small{color:var(--sub);font-size:12px}
.mv,.del{flex:0 0 auto;border:0;background:transparent;color:var(--sub);font-size:18px;
  line-height:1;padding:0;width:44px;height:44px;border-radius:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.mv{font-size:17px}
/* 温度单位(doc/overseas-first.md §7):两段分段控件,选中段抬一层底。 */
.seg{display:flex;gap:4px;padding:4px}
.seg button{flex:1 1 0;border:0;background:transparent;color:var(--sub);font:inherit;font-size:15px;
  padding:9px 0;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--fg);font-weight:600}
.mv:active{color:var(--fg);background:var(--bg)}
.del:active{color:var(--danger);background:var(--bg)}
.mv[disabled],.del[disabled]{opacity:.3;cursor:default}
.hit{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.hit:last-child{border-bottom:0}
.hit .grow{flex:1 1 auto;min-width:0}
.hit b{display:block}
.hit small{color:var(--sub)}
.add{flex:0 0 auto;border:0;background:var(--accentStrong);color:#fff;font-size:13px;font-weight:600;
  border-radius:16px;padding:7px 16px;cursor:pointer}
.add[disabled]{opacity:.5}
.state{color:var(--sub);font-size:13px;padding:14px;text-align:center}
.foot{color:var(--sub);font-size:11px;margin-top:24px;line-height:1.6}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.hit,.xb-tap{position:relative}
.hit::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.hit:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.mv,.del,.add,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}
.mv:active,.del:active,.add:active,.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */
@keyframes xb-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */
@keyframes xb-sheen{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .xb-sk{opacity:1!important;animation:none!important}
  .xb-in{animation:none!important}
}
/* xb:motion end */
</style>

<!-- xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改 -->
<script>
/* 数据刷新不再硬切:内容换了才淡入一次。三条纪律直接写在判据里 ——
   ① 首屏不过渡(首屏要立刻可读,不该等动画);
   ② 命中缓存的瞬时返回不过渡(G23「有缓存必先渲」是毫秒级,加动画反而像卡)——
      它就是首屏那一次,被 ① 一并盖住;
   ③ 边打字边筛出来的重绘不是「数据刷新」(400ms 内有过输入就不过渡),
      否则搜索结果每敲一个字母闪一下。
   另加:内容签名没变就不过渡(重绘 ≠ 换了数据)。 */
(function(){
  var RM = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
  var lastKey = 0;
  function mark(){ lastKey = Date.now(); }
  document.addEventListener("input", mark, true);
  document.addEventListener("keydown", mark, true);
  function sig(el){ var t = el.textContent || ""; return el.childElementCount + "|" + t.length + "|" + t.slice(0, 256); }
  function watch(el){
    if (!el || el.__xbm || !window.MutationObserver) return;
    el.__xbm = 1;
    var last = sig(el), first = true;
    new MutationObserver(function(){
      var s = sig(el);
      if (first){ first = false; last = s; return; }
      if (s === last) return;
      last = s;
      if (RM.matches) return;
      if (Date.now() - lastKey < 400) return;
      el.classList.remove("xb-in");
      void el.offsetWidth;                       /* 强制回流,让动画重新起跑 */
      el.classList.add("xb-in");
    }).observe(el, {childList:true, subtree:true});
  }
  function watchAll(sel){
    if (!sel) return;
    try { var ns = document.querySelectorAll(sel); for (var i=0;i<ns.length;i++) watch(ns[i]); } catch(e){}
  }
  window.xbMotion = {watch:watch, watchAll:watchAll};
  var SEL = "#mine";
  function boot(){ watchAll(SEL); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!-- xb:motion end -->
</head>
<body>
  <h1 data-i="title"></h1>
  <div class="sub" data-i="sub"></div>

  <div class="sec" data-i="mineSec"></div>
  <div id="mine" class="card"></div>

  <div class="sec" data-i="unitSec"></div>
  <div id="unit" class="card seg"><button type="button" data-u="c">°C</button><button type="button" data-u="f">°F</button></div>

  <div class="sec" data-i="searchSec"></div>
  <input id="q" class="q" type="search" autocomplete="off">
  <div id="hits" class="card" style="display:none"></div>

  <div class="foot" data-i="foot"></div>
<script>
// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
(function(){
// v49:4 → 8。老上限的理由是首页那条 chip 条排得下 4 枚 + 一个加号;首页改成竖排列表后
// 那个约束没了,真正的上限变成「首页有几个静态槽位」——RCN 无循环,列表是 8 行写死下标展开的。
// ⚠️ 三处必须同值:本页、/pick 的 remember()、gen_weather_home.py 的 N。
var MAX = 8;
var I18N = {
  "zh": {"title":"我的城市","sub":"↑↓ 调整顺序 · ✕ 删除 · 下方搜索添加","mineSec":"我的城市",
         "searchSec":"添加城市","unitSec":"温度单位","up":"上移","down":"下移","del":"删除","ph":"搜索城市，如 上海 / Tokyo","add":"添加","added":"已添加",
         "searching":"搜索中…","noHit":"没有找到匹配的城市","dup":"已在列表里","full":"最多 8 个城市",
         "foot":"数据来源：Open-Meteo（开放气象数据，无需密钥）。城市列表默认只保存在本机。城市检索结果含 OpenStreetMap 数据（© OSM 贡献者）。",
         "notX":"当前不在 XBundle 环境中"},
  "en": {"title":"My Cities","sub":"↑↓ to reorder · ✕ to remove · search below to add","mineSec":"My cities",
         "searchSec":"Add a city","unitSec":"Temperature unit","up":"Move up","down":"Move down","del":"Remove","ph":"Search a city, e.g. Tokyo","add":"Add","added":"Added",
         "searching":"Searching…","noHit":"No matching city","dup":"Already added","full":"Up to 8 cities",
         "foot":"Source: Open-Meteo (open weather data, no API key). Your city list stays on your devices. City search results include data from OpenStreetMap (© OSM contributors).",
         "notX":"Not running inside XBundle"}
};
var LANG='en', list=[], CND=false, UNIT='';
function t(k){var T=I18N[LANG]; if(T&&Object.prototype.hasOwnProperty.call(T,k)) return T[k]; return Object.prototype.hasOwnProperty.call(I18N.en,k)?I18N.en[k]:k;}  /* 空串是合法译文(如英文的后缀),不能当缺键;缺键回落英文(§2) */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function applyTheme(th){
  var dark = th==='dark' || (th!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
}
function paint(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(el){
    el.textContent = t(el.dataset.i); });
  document.getElementById('q').placeholder = t('ph');
}

// ---- 我的城市 ----
function renderMine(){
  var box = document.getElementById('mine');
  var last = list.length-1;
  box.innerHTML = list.map(function(c,i){
    // 最后一个城市不给删 —— 列表空了首页就没有取数坐标,只能渲一片 `--` 且用户无法自救。
    var lock = list.length<=1 ? ' disabled' : '';
    return '<div class="mine">'+
      '<div class="grow"><b>'+esc(c.name)+'</b><small>'+esc(c.where||'')+'</small></div>'+
      '<button class="mv" data-mv="'+i+'" data-d="-1" aria-label="'+esc(t('up'))+'"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button class="mv" data-mv="'+i+'" data-d="1" aria-label="'+esc(t('down'))+'"'+(i===last?' disabled':'')+'>↓</button>'+
      '<button class="del" data-del="'+i+'" aria-label="'+esc(t('del'))+'"'+lock+'>✕</button></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('[data-mv]'),function(b){
    b.addEventListener('click',function(){ move(+b.dataset.mv, +b.dataset.d); });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-del]'),function(b){
    b.addEventListener('click',function(){ removeAt(+b.dataset.del); });
  });
}
function save(){
  if(!(window.xbridge&&xbridge.runFlow)) return Promise.resolve();
  // 整份写回:JS 这边已经是最终状态,AF 只负责落盘(它没有数组原语)。
  return xbridge.runFlow('cities-save',{list:list},8000);
}
// 与相邻项交换。顺序即首页列表顺序,也决定首页「添加组件」预填哪座城市(第一座)。
// 返回首页时 open-city.af 会 reloadPage,新顺序即时生效。
function move(i,d){
  var j = i+d;
  if(j<0 || j>=list.length) return;
  var x = list[i]; list[i] = list[j]; list[j] = x;
  renderMine(); save();
}
function removeAt(i){
  if(list.length<=1) return;
  list.splice(i,1);
  renderMine(); save();
}
function addCity(c){
  if(list.length>=MAX) return t('full');
  var dup = list.some(function(x){ return x.lat===c.lat && x.lon===c.lon; });
  if(dup) return t('dup');
  list.push(c);
  renderMine(); save();
  return null;
}
// ---- 启动 ----
// v70:语言 / 地区按 doc/overseas-first.md §1–§2(numable-env:nbInfo 等桥、处理信封,缺省英文)。
(async function boot(){
  var info = await nbInfo();
  applyTheme(info.theme);
  LANG = nbLang(info.language || info.locale);
  CND = nbCnDefault(info);
  paint();
  if(!window.xbridge){ document.getElementById('mine').innerHTML='<div class="state">'+t('notX')+'</div>'; return; }
  xbridge.runDataFlow('cities-read',{},8000).then(function(r){
    var d = (r&&r.code===0&&r.data)||{};
    list = Array.isArray(d.list)? d.list : [];
    // v44:**不再补一座上海**。空列表是合法态 —— 首页此时是引导屏(搜索 + 常用城市),
    // 这一页拿到空数组就画一张空列表,下面的搜索框照样能加。补一座假城市等于把
    // 「你还没选城市」偷偷改写成「你选了上海」,而用户会照着它决定穿什么。
    UNIT = d.unit === 'f' ? 'f' : 'c';
    renderMine(); renderUnit();
  }).catch(function(){ renderMine(); });
})();

// ---- 温度单位(°C / °F)----
// 写 data.wxUnit(unit-save.af 落盘并刷新本包全部组件);没设过时 cities-read 按系统地区给缺省(US 等 → °F)。
// 首页由 open-city.af 在关页后软重载 —— 详情 / 行的缓存记着单位,对不上就重取,不会贴出另一种单位的数。
function renderUnit(){
  Array.prototype.forEach.call(document.querySelectorAll('#unit [data-u]'),function(b){
    b.classList.toggle('on', b.dataset.u === UNIT);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('#unit [data-u]'),function(b){
  b.addEventListener('click',function(){
    var u = b.dataset.u;
    if(u === UNIT || !window.xbridge) return;
    UNIT = u; renderUnit();
    if(xbridge.haptic) try{ xbridge.haptic('selection'); }catch(e){}
    xbridge.runFlow('unit-save',{u:u},8000);
  });
});

// ---- 搜索添加 ----
// 两路检索结果合并(geo.df 发了「裸词」与「词+市」两路,见那条流的长注)。
// ⚠️ 排序按 **population 降序**:open-meteo 的返回顺序不是按重要性的 ——
//    搜「长沙」裸搜回来的八条是重庆/贵州/广东的同名村镇(人口一千到四万),
//    而真正的湖南长沙市(pop=309万)只在「长沙市」那一路里。按人口排,它自己会站到第一位。
// ⚠️ 去重按坐标(同一个地方可能两路都回),保留先遇到的那条。
// ⚠️ 没有人口数据的条目(多数是村、镇、住宅区)一律排在有人口的之后 —— 不是丢掉:
//    小地方也可能正是用户要的(他自己搜的名字),只是不该挡在省会前面。
// Nominatim(第二源)条目 → 与 open-meteo 同形状。只在 open-meteo 交白卷时才有(见 geo.df)。
// ⚠️ 名字带**简繁双写**:「纽约;紐約」「东京都/東京都」「韩国 / 南韓」—— 分隔符 `;` 与 `/` 都有,
//    取第一段。伦敦那条是繁体在前(「大倫敦;大伦敦」),会显示成「大倫敦」——认得出,不为它再加规则。
// ⚠️ 借 `importance`(0~1)折算成伪人口参与同一套排序:0.88 → 880 万,与真实人口量级可比,
//    于是三路结果能排在同一把尺子上,不用为「哪一路优先」再写一套规则。
/* 港澳台按「地区 · 中国」显示,不与国家并列(doc/cn-review-standard.md CN-3)—— 只在国内默认(CND)时;海外默认照数据源原样显示。
   open-meteo 搜「Taipei」回的 country 是「台湾」,原样拼就成了「台湾」占国家那一格。 */
var CN_SAR={TW:['台湾','Taiwan'],HK:['香港','Hong Kong'],MO:['澳门','Macau']};
function placeOf(c){
  var r=CN_SAR[String((c&&(c.country_code||c.cc))||'').toUpperCase()];
  if(r && CND){ var zh=LANG==='zh'; return (zh?r[0]:r[1])+' · '+(zh?'中国':'China'); }   /* 只在国内默认时(doc/overseas-first.md §8) */
  return [c.admin1,c.country].filter(Boolean).join(' · ');
}
function normNom(x){
  var a = x.address || {};
  var cut = function(s){ return String(s == null ? '' : s).split(/[;/]/)[0].trim(); };
  var lat = parseFloat(x.lat), lon = parseFloat(x.lon);
  if(!isFinite(lat) || !isFinite(lon)) return null;
  return { name: cut(x.name || a.city), latitude: lat, longitude: lon,
           admin1: cut(a.state), country: cut(a.country), cc: String(a.country_code || '').toUpperCase(),
           population: Math.round((x.importance || 0) * 1e7) };
}

function mergeHits(data){
  var a = (data && data.listC) || [], b = (data && data.list) || [];
  var c = ((data && data.listN) || []).map(normNom).filter(Boolean);
  var seen = {}, out = [];
  [].concat(a, b, c).forEach(function(x){
    if(!x || x.latitude == null || x.longitude == null) return;
    var k = x.latitude + ',' + x.longitude;
    if(seen[k]) return;
    seen[k] = 1; out.push(x);
  });
  out.sort(function(p, q){ return (q.population || 0) - (p.population || 0); });
  return out.slice(0, 8);
}

// ⚠️ **请求序号守卫**:搜索是「边打字边发」,而三路的耗时差得很远 ——
//    open-meteo 两路 ~0.8s,补 OSM 那一路要 2s 上下。于是先发的慢请求会**晚于**后发的快请求回来,
//    把正确结果覆盖掉:实测打「长」→350ms→「长沙」,最后停在屏幕上的是搜「长」的结果(日本的「長」)。
//    这不是「搜错了」,是**后到的旧答案盖住了先到的新答案** —— 用户看到的现象是「搜索触发有问题」。
//    修法是每次发请求领一个号,回来时号对不上就丢弃(经典做法,别用 AbortController:
//    这里的请求走的是桥,不是 fetch)。
var seq = 0;
var timer=null;
document.getElementById('q').addEventListener('input',function(e){
  var kw=e.target.value.trim(); clearTimeout(timer);
  var box=document.getElementById('hits');
  // ⚠️ 单字不搜:中文城市名至少两字,而「长」「京」这种单字必然搜出一屏无关小地方、
  //    还会触发那条慢的补充检索(见 geo.df 第三路)。等第二个字再发,既准又省。
  if(kw.length < 2){ box.style.display='none'; seq++; return; }
  // 300ms 防抖:每敲一个字母打一次地理编码接口既慢又浪费(xbundle-template §7)。
  timer=setTimeout(function(){
    box.style.display='block'; box.innerHTML='<div class="state">'+t('searching')+'</div>';
    var my = ++seq;
    xbridge.runDataFlow('geo',{kw:kw,lang:LANG==='zh'?'zh':'en'},10000).then(function(r){
      if(my !== seq) return;                    // 已经有更新的一次搜索了 —— 丢弃这份旧答案
      var hits = (r && r.code === 0) ? mergeHits(r.data) : [];
      if(!hits.length){box.innerHTML='<div class="state">'+t('noHit')+'</div>';return;}
      box.innerHTML=hits.map(function(c,i){
        var where=placeOf(c);
        return '<div class="hit" data-k="'+i+'" data-lat="'+c.latitude+'" data-lon="'+c.longitude+
               '" data-city="'+esc(c.name)+'" data-where="'+esc(where)+'">'+
          '<div class="grow"><b>'+esc(c.name)+'</b><small>'+esc(where)+'</small></div>'+
          '<button class="add">'+t('add')+'</button></div>';}).join('');
      Array.prototype.forEach.call(box.querySelectorAll('.hit'),function(h){
        h.addEventListener('click',function(){
          var btn=h.querySelector('.add');
          var err=addCity({lat:String(h.dataset.lat),lon:String(h.dataset.lon),
                           name:h.dataset.city,where:h.dataset.where});
          btn.textContent = err || t('added');
          // ⚠️ 只有**成功**才锁按钮。失败(已满 / 重复)时保持可点、1.6s 后文案复位 ——
          // 否则用户看到「最多 4 个城市」、上去删掉一个回来,这个按钮却还是灰的,
          // 只能重新搜一遍。错误提示不该顺手把重试路径也一起关掉。
          btn.disabled = !err;
          if(err){ setTimeout(function(){ btn.textContent = t('add'); }, 1600); }
          else { setTimeout(function(){ if(xbridge.closePage) xbridge.closePage(); },420); }
        });});
    }).catch(function(){ if(my !== seq) return; box.innerHTML='<div class="state">'+t('noHit')+'</div>'; });
  },400);
});

})();
</script>
</body></html>

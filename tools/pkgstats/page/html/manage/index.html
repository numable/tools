<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">

<style>
/* 版式对齐 weather / github / tubewatch(2026-09 v2):页边距 14、卡片圆角 14 + 同一套投影(暗色换 .5px 细边)、
   段标题 13px/600 次级灰、列表行左右内边距同为 14、分隔线从文字起点缩进。
   次要动作(关注 / 选这个)= 源色浅底胶囊,已关注 = 中性灰底灰字;平台 accent 绿只留给「添加组件」。 */
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--faint:#9AA0A6;--tile:#E7E9EE;--rail:#D6DAE1;--line:#E4E7EC;
  --src:#B4329B;--srcBg:rgba(180,50,155,.10);--srcSoft:#B4329B66;--amb:#B45309;--ambBg:rgba(180,83,9,.11);
  --edge:transparent;--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--faint:#5E636B;--tile:#20232A;--rail:#2C313A;--line:#262A31;
  --src:#EE7FD6;--srcBg:rgba(238,127,214,.14);--srcSoft:#EE7FD666;--amb:#F5A524;--ambBg:rgba(245,165,36,.14);
  --edge:rgba(255,255,255,.06);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}   /* .seg / .card 等带 display 的类会压过 hidden 属性(v2 选择页单槽模式下空出一条分段栏) */
body{font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd .tx{flex:1 1 auto;min-width:0}
.hd h1{font-size:24px;line-height:1.25;font-weight:700;margin:0;letter-spacing:-.3px;word-break:break-all}
.hd .sub{color:var(--sub);font-size:13px;margin-top:3px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:.5px solid var(--edge)}
.pad{padding:14px}
.list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:.5px solid var(--edge);overflow:hidden}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px;font-size:13px;font-weight:600;color:var(--sub)}
.sec .v{font-weight:400;font-size:12px}
.sec .lnk{color:var(--src);font-weight:600;font-size:13px;padding:6px 0 6px 12px;margin:-6px 0}
/* 列表行:左右内边距同为 14;分隔线从文字起点(左 14)缩进到右缘 */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.row .l{flex:1 1 auto;min-width:0}
.row .l b{display:block;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--sub);font-size:11.5px;min-width:0}
.eco{display:inline-block;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:6px;background:var(--tile);color:var(--sub);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1.3;border-radius:8px;padding:2px 7px;white-space:nowrap;background:var(--tile);color:var(--sub)}
.pill.up,.pill.src{background:var(--srcBg);color:var(--src)}
.pill.dn{background:var(--ambBg);color:var(--amb)}
.c-up{color:var(--src)} .c-dn{color:var(--amb)} .c-flat{color:var(--sub)}
.act{flex:0 0 auto;min-width:64px;height:32px;border-radius:16px;padding:0 14px;font-size:13px;font-weight:600;background:var(--srcBg);color:var(--src);white-space:nowrap}
.act.on{background:var(--tile);color:var(--sub)}
.spk .spl{fill:none;stroke:var(--src);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spk .g0{stop-color:var(--src);stop-opacity:.22} .spk .g1{stop-color:var(--src);stop-opacity:0}
.spk .spd{fill:var(--src)}
.chev{flex:0 0 auto;color:var(--faint);font-size:17px;line-height:1}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin:22px 2px 0}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 12px}
.warn{color:var(--amb);font-size:12px;margin:10px 0 0}
.sk{display:inline-block;background:var(--tile);border-radius:6px;color:transparent}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px}
.seg button{flex:1 1 0;font-size:13px;min-height:34px;border-radius:8px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .seg button.on{background:var(--rail);box-shadow:none}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;margin-top:10px;text-align:left}
.addrow .g{flex:1 1 auto;min-width:0}
.addrow b{display:block;font-size:14px;font-weight:600}
.addrow small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
.addrow i{flex:0 0 auto;font-style:normal;color:var(--src);font-size:20px;font-weight:600;line-height:1}
/* 搜索框:字号必须 ≥16px(iOS 聚焦 <16px 的输入框会放大整页,G15) */
.sbox{display:flex;gap:8px;margin-top:10px}
.sbox input{flex:1 1 auto;min-width:0;font-size:16px;height:44px;border-radius:12px;border:.5px solid var(--edge);padding:0 14px;background:var(--card);color:var(--fg);
  box-shadow:var(--shadow);outline:none;-webkit-appearance:none}
.sbox button{flex:0 0 auto;min-width:64px;height:44px;border-radius:22px;background:var(--srcBg);color:var(--src);font-weight:600;font-size:14px;padding:0 16px}
.hint{color:var(--sub);font-size:11.5px;margin:8px 2px 0}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.row,.addrow,.xb-tap{position:relative}
.row::after,.addrow::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.row:active::after,.addrow:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.act,.ib,.seg button,.sbox button,.watch,.wst button,.lnk,.pickb,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}
.act:active,.ib:active,.seg button:active,.sbox button:active,.watch:active,.wst button:active,.lnk:active,.pickb:active,.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */
@keyframes xb-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */
@keyframes xb-sheen{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .xb-sk{opacity:1!important;animation:none!important}
  .xb-in{animation:none!important}
}
/* xb:motion end */
</style>
</head>

<style>
.it .l b{white-space:normal;word-break:break-all}
.it .vn{color:var(--sub);font-size:11.5px;margin-left:6px;font-weight:400}
.it .d{color:var(--sub);font-size:12px;margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

<header class="hd"><div class="tx"><h1 data-i="hMg"></h1><div class="sub" data-i="subMg"></div></div></header>

<form class="sbox" id="sf"><input id="kw" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-ph="ph"><button type="submit" data-i="go"></button></form>

<script>
// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* ── ps kit(包下载量四页共用,由生成脚本注入每一页;包内容必须自包含,不跨文件引用)──
   数据全部来自 npm / pypistats / PyPI / crates.io 的公开接口,经 page/flow/*.df 原样取回
   (CSP connect-src 'none',页面不能直连),解析与派生在这里用 JS 做。 */
/* 语言:缺省英文;先用 <html data-lang>,appInfo 回来再以它为准(doc/overseas-first.md §1–§2)。 */
var LANG = nbLang(document.documentElement.getAttribute("data-lang")), I18N = { zh: {}, en: {} };
function i18n(o) { for (var l in o) { I18N[l] = I18N[l] || {}; for (var k in o[l]) I18N[l][k] = o[l][k]; } }
i18n({
  zh: { notX: "请在 Numable 里打开这个页面",
    wan: "万", yi: "亿", vsWk: "较上周", flat: "与上周持平", flatS: "持平", noCmp: "上周没有下载",
    fail: "获取数据失败，显示的是上次的数据", failCold: "暂时取不到数据，请稍后点右上角的日期重试",
    notFound: "找不到这个开源包，请检查名称", ago: "%s 天前", today: "今天",
    offT: "当前地区不提供", offD: "当前地区不提供 Docker Hub 的数据。" },
  en: { notX: "Open this page in Numable",
    vsWk: "vs prev week", flat: "Flat vs prev week", flatS: "Flat", noCmp: "No downloads last week",
    fail: "Couldn't update. Showing the last data", failCold: "Couldn't get data right now. Tap the date to retry",
    notFound: "Package not found. Check the name", ago: "%sd ago", today: "today",
    offT: "Not available in your region", offD: "Docker Hub data isn't available in your region." }
});
function t(k, a) { var s = I18N[LANG] && I18N[LANG][k]; if (s == null) s = I18N.en[k]; if (s == null) s = k;
  if (a != null) s = String(s).replace("%s", a); return s; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function $(id) { return document.getElementById(id); }
function paintI18n() { var els = document.querySelectorAll("[data-i]");
  for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute("data-i"));
  var ph = document.querySelectorAll("[data-ph]");
  for (var j = 0; j < ph.length; j++) ph[j].setAttribute("placeholder", t(ph[j].getAttribute("data-ph"))); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function ready() { for (var i = 0; i < 30 && !window.xbridge; i++) await sleep(50); return !!window.xbridge; }
/* G49:call 型桥方法回的是信封 {code,msg,data};老宿主可能直接给 data —— 两种都吃。 */
async function call(p) { var r = await p;
  if (r && typeof r === "object" && "code" in r) { if (r.code !== 0) throw new Error(r.msg || "bridge"); return r.data; }
  return r; }
async function sGet(k) { try { var v = await call(xbridge.getData(k)); return (v == null || v === "") ? null : String(v); } catch (e) { return null; } }
async function sGetJ(k) { var v = await sGet(k); if (v == null) return null; try { return JSON.parse(v); } catch (e) { return null; } }
function sSet(k, v) { try { xbridge.setData(k, typeof v === "string" ? v : JSON.stringify(v)); } catch (e) {} }
function toast(m) { try { xbridge.toast(m); } catch (e) {} }
function haptic(k) { try { xbridge.haptic(k || "selection"); } catch (e) {} }
function go(path) { haptic(); try { xbridge.route("numable://self/page" + path); } catch (e) {} }
function openUrl(u) { haptic(); try { xbridge.route(u); } catch (e) {} }

/* ── 大陆不提供 Docker(2026-10-10,doc/pkgstats-infosource.md §7)──
   hub.docker.com 在大陆打不开。判据只认分发地区 region === "cn"(取不到 = 按海外照常取,与 stock 快讯、组件流同一口径);
   appInfo 不带 region 的宿主跑一次 env 流(零网络)补上。大陆:不给 Docker 分段、不发 Docker 请求,
   已关注的 Docker 镜像照常列出、标「当前地区不提供」—— 关注一个不删。 */
var REGION = "";
function dkOff(e) { return REGION === "cn" && e === "docker"; }
async function bootRegion(d) { var r = d && d.region;
  if (r == null || r === "") { try { var ev = await call(xbridge.runDataFlow("env", {}, 5000)); r = ev && ev.rg; } catch (x) { r = ""; } }
  REGION = String(r || ""); }

async function bootEnv(onChange) {
  var de = document.documentElement, d = await nbInfo();
  await bootRegion(d);
  if (!de.getAttribute("data-theme") && d.theme) de.setAttribute("data-theme", d.theme === "dark" ? "dark" : "light");
  LANG = nbLang(d.language || d.locale);
  de.lang = LANG === "zh" ? "zh-CN" : "en"; paintI18n();
  addEventListener("languagechange", function (e) {
    LANG = nbLang((e && e.detail && e.detail.language) || de.getAttribute("data-lang"));
    de.lang = LANG === "zh" ? "zh-CN" : "en"; paintI18n(); onChange && onChange("lang"); });
  addEventListener("themechange", function () { onChange && onChange("theme"); });
}

/* ── 生态 ──
   docker / brew / cask(2026-10-09)没有逐日数据:Docker Hub 只有累计拉取,Homebrew 只有近 30 / 90 / 365 天安装。
   它们不走 series(),走 nsModel();页面按 m.k("d" / "b")换一套表现,不画走势、不报较上周。 */
var ECO = { npm: "npm", pypi: "PyPI", crates: "crates.io", docker: "Docker Hub", brew: "Homebrew", cask: "Homebrew Cask" };
function normE(e) { e = String(e || "").toLowerCase(); return ECO[e] ? e : "npm"; }
function normN(e, n) { n = String(n || "").trim(); return e === "npm" ? n : n.toLowerCase(); }
function isSer(e) { return e === "npm" || e === "pypi" || e === "crates"; }
function pyName(n) { return String(n).toLowerCase().replace(/[._]+/g, "-"); }
function dRepo(n) { return n.indexOf("/") > 0 ? n : "library/" + n; }
function regUrl(e, n) { return e === "npm" ? "https://www.npmjs.com/package/" + n
  : e === "pypi" ? "https://pypi.org/project/" + n + "/"
  : e === "docker" ? (n.indexOf("/") > 0 ? "https://hub.docker.com/r/" + n : "https://hub.docker.com/_/" + n)
  : e === "brew" ? "https://formulae.brew.sh/formula/" + n : e === "cask" ? "https://formulae.brew.sh/cask/" + n
  : "https://crates.io/crates/" + n; }

/* ── 关注列表:data.ps_list(组件 board.df 读同一个键;顺序 = 首页与「关注列表」组件的显示顺序)── */
var DEF = [{ e: "npm", n: "react" }, { e: "pypi", n: "requests" }, { e: "crates", n: "serde" }];
var WL_MAX = 12;
/* ⚠️ 读法两种都吃:save.af 用 data.set 存的是结构化数组,桥 getData 可能原样给数组,也可能给 JSON 串。 */
async function wlRaw() { try { var v = await call(xbridge.getData("ps_list"));
  if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = null; } } return v; } catch (e) { return null; } }
async function wlLoad() { var a = await wlRaw(); if (!Array.isArray(a)) return DEF.slice();
  var out = [], seen = {};
  a.forEach(function (x) { if (!x || !x.n) return; var e = normE(x.e), n = normN(e, x.n), k = e + ":" + n;
    if (!seen[k]) { seen[k] = 1; out.push({ e: e, n: n }); } });
  return out; }
async function wlSave(a) { try { await call(xbridge.runFlow("save", { list: a.slice(0, WL_MAX) })); } catch (e) {} }
function wlHas(a, e, n) { for (var i = 0; i < a.length; i++) if (a[i].e === e && a[i].n === n) return true; return false; }

/* ── 取数:原样取回 + 本页解析 ── */
async function raw(flow, p) { var d = await call(xbridge.runDataFlow(flow, { p: p }, 20000));
  return String((d && d.raw) || ""); }
async function rawJ(flow, p) { var s = await raw(flow, p); if (!s) throw new Error("empty");
  var j = JSON.parse(s); if (j && j.error && !j.downloads && !j.crate && !j.objects && !j.versions) throw new Error("notfound"); return j; }
/* pypistats 按 IP 限流(连打偶发 429):一律排队串行,失败隔 1.5 秒重试一次。 */
var pyQ = Promise.resolve();
function pyQueue(fn) { var p = pyQ.then(function () { return fn(); }); pyQ = p.then(function () { return sleep(350); }, function () { return sleep(350); }); return p; }
async function retry(fn) { try { return await fn(); } catch (e) { if (e && e.message === "notfound") throw e; await sleep(1500); return await fn(); } }

/* 逐日序列 → { days:[{d,v}], end }(旧 → 新,只含完整的日子) */

    toastAdd: "已关注 %s", toastRm: "已取消关注 %s", up: "上移", rm: "移除",
    rmQ: "不再关注「%s」？", rmM: "首页和「关注列表」组件里将不再显示它。", rmOk: "不再关注",
    foot: "关注列表只保存在这台设备上。「关注列表」组件显示列表里前 5 个开源包，点 ↑ 可以调整顺序。" },
  en: { hMg: "Manage Packages", subMg: "The home page and the Watchlist widget follow this order",
    ph: "Package name or keyword", go: "Search", hintNpm: "Search npm by keyword. Results show weekly downloads.", hintPy: "PyPI has no public search. Enter the exact package name (e.g. requests).",
    hintCr: "Search crates.io by keyword. Results show 90-day downloads.", wkDl: "%s / week", r90: "%s in 90 days",
    hintDk: "Search Docker Hub images by keyword. Results show total pulls.", hintBr: "Homebrew has no public search. Enter the exact name (e.g. wget, visual-studio-code).",
    pulls: "%s pulls", i30: "%s installs in 30 days", official: "Official", brNo: "Nothing named \"%s\" on Homebrew. Check the name",
    add: "Watch", added: "Watching", mineMg: "Watching", nMine: "%s / %s",
    emptyMine: "No packages yet. Search above and tap Watch.", noResE: "Nothing called \"%s\" on %e", pyNo: "No package named \"%s\" on PyPI. Check the name",
    searching: "Searching…", searchFail: "Search failed. Check your connection and try again", full: "You can watch up to %s packages. Remove one first",
    toastAdd: "Watching %s", toastRm: "Stopped watching %s", up: "Move up", rm: "Remove",
    rmQ: "Stop watching \"%s\"?", rmM: "It will no longer show on the home page or in the Watchlist widget.", rmOk: "Stop watching",
    foot: "Your watchlist is saved only on this device. The Watchlist widget shows the first 5 packages; tap ↑ to reorder." }
});
var S = { e: "npm", wl: [], res: null, seq: 0 };
function paintTop() {
  [].forEach.call($("seg").children, function (b) { var de = b.getAttribute("data-e");
    b.className = de === S.e ? "on" : ""; b.hidden = dkOff(de); });   /* 大陆不给 Docker 分段 */
  $("hint").textContent = t(HINT[S.e] || "hintNpm");
  $("mineN").textContent = t("nMine", S.wl.length).replace("%s", WL_MAX);
}
function actBtn(e, n) { var on = wlHas(S.wl, e, n);
  return '<button class="act' + (on ? " on" : "") + '" type="button" data-a="tog">' + esc(t(on ? "added" : "add")) + "</button>"; }
function paintRes() {
  var r = S.res;
  if (r == null) { $("res").innerHTML = ""; return; }
  if (r === "busy") { $("res").innerHTML = '<div class="state">' + esc(t("searching")) + "</div>"; return; }
  if (typeof r === "string") { $("res").innerHTML = '<div class="state">' + esc(r) + "</div>"; return; }
  $("res").innerHTML = '<div class="list">' + r.map(function (x) { return resRow(x, actBtn(x.e, x.n)); }).join("") + "</div>";
}
function paintMine() {
  if (!S.wl.length) { $("mine").innerHTML = '<div class="state">' + esc(t("emptyMine")) + "</div>"; return; }
  $("mine").innerHTML = '<div class="list mine">' + S.wl.map(function (x, i) {
    return '<div class="row it" data-e="' + esc(x.e) + '" data-n="' + esc(x.n) + '" data-x="' + i + '"><div class="l"><b>' + esc(x.n) +
      '</b><div class="m"><span class="eco">' + esc(ECO[x.e]) + "</span>" + (dkOff(x.e) ? '<span class="off">' + esc(t("offT")) + "</span>" : "") + "</div></div>" +
      '<button class="ib" type="button" data-a="up" aria-label="' + esc(t("up")) + '"' + (i === 0 ? " disabled" : "") + ">" + USVG + "</button>" +
      '<button class="ib" type="button" data-a="rm" aria-label="' + esc(t("rm")) + '">' + XSVG + "</button></div>";
  }).join("") + "</div>";
}
function paintAll() { paintTop(); paintRes(); paintMine(); }
async function search(kw) {
  var e = S.e, my = ++S.seq, out;
  S.res = "busy"; paintRes();
  try { out = await doSearch(e, kw); } catch (err) { out = t("searchFail"); }
  /* 慢请求晚回不许盖掉新结果(边打字边搜的竞态) */
  if (my !== S.seq) return;
  S.res = out; paintRes();
}
async function toggle(e, n) {
  var a = await wlLoad(), on = wlHas(a, e, n);
  if (on) a = a.filter(function (x) { return !(x.e === e && x.n === n); });
  else { if (a.length >= WL_MAX) { toast(t("full", WL_MAX)); return; } a.push({ e: e, n: n }); }
  S.wl = a; paintAll();                       /* 先改按钮,再落盘:点下去立刻变「已关注」 */
  await wlSave(a); haptic("success"); toast(t(on ? "toastRm" : "toastAdd", n));
}
async function moveUp(i) {
  var a = await wlLoad(); if (i <= 0 || i >= a.length) return;
  var x = a[i]; a[i] = a[i - 1]; a[i - 1] = x;
  S.wl = a; paintAll(); haptic(); await wlSave(a);
}
async function removeOne(e, n) {
  var ok = false;
  try { ok = await call(xbridge.confirm(t("rmQ", n), t("rmM"), { okText: t("rmOk") })); } catch (x) { ok = false; }
  if (!ok) return;
  var a = (await wlLoad()).filter(function (x) { return !(x.e === e && x.n === n); });
  S.wl = a; paintAll(); await wlSave(a); haptic("success"); toast(t("toastRm", n));
}
(async function boot() {
  if (!(await ready())) { $("mine").innerHTML = '<div class="state">' + esc(t("notX")) + "</div>"; return; }
  await bootEnv(function () { paintAll(); });
  S.wl = await wlLoad(); paintAll();
  $("seg").onclick = function (ev) { var b = ev.target.closest("button"); if (!b) return; haptic();
    S.e = b.getAttribute("data-e"); S.res = null; S.seq++; paintAll(); var kw = $("kw").value.trim(); if (kw) search(kw); };
  $("sf").onsubmit = function (ev) { ev.preventDefault(); var kw = $("kw").value.trim(); if (!kw) return; $("kw").blur(); search(kw); };
  $("res").addEventListener("click", function (ev) { var b = ev.target.closest("button"), it = ev.target.closest(".row"); if (!it) return;
    var e = it.getAttribute("data-e"), n = it.getAttribute("data-n");
    if (b && b.getAttribute("data-a") === "tog") return toggle(e, n);
    go("/pkg?eco=" + encodeURIComponent(e) + "&name=" + encodeURIComponent(n)); });
  $("mine").addEventListener("click", function (ev) { var b = ev.target.closest("button"), it = ev.target.closest(".row"); if (!it) return;
    var e = it.getAttribute("data-e"), n = it.getAttribute("data-n"), a = b && b.getAttribute("data-a");
    if (a === "up") return moveUp(+it.getAttribute("data-x"));
    if (a === "rm") return removeOne(e, n);
    go("/pkg?eco=" + encodeURIComponent(e) + "&name=" + encodeURIComponent(n)); });
})();
</script>

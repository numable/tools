<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Package Stats</title>
<style>
/* 版式对齐 weather / github / tubewatch(2026-09 v2):页边距 14、卡片圆角 14 + 同一套投影(暗色换 .5px 细边)、
   段标题 13px/600 次级灰、列表行左右内边距同为 14、分隔线从文字起点缩进。
   次要动作(关注 / 选这个)= 源色浅底胶囊,已关注 = 中性灰底灰字;平台 accent 绿只留给「添加组件」。 */
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--faint:#9AA0A6;--tile:#E7E9EE;--rail:#D6DAE1;--line:#E4E7EC;
  --src:#B4329B;--srcBg:rgba(180,50,155,.10);--srcSoft:#B4329B66;--amb:#B45309;--ambBg:rgba(180,83,9,.11);
  --edge:transparent;--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--faint:#5E636B;--tile:#20232A;--rail:#2C313A;--line:#262A31;
  --src:#EE7FD6;--srcBg:rgba(238,127,214,.14);--srcSoft:#EE7FD666;--amb:#F5A524;--ambBg:rgba(245,165,36,.14);
  --edge:rgba(255,255,255,.06);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}   /* .seg / .card 等带 display 的类会压过 hidden 属性(v2 选择页单槽模式下空出一条分段栏) */
body{font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd .tx{flex:1 1 auto;min-width:0}
.hd h1{font-size:24px;line-height:1.25;font-weight:700;margin:0;letter-spacing:-.3px;word-break:break-all}
.hd .sub{color:var(--sub);font-size:13px;margin-top:3px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:.5px solid var(--edge)}
.pad{padding:14px}
.list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:.5px solid var(--edge);overflow:hidden}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px;font-size:13px;font-weight:600;color:var(--sub)}
.sec .v{font-weight:400;font-size:12px}
.sec .lnk{color:var(--src);font-weight:600;font-size:13px;padding:6px 0 6px 12px;margin:-6px 0}
/* 列表行:左右内边距同为 14;分隔线从文字起点(左 14)缩进到右缘 */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.row .l{flex:1 1 auto;min-width:0}
.row .l b{display:block;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--sub);font-size:11.5px;min-width:0}
.eco{display:inline-block;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:6px;background:var(--tile);color:var(--sub);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1.3;border-radius:8px;padding:2px 7px;white-space:nowrap;background:var(--tile);color:var(--sub)}
.pill.up,.pill.src{background:var(--srcBg);color:var(--src)}
.pill.dn{background:var(--ambBg);color:var(--amb)}
.c-up{color:var(--src)} .c-dn{color:var(--amb)} .c-flat{color:var(--sub)}
.act{flex:0 0 auto;min-width:64px;height:32px;border-radius:16px;padding:0 14px;font-size:13px;font-weight:600;background:var(--srcBg);color:var(--src);white-space:nowrap}
.act.on{background:var(--tile);color:var(--sub)}
.spk .spl{fill:none;stroke:var(--src);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spk .g0{stop-color:var(--src);stop-opacity:.22} .spk .g1{stop-color:var(--src);stop-opacity:0}
.spk .spd{fill:var(--src)}
.chev{flex:0 0 auto;color:var(--faint);font-size:17px;line-height:1}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin:22px 2px 0}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 12px}
.warn{color:var(--amb);font-size:12px;margin:10px 0 0}
.sk{display:inline-block;background:var(--tile);border-radius:6px;color:transparent}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px}
.seg button{flex:1 1 0;font-size:13px;min-height:34px;border-radius:8px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .seg button.on{background:var(--rail);box-shadow:none}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;margin-top:10px;text-align:left}
.addrow .g{flex:1 1 auto;min-width:0}
.addrow b{display:block;font-size:14px;font-weight:600}
.addrow small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
.addrow i{flex:0 0 auto;font-style:normal;color:var(--src);font-size:20px;font-weight:600;line-height:1}
/* 搜索框:字号必须 ≥16px(iOS 聚焦 <16px 的输入框会放大整页,G15) */
.sbox{display:flex;gap:8px;margin-top:10px}
.sbox input{flex:1 1 auto;min-width:0;font-size:16px;height:44px;border-radius:12px;border:.5px solid var(--edge);padding:0 14px;background:var(--card);color:var(--fg);
  box-shadow:var(--shadow);outline:none;-webkit-appearance:none}
.sbox button{flex:0 0 auto;min-width:64px;height:44px;border-radius:22px;background:var(--srcBg);color:var(--src);font-weight:600;font-size:14px;padding:0 16px}
.hint{color:var(--sub);font-size:11.5px;margin:8px 2px 0}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。

/* xb:motion end */
</style>

<style>

.sum .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sum .l1 b{font-size:17px;font-weight:700;margin-right:4px}

var S = { wl: [], m: {}, meta: {}, err: {}, busy: false };
function key(x) { return x.e + ":" + x.n; }
function relAgo(x) { var mt = S.meta[key(x)]; return mt && mt.v && mt.date ? daysAgo(mt.date) : null; }
function paintHead() {
  var ends = [];
  S.wl.forEach(function (x) { var m = S.m[key(x)]; if (m) ends.push(m.end); });
  ends.sort(); var end = ends[ends.length - 1];
  xbAt.set("at", end || null, { day: 1 });   /* 数据只有日粒度:MM-DD = 各源最新一天(通常滞后 1~4 天) */
  $("sub").textContent = t("subN", S.wl.length);
  $("mg").textContent = t("manage") + " ›";
}
/* 本周概况:跨生态把下载量相加没有意义(v1 的「近 7 天合计」已去掉),改成「几涨几跌 + 谁发了新版本 + 涨跌之最」。 */
function paintOv() {
  if (!S.wl.length) { $("ov").innerHTML = ""; return; }
  var up = 0, dn = 0, fl = 0, best = null, worst = null, rel = [], metaN = 0;
  S.wl.forEach(function (x) { var m = S.m[key(x)];
    if (m) { var d = dir(m.chg); if (d === "up") up++; else if (d === "dn") dn++; else if (d === "flat") fl++;
      if (m.chg !== null) { if (!best || m.chg > best.c) best = { n: x.n, c: m.chg }; if (!worst || m.chg < worst.c) worst = { n: x.n, c: m.chg }; } }
    if (S.meta[key(x)]) metaN++;
    var a = relAgo(x); if (a != null && a <= 7) rel.push(x.n + " " + S.meta[key(x)].v); });
  var h = '<div class="card sum"><div class="l1"><b>' + esc(t("nPkg", S.wl.length)) + "</b>" +
    (up ? '<span class="pill up">' + esc(t("nUp", up)) + "</span>" : "") +
    (dn ? '<span class="pill dn">' + esc(t("nDn", dn)) + "</span>" : "") +
    (fl ? '<span class="pill">' + esc(t("nFlat", fl)) + "</span>" : "") + "</div>";
  if (metaN) h += '<div class="l2">' + (rel.length ? esc(t("relN", rel.length)) + "<em>" + esc(rel.join(LANG === "zh" ? "、" : ", ")) + "</em>" : esc(t("relNone"))) + "</div>";
  h += "</div>";
  function tl(k, n, c) { var d = c == null ? "" : dir(c);
    return '<div class="card tl"><div class="k">' + esc(t(k)) + '</div><div class="n">' + esc(n || t("none")) + '</div>' +
      '<div class="v ' + (d ? "c-" + d : "") + '">' + esc(c == null ? "--" : pctTxt(c)) + "</div></div>"; }
  h += '<div class="ov">' + tl("best", best && best.c > 0 ? best.n : "", best && best.c > 0 ? best.c : null) +
    tl("worst", worst && worst.c < 0 ? worst.n : "", worst && worst.c < 0 ? worst.c : null) + "</div>";
  $("ov").innerHTML = h;
}
function paintList() {
  if (!S.wl.length) { $("list").innerHTML = '<div class="card empty"><b>' + esc(t("emptyT")) + "</b><p>" + esc(t("emptyS")) + "</p></div>"; return; }
  /* 顺序 = 关注列表顺序(管理页里调的序说了算,与「关注列表」组件一致) */
  var h = "";
  S.wl.forEach(function (x) {
    var m = S.m[key(x)], d = m ? dir(m.chg) : "", a = relAgo(x), mt = S.meta[key(x)];
    h += '<div class="row" data-e="' + esc(x.e) + '" data-n="' + esc(x.n) + '">' +
      '<div class="l"><b>' + esc(x.n) + '</b><div class="m"><span class="eco">' + esc(ECO[x.e]) + "</span>" +
      (a != null && a <= 7 ? '<span class="nv">' + esc(t("newV", mt.v)) + "</span>" : "") +
      (S.err[key(x)] && !m ? '<span class="c-dn">' + esc(t("failCold")) + "</span>" : "") + "</div></div>" +
      (m ? sparkSvg(m.spark, 64, 28) : '<svg class="spk" width="64" height="28"></svg>') +
      '<div class="r"><b>' + (m ? esc(cmp(m.wk)) : '<span class="sk">0000</span>') + "</b>" +
      '<span class="pill ' + d + '">' + esc(m ? (d === "flat" ? t("flatS") : pctTxt(m.chg)) : "--") + "</span></div>" +
      '<span class="chev">›</span></div>';
  });
  $("list").innerHTML = '<div class="list">' + h + "</div>";
}
function paintAll() { paintHead(); paintOv(); paintList(); }
function model(s) { var st = stats(s); st.spark = fillGaps(s.days.map(function (x) { return x.v; })).slice(-30); return st; }

async function loadOne(x, force) {
  var k = ckey("30", x.e, x.n), c = force ? null : await cacheGet(k);
  if (c) { S.m[key(x)] = c.d; if (!c.stale) return; }
  try { var s = await series(x.e, x.n, false); var m = model(s); S.m[key(x)] = m; delete S.err[key(x)]; cachePut(k, m); }
  catch (e) { S.err[key(x)] = 1; }
}
async function loadMeta(x, force) {
  var k = ckey("m", x.e, x.n), c = force ? null : await cacheGet(k);
  if (c) { S.meta[key(x)] = c.d; if (!c.stale) return; }
  try { var mt = await meta(x.e, x.n, false); S.meta[key(x)] = mt; cachePut(k, mt); } catch (e) {}
}
async function refresh(force) {
  if (S.busy) return; S.busy = true; xbAt.busy("at", true);
  /* 先把有缓存的全部画出来(包括过期的),再后台逐个校新 —— 首屏不等网络 */
  for (var i = 0; i < S.wl.length; i++) { var x0 = S.wl[i];
    var c = await cacheGet(ckey("30", x0.e, x0.n)); if (c) S.m[key(x0)] = c.d;
    var cm = await cacheGet(ckey("m", x0.e, x0.n)); if (cm) S.meta[key(x0)] = cm.d; }
  paintAll();
  var q = S.wl.slice(), failed = 0;
  async function worker() { while (q.length) { var x = q.shift(); await loadOne(x, force); if (S.err[key(x)]) failed++; paintAll();
    await loadMeta(x, force); paintAll(); } }
  await Promise.all([worker(), worker(), worker()]);
  S.busy = false; xbAt.busy("at", false);
  if (force && failed) toast(t("fail"));
}
(async function boot() {
  if (!(await ready())) { $("list").innerHTML = '<div class="state">' + esc(t("notX")) + "</div>"; paintI18n(); return; }
  await bootEnv(function () { paintAll(); });
  S.wl = await wlLoad(); paintAll();
  $("at").onclick = function () { haptic(); refresh(true); };
  $("mg").onclick = function () { go("/manage"); };
  $("addPkg").onclick = function () { go("/manage"); };
  /* 两包对比默认拿关注列表前两个(不足两个用 react / vue);加上之后长按编辑可以换 */
  $("pickw").onclick = function () { haptic(); var a = S.wl[0] || { e: "npm", n: "react" }, b = S.wl[1] || { e: "npm", n: a.n === "vue" ? "react" : "vue" };
    xbridge.pickWidgets([{ id: "board" }, { id: "cmp", params: { eco: a.e, pkg: a.n, eco2: b.e, pkg2: b.n } }]); };
  $("list").addEventListener("click", function (e) { var r = e.target.closest(".row"); if (!r) return;
    go("/pkg?eco=" + encodeURIComponent(r.getAttribute("data-e")) + "&name=" + encodeURIComponent(r.getAttribute("data-n"))); });
  /* 从管理页 / 详情页回来:关注列表(含顺序)可能变了 —— 先用缓存立刻重画,再补取新加的 */
  document.addEventListener("visibilitychange", async function () { if (document.visibilityState !== "visible") return;
    var w = await wlLoad(); if (JSON.stringify(w) !== JSON.stringify(S.wl)) { S.wl = w; refresh(false); } });
  refresh(false);
})();
</script>

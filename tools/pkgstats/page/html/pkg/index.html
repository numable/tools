<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Package</title>
<style>
/* 版式对齐 weather / github / tubewatch(2026-09 v2):页边距 14、卡片圆角 14 + 同一套投影(暗色换 .5px 细边)、
   段标题 13px/600 次级灰、列表行左右内边距同为 14、分隔线从文字起点缩进。
   次要动作(关注 / 选这个)= 源色浅底胶囊,已关注 = 中性灰底灰字;平台 accent 绿只留给「添加组件」。 */
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--faint:#9AA0A6;--tile:#E7E9EE;--rail:#D6DAE1;--line:#E4E7EC;
  --src:#B4329B;--srcBg:rgba(180,50,155,.10);--srcSoft:#B4329B66;--amb:#B45309;--ambBg:rgba(180,83,9,.11);
  --edge:transparent;--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--faint:#5E636B;--tile:#20232A;--rail:#2C313A;--line:#262A31;
  --src:#EE7FD6;--srcBg:rgba(238,127,214,.14);--srcSoft:#EE7FD666;--amb:#F5A524;--ambBg:rgba(245,165,36,.14);
  --edge:rgba(255,255,255,.06);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}   /* .seg / .card 等带 display 的类会压过 hidden 属性(v2 选择页单槽模式下空出一条分段栏) */
body{font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd .tx{flex:1 1 auto;min-width:0}
.hd h1{font-size:24px;line-height:1.25;font-weight:700;margin:0;letter-spacing:-.3px;word-break:break-all}
.hd .sub{color:var(--sub);font-size:13px;margin-top:3px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:.5px solid var(--edge)}
.pad{padding:14px}
.list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:.5px solid var(--edge);overflow:hidden}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px;font-size:13px;font-weight:600;color:var(--sub)}
.sec .v{font-weight:400;font-size:12px}
.sec .lnk{color:var(--src);font-weight:600;font-size:13px;padding:6px 0 6px 12px;margin:-6px 0}
/* 列表行:左右内边距同为 14;分隔线从文字起点(左 14)缩进到右缘 */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.row .l{flex:1 1 auto;min-width:0}
.row .l b{display:block;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--sub);font-size:11.5px;min-width:0}
.eco{display:inline-block;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:6px;background:var(--tile);color:var(--sub);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1.3;border-radius:8px;padding:2px 7px;white-space:nowrap;background:var(--tile);color:var(--sub)}
.pill.up,.pill.src{background:var(--srcBg);color:var(--src)}
.pill.dn{background:var(--ambBg);color:var(--amb)}
.c-up{color:var(--src)} .c-dn{color:var(--amb)} .c-flat{color:var(--sub)}
.act{flex:0 0 auto;min-width:64px;height:32px;border-radius:16px;padding:0 14px;font-size:13px;font-weight:600;background:var(--srcBg);color:var(--src);white-space:nowrap}
.act.on{background:var(--tile);color:var(--sub)}
.spk .spl{fill:none;stroke:var(--src);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spk .g0{stop-color:var(--src);stop-opacity:.22} .spk .g1{stop-color:var(--src);stop-opacity:0}
.spk .spd{fill:var(--src)}
.chev{flex:0 0 auto;color:var(--faint);font-size:17px;line-height:1}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin:22px 2px 0}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 12px}
.warn{color:var(--amb);font-size:12px;margin:10px 0 0}
.sk{display:inline-block;background:var(--tile);border-radius:6px;color:transparent}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px}
.seg button{flex:1 1 0;font-size:13px;min-height:34px;border-radius:8px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .seg button.on{background:var(--rail);box-shadow:none}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;margin-top:10px;text-align:left}
.addrow .g{flex:1 1 auto;min-width:0}
.addrow b{display:block;font-size:14px;font-weight:600}
.addrow small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
.addrow i{flex:0 0 auto;font-style:normal;color:var(--src);font-size:20px;font-weight:600;line-height:1}
/* 搜索框:字号必须 ≥16px(iOS 聚焦 <16px 的输入框会放大整页,G15) */
.sbox{display:flex;gap:8px;margin-top:10px}
.sbox input{flex:1 1 auto;min-width:0;font-size:16px;height:44px;border-radius:12px;border:.5px solid var(--edge);padding:0 14px;background:var(--card);color:var(--fg);
  box-shadow:var(--shadow);outline:none;-webkit-appearance:none}
.sbox button{flex:0 0 auto;min-width:64px;height:44px;border-radius:22px;background:var(--srcBg);color:var(--src);font-weight:600;font-size:14px;padding:0 16px}
.hint{color:var(--sub);font-size:11.5px;margin:8px 2px 0}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */

.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}

.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的

.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */

   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}

  .xb-in{animation:none!important}

/* xb:motion end */

<style>
.hero .k{color:var(--sub);font-size:12px}
.hero .big{font-size:40px;line-height:1.1;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.hero .chg{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--sub);min-width:0}
.hero .chg span:last-child{min-width:0;line-height:1.4}   /* 缺天时多一句「按有数据的 N 天」,允许折行,不截断 */
.chart{margin-top:8px}
.chart .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chart .seg{display:inline-flex;padding:2px;border-radius:9px}
.chart .seg button{flex:0 0 auto;font-size:12px;padding:0 12px;min-height:30px;border-radius:7px}
.rd{font-size:12px;color:var(--sub);text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd b{color:var(--fg)}
#bars{display:block;width:100%;height:150px;margin-top:10px;touch-action:pan-y}
#bars .b0{fill:var(--rail)} #bars .b1{fill:var(--srcSoft)} #bars .b2{fill:var(--src)} #bars .bg{fill:var(--faint)} #bars .sel{fill:var(--fg)}
.ax{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:10.5px;margin-top:6px;gap:8px}
.lg{display:inline-flex;align-items:center;gap:4px}
.lg i{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--src)} .lg i.p{background:var(--srcSoft)} .lg i.g{background:var(--faint)} .lg .gx{display:inline-flex;align-items:center;gap:4px} .lg .gx[hidden]{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tiles>div{padding:12px 14px;min-width:0}
.tiles .k{color:var(--sub);font-size:11.5px}
.tiles .v{font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap}
.tiles .f{color:var(--sub);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver .vv{font-size:20px;font-weight:700}
.ver .vd{color:var(--sub);font-size:12px;margin-top:2px}
.ver .ds{font-size:13px;margin-top:10px;line-height:1.55;color:var(--fg)}
.hist .row{min-height:48px;padding-top:10px;padding-bottom:10px}
.hist .row b{font-size:14px}
.hist .d{flex:0 0 auto;color:var(--sub);font-size:12px}
.hist .a{flex:0 0 auto;min-width:58px;text-align:right;color:var(--sub);font-size:12px}
.hist .a.src{color:var(--src);font-weight:600}
.links .row{min-height:48px;cursor:pointer}
.links .row .l{font-size:14px;flex:0 0 auto}

i18n({

  if (a != null) s = String(s).replace("%s", a); return s; }

async function call(p) { var r = await p;
  if (r && typeof r === "object" && "code" in r) { if (r.code !== 0) throw new Error(r.msg || "bridge"); return r.data; }
  return r; }
async function sGet(k) { try { var v = await call(xbridge.getData(k)); return (v == null || v === "") ? null : String(v); } catch (e) { return null; } }

async function bootEnv(onChange) {

  if (!de.getAttribute("data-theme") && d.theme) de.setAttribute("data-theme", d.theme === "dark" ? "dark" : "light");
  LANG = nbLang(d.language || d.locale);
  de.lang = LANG === "zh" ? "zh-CN" : "en"; paintI18n();
  addEventListener("languagechange", function (e) {
    LANG = nbLang((e && e.detail && e.detail.language) || de.getAttribute("data-lang"));
    de.lang = LANG === "zh" ? "zh-CN" : "en"; paintI18n(); onChange && onChange("lang"); });
  addEventListener("themechange", function () { onChange && onChange("theme"); });

/* ── 生态 ──
   docker / brew / cask(2026-10-09)没有逐日数据:Docker Hub 只有累计拉取,Homebrew 只有近 30 / 90 / 365 天安装。
   它们不走 series(),走 nsModel();页面按 m.k("d" / "b")换一套表现,不画走势、不报较上周。 */
var ECO = { npm: "npm", pypi: "PyPI", crates: "crates.io", docker: "Docker Hub", brew: "Homebrew", cask: "Homebrew Cask" };
function normE(e) { e = String(e || "").toLowerCase(); return ECO[e] ? e : "npm"; }
function normN(e, n) { n = String(n || "").trim(); return e === "npm" ? n : n.toLowerCase(); }
function isSer(e) { return e === "npm" || e === "pypi" || e === "crates"; }
function pyName(n) { return String(n).toLowerCase().replace(/[._]+/g, "-"); }
function dRepo(n) { return n.indexOf("/") > 0 ? n : "library/" + n; }
function regUrl(e, n) { return e === "npm" ? "https://www.npmjs.com/package/" + n
  : e === "pypi" ? "https://pypi.org/project/" + n + "/"
  : e === "docker" ? (n.indexOf("/") > 0 ? "https://hub.docker.com/r/" + n : "https://hub.docker.com/_/" + n)
  : e === "brew" ? "https://formulae.brew.sh/formula/" + n : e === "cask" ? "https://formulae.brew.sh/cask/" + n
  : "https://crates.io/crates/" + n; }

/* ── 关注列表:data.ps_list(组件 board.df 读同一个键;顺序 = 首页与「关注列表」组件的显示顺序)── */
var DEF = [{ e: "npm", n: "react" }, { e: "pypi", n: "requests" }, { e: "crates", n: "serde" }];
var WL_MAX = 12;
/* ⚠️ 读法两种都吃:save.af 用 data.set 存的是结构化数组,桥 getData 可能原样给数组,也可能给 JSON 串。 */
async function wlRaw() { try { var v = await call(xbridge.getData("ps_list"));
  if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = null; } } return v; } catch (e) { return null; } }
async function wlLoad() { var a = await wlRaw(); if (!Array.isArray(a)) return DEF.slice();
  var out = [], seen = {};
  a.forEach(function (x) { if (!x || !x.n) return; var e = normE(x.e), n = normN(e, x.n), k = e + ":" + n;
    if (!seen[k]) { seen[k] = 1; out.push({ e: e, n: n }); } });
  return out; }
async function wlSave(a) { try { await call(xbridge.runFlow("save", { list: a.slice(0, WL_MAX) })); } catch (e) {} }
function wlHas(a, e, n) { for (var i = 0; i < a.length; i++) if (a[i].e === e && a[i].n === n) return true; return false; }

/* ── 取数:原样取回 + 本页解析 ── */
async function raw(flow, p) { var d = await call(xbridge.runDataFlow(flow, { p: p }, 20000));
  return String((d && d.raw) || ""); }
async function rawJ(flow, p) { var s = await raw(flow, p); if (!s) throw new Error("empty");
  var j = JSON.parse(s); if (j && j.error && !j.downloads && !j.crate && !j.objects && !j.versions) throw new Error("notfound"); return j; }
/* pypistats 按 IP 限流(连打偶发 429):一律排队串行,失败隔 1.5 秒重试一次。 */
var pyQ = Promise.resolve();
function pyQueue(fn) { var p = pyQ.then(function () { return fn(); }); pyQ = p.then(function () { return sleep(350); }, function () { return sleep(350); }); return p; }
async function retry(fn) { try { return await fn(); } catch (e) { if (e && e.message === "notfound") throw e; await sleep(1500); return await fn(); } }

/* 逐日序列 → { days:[{d,v}], end }(旧 → 新,只含完整的日子) */
async function series(e, n, long) {
  if (e === "npm") {
    var j = await retry(function () { return rawJ("npm", "range/" + (long ? "last-year" : "last-month") + "/" + n); });
    var a = (j.downloads || []).map(function (x) { return { d: x.day, v: +x.downloads || 0 }; });
    if (!a.length) throw new Error("notfound");
    return { days: a.slice(long ? -90 : -30), end: j.end || a[a.length - 1].d };
  }
  if (e === "pypi") {
    var jp = await pyQueue(function () { return retry(function () { return rawJ("pystats", pyName(n) + "/overall?mirrors=false"); }); });
    var b = (jp.data || []).filter(function (x) { return !x.category || x.category === "without_mirrors"; })
      .map(function (x) { return { d: x.date, v: +x.downloads || 0 }; }).sort(function (x, y) { return x.d < y.d ? -1 : 1; });
    if (!b.length) throw new Error("notfound");
    b = b.slice(long ? -90 : -30); return { days: b, end: b[b.length - 1].d };
  }
  var jc = await retry(function () { return rawJ("crates", "crates/" + n + "/downloads"); });
  var acc = {}, ex = (jc.meta && jc.meta.extra_downloads) || [];
  (jc.version_downloads || []).concat(ex).forEach(function (x) { acc[x.date] = (acc[x.date] || 0) + (+x.downloads || 0); });
  var ks = Object.keys(acc).sort();
  /* 最后一天是「今天(UTC)」,还没过完:丢掉,只用完整的日子(与组件同一条判据)。 */
  ks.pop();
  if (!ks.length) throw new Error("notfound");
  var c = ks.map(function (k) { return { d: k, v: acc[k] }; }).slice(long ? -90 : -30);
  return { days: c, end: c[c.length - 1].d };
}
/* Docker Hub / Homebrew:一次取回就是全部数字(没有序列)。404:Docker 回 {message},Homebrew 回网页(解析失败)→ notfound。 */
async function nsModel(e, n) {
  if (e === "docker") {
    var j = await retry(function () { return rawJ("docker", "repositories/" + dRepo(n) + "/"); });
    if (!j || !j.name) throw new Error("notfound");
    return { k: "d", main: +j.pull_count || 0, stars: +j.star_count || 0, upd: String(j.last_updated || "").slice(0, 10),
      reg: String(j.date_registered || "").slice(0, 10), end: isoDay(new Date()) };
  }
  var s = await retry(function () { return raw("brew", (e === "cask" ? "cask/" : "formula/") + n + ".json"); }), h;
  try { h = JSON.parse(s); } catch (x) { throw new Error("notfound"); }
  var a = (h && h.analytics) || {}, ins = a.install || {}, req = a.install_on_request || {};
  function g(o, w) { var t = o[w]; return t && t[n] != null ? +t[n] : 0; }
  if (!h || !h.generated_date) throw new Error("notfound");
  return { k: "b", main: g(ins, "30d"), d90: g(ins, "90d"), d365: g(ins, "365d"),
    req30: e === "brew" && req["30d"] ? g(req, "30d") : null, end: String(h.generated_date).slice(0, 10) };
}
/* 缺天判据(与组件 pkg.df / board.df / cmp.df 同一条):某天为 0,且最近 30 天里非零日的中位数 ≥ 100
   → 视为「数据源当天没有统计」,不是「没人下载」。小包真的一天 0 下载不受影响。
   npm 的逐日统计会整天缺失(2026-09 实测 react 两周缺 3 天),不处理的话环比会报出假下跌。 */
function gapMask(v) {
  var w = v.slice(-30), nz = w.filter(function (x) { return x > 0; }).sort(function (a, b) { return a - b; });
  var med = !nz.length ? 0 : nz.length % 2 ? nz[(nz.length - 1) / 2] : (nz[nz.length / 2 - 1] + nz[nz.length / 2]) / 2;
  var gap = med >= 100;
  return v.map(function (x) { return gap && !(x > 0); });
}
function stats(s) {
  var v = s.days.map(function (x) { return x.v; }), n = v.length, miss = gapMask(v);
  function sum(a, b) { var z = 0; for (var i = Math.max(0, a); i < b; i++) z += v[i]; return z; }
  function cnt(a, b) { var z = 0; for (var i = Math.max(0, a); i < b; i++) if (!miss[i]) z++; return z; }
  var wk = sum(n - 7, n), pw = sum(n - 14, n - 7), mo = sum(n - 30, n), wkN = cnt(n - 7, n), pwN = cnt(n - 14, n - 7);
  /* 环比 = 近 7 天有数据日的日均 ÷ 前 7 天有数据日的日均 − 1;任一边不足 4 天不下结论。大字仍是官方合计。 */
  var chg = (wkN >= 4 && pwN >= 4 && pw > 0) ? ((wk / wkN) / (pw / pwN) - 1) * 100 : null;
  /* 近 30 天较前 30 天:同一口径(有数据日的日均),需要 60 天序列(详情页取 90 天)。 */
  var moN = cnt(n - 30, n), pm = n >= 60 ? sum(n - 60, n - 30) : 0, pmN = n >= 60 ? cnt(n - 60, n - 30) : 0;
  var moChg = (moN >= 20 && pmN >= 20 && pm > 0) ? ((mo / moN) / (pm / pmN) - 1) * 100 : null;
  var gaps = 0; for (var i = Math.max(0, n - 14); i < n; i++) if (miss[i]) gaps++;
  var pk = null; for (var j = 0; j < n; j++) if (!miss[j] && (!pk || v[j] > pk.v)) pk = { v: v[j], d: s.days[j].d };
  return { wk: wk, pw: pw, mo: mo, d1: v[n - 1], d1d: s.days[n - 1].d, chg: chg, end: s.end, gaps: gaps,
    wkN: wkN, avg: wkN ? wk / wkN : null, moChg: moChg, peak: pk, n: n };
}
/* 折线用:缺天沿用前一天的值,不画成跌到 0 */
function fillGaps(v) { var miss = gapMask(v), out = [], last = null;
  for (var i = 0; i < v.length; i++) { if (miss[i]) out.push(last); else { out.push(v[i]); last = v[i]; } }
  var first = null; for (var j = 0; j < out.length; j++) if (out[j] != null) { first = out[j]; break; }
  return out.map(function (x) { return x == null ? (first || 0) : x; }); }

/* Docker:最近推送的 tag 里以版本号开头的(1.30.5-trixie-perl → 1.30.5),按推送先后去重 → 最近推送的版本。
   ⚠️ 不是「最高版本」:nginx 同时维护 stable 与 mainline 两条线,哪条后推哪条在前。 */
function dkVer(tags) { var out = [], seen = {};
  (tags || []).forEach(function (x) { var m = /^v?(\d+(\.\d+)+)/.exec(String(x.name || ""));
    /* 1.30 是 1.30.5 的别名 tag(同一次推送),已有更细的版本号就不再列 */
    if (m && !seen[m[1]] && !Object.keys(seen).some(function (k) { return k.indexOf(m[1] + ".") === 0; })) {
      seen[m[1]] = 1; out.push({ v: m[1], date: String(x.last_updated || "").slice(0, 10) }); } });
  return out; }
/* 元数据:最新版本 / 发布日 / 简介 / 主页 / 仓库;hist = 最近 5 个正式版(PyPI / crates.io)。
   npm 不做发布记录:带时间的版本表只在完整文档里,react 一份 2.9MB,为一个列表每天拉它不值当。 */
function isRel(v) { return /^\d+(\.\d+)*$/.test(String(v || "")); }
async function meta(e, n, withHist) {
  if (e === "docker") {
    var dj = await retry(function () { return rawJ("docker", "repositories/" + dRepo(n) + "/"); }), dh = [];
    try { var tg = await rawJ("docker", "repositories/" + dRepo(n) + "/tags?page_size=" + (withHist ? 25 : 10) + "&ordering=last_updated");
      dh = dkVer(tg.results); } catch (x) { dh = []; }
    return { v: dh[0] ? dh[0].v : "", date: dh[0] ? dh[0].date : "", desc: dj.description || "", home: "", repo: "",
      hist: withHist && dh.length ? dh.slice(0, 5) : null, pushed: 1 };
  }
  if (e === "brew" || e === "cask") {
    var hs = await retry(function () { return raw("brew", (e === "cask" ? "cask/" : "formula/") + n + ".json"); }), hj;
    try { hj = JSON.parse(hs); } catch (x) { throw new Error("notfound"); }
    var hv = e === "cask" ? String(hj.version || "").split(",")[0] : ((hj.versions && hj.versions.stable) || "");
    return { v: hv, date: "", desc: hj.desc || "", home: hj.homepage || "", repo: "", hist: null, nodate: 1 };
  }
  if (e === "npm") {
    var l = await retry(function () { return rawJ("reg", n + "/latest"); });
    var date = "";
    try { var sj = await rawJ("reg", "-/v1/search?text=" + encodeURIComponent(n) + "&size=5");
      (sj.objects || []).some(function (o) { if (o.package && o.package.name === n) { date = o.package.date || ""; return true; } }); } catch (x) {}
    var repo = l.repository && (l.repository.url || l.repository);
    return { v: l.version || "", date: String(date).slice(0, 10), desc: l.description || "", home: l.homepage || "",
      repo: cleanRepo(typeof repo === "string" ? repo : ""), hist: null };
  }
  if (e === "pypi") {
    var xml = await retry(function () { return raw("pypi", "rss/project/" + pyName(n) + "/releases.xml"); });
    var its = rssItems(xml);
    if (!its) throw new Error("notfound");
    var rel = its.filter(function (x) { return isRel(x.v); });   /* 跳过 a / b / rc / dev 预发布 */
    var pick = rel[0] || its[0] || { v: "", date: "", desc: "" };
    return { v: pick.v, date: pick.date, desc: pick.desc, home: "", repo: "",
      hist: rel.slice(0, 5).map(function (x) { return { v: x.v, date: x.date }; }) };
  }
  var c = await retry(function () { return rawJ("crates", "crates/" + n + "?include=default_version"); });
  var cr = c.crate || {}, vv = (c.versions && c.versions[0]) || {}, hist = null;
  if (withHist) {
    try { var hv = await rawJ("crates", "crates/" + n + "/versions?per_page=8&sort=date");
      hist = (hv.versions || []).filter(function (x) { return !x.yanked && isRel(x.num); }).slice(0, 5)
        .map(function (x) { return { v: x.num, date: String(x.created_at || "").slice(0, 10) }; }); } catch (x) { hist = null; }
  }
  return { v: cr.default_version || cr.max_stable_version || "", date: String(vv.created_at || "").slice(0, 10),
    desc: cr.description || "", home: cr.homepage || "", repo: cleanRepo(cr.repository || ""), hist: hist };

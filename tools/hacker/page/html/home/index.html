<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hacker News</title>
<style>
/* 与卡片同源(infosource-standard §4.2b):同一套块、同一条热度条、同一个源色(HN 橙)。
   首页是**内容页**不是加卡目录(github 立的范式)—— 打开就能读今天的榜,
   加卡入口降为页尾次要区。 */
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --tile:#E7E9EE;--rail:#D6DAE1;--add:#EEF0F4;--accent:#128F66;
  --src:#FF6600;--srcSoft:rgba(255,102,0,.12);
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--tile:#20232A;--rail:#2C313A;--add:#252930;--accent:#6FE8BE;
  --src:#FF8A3D;--srcSoft:rgba(255,138,61,.16);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
/* §1 页头三段:大标题 + 时效锚(右上角) / 副标 = 此刻的状态。
   ⚠️ 副标此前放的是**描述**(「HN 首页热榜 · 每 30 分钟更新」)—— 那是元信息,
   按 §3 下沉到了页尾;副标现在说的是这一屏此刻的状态(见 paintAt 的注)。 */
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
/* 时效锚 = 页头右上角的 `.xb-at` 胶囊,样式与格式全在 xb:anchor 块(tools/infosource/mk_anchor.py),
   本页只管给它时间。页面上它同时是刷新按钮(G23 契约 2)。 */
.sub{color:var(--sub);font-size:13px;margin-bottom:8px}
/* §3 图例:紧贴它所解释的那个图形(下面每一行里那条热度条)、11pt、不单独成段。 */
.legend{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:11px;margin-bottom:12px}
.legend i{width:22px;height:3px;border-radius:2px;background:var(--src);display:inline-block}
/* §2 段标题 13pt/Medium/sub;段间 20pt、到第一张卡 8pt(page-design-system §2.1、§5)。 */
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec em{font-style:normal;font-weight:500;font-size:13px;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec em b{font-weight:600;color:var(--fg)}

/* align-items:baseline:序号(12px)与标题首行(14px)同基线 —— 默认 stretch 是顶对齐,小一号的序号比标题高约 2px。 */
.story{display:flex;align-items:baseline;gap:10px;background:var(--tile);border-radius:12px;padding:12px 12px 11px;
  margin-bottom:8px;cursor:pointer}
.story .rk{flex:0 0 16px;color:var(--src);font-weight:700;font-size:12px;line-height:1.4}
.story .grow{flex:1 1 auto;min-width:0}
.story b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.story .foot2{display:flex;align-items:center;gap:10px;margin-top:8px}
.story .bar{flex:0 0 84px;height:3px;border-radius:2px;background:var(--rail);position:relative}
.story .bar i{position:absolute;left:0;top:0;height:3px;border-radius:2px;background:var(--src)}
.story .meta{flex:1 1 auto;color:var(--sub);font-size:11.5px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{color:var(--sub);font-size:13px;text-align:center;padding:26px}
/* v36:分区切换 + 数字块 + 热度地图 + 来源。与卡片同一套块与源色(§4.2b)。 */
.tabs{display:flex;gap:6px;margin:4px 0 12px}
.tabs button{flex:1 1 0;border:0;border-radius:10px;padding:8px 0;font:inherit;font-size:13px;font-weight:600;
  background:var(--tile);color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--srcSoft);color:var(--src)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border-radius:12px;padding:10px 10px 9px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-.2px;white-space:nowrap}
.kpi .v small{font-size:11px;color:var(--sub);font-weight:600;margin-left:1px}
.card{background:var(--card);border-radius:14px;padding:12px 12px 8px;box-shadow:var(--shadow);margin-bottom:10px}
.card .ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.card .ct b{font-size:14px}
.card .ct span{font-size:10.5px;color:var(--sub);text-align:right}
#map{display:block;width:100%;height:auto;overflow:visible}
#map .gl{stroke:var(--line);stroke-width:1}
#map text{fill:var(--sub);font-size:9px}
#map .d{fill:var(--src);fill-opacity:.32;cursor:pointer}
#map .d.hot{fill-opacity:1;stroke:var(--card);stroke-width:2}
.fast{display:flex;gap:8px;align-items:center;margin-top:4px;padding:8px 10px;border-radius:10px;background:var(--tile);cursor:pointer}
.fast i{font-style:normal;flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--src)}
.fast span{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom{display:flex;align-items:center;gap:10px;padding:5px 0}
.dom .n{flex:0 0 130px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom .b{flex:1 1 auto;height:6px;border-radius:3px;background:var(--rail);position:relative}
.dom .b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--src)}
.dom .c{flex:0 0 26px;text-align:right;font-size:12px;color:var(--sub)}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
.foot{color:var(--sub);font-size:11px;margin-top:22px;line-height:1.7}
.foot b{color:var(--fg);font-weight:600}

/* xb:anchor v1 — 由 tools/infosource/mk_anchor.py 生成,别手改(页面时效锚 §1.1) */
:root{--xb-at-bg:rgba(14,17,22,.055);--xb-at-fg:#6B7280;--xb-at-live:#128F66;--xb-at-idle:#B8BDC6}
html[data-theme="dark"]{--xb-at-bg:rgba(243,244,246,.08);--xb-at-fg:#8E939B;--xb-at-live:#6FE8BE;--xb-at-idle:#4A4F58}
.xb-at{flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;box-sizing:border-box;height:26px;min-width:26px;padding:0 10px 0 8px;margin:0 0 0 auto;border:0;border-radius:13px;background:var(--xb-at-bg);color:var(--xb-at-fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform var(--xb-out,140ms) ease,opacity var(--xb-out,140ms) ease}
.xb-at:active{transform:scale(var(--xb-scale,.96));opacity:var(--xb-dim,.72);transition-duration:var(--xb-in,60ms)}
.xb-at svg{flex:0 0 auto;display:block;width:13px;height:13px;fill:currentColor}
.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的
   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */
.xb-at.hide,.xb-at[hidden]{display:none}
@keyframes xb-at-spin{to{transform:rotate(360deg)}}
.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.xb-at.busy svg{animation:none;opacity:.5}}
/* xb:anchor end */
/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.story,.xb-tap{position:relative}
.story::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.story:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.pickb,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}
.pickb:active,.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */
@keyframes xb-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */
@keyframes xb-sheen{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .xb-sk{opacity:1!important;animation:none!important}
  .xb-in{animation:none!important}
}
/* xb:motion end */
</style>

<body>
  <div class="hd">
    <h1 data-i="title"></h1>
    <button class="xb-at" id="xbAt" type="button"></button>
  </div>
  <!-- ⚠️ §0:这一句就是 list 卡上那句结论(「最近 24 小时新上榜 N 条」)。
       卡片上有、页面上一个字都没有,是这一轮要根治的病;放在副标 = 页面上它的位置
       只会比卡片更靠前,不会更靠后。 -->
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs">
    <button class="on" data-f="front" data-i="tabTop"></button>
    <button data-f="pshow">Show HN</button>
    <button data-f="pask">Ask HN</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card" id="mapc">
    <div class="ct"><b data-i="mapT"></b><span data-i="mapLeg"></span></div>
    <svg id="map" viewBox="0 0 340 176"></svg>
    <div class="fast" id="fast"></div>
  </div>
  <div class="card" id="domc">
    <div class="ct"><b data-i="domT"></b><span data-i="domS"></span></div>
    <div id="doms"></div>
  </div>

  <div class="sec"><span data-i="listT"></span></div>
  <div class="legend"><i></i><span data-i="legend"></span></div>
  <div id="list"><div class="state" data-i="loading"></div></div>

  <button class="pickb" id="pickw"><span class="pk">＋</span><span class="pg">
    <b data-i="pickT"></b><span class="d" data-i="pickS"></span></span></button>

  <div class="foot" data-i="foot"></div>
<script>
var I18N = {
 zh:{title:"Hacker News",
   /* ⚠️ 这三句与 xWidget/rc/list.rcn 的 i18n **逐字同源**(newPre/newSuf/noNew):
      同一句结论在卡上与页上必须是同一句话。改一处必须改两处。 */
   newPre:"最近 24 小时新上榜 ",newSuf:" 条",noNew:"最近 24 小时没有新上榜",
   legend:"条越长，最近涨得越快",
   pickT:"添加组件",pickS:"在面板里挑，确认后加到仪表盘",
   pts:" 分",cmt:" 评论",hrs:" 小时前",
   loading:"读取中…",fail:"暂时取不到热榜",
   tabTop:"热榜",kAvg:"平均得分",kCmt:"评论总数",kNew:"24h 新上榜",kFast:"最快",pph:" 分/时",
   mapT:"热度地图",mapLeg:"横轴上榜时长 · 纵轴得分 · 圆越大评论越多",fastT:"上升最快",
   domT:"链接来源",domS:"这一页的链接都指向哪儿",self:"HN 站内(讨论帖)",listT:"全部",
   foot:"数据来源：<b>Hacker News</b>，<b>每 5 分钟</b>更新一次。标题为英文原文，<b>不作翻译</b>。热度按「每小时得分」计算，用来把刚上榜的爆帖与挂了一天的老帖区分开。"},
 en:{title:"Hacker News",
   newPre:"",newSuf:" new in the last 24h",noNew:"None new in the last 24h",
   legend:"Longer bar = rising faster right now",
   pickT:"Add widgets",pickS:"Pick in the panel, then confirm",
   pts:" pts",cmt:" comments",hrs:"h ago",
   loading:"Loading…",fail:"Front page unavailable",
   tabTop:"Top",kAvg:"Avg. points",kCmt:"Comments",kNew:"New in 24h",kFast:"Fastest",pph:" pts/h",
   mapT:"Heat map",mapLeg:"x = hours on page · y = points · size = comments",fastT:"Rising fastest",
   domT:"Link sources",domS:"Where this page links to",self:"HN itself (text posts)",listT:"All stories",
   foot:"Source: <b>Hacker News</b>, refreshed <b>every 5 minutes</b>. Titles are shown in the <b>original English</b>. Heat is points per hour, which separates a story that just caught fire from one that has been up all day."}
};
// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* 语言:缺省英文;先用 <html data-lang>,appInfo 回来再以它为准(doc/overseas-first.md §1–§2)。 */
var LANG=nbLang(document.documentElement.getAttribute("data-lang"));
/* ⚠️ 与 xWidget/flow/list.df 的 `_ns` / `newN` / `cst` **同一条判据**,常量抽在这里而不是
   把表达式抄一遍:上榜不到 NEW_H 小时算「新」,小时数与热度条共用同一个下限钳 H_MIN
   (刚上榜几分钟的帖子除出来的速率会是几千,把整条比例尺拉爆)。
   ⚠️ 唯一的口径差别是**窗口**,而且是刻意的:卡片数它自己显示的那 5 条,页面数它自己
   显示的这 10 条 —— 两边说的都是「你眼前这一屏里有几条是新的」,而不是两套定义。
   ⚠️ 「数据不齐」与「一条都没有」必须分开(df 的 cst=0 vs 2):列表空时不出结论,
   而不是渲成「没有新上榜」—— 那是把「不知道」说成了「知道」。 */
var NEW_H = 24, H_MIN = 1;
function hoursOf(h, nowS){
  return Math.round(Math.max((nowS-Number(h.created_at_i||nowS))/3600, H_MIN));
}
/* ⚠️ **空串是合法译文,不许兜底** —— `newPre` 的英文半边是刻意为空的
   (中文把数字夹在句中「最近 24 小时新上榜 」+4+「 条」,英文把它放句首 ''+4+' new in the last 24h'),
   与 xWidget/rc/list.rcn 的 `i18nEmptyOk` 声明是同一件事。
   老写法 `I18N[LANG][k] || I18N.zh[k]` 用真值判断,空串直接落回中文 ——
   实测英文档渲成「最近 24 小时新上榜 8 new in the last 24h」,中英各半句。 */
function t(k){
  var m=I18N[LANG];
  if (m && Object.prototype.hasOwnProperty.call(m,k)) return m[k];
  return I18N.en[k]!==undefined ? I18N.en[k] : k;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function applyTheme(th){
  var dark = th ? th==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
}
async function ready(){
  for (var i=0;i<24 && !window.xbridge;i++) await new Promise(function(r){setTimeout(r,50);});
  return !!window.xbridge;
}

function paintList(d){
  var box=document.getElementById("list");
  var hits=(d&&d.list)||[];
  if (!hits.length){ box.innerHTML='<div class="state">'+esc(t("fail"))+"</div>"; return; }
  var now=Number(d.nowS)||Math.floor(Date.now()/1000);
  /* 与卡片同一条判据:小时数下限钳 1 —— 刚上榜几分钟的帖子除出来的速率会是几千,
     把整条比例尺拉爆,别的行全变成一根针。 */
  var vel=hits.map(function(h){ return Number(h.points||0)/Math.max((now-Number(h.created_at_i||now))/3600,H_MIN); });
  var vmax=Math.max.apply(null,vel.concat([1]));
  box.innerHTML=hits.map(function(h,i){
    var hrs=hoursOf(h,now);
    var w=Math.max(vel[i]/vmax*100,7);
    return '<div class="story" data-id="'+esc(h.objectID)+'" data-t="'+esc(h.title)+'" data-c="'+Number(h.num_comments||0)+'">'+
      '<div class="rk">'+(i+1)+'</div><div class="grow"><b>'+esc(h.title)+"</b>"+
      '<div class="foot2"><span class="bar"><i style="width:'+w.toFixed(1)+'%"></i></span>'+
      '<span class="meta">'+Number(h.points||0)+t("pts")+" · "+Number(h.num_comments||0)+t("cmt")+
      " · "+hrs+t("hrs")+"</span></div></div></div>";
  }).join("");
}

/* v36 仪表区:四个数字 + 热度地图 + 链接来源。全部由同一份列表在页面里算(零新请求)。
   ⚠️ 地图的映射与 map 卡同式(饱和映射 f(v)=v·1.25/(v+M/4),M 为峰值;x 的 M=48h),
   同一条数据在卡上和页上落在同一个位置。 */
var FLOW="front";
function sat(v,M){ v=Math.max(0,Math.min(v,M)); return M>0 ? v*1.25/(v+M/4) : 0; }
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function paintDash(d){
  var hits=(d&&d.list)||[], now=Number(d&&d.nowS)||Math.floor(Date.now()/1000);
  var kp=document.getElementById("kpis"), svg=document.getElementById("map"),
      fast=document.getElementById("fast"), doms=document.getElementById("doms");
  if (!hits.length){ kp.innerHTML=""; svg.innerHTML=""; fast.innerHTML=""; doms.innerHTML=""; return; }
  var P=hits.map(function(h){return Number(h.points||0);}), Cm=hits.map(function(h){return Number(h.num_comments||0);});
  var H=hits.map(function(h){return Math.max((now-Number(h.created_at_i||now))/3600,1);});
  var V=P.map(function(p,i){return p/H[i];});
  var fi=V.indexOf(Math.max.apply(null,V));
  var sumP=P.reduce(function(a,b){return a+b;},0), sumC=Cm.reduce(function(a,b){return a+b;},0);
  var nNew=H.filter(function(h){return Math.round(h)<=NEW_H;}).length;
  function k(l,v,u){ return '<div class="kpi"><div class="l">'+esc(l)+'</div><div class="v">'+v+(u?'<small>'+esc(u)+'</small>':'')+'</div></div>'; }
  function big(n){ return n>=10000 ? (n/1000).toFixed(1)+"k" : String(n); }
  kp.innerHTML=k(t("kAvg"),Math.round(sumP/hits.length))+k(t("kCmt"),big(sumC))+k(t("kNew"),nNew)+k(t("kFast"),Math.round(V[fi]),t("pph"));
  /* 地图 */
  var W=340,HH=176,L=30,R=8,T=8,B=20,cw=W-L-R,ch=HH-T-B;
  var pM=Math.max.apply(null,P.concat([1])), cM=Math.max.apply(null,Cm.concat([1]));
  var g="";
  [[1,pM],[0.625,Math.round(pM/4)],[0,0]].forEach(function(q){
    var y=T+ch-ch*q[0];
    g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="0" y="'+(y+3)+'">'+q[1]+'</text>';
  });
  [[0,"0"],[12,"12h"],[24,"24h"],[48,"48h"]].forEach(function(q){
    var x=L+cw*sat(q[0],48);
    g+='<text x="'+x+'" y="'+(HH-4)+'" text-anchor="middle">'+q[1]+'</text>';
  });
  var order=hits.map(function(_,i){return i;}).sort(function(a,b){return Cm[b]-Cm[a];});   /* 大圆先画,小圆压在上面点得到 */
  order.forEach(function(i){
    var x=L+cw*sat(H[i],48), y=T+ch-ch*sat(P[i],pM), r=(5+11*sat(Cm[i],cM))/2;
    if (i===fi) return;
    g+='<circle class="d" data-id="'+esc(hits[i].objectID)+'" data-t="'+esc(hits[i].title)+'" data-c="'+Cm[i]+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'"/>';
  });
  var fx=L+cw*sat(H[fi],48), fy=T+ch-ch*sat(P[fi],pM), fr=(7+11*sat(Cm[fi],cM))/2;
  g+='<circle class="d hot" data-id="'+esc(hits[fi].objectID)+'" data-t="'+esc(hits[fi].title)+'" data-c="'+Cm[fi]+'" cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="'+fr.toFixed(1)+'"/>';
  svg.innerHTML=g;
  fast.dataset.id=hits[fi].objectID; fast.dataset.c=Cm[fi]; fast.dataset.t=hits[fi].title||"";
  fast.innerHTML='<i>'+esc(t("fastT"))+'</i><span>'+esc(hits[fi].title)+'</span>';
  /* 来源:按域名归并,前五 */
  var m={}; hits.forEach(function(h){ var k=hostOf(h.url)||t("self"); m[k]=(m[k]||0)+1; });
  var top=Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  var mx=top.length?top[0][1]:1;
  /* 全是站内帖(Ask HN)时这一块只有一行「HN 站内」,没有信息量 —— 整块藏掉。 */
  document.getElementById("domc").style.display = (top.length<2 && (!top.length || top[0][0]===t("self"))) ? "none" : "";
  doms.innerHTML=top.map(function(e){
    return '<div class="dom"><span class="n">'+esc(e[0])+'</span><span class="b"><i style="width:'+Math.max(e[1]/mx*100,6).toFixed(0)+'%"></i></span><span class="c">'+e[1]+'</span></div>';
  }).join("");
}

/* §0/§1 副标 = 此刻的状态,而这一屏此刻的状态就是卡片上那句结论。 */
function paintState(d){
  var hits=(d&&d.list)||[], el=document.getElementById("sub");
  if (!hits.length || FLOW!=="front"){ el.textContent=""; return; }      /* 不知道就不说(同 df 的 cst=0) */
  var now=Number(d.nowS)||Math.floor(Date.now()/1000), n=0;
  for (var i=0;i<hits.length;i++){ var g=hoursOf(hits[i],now); if (g>0 && g<=NEW_H) n++; }
  el.textContent = n>0 ? (t("newPre")+n+t("newSuf")) : t("noNew");
}
function paint(){
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k=el.dataset.i;
    if (k==="foot") el.innerHTML=t(k); else el.textContent=t(k);
  });
}
document.addEventListener("click", function(e){
  var tb=e.target.closest && e.target.closest("#tabs button");
  if (tb){ if (tb.dataset.f!==FLOW){ FLOW=tb.dataset.f;
      document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b===tb); });
      HAS=false; refresh(false); } return; }
  var st=e.target.closest && e.target.closest(".story,.d,.fast");
  if (st && st.dataset.id){
    var nm=String(st.dataset.t||"").trim();
    if (window.xbridge && xbridge.route) xbridge.route("/story?id="+encodeURIComponent(st.dataset.id)+"&c="+encodeURIComponent(st.dataset.c||"")+(nm?"&name="+encodeURIComponent(nm):""));
    else location.href="../story/index.html?id="+encodeURIComponent(st.dataset.id)+"&c="+encodeURIComponent(st.dataset.c||"");
    return;
  }
});

/* 加卡入口 = **一个按钮**(doc/infosource-standard.md §8.1a):打开系统「添加到仪表盘」面板,
   由**用户**在面板里挑。包内不再画组件名录 —— 那是在手抄一份 .xwidget 目录,与真目录两份真源,
   新增组件忘了改这里就永远加不到;而面板已经做得更好(真 RCN 预览、轮播 ⇄ 网格、多选)。
   ⚠️ 调用后**不提示「已添加」**:落盘只发生在面板里的原生按钮上,用户完全可能翻两下就关掉。 */
document.getElementById("pickw").addEventListener("click", function(){
  if (window.xbridge && xbridge.pickWidgets) xbridge.pickWidgets();
});
document.getElementById("xbAt").addEventListener("click", function(){ refresh(true); });

/* 取一次头条。useCache=true → 走 .df 的三态缓存(命中即 3ms);false → 穿透,必打网络。 */
async function fetchFront(useCache){
  if (!(window.xbridge && xbridge.runDataFlow)) return null;
  try { var r=await xbridge.runDataFlow(FLOW,{ _cache: useCache?1:0 });
        return (r && r.code===0) ? r.data : null; } catch(e){ return null; }
}
/* ── G23 首屏缓存的页面侧三件套(doc/infosource-standard.md §5.5.6)────────────
   ① 取数带 `_cache` 开关:首屏要缓存(命中即 3ms),校新/主动刷新穿透(必打网络);
   ② 骨架**延迟 150ms** 才铺:命中缓存整条链路 3ms,先铺一屏「加载中…」再瞬间换掉比不铺更糟;
   ③ 时间锚兼刷新入口:H5 页拿不到容器的下拉刷新(那是 XPage 才有的),而契约 2 要求
      穿透路径必须存在 —— 就挂在这行字上,顺便让「这个数有多旧」看得见(契约 3)。 */
/* ⚠️ 时效锚现在是页头里一个**真按钮**(`.fresh` 胶囊,§1.1),不再是 JS 造出来浮在
   标题右边的一段裸文字 —— 裸文字不给可点暗示,而这一行是本页唯一的刷新入口(G23 契约 2)。 */
function xbAtEl(){ return document.getElementById("xbAt"); }
function paintAt(d){
  var el=xbAtEl();
  /* 本包没有「数据时间」这种东西(榜单是连续变的),时间锚 = **取数那一刻** ——
     `nowS` 是 .df 在取数时落的秒级时间戳,进了缓存就跟着那份数据一起变旧,正是要的语义。 */
  xbAt.set(el, d && d.nowS ? Number(d.nowS) : null);
}

var seq=0, HAS=false;
/* force=true → 用户主动刷新(点时间锚),穿透缓存 */
async function refresh(force){
  var my=++seq, done=false;
  setTimeout(function(){
    if (done || my!==seq || HAS) return;      // 已有内容就不铺骨架:旧货比骨架强
    document.getElementById("list").innerHTML='<div class="state">'+esc(t("loading"))+"</div>";
  },150);

  if (force) xbAt.busy(xbAtEl(), true);
  var d=await fetchFront(!force);
  done=true; xbAt.busy(xbAtEl(), false);
  if (my!==seq) return;
  if (d || !HAS) { paintList(d); paintAt(d); paintState(d); paintDash(d); HAS = !!d; }

  /* 三态的中间那一行:刚才渲的是旧货 → 后台真取一次,回来原地替换,不铺骨架不弹东西 */
  if (!force && d && String(d._stale)==="1"){
    var f=await fetchFront(false);
    if (my===seq && f){ paintList(f); paintAt(f); paintState(f); paintDash(f); }
  }
}

(async function boot(){
  if (!(await ready())){ applyTheme(); paint();
    document.getElementById("list").innerHTML='<div class="state">'+esc(t("fail"))+"</div>"; return; }
  var a=await nbInfo();
  applyTheme(a.theme);
  LANG=nbLang(a.language||a.locale);
  paint();
  refresh();
})();
</script>
</body></html>

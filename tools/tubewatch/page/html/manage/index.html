<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">

<style>
/* v26(2026-09-07 用户点单):列表为主体、可拖拽排序;「添加」收进底部 sheet;删除走 xbridge.confirm(XBDialog)。
   sheet 与遮罩都是页面内 DOM —— 天然在容器视图之内(CLAUDE.md「浮层容器边界」),不用任何平台弹窗。 */
:root{color-scheme:light dark;--bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --tile:#E7E9EE;--src:#CC0000;--srcSoft:rgba(204,0,0,.10);--onsrc:#FFFFFF;--edge:transparent;
  --warn:rgba(255,149,0,.12);--warnFg:#C77700;--dim:rgba(15,20,30,.42);
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--line:#262A31;
  --tile:#20232A;--src:#FF4E45;--srcSoft:rgba(255,78,69,.14);--onsrc:#0B0C0E;
  --edge:rgba(255,255,255,.05);--warnFg:#FFB84D;--dim:rgba(0,0,0,.55);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:12.5px;margin-bottom:16px;line-height:1.55}
.sec{font-size:11.5px;color:var(--sub);font-weight:600;margin:22px 2px 9px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--src);opacity:.85}
.sec small{margin-left:auto;font-weight:400;font-size:11px}
.grp{background:var(--card);border:.5px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 6px;background:var(--card);position:relative;
  transition:transform .16s ease}
.row+.row{border-top:.5px solid var(--line)}
.row.drag{transition:none;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.28);border-radius:12px;border-top:0}
.hd{width:30px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:var(--sub);opacity:.55;font-size:17px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.av{width:34px;height:34px;border-radius:17px;background:var(--tile);flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub)}
.vx{flex:1 1 auto;min-width:0}
.vx .a{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vx .b{font-size:10.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{color:var(--sub);opacity:.6;font-size:16px;padding:6px 8px;flex:0 0 auto}
.x.arm{color:var(--src);opacity:1;font-size:12px;font-weight:700}
.pick{color:var(--src);font-weight:700;font-size:12px;flex:0 0 auto;padding:0 6px}
.empty{color:var(--sub);font-size:12.5px;text-align:center;padding:22px 8px;line-height:1.7}
.addbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:13px 14px;margin-top:12px;
  background:var(--card);color:var(--fg);box-shadow:var(--shadow);text-align:left;font:inherit;border:.5px solid var(--edge)}
.addbtn b{font-size:14px;font-weight:600}
.addbtn small{display:block;color:var(--sub);font-size:11px;margin-top:1px}
.addbtn i{margin-left:auto;font-style:normal;color:var(--src);font-size:20px;font-weight:700;line-height:1}
.addbtn[disabled]{opacity:.45}
.foot{color:var(--sub);font-size:11px;margin-top:20px;line-height:1.7}
/* 底部 sheet(页面内 DOM,容器之内) */
.bd{position:fixed;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity var(--xb-mask) ease;z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;z-index:21;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform var(--xb-sheet) var(--xb-ease-sheet);
  box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:86vh;overflow:auto}
body.open .bd{opacity:1;pointer-events:auto} body.open .sh{transform:none}
.sh .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh h2{font-size:17px;margin:0 0 4px}
.sh .sub{margin-bottom:12px}
.inp{width:100%;border:.5px solid transparent;border-radius:12px;padding:11px 13px;font-size:16px;
  background:rgba(15,20,30,.05);color:var(--fg);outline:none}
html[data-theme="dark"] .inp{background:rgba(0,0,0,.22)}
.cta{display:block;width:100%;border:0;border-radius:12px;padding:12px;text-align:center;
  font-size:14px;font-weight:600;background:var(--src);color:var(--onsrc);margin-top:10px}
.cta[disabled]{opacity:.45}
.warn{border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;margin-top:10px;
  background:var(--warn);display:flex;gap:8px}
.warn b{color:var(--warnFg);flex:0 0 auto}
.sh .grp{margin-top:8px}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。

    transition-duration:.01ms!important;scroll-behavior:auto!important}

  .xb-in{animation:none!important}

function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){

/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */

    try {

async function ready(){for(var i=0;i<24&&!window.xbridge;i++)await new Promise(function(r){setTimeout(r,50);});return !!window.xbridge;}

async function save(){ try{ await xbridge.runFlow("save",{list:LIST}); }catch(e){} }
function openSheet(){ document.body.classList.add("open"); setTimeout(function(){ $("q").focus(); },280); }

async function boot(){
  await ready();
  var d=await nbInfo();
  if(d.theme==="dark")document.documentElement.setAttribute("data-theme","dark");

$("openAdd").addEventListener("click", openSheet);
$("bd").addEventListener("click", closeSheet);
$("go").addEventListener("click", async function(){
  var raw=($("q").value||"").trim(); if(!raw) return;
  say("");
  var m=raw.match(/(UC[0-9A-Za-z_-]{22})/);
  if(!m){ await search(raw, this); return; }
  $("hits").innerHTML="";
  var btn=this; btn.disabled=true; btn.textContent=T.adding;

});
async function search(kw, btn){
  // 输入里没有 UC id → 当作频道名去搜(P1:需要密钥)。无密钥时 search.df 的 ok=0,
  // 提示「绑定后可搜」并保留「粘链接」这条永远可用的路 —— 不把用户堵死在一个必须付费的入口上。
  btn.disabled=true; btn.textContent=T.searching;
  // 无密钥时 Data API 返 **403 并带 JSON 响应体** → 请求是通的,search.df 只是把 ok 落成 0
  // → 提示「绑定后可搜」。而连不上时 request 直接抛 → 这里 catch 到 → 说网络。
  // 少了这道分诊,大陆用户搜一次得到的提示是「去绑定密钥」,绑完还是搜不了。
  var ok=false, rows=[], neterr=false, credState="";
  try{ var r=await xbridge.runDataFlow("search",{q:kw});
       if(r&&typeof r.code==="number"&&r.code!==0) neterr=true;
       var d=(r&&r.data)||r||{};
       ok=String(d.ok)==="1"; rows=Array.isArray(d.rows)?d.rows:[]; credState=String(d.credState||""); }catch(e){ neterr=true; }
  btn.disabled=false; btn.textContent=T.add;
  rows=rows.filter(function(x){return x&&x.id;});
  if(neterr){ say(T.netFail); $("hits").innerHTML=""; return; }
  // ⚠️ 2026-09-09 修一个真 bug:此前这里是 `if(!ok) say(T.noKey)`,而 `ok` 其实是
  // 「有没有搜到东西」—— 于是**绑了密钥、只是这个词搜不到**的用户被告知「要绑定密钥」。
  // 绑没绑是**本地事实**(credential.state,零网络),搜没搜到是**服务端结果**,两件事分开问。
  if(credState && credState!=="bound"){ say(T.noKey); $("hits").innerHTML=""; return; }
  if(!ok || !rows.length){ say(T.noHit); $("hits").innerHTML=""; return; }
  say("");
  var h='<div class="sec">'+esc(T.results)+'</div><div class="grp">';
  rows.forEach(function(c){
    h+='<div class="row" data-pick="'+esc(c.id)+'" data-name="'+esc(c.name)+'">'
     + '<div class="av" style="margin-left:6px">'+esc((c.name||"?").slice(0,1))+'</div>'
     + '<div class="vx"><div class="a">'+esc(c.name)+'</div><div class="b">'+esc(c.id)+'</div></div>'
     + '<span class="pick">＋</span></div>';
  });
  $("hits").innerHTML=h+"</div>";
}
// 删除:优先走桥的 confirm(→ AF ui.confirm → 容器内 XBDialog,四端一致);桥没有时退回「点一次变红、再点一次才删」的两步确认。
async function confirmDel(i){
  var name=LIST[i]&&(LIST[i].name||LIST[i].id)||"";
  if(window.xbridge&&typeof xbridge.confirm==="function"){
    try{ var ok=await xbridge.confirm(T.delT, T.delM.replace("%s",name), {okText:T.delOk,cancelText:T.delNo,destructive:true});
         return ok===true||(ok&&ok.data===true)||(ok&&ok.data&&ok.data.value===true); }catch(e){ return false; }
  }
  if(armed!==i){ armed=i; draw(); setTimeout(function(){ if(armed===i){armed=-1;draw();} },3000); return false; }
  armed=-1; return true;
}
document.addEventListener("click", async function(e){
  var pk=e.target.closest("[data-pick]");
  if(pk){ if(await addOne(pk.dataset.pick,pk.dataset.name||"")){ $("hits").innerHTML=""; $("q").value=""; closeSheet(); } return; }
  var el=e.target.closest("[data-del]"); if(!el) return;
  var i=+el.dataset.del;
  if(!(await confirmDel(i))) return;
  LIST.splice(i,1); await save(); draw();
});
// 拖拽排序:按住 ≡ 手柄,pointer 事件(touch-action:none 让 WebView 不抢滚动);松手按位置重排、整份写回。
(function(){
  var drag=null;
  document.addEventListener("pointerdown", function(e){
    var hd=e.target.closest("[data-hd]"); if(!hd) return;
    var row=hd.closest(".row"), rows=[].slice.call($("list").querySelectorAll(".row"));
    var rects=rows.map(function(r){return r.getBoundingClientRect();});
    drag={from:+hd.dataset.hd, row:row, y0:e.clientY, rects:rects, rows:rows, to:+hd.dataset.hd};
    row.classList.add("drag"); hd.setPointerCapture(e.pointerId); e.preventDefault();
  });
  document.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dy=e.clientY-drag.y0; drag.row.style.transform="translateY("+dy+"px)";
    var cy=drag.rects[drag.from].top+drag.rects[drag.from].height/2+dy, to=drag.from;
    for(var i=0;i<drag.rects.length;i++){ var r=drag.rects[i]; if(cy>r.top+r.height/2) to=i; else break; }
    if(cy<drag.rects[0].top+drag.rects[0].height/2) to=0;
    drag.to=to;
    drag.rows.forEach(function(r,i){
      if(i===drag.from) return;
      var h=drag.rects[drag.from].height;
      var sh=(drag.from<to&&i>drag.from&&i<=to)?-h:(drag.from>to&&i<drag.from&&i>=to)?h:0;
      r.style.transform=sh?"translateY("+sh+"px)":"";
    });
  });
  async function end(){
    if(!drag) return;
    var d=drag; drag=null;
    d.rows.forEach(function(r){ r.style.transform=""; r.classList.remove("drag"); });
    if(d.to!==d.from){ var it=LIST.splice(d.from,1)[0]; LIST.splice(d.to,0,it); draw(); await save(); }
  }
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();
boot();
</script></body></html>

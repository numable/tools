<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day</title>
<style>

/* 源色 = Claude 暖橙两档,与本包 RCN 卡片同源;其余一律取 design-tokens 的 token。 */
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --src:#C15F3C;--srcSoft:rgba(194,65,12,.10);--chip:#E7E9EE;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px -14px rgba(15,20,30,.18)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--src:#E8916B;--srcSoft:rgba(251,146,60,.14);--chip:#20232A;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
.top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--src);flex:0 0 auto}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.6px}
.top .grow{flex:1 1 auto;min-width:0}
.lead{color:var(--sub);font-size:12.5px;margin:2px 0 18px 17px}
/* §1 时效锚 = 页头右上角的 `.xb-at` 胶囊(与首页那颗同规),样式与格式全在 xb:anchor 块
   (tools/infosource/mk_anchor.py),本页只管给它时间。它同时是刷新按钮(§5.5.2 契约 2)。 */
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.step{display:flex;gap:12px;margin-bottom:16px}
.step:last-child{margin-bottom:0}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:11px;background:var(--srcSoft);color:var(--src);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .b{flex:1 1 auto;min-width:0}
.step h3{margin:0 0 5px;font-size:14px;font-weight:600}
.step p{margin:0;color:var(--sub);font-size:12.5px}
code.cmd{display:block;background:var(--chip);border-radius:12px;padding:9px 11px;margin-top:8px;
  font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
button{border:0;font:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--src);color:#fff;border-radius:12px;
  padding:12px;font-size:14px;font-weight:600;margin-top:10px}
.btn.ghost{background:var(--chip);color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--chip);border-radius:12px;padding:11px 12px}
.st .k{color:var(--sub);font-size:11px}
.st .v{font-size:20px;font-weight:700;margin-top:2px}
.st .v.acc{color:var(--src)}
/* ── 聚合首页 ─────────────────────────────────────────── */
/* §2 段标题 = 左名字 + 右摘要,13pt/sub。⚠️ 这条规则在本文件里原本写了两遍
   (这里一份、样式表末尾又一份 uppercase 的),后者整个盖掉前者。现在只留一份。 */
.sect{font-size:13px;color:var(--sub);font-weight:700;margin:20px 0 8px;
  display:flex;align-items:baseline;gap:8px}
.sect em{font-style:normal;font-weight:400;font-size:13px;margin-left:auto;text-align:right}
/* 今日:一个大数 + 两个小数。大数是**输出 token** —— 消息数不区分一句话与一整轮重构,
   而 token 才是「今天让模型干了多少活」。 */
.hero{display:flex;align-items:flex-end;gap:12px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:.98;color:var(--src)}
.hero .big .u{font-size:22px;opacity:.55;letter-spacing:-.4px}
.hero .side{margin-left:auto;text-align:right}
.hero .side .k{font-size:10.5px;color:var(--sub)}
.hero .side .v{font-size:15px;font-weight:700;margin-top:1px}
.hlbl{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.hcmp{font-size:11.5px;color:var(--sub);margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.hcmp b{color:var(--fg)}
/* 折线:与其它包同构(SVG 只画线与面,标注交给 HTML) */
.chartWrap{position:relative;height:96px;margin:2px 0 4px}
.spark{width:100%;height:100%;display:block}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px}
/* 行:最近的日子 / 模型 —— 两处同一种行式,点进去看一个对象 */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer}
.row + .row{border-top:1px solid var(--line)}
.row .d{flex:0 0 58px;font-size:12.5px;font-weight:600}
.row .nm{flex:0 0 76px;font-size:13px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .bar{flex:1 1 0;height:6px;border-radius:3px;background:var(--chip);overflow:hidden;min-width:20px}
.row .bar i{display:block;height:100%;border-radius:3px;background:var(--src);opacity:.8}
.row .v{flex:0 0 56px;text-align:right;font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.row .x{flex:0 0 42px;text-align:right;font-size:11px;color:var(--sub)}
.row .ar{flex:0 0 auto;color:var(--sub);font-size:13px;opacity:.5}
/* 24 小时作息:柱阵,峰值那根用源色 */
.hours{display:flex;align-items:flex-end;gap:2px;height:52px;margin-top:2px}
.hours i{flex:1 1 0;background:var(--chip);border-radius:3px 3px 0 0;min-height:2px}
.hours i.pk{background:var(--src)}
.hlab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:5px}
.three{display:flex;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.three>div{flex:1;text-align:center}
.three .k{font-size:10.5px;color:var(--sub)}
.three .v{font-size:16px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
/* §3 元信息(数据来源 / 用法说明)一律 11pt。 */
/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
.note{color:var(--sub);font-size:11px;line-height:1.6;margin:14px 0 0}
.hide{display:none}
/* ── 2026-09-24 二版:与首页同一套配色 / 胶囊 / 图表(首页 index.html 是真源) ── */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--sOther:#B8BDC6;--grid:#EEF0F3;
  --up:#C15F3C;--upBg:rgba(193,95,60,.10);--dn:#5B6472;--dnBg:rgba(91,100,114,.10)}
html[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--sOther:#4B5059;--grid:#23262C;
  --up:#E8916B;--upBg:rgba(232,145,107,.14);--dn:#9AA1AC;--dnBg:rgba(154,161,172,.14)}
.st .dl{margin-top:auto;padding-top:6px}
.grid.g3 .st{display:flex;flex-direction:column}
.plot{display:block;width:100%;height:120px}
.plot text{font-size:10px;fill:var(--sub);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.share{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:2px 0 10px}
.share i{display:block;height:100%}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .dot2{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.mrow .nm{flex:1 1 auto;font-size:13px;font-weight:600;min-width:0}
.mrow .v{flex:0 0 auto;font-size:14px;font-weight:700}
.mrow .x{flex:0 0 44px;text-align:right;font-size:11px;color:var(--sub)}
.axis2{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
.big2{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.big2 .k{font-size:11.5px;color:var(--sub)}
.big2 .v{font-size:20px;font-weight:700;letter-spacing:-.4px}
.hero2{border-radius:18px;padding:16px 16px 14px;color:#fff;margin-bottom:12px;
  background:linear-gradient(135deg,#E07B55 0%,#C15F3C 52%,#96401F 100%);
  box-shadow:0 10px 26px -14px rgba(150,64,31,.65)}
html[data-theme="dark"] .hero2{background:linear-gradient(135deg,#A9553A 0%,#7E3A22 55%,#4E2313 100%);box-shadow:none}
.hero2 .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.86}
.hero2 .lbl b{font-weight:600}
.hero2 .val{font-size:48px;font-weight:700;letter-spacing:-1.6px;line-height:1.05;margin:6px 0 2px}
.hero2 .sub{font-size:12px;opacity:.86}
.meter{margin-top:12px}
.meter .trk{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.24);overflow:visible}
.meter .fil{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#fff}
.meter .avg{position:absolute;top:-4px;width:2px;height:16px;border-radius:1px;background:rgba(255,255,255,.9)}
.meter .cap{display:flex;justify-content:space-between;font-size:11px;opacity:.86;margin-top:6px}
.hero2 .four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.22)}
.hero2 .four .k{font-size:10.5px;opacity:.78}
.hero2 .four .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;letter-spacing:-.3px}
/* 变化值小胶囊:上涨用源色、下降用中性灰 —— 用量涨跌不是好坏,不用状态色 */
.chip{display:inline-block;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 7px;line-height:1.35;
  white-space:nowrap;vertical-align:middle}
.chip.up{color:var(--up);background:var(--upBg)}
.chip.dn{color:var(--dn);background:var(--dnBg)}
.hero2 .chip{color:#fff;background:rgba(255,255,255,.22)}
/* 近 7 天 KPI 2×2 */

/* xb:anchor v1 — 由 tools/infosource/mk_anchor.py 生成,别手改(页面时效锚 §1.1) */
:root{--xb-at-bg:rgba(14,17,22,.055);--xb-at-fg:#6B7280;--xb-at-live:#128F66;--xb-at-idle:#B8BDC6}
html[data-theme="dark"]{--xb-at-bg:rgba(243,244,246,.08);--xb-at-fg:#8E939B;--xb-at-live:#6FE8BE;--xb-at-idle:#4A4F58}
.xb-at{flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;box-sizing:border-box;height:26px;min-width:26px;padding:0 10px 0 8px;margin:0 0 0 auto;border:0;border-radius:13px;background:var(--xb-at-bg);color:var(--xb-at-fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform var(--xb-out,140ms) ease,opacity var(--xb-out,140ms) ease}
.xb-at:active{transform:scale(var(--xb-scale,.96));opacity:var(--xb-dim,.72);transition-duration:var(--xb-in,60ms)}
.xb-at svg{flex:0 0 auto;display:block;width:13px;height:13px;fill:currentColor}
.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的
   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */
.xb-at.hide,.xb-at[hidden]{display:none}
@keyframes xb-at-spin{to{transform:rotate(360deg)}}
.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}

/* xb:anchor end */
/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.row,.xb-tap{position:relative}
.row::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}

.btn,.sect .at,.pickb,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}
.btn:active,.sect .at:active,.pickb:active,.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* xb:motion end */

  buildColors(allModelNames());
  var days=M().days||[], main=document.getElementById("main"), hero=document.getElementById("hero");
  var show=function(id, on){ document.getElementById(id).classList.toggle("hide", !on); };
  /* 组件直达不带日期 → 今天;今天还没用 → 最近有记录的那天 */
  if (!DATE){ var td=todayOf(); DATE = days.some(function(x){ return x.date===td; }) ? td : (days.length ? days[days.length-1].date : td); }
  var i=-1; for (var k=0;k<days.length;k++) if (days[k].date===DATE) { i=k; break; }
  /* 前一个 / 后一个有记录的日子(翻天不走空日子) */
  var pd=null, nd=null;
  days.forEach(function(x){ if (x.date<DATE && (x.out>0||x.msgs>0)) pd=x.date; if (x.date>DATE && !nd && (x.out>0||x.msgs>0)) nd=x.date; });
  document.getElementById("dnav").innerHTML=
    (pd ? '<button data-day="'+esc(pd)+'">'+esc(t("prevDay","‹ {d}").replace("{d}", md(pd)))+"</button>" : "")+
    (nd ? '<button data-day="'+esc(nd)+'">'+esc(t("nextDay","{d} ›").replace("{d}", md(nd)))+"</button>" : "");
  document.getElementById("h1").textContent = md(DATE); xbTitle(md(DATE));
  if (i<0){ show("hero", false); show("mixWrap", false); show("dailyWrap", false);
    main.innerHTML='<div class="note" style="margin:0">'+esc(t("noData","这一天没有记录"))+"</div>";
    document.getElementById("ctx").innerHTML=""; return; }
  var d=days[i], prev=i>0?days[i-1]:null;
  var out=Number(d.out||0), big=fmt(out);
  document.getElementById("h1").textContent = md(d.date); xbTitle(md(d.date));
  var v2 = "am" in d;                      /* 老服务端没有费用 / 活跃 / 改动 → 主卡退回输出 */
  var vsPrev = prev ? t("vsPrev","比 {d}").replace("{d}", md(prev.date)) : "";

  if (v2){
    var cc = prev ? chgOf(d.usd, prev.usd) : null;
    hero.innerHTML =
      '<div class="lbl"><b>'+esc(t("cost","费用估算"))+"</b>"+
        (cc ? '<span>'+esc(vsPrev)+" "+chipOf(cc)+"</span>" : "")+"</div>"+
      '<div class="val">'+esc(usd(d.usd))+"</div>"+
      '<div class="sub">'+esc(prev ? t("prevV","{d} 是 {v}").replace("{d}", md(prev.date)).replace("{v}", usd(prev.usd)) : "")+"</div>"+
      '<div class="four">'+[
        [t("outTok","输出 token"), big], [t("inTok","输入 token"), fmt(d["in"])],
        [t("cache","缓存写入"), fmt(d.cacheCreate)], [t("sess","会话"), d.sessions==null?"--":String(d.sessions)]
      ].map(function(x){ return '<div><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+"</div></div>"; }).join("")+"</div>";
    show("hero", true);
    /* 三格都带「比前一天」:活跃 / 改动 / 消息 —— 费用已在主卡上 */
    main.innerHTML = '<div class="grid g3">'+
      cellD(t("active","活跃"), dur(d.am), prev && chgOf(d.am, prev.am))+
      /* 三列格子只有 ~84pt 宽:「+13.2k −1.5k」一行放不下 → 大字只放新增,删除降成下面一行小字 */
      cellD(t("lines","改动行"), "+"+fmt(d.la), prev && chgOf(d.la, prev.la), t("removed","删 {n}").replace("{n}", fmt(d.lr)))+
      cellD(t("msgs","消息"), fmt(d.msgs), prev && chgOf(d.msgs, prev.msgs))+
    "</div>";
  } else {
    show("hero", false);
    var n=big.match(/^([\d.]+)([kM]?)$/)||[big,big,""];
    main.innerHTML =
      '<div class="hlbl">'+esc(t("outTok","输出 token"))+"</div>"+
      '<div class="hero"><div class="big">'+esc(n[1])+'<span class="u">'+esc(n[2])+"</span></div>"+
        '<div class="side"><div class="k">'+esc(t("msgs","消息"))+'</div><div class="v">'+esc(fmt(d.msgs))+"</div></div></div>"+
      '<div class="grid" style="margin-top:13px">'+
        cell(t("inTok","输入 token"), fmt(d["in"]))+cell(t("cache","缓存写入"), fmt(d.cacheCreate))+"</div>";
  }

  /* 按模型 + 近 30 天:都来自 daily30(连续 30 天,前 4 个模型单列、其余并成「其他」)。
     这一天不在近 30 天里 → 两段都不出(老日子没有按模型的逐日费用) */
  var d30=M().daily30||[], j=-1;
  for (var q=0;q<d30.length;q++) if (d30[q].d===DATE){ j=q; break; }
  var row = j>=0 ? d30[j] : null;
  var parts = row ? Object.keys(row.parts||{}).map(function(n){ return {name:n, usd:Number(row.parts[n])||0}; })
      .filter(function(x){ return x.usd>0; }).sort(function(a,b){ return b.usd-a.usd; }) : [];
  var psum = parts.reduce(function(a,b){ return a+b.usd; }, 0);
  if (parts.length && psum>0){
    document.getElementById("vMix").textContent = t("vMix","{n} 个模型").replace("{n}", parts.length);
    document.getElementById("mix").innerHTML =
      '<div class="share">'+parts.map(function(x){
        return '<i style="width:'+Math.max(0.8, x.usd/psum*100).toFixed(1)+"%;background:"+colorOf(x.name)+'"></i>'; }).join("")+"</div>"+
      parts.map(function(x){
        var link=x.name!=="other";
        return '<div class="mrow"'+(link?' data-model="'+esc(x.name)+'"':"")+'><span class="dot2" style="background:'+colorOf(x.name)+'"></span>'+
          '<span class="nm">'+esc(mlabel(x.name))+'</span><span class="v">'+esc(usd(x.usd))+
          '</span><span class="x">'+esc(Math.round(x.usd/psum*100))+"%</span>"+(link?'<span class="chev">›</span>':"")+"</div>";
      }).join("");
    show("mixWrap", true);
  } else show("mixWrap", false);

  if (j>=0){
    var vals=d30.map(function(r){ return Number(r.usd)||0; });
    var rk=vals.slice().sort(function(a,b){ return b-a; }).indexOf(vals[j])+1;
    document.getElementById("vDaily").textContent = vals[j]>0
      ? t("vDaily","费用第 {r} 高").replace("{r}", rk) : "";
    document.getElementById("daily").innerHTML = columns(vals, j, "var(--src)", usd, 0, d30.map(function(r){ return r.d; }))+
      '<div class="axis2"><span>'+esc(md(d30[0].d))+"</span><span>"+esc(md(d30[d30.length-1].d))+"</span></div>";
    show("dailyWrap", true);
  } else show("dailyWrap", false);

  /* 用了哪些工具:近 30 天内的日子才有逐日工具次数 */
  var tl = row && row.t ? Object.keys(row.t).map(function(n){ return {name:n, n:Number(row.t[n])||0}; })
      .filter(function(x){ return x.n>0; }).sort(function(a,b){ return b.n-a.n; }) : [];
  if (tl.length){
    var tsum=tl.reduce(function(a,x){ return a+x.n; },0), tmx=tl[0].n;
    document.getElementById("vTools").textContent = t("vTools","{n} 次调用").replace("{n}", fmt(tsum));
    document.getElementById("toolsCard").innerHTML = tl.slice(0,6).map(function(x){
      return '<div class="mrow" data-tool="'+esc(x.name)+'"><span class="nm w">'+esc(toolLabel(x.name))+"</span>"+
        '<span class="bar2"><i style="width:'+Math.max(2,x.n/tmx*100).toFixed(1)+'%;background:var(--src)"></i></span>'+
        '<span class="v" style="min-width:44px;text-align:right">'+esc(fmt(x.n))+'</span><span class="chev">›</span></div>'; }).join("");
    show("toolWrap", true);
  } else show("toolWrap", false);

  /* 「在这段时间里」= 把这一天放回序列:排第几、占多少、比日均高多少。
     单独一个数说明不了「这天算忙还是闲」,而这三个量放一起就说清了。 */
  var outs=days.map(function(x){ return Number(x.out||0); });
  var tot=outs.reduce(function(a,b){return a+b;},0);
  var sorted=outs.slice().sort(function(a,b){ return b-a; });
  var rank=sorted.indexOf(out)+1;
  var act=outs.filter(function(v){ return v>0; }).length;
  var avg=act?tot/act:0;
  var dp=avg>0?(out-avg)/avg*100:null;
  var share=tot>0?out/tot*100:0;
  /* §1 副标 = 这一天此刻的状态,不是「这一天的用量」那种描述。 */
  document.getElementById("lead").textContent = v2
    ? t("leadC","{c} · 活跃 {a} · {m} 条消息").replace("{c}", usd(d.usd)).replace("{a}", dur(d.am)).replace("{m}", fmt(d.msgs))
    : t("leadS","输出 {v} token · {m} 条消息").replace("{v}", big).replace("{m}", fmt(d.msgs));
  /* §2 右侧摘要 = 这一段的答案:这一天在整段序列里排第几。 */
  document.getElementById("vCtx").textContent =
    t("vCtx","输出第 {r} / 共 {n} 天").replace("{r}", rank).replace("{n}", act);
  document.getElementById("ctx").innerHTML=
    '<div class="grid">'+
      cell(t("rank","输出排名"), "#"+rank, rank===1)+
      cell(t("share","占这段时间"), share.toFixed(1)+"%")+
    "</div>"+
    '<div class="hcmp">'+esc(t("vsAvg","比日均"))+" "+
      (dp==null?"<b>--</b>":chipOf({p:Math.round(dp)}))+
      (rank===1?" · "+esc(t("best","目前最忙的一天")):"")+"</div>"+
    '<div class="mrow" data-go="/period?r=d30" style="margin-top:6px;border-top:1px solid var(--line)"><span class="nm">'+
      esc(t("seePeriod","看近 30 天逐日"))+'</span><span class="chev">›</span></div>';
}

(async function boot(){
  var q=new URLSearchParams(location.search);
  DATE=String(q.get("date")||"");
  var ok=await ready();
  var raw=ok?await appInfo():{};
  var info=(raw && raw.data) || raw || {};
  applyTheme(info && info.theme);
  /* 语言:appInfo → <html data-lang> → 英文(doc/overseas-first.md §1–§2,nbLang)。 */
  var lang=(info && (info.language||info.lang||info.locale)) || document.documentElement.getAttribute('data-lang') || '';
  EN = nbLang(lang) !== 'zh';
  T = EN ? L['en-US'] : L['zh-CN'];
  document.documentElement.lang = (EN || T === L['en-US']) ? 'en' : 'zh-CN';
  if (EN){ ['lead','secCtx','secMix','secDaily','secTools','note'].forEach(function(k){
      var e=document.getElementById(k); if(e&&T[k]) e.textContent=T[k]; });
    document.documentElement.lang='en'; }
  else document.getElementById("note").textContent =
    "数据来自 Claude Code 中的采集插件，只包含汇总数字，不含文件路径和任何对话内容。";
  document.getElementById("h1").textContent = md(DATE) || "--"; xbTitle(md(DATE));
  if (!ok) return;
  /* 点锚 = 穿透缓存真取一次、原地替换(§5.5.2 契约 2,与首页同规);在途转圈、连点只算一次。
     新数据解析不出来就保留旧的 D,不把好数据抹掉。 */
  var atBusy=false;
  document.getElementById("at").addEventListener("click", async function(){
    if (atBusy) return;
    atBusy=true; xbAt.busy("at", true);
    try{
      var f=await fetchSummary(false);
      if (f && String(f.live||"")==="1"){
        var nd=null; try{ nd=JSON.parse(String(f.raw||"")); }catch(e){}
        if (nd){ D=nd; paint(); stamp(f); }
      }
    } finally { atBusy=false; xbAt.busy("at", false); }
  });
  var data=await fetchSummary(true);
  if (!data || String(data.live||"")!=="1") return;
  try{ D=JSON.parse(String(data.raw||"")); }catch(e){ D=null; }
  if (D) paint(); stamp(data);
  if (String(data._stale)==="1"){
    var fresh=await fetchSummary(false);
    if (!fresh || String(fresh.live||"")!=="1") return;
    try{ D=JSON.parse(String(fresh.raw||"")); }catch(e){ return; }
    paint(); stamp(fresh);
  }
})();
</script>

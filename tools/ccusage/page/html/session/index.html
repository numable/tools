<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>会话</title>
<style>
/* 源色 = Claude 暖橙两档,与本包 RCN 卡片同源;其余一律取 design-tokens 的 token(与同包详情页同一份)。 */
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --src:#C15F3C;--srcSoft:rgba(194,65,12,.10);--chip:#E7E9EE;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px -14px rgba(15,20,30,.18)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--src:#E8916B;--srcSoft:rgba(251,146,60,.14);--chip:#20232A;--shadow:none}
/* 实时会话的状态与类目色 —— 逐值抄自服务端组件视图 Numable-ccusage/service/src/live.js 的 C(组件那边的真源)。
   三族(doc/ccusage-live-timeline.md §1.4):强调色 = 在跑 · 黄 = 等你 · 灰 = 停了。类目色避开这三族。 */
:root{--run:#C15F3C;--wait:#C98A00;--waitBg:#FBF1D6;--stop:#A1A1AA;--track:#F1EEEC;
  --k-r:#4F7BE0;--k-e:#2F9E5B;--k-s:#5B6B7F;--k-a:#8B6FD6;--k-w:#3D8BD9;--k-b:#1F9BB0;--k-d:#9C6B3F;--k-m:#8D96A3;--k-q:#C98A00;--k-o:#A1A1AA}
html[data-theme="dark"]{--run:#E8916B;--wait:#F5C242;--waitBg:#3A3015;--stop:#5B5B63;--track:#2A2725;
  --k-r:#7D9BEF;--k-e:#4CC27A;--k-s:#8E9BB0;--k-a:#A792EC;--k-w:#5FA5EC;--k-b:#3CB9CD;--k-d:#C7925F;--k-m:#6E7782;--k-q:#F5C242;--k-o:#6E6E76}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
.top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--src);flex:0 0 auto}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .grow{flex:1 1 auto;min-width:0}
.lead{color:var(--sub);font-size:12.5px;margin:2px 0 18px 17px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
button{border:0;font:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--src);color:#fff;border-radius:12px;
  padding:12px;font-size:14px;font-weight:600;margin-top:10px}
.btn.ghost{background:var(--chip);color:var(--fg)}
.sect{font-size:13px;color:var(--sub);font-weight:700;margin:20px 0 8px;display:flex;align-items:baseline;gap:8px}
.sect em{font-style:normal;font-weight:400;font-size:13px;margin-left:auto;text-align:right}
.note{color:var(--sub);font-size:11px;line-height:1.6;margin:14px 0 0}
.hide{display:none}
.chev{flex:0 0 auto;color:var(--sub);opacity:.5;font-size:14px;line-height:1;margin-left:2px}
.num0{font-variant-numeric:tabular-nums}
code.cmd{display:block;background:var(--chip);border-radius:12px;padding:9px 11px;margin-top:8px;
  font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
/* 引导态(三种没数据分开说,§4B):一句现状 + 一句下一步 */
.guide h3{margin:0 0 6px;font-size:15px;font-weight:700}
.guide p{margin:0;color:var(--sub);font-size:12.5px}
.guide p.alt{margin-top:10px;font-size:11.5px}
/* 状态位 / 图标:图标 + 字 + 时长,不靠颜色也能读(§5.4 第 3 条) */
.sb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;
  white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.sb.running{color:var(--run)}
.sb.perm{background:var(--wait);color:#1A1400}
.sb.input{color:var(--wait);box-shadow:inset 0 0 0 1px var(--wait)}
.sb.parked{color:var(--sub);box-shadow:inset 0 0 0 1px var(--stop)}
.sb.lost{color:var(--sub)}
.sb.ended{color:var(--sub);font-weight:400}
/* 标签列圆点:运行实心强调色(呼吸)· 授权实心黄 · 输入空心黄 · 搁置空心灰 · 断开 / 结束实心灰 */
.sd{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--stop)}
.sd.running{background:var(--run);animation:lv-breath 1.8s ease-in-out infinite}
.sd.perm{background:var(--wait)}
.sd.input{background:transparent;box-shadow:inset 0 0 0 1.5px var(--wait)}
.sd.parked{background:transparent;box-shadow:inset 0 0 0 1.5px var(--stop)}
@keyframes lv-breath{0%,100%{opacity:1}50%{opacity:.35}}
/* 尾巴画法(§5.4,与组件同形):授权 = 实心黄块;输入 = 黄 1px 描边 + 淡黄底;搁置 = 灰描边 + 轨道底;断开 = 半透明灰 */
.tl-perm{background:var(--wait)}
.tl-input{background:var(--waitBg);box-shadow:inset 0 0 0 1px var(--wait)}
.tl-parked{background:var(--track);box-shadow:inset 0 0 0 1px var(--stop)}
.tl-lost{background:var(--stop);opacity:.55}
/* 状态图标:CSS 画形状(字符图标在部分字体里没有字形) */
.ic{display:inline-block;flex:0 0 auto;font-style:normal;line-height:1;vertical-align:middle}
.ic.running{width:0;height:0;border-left:7px solid var(--run);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin:0 1px}
.ic.perm{color:var(--wait);font-size:11px;font-weight:700}
.ic.input,.ic.parked{width:7px;height:9px;border-left:2.5px solid var(--wait);border-right:2.5px solid var(--wait)}
.ic.parked{border-color:var(--stop)}
.ic.lost{color:var(--sub);font-size:13px;font-weight:700;margin-top:-1px}
.ic.ended{width:7px;height:7px;background:var(--stop);border-radius:1px}
.sb.perm .ic.perm{color:#1A1400}
/* 工具类目 → 块颜色 */
.k-r{background:var(--k-r)}.k-e{background:var(--k-e)}.k-s{background:var(--k-s)}.k-a{background:var(--k-a)}.k-w{background:var(--k-w)}
.k-b{background:var(--k-b)}.k-d{background:var(--k-d)}.k-m{background:var(--k-m)}.k-q{background:var(--k-q)}.k-o{background:var(--k-o)}
/* 会话行(全部会话 / 等你处理 / 同工程的其它会话) */
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.srow + .srow{border-top:1px solid var(--line)}
.srow .bd{flex:1 1 auto;min-width:0}
.srow .p{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.srow .rt .x{font-size:11px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.srow.dim .bd{opacity:.55}
.srow.alert{background:color-mix(in srgb,var(--wait) 12%,transparent);margin:0 -8px;padding:10px 8px;border-radius:12px}
.srow.alert + .srow{border-top-color:transparent}
.srow[data-go]{-webkit-user-select:none;user-select:none;transition:opacity var(--xb-out,140ms) ease}
.srow[data-go]:active{opacity:.55;transition-duration:var(--xb-in,60ms)}
/* 可能卡住(§6.2):黄字一行,只是信号不下结论 —— 不改状态圆点、不改状态位(状态词表 §1.4 不动) */
.srow .sk{font-size:11.5px;color:var(--wait);font-weight:600;line-height:1.45;margin-top:2px}
.srow .sk .ic.perm{font-size:10.5px;margin-right:3px}
.stk{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--wait);line-height:1.45;
  background:color-mix(in srgb,var(--wait) 12%,transparent);border-radius:10px;padding:7px 10px}
.stk .ic.perm{font-size:12px}
[data-go]{cursor:pointer}

.meta0{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 轮询:页面可见时每 15 秒一发,隐藏即停、回来立刻补一发(照 crypto 首页 Poller)。
   离开本页(压栈进详情)后降到 60 秒:有的宿主在栈底页上不派发可见性事件,那就退到「慢慢刷」,
   而不是一直全速或永远停住;回来时靠 visibilitychange / focus / pageshow / 任何一次触摸恢复原速。 */
function Poller(fn, ms){
  var timer=null, busy=false, away=false;
  async function tick(){ if (busy || document.visibilityState==="hidden") return;
    busy=true; try{ await fn(); }catch(e){} busy=false; }
  function arm(){ if (timer) clearInterval(timer); timer=setInterval(tick, away?Math.max(60000,ms):ms); }
  function back(){ if (away){ away=false; arm(); tick(); } }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState==="visible"){ away=false; arm(); tick(); }
    else if (timer){ clearInterval(timer); timer=null; }
  });
  addEventListener("focus", back); addEventListener("pageshow", back);
  document.addEventListener("pointerdown", back, true);
  return {start:arm, tick:tick, leave:function(){ away=true; arm(); }};
}

}

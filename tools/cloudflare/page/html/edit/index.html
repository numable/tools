<!DOCTYPE html>
<!--
  选域名页(路由 /edit):卡片「编辑参数」的落点,?brickId=<实例> 定位要改的那张卡。
  点某一行 → xbridge.updateParams(brickId, {zoneId, zoneName}) 立即回写(改即生效)。

  ⚠️ **这一页必须是 H5,不能是 XPage** —— 不是审美选择,是平台现状:
  `PageRouter.openParamPage`(编辑参数那条路)与常规的 `openPage` 不是同一条代码路径,
  后者按 route 的 `type` 做 xpage/form/html 三分派,前者**写死 WebView 壳、从不读 type**。
  把 onEdit 指向 `type:"xpage"` 的路由 → 被塞进 WebView 去解析一个不存在的域名
  → `ERR_NAME_NOT_RESOLVED`(2026-08-09 Android 真机撞到)。平台侧补齐三分派之前,onEdit 一律指 H5。

  ⚠️ 页面只拿得到域名列表,拿不到令牌本体 —— 2026-09-09 令牌迁进 App 凭证中心后,
  这已经不是「resultFilter 里没写」的自觉,而是**结构上读不到**:注入发生在网络出口,
  包只写一句「这个请求用哪条凭证」。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choose a zone</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --chip:#E7E9EE;--src:#F38020;--ok:#1FC77D}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--chip:#20232A;--src:#FBAD41}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 16px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:12px;margin-bottom:16px;line-height:1.6}
.row{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ok);flex:0 0 auto}
.dot.off{background:var(--src)}
.tx{flex:1 1 auto;min-width:0}
.tx b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx i{display:block;font-style:normal;color:var(--sub);font-size:11px;margin-top:1px}
.tick{color:var(--src);font-weight:700;font-size:15px;opacity:0}
.row.on .tick{opacity:1}
.empty{background:var(--card);border-radius:14px;padding:18px 14px;color:var(--sub);
  font-size:13px;line-height:1.7;text-align:center}
.more{color:var(--sub);font-size:11px;line-height:1.6;margin-top:10px;padding:0 2px}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.row,.xb-tap{position:relative}
.row::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.row:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}
.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */
@keyframes xb-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */
@keyframes xb-sheen{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .xb-sk{opacity:1!important;animation:none!important}
  .xb-in{animation:none!important}
}
/* xb:motion end */
</style></head><body>
<h1 id="h1"></h1>
<div class="sub" id="sub"></div>
<div id="list"></div>
<div class="more" id="more"></div>

<script>
var $=function(i){return document.getElementById(i)};
var bridge=function(){return window.xbridge||{}};
var brickId='', cur='', zones=[];
// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* 文案中英两份(doc/overseas-first.md §2):缺省英文,先用 <html data-lang>,appInfo 回来再以它为准;缺键回落英文。 */
var I18N={
 zh:{h1:"选择域名",sub:"选择这个组件显示哪个域名的数据，点击即生效。",
  none:"这个令牌下没有可读的域名。<br>回到「我的 Cloudflare 账号」确认令牌还有效，<br>且 Zone Resources 里包含了你的域。",
  noBridge:"请在 Numable 里打开这一页。",
  noToken:"还没有配置只读令牌。<br>请回到工具首页，在「我的 Cloudflare 账号」中填写。",
  more:"这个账号下有 {n} 个域名，这里只列出前 8 个。",fail:"读取域名列表失败：{e}"},
 en:{h1:"Choose a zone",sub:"Pick the zone this widget shows. Tap a row to apply.",
  none:"This token can't read any zones.<br>Go back to \u201cMy Cloudflare account\u201d and check the token is still valid<br>and that Zone Resources includes your zones.",
  noBridge:"Open this page in Numable.",
  noToken:"No read-only token yet.<br>Add one under \u201cMy Cloudflare account\u201d on this tool\u2019s home page.",
  more:"This account has {n} zones. Only the first 8 are listed here.",fail:"Couldn't load your zones: {e}"}};
var LANG=nbLang(document.documentElement.getAttribute('data-lang'));
function t(k){var m=I18N[LANG]; if(m&&Object.prototype.hasOwnProperty.call(m,k)) return m[k]; return Object.prototype.hasOwnProperty.call(I18N.en,k)?I18N.en[k]:k;}
function paintStatic(){ $('h1').textContent=t('h1'); $('sub').textContent=t('sub'); }
paintStatic();

function pick(z){
  if(!(window.xbridge && xbridge.updateParams && brickId)) return;
  cur = z.id;
  // 两个键都写回:zoneId 是取数键,zoneName 是卡上直接显示的名字
  // (卡片的 flow 只收 zoneId,拿不到名字;为一个字符串再打一次 /zones 不值)。
  xbridge.updateParams(brickId, {zoneId:z.id, zoneName:z.name});
  render();
}

function render(){
  var box=$('list'); box.innerHTML='';
  if(!zones.length){
    box.innerHTML='<div class="empty">'+t('none')+'</div>';
    return;
  }
  zones.forEach(function(z){
    var d=document.createElement('div');
    d.className='row'+(z.id===cur?' on':'');
    d.innerHTML='<span class="dot'+(z.status==='active'?'':' off')+'"></span>'+
      '<span class="tx"><b></b><i></i></span><span class="tick">✓</span>';
    d.querySelector('b').textContent=z.name;
    d.querySelector('i').textContent=(z.status||'--')+' · '+(z.plan||'--');
    d.onclick=function(){pick(z)};
    box.appendChild(d);
  });
}

(async function(){
  var q=new URLSearchParams(location.search);
  brickId=q.get('brickId')||'';
  cur=q.get('zoneId')||'';
  var info=await nbInfo();
  if(info.theme==='dark'||info.theme==='light') document.documentElement.setAttribute('data-theme',info.theme);
  LANG=nbLang(info.language||info.locale); paintStatic();
  addEventListener('languagechange',function(e){ LANG=nbLang((e&&e.detail&&e.detail.language)||document.documentElement.getAttribute('data-lang')); paintStatic(); if(zones.length) render(); });
  if(!bridge().runDataFlow){ $('sub').textContent=t('noBridge'); return; }
  // 取数流是 .df,必须用 runDataFlow —— 用 runFlow 只会搜 .af,直接 -6 flow not found(标准 §9.5 #7)。
  bridge().runDataFlow('zones',{},10000).then(function(r){
    var d=(r&&r.data)||r||{};
    if(String(d.hasToken==null?'0':d.hasToken)!=='1'){
      $('list').innerHTML='<div class="empty">'+t('noToken')+'</div>';
      return;
    }
    var n=Number(d.n||0);
    // 定长 8 槽,按 n 截断(尾槽字段为空)。
    zones=(d.list||[]).slice(0, Math.min(n,8)).filter(function(z){return z && z.id;});
    render();
    // ⚠️ 超过 8 个要**说出来**:静默截断读起来就像「你只有 8 个域」。
    if(n>8) $('more').textContent=t('more').replace('{n}',n);
  }).catch(function(e){
    var em=String((e&&e.message)||e).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
    $('list').innerHTML='<div class="empty">'+t('fail').replace('{e}',em)+'</div>';
  });
})();
</script>
</body></html>

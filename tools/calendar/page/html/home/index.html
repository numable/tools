<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i="title">Chinese Calendar</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--fade:#AEB3BB;--line:#E4E7EC;--tile:#E7E9EE;
  --src:#C8402F;--srcSoft:#F8E3DF;--term:#128F66;--wk:#C0584A;--accent:#128F66;--onSrc:#FFFFFF;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--fade:#4A4F58;--line:#262A31;
  --tile:#20232A;--src:#F2735F;--srcSoft:#3A1E19;--term:#6FE8BE;--wk:#E88A7D;--accent:#6FE8BE;--onSrc:#15171A;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"PingFang SC","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
button{font:inherit;color:inherit}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec b{color:var(--fg);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px;vertical-align:1px}
.chip.off{background:var(--srcSoft);color:var(--src)}
.chip.work{background:var(--tile);color:var(--sub)}
.src{color:var(--src)}.term{color:var(--term)}.mut{color:var(--sub)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0;padding-top:0}.kv:last-child{padding-bottom:0}
.kv>span:first-child{color:var(--sub);flex:0 0 auto}
.kv>span:last-child{text-align:right}
.lst{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:14.5px;font-weight:600}
.it .m i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.it .v{text-align:right;font-size:13.5px;font-weight:600;white-space:nowrap}
.it .v i{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--sub)}
.it.cur{background:color-mix(in srgb,var(--src) 7%,var(--card))}
.it.past{opacity:.5}
.chev{color:var(--fade);font-size:18px;line-height:1}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;font-size:12.5px;padding:6px 0;border-radius:8px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meta{font-size:11.5px;color:var(--sub);margin-top:18px;line-height:1.6}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}
/* 贴底 sheet(容器内自绘,不用窗口级浮层) */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;z-index:21;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s ease;
  max-height:86vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12);visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.sheet.on{transform:none;visibility:visible;transition:transform .26s ease}
html[data-theme="dark"] .sheet{box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.sheet h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);appearance:none;-webkit-appearance:none}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;
  background:var(--accent);color:var(--onSrc)}
html[data-theme="dark"] .btn{color:#0B0C0E}
.btn.ghost{background:var(--tile);color:var(--fg)}
.btn.danger{background:none;color:var(--src);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.empty{text-align:center;color:var(--sub);padding:26px 10px}
@media (prefers-reduced-motion:reduce){.sheet,.mask{transition:none}}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
/* 首页:今日 → 月历 → 选中那天的详情 → 黄历 → 更多。零网络:历法全部由页内引擎现算(表与组件同源)。 */
.hero{display:flex;gap:14px;align-items:center}
.hero .big{font-size:54px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.hero .mid{flex:1;min-width:0}
.hero .l1{font-size:12.5px;color:var(--sub)}
.hero .l2{font-size:19px;font-weight:700;margin:1px 0}
.hero .l2 em{font-style:normal;font-size:14px;margin-left:6px}
.hero .l3{font-size:12.5px;color:var(--sub)}
.hero .chip{align-self:flex-start}
.mcard{padding:10px 8px 8px}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.mnav button{background:none;border:0;padding:4px 10px;font-size:20px;color:var(--sub);cursor:pointer;line-height:1}
.mnav .mttl{font-size:15px;font-weight:700;color:var(--fg)}
.mnav .mttl small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);touch-action:pan-y}
.grid .wd{font-size:11px;color:var(--sub);text-align:center;padding-bottom:4px}
.grid .c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:52px;
  border:0;background:none;padding:0;cursor:pointer}
.grid .c .n{font-size:17px;font-weight:600;width:30px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;line-height:1}
.grid .c .l{font-size:10px;line-height:1.2;color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.grid .c.we .n{color:var(--wk)}
.grid .c.k2 .l,.grid .c.k4 .l{color:var(--src)}
.grid .c.k3 .l{color:var(--term)}
.grid .c.k5 .l{color:var(--fg);font-weight:700}
.grid .c.o{opacity:.32}
.grid .c .h{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;line-height:1}
.grid .c .h.r{color:var(--src)}.grid .c .h.b{color:var(--sub)}
.grid .c.today .n{background:var(--src);color:var(--onSrc)}
.grid .c.sel:not(.today) .n{box-shadow:0 0 0 1.5px var(--src)}
.mfoot{display:flex;justify-content:space-between;align-items:center;min-height:20px;padding:6px 6px 0;font-size:11.5px;color:var(--sub)}
.yj b{display:inline-block;min-width:22px;font-weight:700}
html[lang=en] .yj b{margin-right:8px}
.yj p{margin:0 0 6px;font-size:13.5px;line-height:1.7}
.ymy{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ymy button{background:none;border:0;font-size:22px;color:var(--sub);padding:4px 12px;cursor:pointer}
.ymy b{font-size:17px}
.ymm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ymm button{border:0;background:var(--tile);border-radius:10px;padding:10px 0;font-size:14px;cursor:pointer}
.ymm button.on{background:var(--src);color:var(--onSrc);font-weight:700}

/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的

.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.xb-at.busy svg{animation:none;opacity:.5}}
/* xb:anchor end */
</style>

<body>
<div class="hd"><h1 data-i="title"></h1><button class="xb-at" id="fresh" type="button"></button></div>
<div class="card hero" id="hero"></div>
<div class="card mcard">
  <div class="mnav"><button id="prev" aria-label="prev">‹</button><button class="mttl" id="ttl"></button><button id="next" aria-label="next">›</button></div>
  <div class="grid" id="grid"></div>
  <div class="mfoot"><span id="pend"></span><button class="link" id="back" data-i="backToday"></button></div>
</div>
<div class="sec"><b id="dTitle"></b><span id="dRel"></span></div>
<div class="card" id="detail"></div>
<div id="yjBox">
  <div class="sec"><b data-i="almanacT"></b><span data-i="folk"></span></div>
  <div class="card yj" id="yiji"></div>
</div>
<div class="sec"><b data-i="more"></b></div>
<div class="lst">
  <button class="it" data-go="/holidays"><div class="m"><b data-i="holidays"></b><i id="mHol"></i></div><span class="chev">›</span></button>
  <button class="it" data-go="/terms"><div class="m"><b data-i="terms"></b><i id="mTerm"></i></div><span class="chev">›</span></button>
  <button class="it" data-go="/dates"><div class="m"><b data-i="dates"></b><i id="mDates"></i></div><span class="chev">›</span></button>
  <button class="it" data-go="/tools"><div class="m"><b data-i="tools"></b><i data-i="toolsS"></i></div><span class="chev">›</span></button>
</div>
<button class="pickb" id="pickw"><span class="pk">＋</span><span class="pg"><b data-i="pickT"></b><span class="d" data-i="pickS"></span></span></button>
<div class="lst" style="margin-top:12px"><button class="it" id="setBtn"><div class="m"><b data-i="settings"></b><i id="setS"></i></div><span class="chev">›</span></button></div>
<div class="meta" id="meta"></div>

<div class="mask" id="mask"></div>
<div class="sheet" id="ymSheet">
  <h3><span data-i="pickMonth"></span><button class="link" id="ymToday" data-i="backToday"></button></h3>
  <div class="ymy"><button id="yPrev">‹</button><b id="yTxt"></b><button id="yNext">›</button></div>
  <div class="ymm" id="ymm"></div>
</div>
<div class="sheet" id="setSheet">
  <h3 data-i="settings"></h3>
  <div class="fld"><label data-i="weekStart"></label><div class="seg" id="segWs"><button data-v="1" data-i="mon"></button><button data-v="0" data-i="sun"></button></div></div>
  <div class="fld"><label data-i="showAlmanac"></label><div class="seg" id="segAl"><button data-v="1" data-i="show"></button><button data-v="0" data-i="hide"></button></div></div>
  <div class="fld"><label data-i="showOffwork"></label><div class="seg" id="segOw"><button data-v="1" data-i="show"></button><button data-v="0" data-i="hide"></button></div></div>
  <p class="meta" style="margin-top:4px" data-i="setNote"></p>
</div>
<script>
/* 万年历页面引擎(由 tools/infosource/calendar/gen.py 内联进各页,别手改)。

function mdText(dn) { var x = CalE.ymd(dn); return EN ? MOE[x.m - 1] + " " + x.d : x.m + " 月 " + x.d + " 日"; }
function ymdText(dn) { var x = CalE.ymd(dn); return EN ? MOE[x.m - 1] + " " + x.d + ", " + x.y : x.y + " 年 " + x.m + " 月 " + x.d + " 日"; }
function ymText(y, m) { return EN ? MOE[m - 1] + " " + y : y + " 年 " + m + " 月"; }
function relDays(n) {
  if (n === 0) return t("today");
  return n > 0 ? tf("inDays", { n: n }) : tf("daysAgo", { n: -n });
}
function openSheet(id) { $("mask").classList.add("on"); $(id).classList.add("on"); }
function closeSheets() {
  $("mask").classList.remove("on");
  Array.prototype.forEach.call(document.querySelectorAll(".sheet"), function (s) { s.classList.remove("on"); });
}
async function boot(main) {
  /* 启动顺序照 market boot():先用宿主在 documentStart 写好的 <html data-lang / data-theme>,appInfo 回来再以它为准;
     appInfo 带信封且 code≠0 = 没拿到(nbInfo 已处理)。缺省一律英文。 */
  var de = document.documentElement;
  var hostLang = de.getAttribute("data-lang") || "", hostTheme = de.getAttribute("data-theme") || "";
  if (hostLang) LANG = nbLang(hostLang);
  INFO = await nbInfo();
  applyTheme(INFO.theme || hostTheme || undefined);
  LANG = nbLang(INFO.language || INFO.locale);
  EN = LANG === "en";
  de.lang = EN ? "en" : "zh";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = t(el.dataset.i); });
  var mk = $("mask"); if (mk) mk.addEventListener("click", closeSheets);
  await main();
}

var TODAY = CalE.todayDn(), SEL = TODAY, VY, VM, RAW = {}, SET = { ws: 1, almanac: 1, offwork: 1 }, DATES = [], PY;
/* 设置:RAW = 用户真设过的(data.settings 原样);SET = 生效值。没设过的项按缺省走(doc/overseas-first.md §6、§8):
   周首跟随宿主 · 黄历与休 / 班标记中文界面开、其他语言关。只把用户动过的那一项写回,缺省值不落盘。 */
function setOn(v) { return !(v === 0 || v === "0"); }
function hasSet(k) { return RAW[k] !== undefined && RAW[k] !== null && RAW[k] !== ""; }
function effSet() {
  return { ws: hasSet("ws") ? (setOn(RAW.ws) ? 1 : 0) : defWs(),
           almanac: hasSet("almanac") ? (setOn(RAW.almanac) ? 1 : 0) : (EN ? 0 : 1),
           offwork: hasSet("offwork") ? (setOn(RAW.offwork) ? 1 : 0) : (EN ? 0 : 1) };
}
(function () { var x = CalE.ymd(TODAY); VY = x.y; VM = x.m; })();

function kindCls(k) { return "k" + k; }
function hdChip(h) { return h && SET.offwork ? '<span class="chip ' + (h.h === 1 ? "off" : "work") + '">' + t(h.h === 1 ? "off" : "work") + "</span>" : ""; }

function paintHero() {
  var L = CalE.lunar(TODAY), tg = CalE.tag(TODAY, EN), x = CalE.ymd(TODAY), h = CalE.hd(TODAY);
  var em = tg.k <= 4 ? '<em class="' + (tg.k === 3 ? "term" : "src") + '">' + esc(tg.full) + "</em>" : "";
  $("hero").innerHTML = '<div class="big">' + x.d + '</div><div class="mid"><div class="l1">' + esc(ymText(x.y, x.m)) + " · " +
    wdName(TODAY) + '</div><div class="l2">' + esc(CalE.lunarText(L, EN)) + em + '</div><div class="l3">' +
    esc(gzLine(TODAY)) + "</div></div>" + hdChip(h);
}
function gzLine(dn) {
  var L = CalE.lunar(dn);
  if (EN) return CalE.gzPy(CalE.gzYear(L.ly)) + " · " + CalE.gzPy(CalE.gzMonth(dn)) + " · " + CalE.gzPy(CalE.gzDay(dn));
  return CalE.gzName(CalE.gzYear(L.ly)) + "年 " + CalE.gzName(CalE.gzMonth(dn)) + "月 " + CalE.gzName(CalE.gzDay(dn)) + "日";
}
function paintGrid() {
  var first = CalE.dnOf(VY, VM, 1), lead = (CalE.wd(first) - SET.ws + 7) % 7, s0 = first - lead;
  var nm = VM === 12 ? CalE.dnOf(VY + 1, 1, 1) : CalE.dnOf(VY, VM + 1, 1);
  var wds = SET.ws === 1 ? t("wd1").split(",") : t("wd0").split(","), html = "";
  for (var i = 0; i < 7; i++) html += '<div class="wd">' + wds[i] + "</div>";
  for (var k = 0; k < 42; k++) {
    var dn = s0 + k, x = CalE.ymd(dn), tg = CalE.tag(dn, EN), h = CalE.hd(dn), w = CalE.wd(dn);
    var cls = ["c", kindCls(tg.k)];
    // 数字色:休 / 班标记打开且这天有安排时跟随安排(休 = 红、调休上班 = 正文色),否则按周末(2026-10-08)
    if (h && SET.offwork ? h.h === 1 : (w === 0 || w === 6)) cls.push("we");
    if (dn < first || dn >= nm) cls.push("o");
    if (dn === TODAY) cls.push("today");
    if (dn === SEL) cls.push("sel");
    html += '<button class="' + cls.join(" ") + '" data-dn="' + dn + '"><span class="n">' + x.d + '</span><span class="l">' +
      esc(tg.t) + "</span>" + (h && SET.offwork ? '<span class="h ' + (h.h === 1 ? "r" : "b") + '">' + t(h.h === 1 ? "gOff" : "gWork") + "</span>" : "") + "</button>";
  }
  $("grid").innerHTML = html;
  var a = CalE.lunar(first), b = CalE.lunar(nm - 1);
  var span = CalE.monthName(a, EN, true) + (a.code !== b.code || a.ly !== b.ly ? "—" + CalE.monthName(b, EN, true) : "");
  $("ttl").innerHTML = esc(ymText(VY, VM)) + "<small>" + esc(span) + "</small>";
  var hy = CalE.holidayYears();
  $("pend").textContent = SET.offwork && VY > hy[hy.length - 1] ? tf("pending", { y: VY }) : "";
  var tx = CalE.ymd(TODAY);
  $("back").style.visibility = (VY === tx.y && VM === tx.m && SEL === TODAY) ? "hidden" : "visible";
}
function paintDetail() {
  var dn = SEL, L = CalE.lunar(dn), h = CalE.hd(dn), ct = CalE.curTerm(dn), rows = [];
  $("dTitle").textContent = mdText(dn) + " " + wdName(dn);
  var wk = Math.floor((dn - CalE.dnOf(CalE.ymd(dn).y, 1, 1) + ((CalE.wd(CalE.dnOf(CalE.ymd(dn).y, 1, 1)) + 6) % 7)) / 7) + 1;
  $("dRel").textContent = relDays(dn - TODAY) + " · " + tf("weekN", { n: wk });
  // 英文:年与月日之间换行(原来挤成「Year of the Horse Month 8 · Day 21」读不出分隔,2026-10-08)
  rows.push([t("lunar"), esc(CalE.yearText(L.ly, EN)) + (EN ? "<br>" : " ") + esc(CalE.lunarText(L, EN) + " · " +
    (EN ? t(L.size === 30 ? "big" : "small") : CalE.monthName(L) + t(L.size === 30 ? "big" : "small"))), 1]);
  rows.push([t("ganzhi"), gzLine(dn)]);
  var fs = CalE.festivals(dn).map(function (f) { return '<span class="src">' + esc(EN ? f.en : f.zh) + "</span>"; });
  if (fs.length) rows.push([t("festival"), fs.join(" · "), 1]);
  if (!SET.offwork) {
    /* 休 / 班标记关掉(英文界面缺省):这一行整个不出 —— 放假安排页照常可看 */
  } else if (h) {
    var p = h.p, name = EN ? p[4] : p[3];
    rows.push([t("dayoff"), hdChip(h) + " " + esc(h.h === 1 ? tf("offN", { name: name, n: dn - p[0] + 1, d: p[2] }) : tf("workN", { name: name })), 1]);
  } else {
    var hy = CalE.holidayYears(), y = CalE.ymd(dn).y;
    if (y > hy[hy.length - 1]) rows.push([t("dayoff"), tf("pending", { y: y })]);
  }
  var tn = function (x) { return EN ? CAL.JQ_EN[x.i] : CAL.JQN[x.i]; };
  if (ct.today) rows.push([t("term"), '<span class="term">' + esc(tn(ct.today)) + "</span> " + esc(ct.today.t ? tf("termAt", { t: ct.today.t }) : ""), 1]);
  else rows.push([t("term"), esc(tf("termNow", { a: tn(ct.cur), b: tn(ct.next), n: ct.next.dn - dn })), 1]);
  var alt = CalE.lichunAlt(dn);
  if (alt && !EN) rows.push(["", '<span class="mut">' + esc(tf("lichun", { g: alt })) + "</span>", 1]);
  $("detail").innerHTML = rows.map(function (r) {
    return '<div class="kv"><span>' + esc(r[0]) + "</span><span>" + (r[2] ? r[1] : esc(r[1])) + "</span></div>";
  }).join("");
  $("yjBox").style.display = SET.almanac === 0 ? "none" : "";
  var y = CalE.yiji(dn);
  if (y) {
    $("yiji").innerHTML = "<p><b>" + t("yi") + "</b>" + esc(y.yi.join(" ")) + "</p><p><b>" + t("ji") + "</b>" + esc(y.ji.join(" ")) +
      "</p>" + '<div class="kv"><span>' + t("chongsha") + "</span><span>" + esc(y.cs) + '</span></div><div class="kv"><span>' +
      t("zhishen") + "</span><span>" + esc(y.zx + " · " + y.ts) + '</span></div><div class="kv"><span>' + t("pengzu") +
      "</span><span>" + esc(y.pz) + "</span></div>";
  }
}
function paintMore() {
  var ps = [], hy = CalE.holidayYears(), i, s = "";
  hy.forEach(function (y) { ps = ps.concat(CalE.periods(y)); });
  for (i = 0; i < ps.length; i++) if (ps[i][1] >= TODAY) break;
  var p = ps[i];
  if (!p) s = tf("pending", { y: hy[hy.length - 1] + 1 });
  else if (p[0] <= TODAY) s = tf("holNow", { name: EN ? p[4] : p[3], n: TODAY - p[0] + 1 });
  else s = tf("holNext", { name: EN ? p[4] : p[3], n: p[0] - TODAY });
  $("mHol").textContent = s;
  var ct = CalE.curTerm(TODAY);
  $("mTerm").textContent = tf("nowTerm", { a: EN ? CAL.JQ_EN[ct.cur.i] : CAL.JQN[ct.cur.i] });
  var best = null;
  DATES.forEach(function (e) {
    var nx = String(e.nx || "").split(":").map(Number).filter(function (d) { return d >= TODAY; });
    if (nx.length && (!best || nx[0] < best.d)) best = { d: nx[0], n: e.name };
  });
  $("mDates").textContent = best ? tf("datesNext", { name: best.n, n: best.d - TODAY }) : t("datesNone");
  $("setS").textContent = (SET.ws === 1 ? t("wsMon") : t("wsSun")) + " · " + (SET.almanac === 0 ? t("alOff") : t("alOn")) +
    " · " + (SET.offwork === 0 ? t("owOff") : t("owOn"));
  var hy2 = hy[hy.length - 1];
  $("meta").textContent = tf("meta", { y: hy2 });
}
function paintAll() { paintHero(); paintGrid(); paintDetail(); paintMore(); }
function shift(n) {
  VM += n; if (VM < 1) { VM = 12; VY--; } if (VM > 12) { VM = 1; VY++; }
  if (VY < 1901) { VY = 1901; VM = 1; } if (VY > 2100) { VY = 2100; VM = 12; }
  hap("selection"); paintGrid();
}
function goToday() { TODAY = CalE.todayDn(); SEL = TODAY; var x = CalE.ymd(TODAY); VY = x.y; VM = x.m; paintAll(); }
function paintYm() {
  $("yTxt").textContent = EN ? PY : PY + " 年";
  var h = "";
  for (var m = 1; m <= 12; m++) h += '<button data-m="' + m + '" class="' + (PY === VY && m === VM ? "on" : "") + '">' + (EN ? MOE[m - 1] : m + " 月") + "</button>";
  $("ymm").innerHTML = h;
}
async function reload() {
  var d = await runDF("read", {});
  if (d) {
    RAW = (d.settings && typeof d.settings === "object" && !Array.isArray(d.settings)) ? d.settings : {};
    DATES = Array.isArray(d.lunarDates) ? d.lunarDates : [];
  }
  SET = effSet();
  TODAY = CalE.todayDn();
  paintAll();
  paintSeg();
}
function paintSeg() {
  [["segWs", SET.ws], ["segAl", SET.almanac], ["segOw", SET.offwork]].forEach(function (a) {
    Array.prototype.forEach.call($(a[0]).querySelectorAll("button"), function (b) { b.classList.toggle("on", +b.dataset.v === a[1]); });
  });
}
async function saveSet(k, v) {
  if (SET[k] === v && hasSet(k)) return;
  var nx = {}; for (var x in RAW) if (Object.prototype.hasOwnProperty.call(RAW, x)) nx[x] = RAW[x];
  nx[k] = v; RAW = nx; SET = effSet();
  paintSeg(); paintHero(); paintGrid(); paintDetail(); paintMore();
  if (!(await runAF("settings", { settings: RAW }))) toast(t("saveFail"), "error");
}
boot(async function () {
  var fr = $("fresh");
  xbAt.set(fr, null); fr.setAttribute("aria-label", t("reload"));
  fr.addEventListener("click", function () { hap("selection"); goToday(); void reload(); });
  $("prev").addEventListener("click", function () { shift(-1); });
  $("next").addEventListener("click", function () { shift(1); });
  $("back").addEventListener("click", function () { hap("selection"); goToday(); });
  $("ttl").addEventListener("click", function () { PY = VY; paintYm(); openSheet("ymSheet"); });
  $("yPrev").addEventListener("click", function () { if (PY > 1901) { PY--; paintYm(); } });
  $("yNext").addEventListener("click", function () { if (PY < 2100) { PY++; paintYm(); } });
  $("ymm").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    VY = PY; VM = +b.dataset.m; closeSheets(); hap("selection"); paintGrid();
  });
  $("ymToday").addEventListener("click", function () { closeSheets(); goToday(); });
  $("grid").addEventListener("click", function (e) {
    var b = e.target.closest(".c"); if (!b) return;
    SEL = +b.dataset.dn; var x = CalE.ymd(SEL);
    if (x.y !== VY || x.m !== VM) { VY = x.y; VM = x.m; }
    hap("selection"); paintGrid(); paintDetail();
  });
  var sx = null;
  $("grid").addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $("grid").addEventListener("touchend", function (e) {
    if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) shift(dx < 0 ? 1 : -1);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
    b.addEventListener("click", function () { go(b.dataset.go); });
  });
  $("pickw").addEventListener("click", function () { if (window.xbridge && xbridge.pickWidgets) xbridge.pickWidgets(); });
  $("setBtn").addEventListener("click", function () { openSheet("setSheet"); });
  Array.prototype.forEach.call(document.querySelectorAll("#segWs button"), function (b) { b.addEventListener("click", function () { void saveSet("ws", +b.dataset.v); }); });
  Array.prototype.forEach.call(document.querySelectorAll("#segAl button"), function (b) { b.addEventListener("click", function () { void saveSet("almanac", +b.dataset.v); }); });
  Array.prototype.forEach.call(document.querySelectorAll("#segOw button"), function (b) { b.addEventListener("click", function () { void saveSet("offwork", +b.dataset.v); }); });
  /* 从子页返回、跨过午夜回到前台:重读并把「今天」拨回真今天 */
  window.addEventListener("pageshow", function () { void reload(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && CalE.todayDn() !== TODAY) goToday(); if (!document.hidden) void reload(); });
  await reload();
});
</script>

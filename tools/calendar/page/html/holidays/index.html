<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i="holidays">China public holidays</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--fade:#AEB3BB;--line:#E4E7EC;--tile:#E7E9EE;
  --src:#C8402F;--srcSoft:#F8E3DF;--term:#128F66;--wk:#C0584A;--accent:#128F66;--onSrc:#FFFFFF;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--fade:#4A4F58;--line:#262A31;
  --tile:#20232A;--src:#F2735F;--srcSoft:#3A1E19;--term:#6FE8BE;--wk:#E88A7D;--accent:#6FE8BE;--onSrc:#15171A;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"PingFang SC","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
button{font:inherit;color:inherit}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec b{color:var(--fg);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px;vertical-align:1px}
.chip.off{background:var(--srcSoft);color:var(--src)}
.chip.work{background:var(--tile);color:var(--sub)}
.src{color:var(--src)}.term{color:var(--term)}.mut{color:var(--sub)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0;padding-top:0}.kv:last-child{padding-bottom:0}
.kv>span:first-child{color:var(--sub);flex:0 0 auto}
.kv>span:last-child{text-align:right}
.lst{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:14.5px;font-weight:600}
.it .m i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.it .v{text-align:right;font-size:13.5px;font-weight:600;white-space:nowrap}
.it .v i{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--sub)}
.it.cur{background:color-mix(in srgb,var(--src) 7%,var(--card))}
.it.past{opacity:.5}
.chev{color:var(--fade);font-size:18px;line-height:1}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;font-size:12.5px;padding:6px 0;border-radius:8px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meta{font-size:11.5px;color:var(--sub);margin-top:18px;line-height:1.6}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}
/* 贴底 sheet(容器内自绘,不用窗口级浮层) */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;z-index:21;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s ease;
  max-height:86vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12);visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.sheet.on{transform:none;visibility:visible;transition:transform .26s ease}
html[data-theme="dark"] .sheet{box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.sheet h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);appearance:none;-webkit-appearance:none}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;
  background:var(--accent);color:var(--onSrc)}
html[data-theme="dark"] .btn{color:#0B0C0E}
.btn.ghost{background:var(--tile);color:var(--fg)}
.btn.danger{background:none;color:var(--src);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.empty{text-align:center;color:var(--sub);padding:26px 10px}
@media (prefers-reduced-motion:reduce){.sheet,.mask{transition:none}}

.it .m i .chip{margin-right:4px}
.works{margin-top:4px;font-size:12px;color:var(--sub)}

.xb-at.ic{width:26px;padding:0;justify-content:center}

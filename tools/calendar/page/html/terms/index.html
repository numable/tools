<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i="terms">Solar terms</title>
<style>
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--fade:#AEB3BB;--line:#E4E7EC;--tile:#E7E9EE;
  --src:#C8402F;--srcSoft:#F8E3DF;--term:#128F66;--wk:#C0584A;--accent:#128F66;--onSrc:#FFFFFF;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--fade:#4A4F58;--line:#262A31;
  --tile:#20232A;--src:#F2735F;--srcSoft:#3A1E19;--term:#6FE8BE;--wk:#E88A7D;--accent:#6FE8BE;--onSrc:#15171A;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"PingFang SC","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
button{font:inherit;color:inherit}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec b{color:var(--fg);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px;vertical-align:1px}
.chip.off{background:var(--srcSoft);color:var(--src)}
.chip.work{background:var(--tile);color:var(--sub)}
.src{color:var(--src)}.term{color:var(--term)}.mut{color:var(--sub)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0;padding-top:0}.kv:last-child{padding-bottom:0}
.kv>span:first-child{color:var(--sub);flex:0 0 auto}
.kv>span:last-child{text-align:right}
.lst{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:14.5px;font-weight:600}
.it .m i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.it .v{text-align:right;font-size:13.5px;font-weight:600;white-space:nowrap}
.it .v i{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--sub)}
.it.cur{background:color-mix(in srgb,var(--src) 7%,var(--card))}
.it.past{opacity:.5}
.chev{color:var(--fade);font-size:18px;line-height:1}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;font-size:12.5px;padding:6px 0;border-radius:8px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meta{font-size:11.5px;color:var(--sub);margin-top:18px;line-height:1.6}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}
/* 贴底 sheet(容器内自绘,不用窗口级浮层) */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;z-index:21;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s ease;
  max-height:86vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12);visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.sheet.on{transform:none;visibility:visible;transition:transform .26s ease}
html[data-theme="dark"] .sheet{box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.sheet h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);appearance:none;-webkit-appearance:none}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;
  background:var(--accent);color:var(--onSrc)}
html[data-theme="dark"] .btn{color:#0B0C0E}
.btn.ghost{background:var(--tile);color:var(--fg)}
.btn.danger{background:none;color:var(--src);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.empty{text-align:center;color:var(--sub);padding:26px 10px}
@media (prefers-reduced-motion:reduce){.sheet,.mask{transition:none}}

.ynav{display:flex;align-items:center;gap:6px}
.ynav button{background:none;border:0;font-size:20px;color:var(--sub);padding:2px 8px;cursor:pointer}
.ynav b{font-size:15px}
.hero{background:color-mix(in srgb,var(--term) 9%,var(--card))}
.hero .n{font-size:26px;font-weight:700;color:var(--term)}
.hero .d{font-size:13px}
.hero .h3{font-size:14px;margin-top:8px}
.hero .p{font-size:12px;color:var(--sub)}
.it.now{background:color-mix(in srgb,var(--term) 9%,var(--card))}
.it.now b{color:var(--term)}
.it .m i.h{margin-top:2px}
</style>
</head>

<div class="card hero" id="hero"></div>
<div class="lst" id="list"></div>

// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* 缺键回落英文(doc/overseas-first.md §2);空串是合法译文(hasOwnProperty 判,不用 ||) */
function t(k) {
  var T = I18N[LANG];
  if (T && Object.prototype.hasOwnProperty.call(T, k)) return T[k];
  return Object.prototype.hasOwnProperty.call(I18N.en, k) ? I18N.en[k] : k;
}
function tf(k, o) { return t(k).replace(/\{(\w+)\}/g, function (_, n) { return o[n] == null ? "" : o[n]; }); }
/* 带数字的句子按单复数取词:n === 1 且本语言有 `<key>.one` 时用它(英文「1 day」) */
function tp(k, n, o) {
  var T = I18N[LANG], k1 = k + ".one";
  return tf(n === 1 && T && Object.prototype.hasOwnProperty.call(T, k1) ? k1 : k, o);
}
/* 周首缺省(§6):宿主 firstWeekday(ISO 1 周一 … 7 周日);本包只支持周一 / 周日 → 7 = 周日(0),其余 = 周一(1);
   老宿主没给 → 国内默认周一、海外默认周日 */
function defWs() {
  var fw = String(INFO.firstWeekday == null ? "" : INFO.firstWeekday);
  if (!fw) return nbCnDefault(INFO) ? 1 : 0;
  return fw === "7" ? 0 : 1;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
}
function $(id) { return document.getElementById(id); }
function applyTheme(x) {
  DARK = x ? x === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", DARK ? "dark" : "light");
}
/* 桥调用一律先探测(老 App 上缺哪个就是 undefined) */
function hap(k) { if (window.xbridge && xbridge.haptic) xbridge.haptic(k); }
function toast(m, ty) { if (window.xbridge && xbridge.toast) xbridge.toast(m, ty); }
function go(u) { if (window.xbridge && xbridge.route) xbridge.route(u); }
async function runDF(name, p) {
  try { var r = await xbridge.runDataFlow(name, p || {}); return (r && r.data) || {}; } catch (e) { return null; }
}
async function runAF(name, p) {
  try { await xbridge.runFlow(name, p || {}); return true; } catch (e) { return false; }
}
var WDZ = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"], WDE = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
var MOE = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function wdName(dn) { return (EN ? WDE : WDZ)[CalE.wd(dn)]; }
function mdText(dn) { var x = CalE.ymd(dn); return EN ? MOE[x.m - 1] + " " + x.d : x.m + " 月 " + x.d + " 日"; }
function ymdText(dn) { var x = CalE.ymd(dn); return EN ? MOE[x.m - 1] + " " + x.d + ", " + x.y : x.y + " 年 " + x.m + " 月 " + x.d + " 日"; }
function ymText(y, m) { return EN ? MOE[m - 1] + " " + y : y + " 年 " + m + " 月"; }
function relDays(n) {
  if (n === 0) return t("today");
  return n > 0 ? tf("inDays", { n: n }) : tf("daysAgo", { n: -n });
}
function openSheet(id) { $("mask").classList.add("on"); $(id).classList.add("on"); }
function closeSheets() {
  $("mask").classList.remove("on");
  Array.prototype.forEach.call(document.querySelectorAll(".sheet"), function (s) { s.classList.remove("on"); });
}
async function boot(main) {
  /* 启动顺序照 market boot():先用宿主在 documentStart 写好的 <html data-lang / data-theme>,appInfo 回来再以它为准;
     appInfo 带信封且 code≠0 = 没拿到(nbInfo 已处理)。缺省一律英文。 */
  var de = document.documentElement;
  var hostLang = de.getAttribute("data-lang") || "", hostTheme = de.getAttribute("data-theme") || "";
  if (hostLang) LANG = nbLang(hostLang);
  INFO = await nbInfo();
  applyTheme(INFO.theme || hostTheme || undefined);
  LANG = nbLang(INFO.language || INFO.locale);
  EN = LANG === "en";
  de.lang = EN ? "en" : "zh";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = t(el.dataset.i); });
  var mk = $("mask"); if (mk) mk.addEventListener("click", closeSheets);
  await main();
}

var TODAY = CalE.todayDn(), Y = CalE.ymd(TODAY).y;
function nm(i) { return EN ? CAL.JQ_EN[i] : CAL.JQN[i]; }
function paint() {
  $("yt").textContent = Y;
  var T = CalE.terms(Y), ct = CalE.curTerm(TODAY), isCur = CalE.ymd(TODAY).y === Y;
  var hero = $("hero");
  if (isCur) {
    var c = ct.cur, h = (EN ? CAL.HOUE : CAL.HOU)[c.i];
    hero.style.display = "";
    hero.innerHTML = '<div class="mut" style="font-size:12px">' + t("nowIs") + '</div><div class="n">' + esc(nm(c.i)) + '</div><div class="d">' +
      esc(mdText(c.dn) + (c.t ? " " + tf("termAtShort", { t: c.t }) : "") + " · " + tf("nextIn", { a: nm(ct.next.i), n: ct.next.dn - TODAY })) +
      '</div><div class="h3">' + esc(h.join(" · ")) + '</div><div class="p">' + esc(EN ? "" : CAL.HOUP[c.i]) + "</div>";
  } else hero.style.display = "none";
  $("list").innerHTML = T.map(function (x) {
    var cls = isCur && ct.cur.dn === x.dn ? " now" : (x.dn < TODAY ? " past" : "");
    return '<div class="it' + cls + '"><div class="m"><b>' + esc(nm(x.i)) + (EN ? ' <span class="mut" style="font-weight:400">' + CAL.JQN[x.i] + "</span>" : "") +
      '</b><i class="h">' + esc((EN ? CAL.HOUE : CAL.HOU)[x.i].join(" · ")) + '</i></div><div class="v">' + esc(mdText(x.dn)) + "<i>" + esc(x.t || "") + "</i></div></div>";
  }).join("");
}
boot(async function () {
  $("yp").addEventListener("click", function () { if (Y > 1901) { Y--; hap("selection"); paint(); } });
  $("yn").addEventListener("click", function () { if (Y < 2100) { Y++; hap("selection"); paint(); } });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { TODAY = CalE.todayDn(); paint(); } });
  paint();
});
</script>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stripe Revenue</title>
<style>
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;--tile:#E7E9EE;--chip:#EEF0F3;--bar:#C9CDD4;
  --src:#635BFF;--srcSoft:rgba(99,91,255,.12);--warn:#B45309;--warnBg:#FEF3C7;--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--line:#262A31;--tile:#20232A;--chip:#20232A;--bar:#4A505A;
  --src:#9B95FF;--srcSoft:rgba(155,149,255,.16);--warn:#F5B454;--warnBg:#3A2A0E;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit}
svg{display:block}
.hide{display:none}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{color:var(--sub);font-size:13px;margin:2px 0 0}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.sec em{font-style:normal;font-weight:500;font-size:12px}
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;padding:11px 14px;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row[data-go]{cursor:pointer}
.row .n{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.row .v{flex:0 0 auto;text-align:right;font-size:14px;font-weight:700}
.row .v small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.tile b{display:block;font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;font-size:11px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.wide{grid-column:1 / -1}
.chip{display:inline-block;font-size:11px;font-weight:700;background:var(--tile);border-radius:9px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warnBg);color:var(--warn);border-radius:14px;padding:11px 14px;
  font-size:13px;font-weight:600;margin-top:12px}
.neg{color:var(--sub)}
.ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:6px}
.step{display:flex;gap:12px;margin-bottom:16px}
.step:last-child{margin-bottom:0}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:11px;background:var(--srcSoft);color:var(--src);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .b{flex:1 1 auto;min-width:0}
.step h3{margin:0 0 5px;font-size:14px;font-weight:600}
.step p,.step .sd{margin:0;color:var(--sub);font-size:12.5px}
.step .sd b{color:var(--fg);font-weight:600}
.step ol{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:12.5px}
.step ol b{color:var(--fg);font-weight:600}
.btn{display:block;width:100%;background:var(--src);color:#fff;border:0;border-radius:12px;
  padding:11px 14px;margin-top:10px;font-size:14px;font-weight:600;text-align:center;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn.hide{display:none}   /* 双类钉住:单类 .hide 写在 .btn 之前、同特异性,会被 display:block 盖掉(stripe「再加载」按钮恒显示,2026-10-10) */
.note{color:var(--sub);font-size:11px;line-height:1.6;margin:14px 0 0}
.note b{color:var(--fg);font-weight:600}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}

<div class="hd"><h1 data-i="title"></h1><button class="xb-at" id="xbAt" type="button"></button></div>
<p class="lead" id="lead" data-i="lead"></p>
<div id="setup" class="hide">
  <div class="card">
    <div class="step"><div class="num">1</div><div class="b">
      <h3 data-i="s1t"></h3>

      <h3 data-i="s2t"></h3>
      <div class="sd" id="s2d"></div>
      <button class="btn" id="s2b" type="button" data-i="s2b"></button>
    </div></div>
  </div>
  <p class="note" id="note"></p>
</div>
<div id="skel" class="hide"><div class="card" style="margin-top:14px"><div class="state xb-sk" data-i="loading"></div></div></div>
<div id="live" class="hide">
  <div id="tiles" class="tiles" style="margin-top:14px"></div>
  <div id="alert"></div>
  <div class="sec"><span data-i="sec30"></span><em id="sum30"></em></div>
  <div id="chart"></div>
  <div class="sec"><span data-i="secRecent"></span><em><a id="more" data-i="all" style="color:var(--src);cursor:pointer"></a></em></div>
  <div id="recent"></div>
  <div style="margin-top:18px"><button class="pickb" id="pickw"><span class="pk">＋</span><span class="pg"><b data-i="pickT"></b><span class="d" data-i="pickS"></span></span></button></div>
</div>
<div class="foot" id="foot"></div>

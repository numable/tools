<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recent activity</title>

button{font:inherit;color:inherit}
svg{display:block}
.hide{display:none}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{color:var(--sub);font-size:13px;margin:2px 0 0}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.sec em{font-style:normal;font-weight:500;font-size:12px}
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;padding:11px 14px;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row[data-go]{cursor:pointer}
.row .n{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.row .v{flex:0 0 auto;text-align:right;font-size:14px;font-weight:700}
.row .v small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.tile b{display:block;font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;font-size:11px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.wide{grid-column:1 / -1}
.chip{display:inline-block;font-size:11px;font-weight:700;background:var(--tile);border-radius:9px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warnBg);color:var(--warn);border-radius:14px;padding:11px 14px;
  font-size:13px;font-weight:600;margin-top:12px}
.neg{color:var(--sub)}
.ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:6px}
.step{display:flex;gap:12px;margin-bottom:16px}
.step:last-child{margin-bottom:0}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:11px;background:var(--srcSoft);color:var(--src);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .b{flex:1 1 auto;min-width:0}
.step h3{margin:0 0 5px;font-size:14px;font-weight:600}
.step p,.step .sd{margin:0;color:var(--sub);font-size:12.5px}
.step .sd b{color:var(--fg);font-weight:600}
.step ol{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:12.5px}
.step ol b{color:var(--fg);font-weight:600}
.btn{display:block;width:100%;background:var(--src);color:#fff;border:0;border-radius:12px;
  padding:11px 14px;margin-top:10px;font-size:14px;font-weight:600;text-align:center;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn.hide{display:none}   /* 双类钉住:单类 .hide 写在 .btn 之前、同特异性,会被 display:block 盖掉(stripe「再加载」按钮恒显示,2026-10-10) */
.note{color:var(--sub);font-size:11px;line-height:1.6;margin:14px 0 0}
.note b{color:var(--fg);font-weight:600}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */

  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
/* 桥返回值是信封 {code,msg,data}(G49):一律拆过再用。 */
function un(r){ if (r && typeof r==="object" && "code" in r){ if (r.code!==0) throw new Error(r.msg||("code "+r.code)); return r.data; } return r; }
async function ready(){
  for (var i=0;i<24 && !window.xbridge;i++) await new Promise(function(r){ setTimeout(r,50); });
  return !!(window.xbridge && xbridge.isXBundleEnv && xbridge.isXBundleEnv());
}
async function env(){
  var hl = document.documentElement.getAttribute("data-lang") || "";
  if (hl) LANG = nbLang(hl);
  try { var a = (await xbridge.appInfo().then(un)) || {};
    if (a.language || a.locale) LANG = nbLang(a.language || a.locale);
    if (a.theme && !document.documentElement.dataset.theme) document.documentElement.setAttribute("data-theme", a.theme);
  } catch(e){}
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  if (I18N[LANG] && I18N[LANG].title) document.title = t("title");
}
function nav(url){ try { if (xbridge.route) return xbridge.route(url); } catch(e){} location.href = url; }
function paintI18n(){ document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.dataset.i); }); }
/* 凭证绑定状态(纯本地查表,零网络;credential-state-query.md)。答不出(老宿主)= ""。 */
async function credState(id){ try { var d = await xbridge.credentialState(id).then(un); return (d && d.state) || ""; } catch(e){ return ""; } }
async function credFp(id){ try { var d = await xbridge.credentialState(id).then(un); return (d && d.fp) || ""; } catch(e){ return ""; } }
/* ── 首屏缓存三态(G23):有缓存必先渲(过期也先渲),过期则后台校新,失败不覆盖 ──
   ⚠️ 缓存键带凭证指纹 fp:换绑 / 删掉密钥后绝不能先渲出上一把密钥看到的数(credential-state-query §5.3)。 */
async function cacheGet(key){
  try { var v = (await xbridge.getData(key).then(un)); if (typeof v==="string") v = JSON.parse(v);
    return (v && v.schema===SCHEMA && v.ts) ? v : null; } catch(e){ return null; }
}
async function cacheSet(key, m){ try { await xbridge.setData(key, JSON.stringify({schema:SCHEMA, ts:Date.now(), m:m})); } catch(e){} }
async function flowCached(key, ttl, hard, fetcher, paint, force){
  var c = force ? null : await cacheGet(key), age = c ? Date.now()-c.ts : 1e15;
  if (c && age < hard){ paint(c.m, c.ts, false); if (age < ttl) return; }
  var fresh = null;
  try { fresh = await fetcher(); } catch(e){ fresh = null; }
  if (fresh){ await cacheSet(key, fresh); paint(fresh, Date.now(), false); }
  else if (!c || age >= hard) paint(null, 0, true);
}
async function flow(name, params, ms){ return xbridge.runDataFlow(name, params || {}, ms || 25000).then(un); }
function paintAt(ts){ xbAt.set("xbAt", ts || null); }

var CRED = "stripe";
var ZD = ["bif", "clp", "djf", "gnf", "jpy", "kmf", "krw", "mga", "pyg", "rwf", "ugx", "vnd", "vuv", "xaf", "xof", "xpf"], TD = ["bhd", "jod", "kwd", "omr", "tnd"], SYM = {"usd": "$", "eur": "€", "gbp": "£", "jpy": "¥", "cny": "¥", "krw": "₩", "inr": "₹", "hkd": "HK$", "twd": "NT$", "aud": "A$", "cad": "CA$", "nzd": "NZ$", "sgd": "S$", "mxn": "MX$", "brl": "R$", "ils": "₪", "php": "₱", "thb": "฿", "vnd": "₫", "try": "₺", "pln": "zł ", "uah": "₴"}, CATS = {"charge": ["收款", "Payment"], "refund": ["退款", "Refund"], "dispute": ["争议", "Dispute"], "dispute_reversal": ["争议撤回", "Dispute won"], "payout": ["提现", "Payout"], "payout_reversal": ["提现退回", "Payout returned"], "fee": ["Stripe 费用", "Stripe fee"], "transfer": ["转账", "Transfer"], "topup": ["充值", "Top-up"], "partial_capture_reversal": ["部分扣款撤回", "Capture released"], "other_adjustment": ["调整", "Adjustment"], "risk_reserved_funds": ["风控预留", "Reserved funds"], "risk_released_funds": ["预留释放", "Released funds"], "connect_reserved_funds": ["预留", "Reserved"], "platform_earning": ["平台收入", "Platform earning"], "charge_failure": ["扣款失败", "Failed payment"], "refund_failure": ["退款失败", "Failed refund"], "network_cost": ["网络费用", "Network cost"], "tax": ["税费", "Tax"], "anticipation_repayment": ["预支还款", "Repayment"], "climate_order_purchase": ["碳移除", "Climate"], "contribution": ["捐赠", "Contribution"], "issuing_authorization_hold": ["发卡预授权", "Issuing hold"], "issuing_authorization_release": ["预授权释放", "Issuing release"], "issuing_dispute": ["发卡争议", "Issuing dispute"], "issuing_transaction": ["发卡交易", "Issuing"]};
var MONS = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
function dec(c){ c = String(c||"").toLowerCase(); return ZD.indexOf(c) >= 0 ? 0 : (TD.indexOf(c) >= 0 ? 3 : 2); }
function major(v, c){ var d = dec(c); return (Number(v)||0) / (d===0 ? 1 : (d===3 ? 1000 : 100)); }
function money(v, c, signed){
  c = String(c||"usd").toLowerCase(); var d = dec(c), m = major(v, c), a = Math.abs(m);
  var s = a.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
  var sym = SYM[c] || (c.toUpperCase()+" ");
  return (m < 0 ? "−" : (signed && m > 0 ? "+" : "")) + sym + s;
}
function catName(r){ var k = r.reporting_category || r.type || "other", x = CATS[k]; return x ? (zh() ? x[0] : x[1]) : k; }
function dayKey(ms){ var d = new Date(ms); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function localMidnight(ms){ var d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function hm(ms){ var d = new Date(ms); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function dShort(key){ var p = key.split("-"); return zh() ? (+p[1])+" 月 "+(+p[2])+" 日" : MONS[+p[1]-1]+" "+(+p[2]); }
function whenTxt(ms){ return dayKey(ms) === dayKey(Date.now()) ? hm(ms) : dShort(dayKey(ms)) + " " + hm(ms); }
async function balFetch(){ var d = await flow("bal"); return (d && d.bal && d.bal.object === "balance") ? d.bal : null; }
/* 余额流水:从 since(UTC 秒)往后翻页,最多 maxPages 页(每页 100);返回 {rows, more}。 */
async function btFetch(since, maxPages){
  var rows = [], after = "", more = false;
  for (var p = 0; p < maxPages; p++){
    var d = await flow("bt", { since: String(since), after: after, limit: "100" });
    if (!d || !Array.isArray(d.rows)) { if (p === 0) return null; break; }
    rows = rows.concat(d.rows); more = String(d.more) === "true";
    if (!more || !d.rows.length) break;
    after = d.rows[d.rows.length-1].id;
  }
  return { rows: rows, more: more };
}

var ROWS = [], AFTER = "", MORE = false, seq = 0;
function paint(){
  var el = document.getElementById("list");
  if (!ROWS.length){ el.innerHTML = '<div class="grp"><div class="state">'+esc(t("none"))+'</div></div>'; return; }
  var h = "", day = "";
  ROWS.forEach(function(r){
    var k = dayKey(r.created*1000);
    if (k !== day){ if (day) h += '</div>'; h += '<div class="sec"><span>'+esc(dShort(k))+'</span></div><div class="grp">'; day = k; }
    var neg = r.amount < 0, w = r.reporting_category === "dispute", fee = Number(r.fee)||0;
    h += '<div class="row"><span class="n">'+esc(catName(r))+'<small>'+esc(hm(r.created*1000)+(fee ? " · "+t("fee")+" "+money(fee, r.currency) : ""))+'</small></span>'+
         '<span class="v" style="'+(w?'color:var(--warn)':(neg?'color:var(--sub)':''))+'">'+esc(money(r.amount, r.currency, true))+
         '<small>'+esc(t("net")+" "+money(r.net, r.currency, true))+'</small></span></div>';
  });
  el.innerHTML = h + '</div>';
  document.getElementById("moreb").classList.toggle("hide", !MORE);
}
async function load(reset){
  var my = ++seq;
  var st = await credState("stripe");
  if (st === "unbound" || st === "expired"){ document.getElementById("list").innerHTML = '<div class="card"><div class="state">'+esc(t("setup"))+'</div></div>'; return; }
  if (reset){ ROWS = []; AFTER = ""; }
  var d = null; try { d = await flow("bt", { since: "0", after: AFTER, limit: "50" }); } catch(e){ d = null; }
  if (my !== seq) return;
  if (!d || !Array.isArray(d.rows)){ if (!ROWS.length) document.getElementById("list").innerHTML = '<div class="card"><div class="state">'+esc(t("fail"))+'</div></div>'; return; }
  ROWS = ROWS.concat(d.rows); MORE = String(d.more) === "true"; if (d.rows.length) AFTER = d.rows[d.rows.length-1].id;
  paint(); paintAt(Date.now());
}
document.addEventListener("click", function(e){
  if (e.target.closest && e.target.closest("#moreb")){ xbridge.haptic && xbridge.haptic(); load(false); return; }
  if (e.target.closest && e.target.closest("#xbAt")){ xbridge.haptic && xbridge.haptic(); xbAt.busy("xbAt", true);
    load(true).then(function(){ xbAt.busy("xbAt", false); }, function(){ xbAt.busy("xbAt", false); }); }
});
addEventListener("languagechange", async function(){ await env(); paintI18n(); paint(); });
(async function boot(){ if (!(await ready())){ paintI18n(); return; } await env(); paintI18n(); await load(true); })();

</script>
</body></html>

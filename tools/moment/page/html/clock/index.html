<style>

html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--tile:#20232A;--rail:#2C313A;--accent:#6FE8BE;
  --src:#A5A3FF;--srcSoft:rgba(165,163,255,.18);--sun:#F2B655;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec em{font-style:normal;font-weight:500;font-size:13px;color:var(--sub);white-space:nowrap}
/* 已选城市:一城一行,与 42 组件同构 —— 昼夜标 · 名字 · 「明天 · +13 小时」· 当地时间 */
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.prow .g{flex:1 1 auto;min-width:0}
.prow .nm{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .d{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
.prow .d.x{color:var(--src)}
.prow .tm{flex:0 0 auto;font-size:24px;font-weight:700;letter-spacing:-.5px}
.prow .rm{flex:0 0 auto;border:0;background:var(--tile);color:var(--sub);width:28px;height:28px;
  border-radius:14px;font:600 15px/28px inherit;padding:0;cursor:pointer}
.ic{flex:0 0 auto;width:12px;height:12px;border-radius:50%;display:inline-block}
.ic.sun{background:var(--sun)}
.ic.moon{background:transparent;box-shadow:inset 4px -2px 0 0 var(--src)}
.hint{color:var(--sub);font-size:11.5px;margin:2px 0 0;line-height:1.55}
/* 城市清单 */
input{width:100%;border:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  padding:12px 14px;font-family:inherit;font-size:16px;font-weight:500;color:var(--fg);
  outline:2px solid transparent}
input:focus{outline-color:var(--src)}
/* ⚠️ 输入框字号必须 ≥16px:iOS WebView 上小于 16px 聚焦会把整页放大且退不回去(lint 查这一条) */
.list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.crow{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.crow+.crow{border-top:1px solid var(--line)}
.crow .g{flex:1 1 auto;min-width:0}
.crow .nm{display:block;font-size:14px;font-weight:600}
.crow .z{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.crow .tm{flex:0 0 auto;font-size:15px;font-weight:600;color:var(--sub)}
.crow .ck{flex:0 0 auto;width:22px;height:22px;border-radius:11px;border:1.5px solid var(--rail);
  font:700 12px/19px inherit;text-align:center;color:transparent}
.crow.on .ck{background:var(--src);border-color:var(--src);color:#FFFFFF}
html[data-theme="dark"] .crow.on .ck{color:#0B0C0E}
.crow.dis{opacity:.45}
.empty{padding:14px;color:var(--sub);font-size:12.5px}
.foot{color:var(--sub);font-size:11px;margin-top:22px;line-height:1.7}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */

  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */

html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.crow,.xb-tap{position:relative}
.crow::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.crow:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.pickb,.chip,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。
   注意状态本身要留下(按下仍然变色/变暗),降掉的只是过渡过程。 */

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}

  .xb-in{animation:none!important}

   tmr:"明天",yst:"昨天",tdy:"今天",
   foot:"这个工具不联网，时间根据设备时钟和包里的时区表计算。夏令时按各地现行规则自动切换，比如美国在 3 月第二个周日、欧洲在 3 月最后一个周日；印度、尼泊尔这类差半小时或 45 分钟的地方也算在内。白天和夜晚按当地钟点划分（6 点到 18 点算白天），不是日出日落时间。桌面上的组件不是每分钟都重画，显示的时间可能比实际晚几分钟。"},
 en:{title:"World clock",
   leadAdd:"Pick 1–4 cities to see their local time and how far ahead or behind they are.",
   leadEdit1:"Pick a different city for this widget.",leadEdit2:"Pick two cities for this widget.",leadEdit42:"Pick 2–4 cities for this widget.",
   secPicked:"Selected",secAll:"All cities",
   pickN:"{n} / {m}",allN:"{n}",
   q:"Search cities",none:"No city matches",
   hint0:"Tap a city below.",hintMin:"Pick at least {m}.",hintFull:"That's the maximum. Remove one to swap it.",
   addT:"Add a World clock widget",addS1:"One big clock, or a tiny one",addSn:"Single-city, two-city and multi-city sizes from your picks",
   saveT:"Save to this widget",saveS:"Updates the widget you came from — no new one",saved:"Saved",
   rm:"Remove",dst:"DST",
   tmr:"Tomorrow",yst:"Yesterday",tdy:"Today",
   foot:"This tool uses no network: times come from the device clock and a time-zone table inside the tool. Daylight saving switches by each place's current rules — the second Sunday of March in the US, the last Sunday of March in Europe — and half-hour or 45-minute offsets such as India and Nepal are covered. Day and night follow the local clock (6:00–18:00 is day), not sunrise and sunset. Widgets on your home screen are not redrawn every minute, so the time shown can run a few minutes behind."}
};
var LANG="en";
function t(k){var T=I18N[LANG]; if(T&&Object.prototype.hasOwnProperty.call(T,k)) return T[k]; return Object.prototype.hasOwnProperty.call(I18N.en,k)?I18N.en[k]:k;}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function applyTheme(th){
  var dark = th ? th==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
}
function toast(m){ try{ window.xbridge&&xbridge.toast&&xbridge.toast(m); }catch(e){} }

var ENV={}, BRICK="", MODE="add", MIN=1, MAX=4, PICK=[], Q="";
/* 从组件 onEdit 进来:n=1(22 / 11)、n=2(21)、w=42(42,2–4 个);从首页进来 = 新加,1–4 个。 */
(function(){
  var q=new URLSearchParams(location.search);
  BRICK=String(q.get("brickId")||"");
  var n=parseInt(q.get("n")||"",10), w=String(q.get("w")||"");
  if (BRICK){
    if (w==="42"){ MODE="e42"; MIN=2; MAX=4; }
    else if (n===2){ MODE="e2"; MIN=2; MAX=2; }
    else { MODE="e1"; MIN=1; MAX=1; }
  }
  ["c1","c2","c3","c4"].forEach(function(k){ var v=q.get(k); if (v) PICK.push(v); });
  if (MODE==="e42" && n>=2 && n<=4) PICK=PICK.slice(0,n);
})();

function rel(dd){ return dd===1?t("tmr"):dd===-1?t("yst"):t("tdy"); }
function dline(c){ return (c.dd?rel(c.dd)+" · ":"")+c.diff; }
function icon(c){ return '<i class="ic '+(c.night?"moon":"sun")+'"></i>'; }
function valid(){ return PICK.filter(function(id){ return clkIdx(id)>=0; }); }

function paintPicked(){
  var box=document.getElementById("picked"), ids=valid();
  document.getElementById("pickSum").textContent=t("pickN").replace("{n}",ids.length).replace("{m}",MAX);
  box.innerHTML=ids.map(function(id){
    var c=clkNow(clkIdx(id),LANG);
    return '<div class="prow">'+icon(c)+'<div class="g"><span class="nm">'+esc(c.name)+'</span>'+
      '<span class="d'+(c.dd?" x":"")+'">'+esc(dline(c))+'</span></div>'+
      '<span class="tm">'+c.time+'</span>'+
      '<button class="rm xb-press" data-rm="'+esc(id)+'" aria-label="'+esc(t("rm"))+'">×</button></div>';
  }).join("");
  var h = !ids.length ? t("hint0") : ids.length<MIN ? t("hintMin").replace("{m}",MIN) : ids.length>=MAX ? t("hintFull") : "";
  var he=document.getElementById("pickHint"); he.textContent=h; he.hidden=!h;
  var ok=ids.length>=MIN;
  var sv=document.getElementById("save"); sv.style.opacity=ok?"":".45";
}
function paintAll(){
  var box=document.getElementById("all"), q=Q.trim().toLowerCase(), ids=valid(), rows=[];
  for (var i=0;i<CLK.ids.length;i++){
    var hay=(CLK.zh[i]+" "+CLK.en[i]+" "+CLK.ids[i]).toLowerCase();
    if (q && hay.indexOf(q)<0) continue;
    rows.push(i);
  }
  /* 按此刻的偏移从东到西排:同一时区的城市挨在一起,找「东京附近」不用记名字 */
  var now=Date.now();
  rows.sort(function(a,b){ var ca=clkNow(a,LANG,now), cb=clkNow(b,LANG,now);
    var oa=ca.offMin, ob=cb.offMin; return ob-oa || (CLK.en[a]<CLK.en[b]?-1:1); });
  document.getElementById("allSum").textContent=t("allN").replace("{n}",rows.length);
  box.innerHTML = rows.length ? rows.map(function(i){
    var c=clkNow(i,LANG,now), on=ids.indexOf(CLK.ids[i])>=0, dis=!on && ids.length>=MAX && MAX>1;
    return '<div class="crow'+(on?" on":"")+(dis?" dis":"")+'" data-id="'+esc(CLK.ids[i])+'">'+icon(c)+
      '<div class="g"><span class="nm">'+esc(c.name)+'</span><span class="z">'+esc(c.utc+(c.dst?" · "+t("dst"):"")+" · "+dline(c))+'</span></div>'+
      '<span class="tm">'+c.time+'</span><span class="ck">✓</span></div>';
  }).join("") : '<div class="empty">'+esc(t("none"))+'</div>';
}
function paintBtn(){
  var k=document.getElementById("saveK"), T=document.getElementById("saveT"), Sd=document.getElementById("saveS");
  if (BRICK){ k.textContent="✓"; T.textContent=t("saveT"); Sd.textContent=t("saveS"); }
  else { k.textContent="＋"; T.textContent=t("addT"); Sd.textContent=t(valid().length>=2?"addSn":"addS1"); }
}
function paint(){
  document.title=t("title");
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent=t(el.dataset.i); });
  document.getElementById("lead").textContent=t(MODE==="e1"?"leadEdit1":MODE==="e2"?"leadEdit2":MODE==="e42"?"leadEdit42":"leadAdd");
  document.getElementById("q").placeholder=t("q");
  paintPicked(); paintAll(); paintBtn();
}

document.addEventListener("input", function(e){ if (e.target.id==="q"){ Q=e.target.value; paintAll(); } });
document.addEventListener("click", function(e){
  var rm=e.target.closest && e.target.closest("[data-rm]");
  if (rm){ var id=rm.dataset.rm; PICK=valid().filter(function(x){ return x!==id; }); paint(); return; }
  var row=e.target.closest && e.target.closest(".crow[data-id]");
  if (row){
    var id=row.dataset.id, ids=valid(), at=ids.indexOf(id);
    if (at>=0) ids.splice(at,1);
    else if (MAX===1) ids=[id];                      /* 单城市:点谁换谁 */
    else if (ids.length<MAX) ids.push(id);
    else { toast(t("hintFull")); return; }
    PICK=ids; paintPicked(); paintAll(); paintBtn(); return;
  }
  /* ⚠️ 判据用 closest:按钮里有 span,点在 span 上 e.target.id 为空(G12) */
  if (e.target.closest && e.target.closest("#save")){
    var ids2=valid();
    if (ids2.length<MIN){ toast(t("hintMin").replace("{m}",MIN)); return; }
    if (BRICK){
      var p={c1:ids2[0]||""};
      if (MODE!=="e1"){ p.c2=ids2[1]||""; }
      if (MODE==="e42"){ p.c3=ids2[2]||""; p.c4=ids2[3]||""; p.n=String(ids2.length); }
      try{ if (window.xbridge && xbridge.updateParams){ xbridge.updateParams(BRICK,p); toast(t("saved")); } }catch(e2){}
      return;
    }
    /* 加组件:候选按选了几个城市给(§8.1a 一个按钮;参数各归各的)。1 个 → 22 与 11;≥ 2 → 再加 21(前两个)与 42(全部)。 */
    var items=[{id:"clock",params:{c1:ids2[0]}},{id:"clock11",params:{c1:ids2[0]}}];
    if (ids2.length>=2){
      items.push({id:"clock21",params:{c1:ids2[0],c2:ids2[1]}});
      items.push({id:"clock42",params:{c1:ids2[0],c2:ids2[1],c3:ids2[2]||"",c4:ids2[3]||"",n:String(ids2.length)}});
    }
    if (window.xbridge && xbridge.pickWidgets) xbridge.pickWidgets(items);
  }
});

(async function boot(){
  var de=document.documentElement;
  if (de.getAttribute("data-lang")) LANG=nbLang(de.getAttribute("data-lang"));
  ENV=await nbInfo();
  applyTheme(ENV.theme || de.getAttribute("data-theme") || undefined);
  LANG=nbLang(ENV.language||ENV.locale);
  /* 没带城市(新加 / 组件还是缺省参数)= 组件上实际显示的那几个:按地区给的缺省(与 clock.df 同判)。 */
  if (!valid().length){
    var d=clkDefaults(ENV);
    PICK = MODE==="e1" ? d.slice(0,1) : MODE==="e2" ? d.slice(0,2) : MODE==="e42" ? d.slice(0,4) : d.slice(0,1);
  }
  paint();
  /* 时间每 20 秒重算一次(只重画数字,不打断正在输入的搜索) */
  setInterval(function(){ paintPicked(); if (document.activeElement && document.activeElement.id==="q") return; paintAll(); }, 20000);
})();
</script>
</body></html>

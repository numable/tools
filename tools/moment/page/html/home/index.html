<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Progress</title>
<style>
/* 与卡片同源(infosource-standard §4.2b):同一套块、**同一种格子**、同一个源色(靛)。
   v10 起页面与卡片说同一句话 —— 本月一格一天 / 本季一格一周 / 今年一格一月,
   三态色也逐格对齐(已过实底 / 当下半透明 / 未来轨色 / 不存在的日子几乎不出声)。
   本页**零网络、零 flow** —— 全部时间量在 JS 里现算。理由与包本身一致:
   任何数据源都可能挂,这一页不会;也因此它在飞行模式下与联网时完全一样。 */
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --tile:#E7E9EE;--rail:#D6DAE1;--void:#EEF0F4;--accent:#128F66;
  --src:#5B5BD6;--srcCur:rgba(91,91,214,.5);--srcSoft:rgba(91,91,214,.12);
  --shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--tile:#20232A;--rail:#2C313A;--void:#252930;--accent:#6FE8BE;
  --src:#A5A3FF;--srcCur:rgba(165,163,255,.5);--srcSoft:rgba(165,163,255,.18);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
/* §1 页头三段:大标题 + 时效锚(右上角) / 副标 = 此刻的状态。 */
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
/* 右上角 = 只有图标的「重新读取」圆钮(`.xb-at.ic`),样式全在 xb:anchor 块(tools/infosource/mk_anchor.py)。
   本包零网络,没有「取数时间」可言(card-design-system §3:无时效意义不放假锚),故**不写日期**;
   按钮本身留着:重读倒数日列表 + 拿设备时钟重算一遍 —— 跨过午夜还开着这一页时,
   那正是唯一能让「今天」回到今天的动作。 */
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
/* §2 段标题 = 左名字 + 右摘要。右边那一格不是装饰,是这一段的答案。 */
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec em{font-style:normal;font-weight:500;font-size:13px;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec em b{font-weight:600;color:var(--fg)}

/* 一段 = 一块:标签 + 百分比 + 一行格子 + 图例/剩余。与 44 卡逐行同构。 */
.seg{background:var(--tile);border-radius:12px;padding:12px;margin-bottom:8px}
.seg .top{display:flex;align-items:baseline;gap:8px}
.seg .lab{font-size:12px;font-weight:600}
.seg .pct{margin-left:auto;font-size:19px;font-weight:700}
.seg .pct em{font-size:11px;font-style:normal;color:var(--sub);font-weight:600}
.cells{display:flex;gap:2px;margin-top:10px}
.cells i{flex:1 1 0;height:18px;border-radius:3px;background:var(--rail);display:block}
.cells i.on{background:var(--src)}
.cells i.cur{background:var(--srcCur)}
.cells i.void{background:var(--void)}
/* §3 图例(解释格子怎么读)紧贴格子、11pt —— 它是脚注不是内容。 */
.seg .foot2{display:flex;margin-top:6px;color:var(--sub);font-size:11px}
.seg .foot2 span+span{margin-left:auto}

.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:10px}
.lbl{flex:0 0 52px;color:var(--sub);font-size:12px}
/* ⚠️ 输入框字号必须显式 ≥16px:iOS WebView 上小于 16px 聚焦会把**整页**放大,而且退不回去
   (memory [[ios-webview-focus-zoom-16px]])。lint 会查这一条。 */
input{flex:1 1 0;min-width:0;border:0;background:var(--tile);border-radius:10px;
  padding:11px 12px;font-family:inherit;font-size:16px;font-weight:600;line-height:1.15;
  color:var(--fg);outline:2px solid transparent}
input:focus{outline-color:var(--src)}
.prev{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);min-height:34px}
.prev .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.prev .unit{font-size:12px;color:var(--sub)}
.prev .st{color:var(--sub);font-size:12px}
/* 点阵:与 22 卡上那张同一个隐喻 —— 一格一天,可数 */
.grid{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.grid i{width:11px;height:11px;border-radius:3px;background:var(--tile);display:block}
.grid i.on{background:var(--src)}
.gridNote{color:var(--sub);font-size:11px;margin-top:7px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:0;background:var(--tile);color:var(--fg);border-radius:8px;padding:8px 11px;
  font:600 13px/1 inherit;cursor:pointer}

/* 入口行:与加卡按钮同高同圆角,但**没有 ＋** —— 那个符号是「加卡」的专属信号,
   借给别的动作用会让两种按钮读起来一样。 */
.entry{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 16px;
  margin:0;background:var(--card);border:0;border-radius:14px;text-align:left;
  font:inherit;color:var(--fg);cursor:pointer;box-shadow:var(--shadow)}
.entry .g{flex:1 1 auto;min-width:0}
.entry b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.entry .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:var(--sub)}
.entry .ar{flex:0 0 auto;color:var(--sub);font-size:15px;opacity:.55}
/* 清单行:一天一行。左边名字与日期,右边一个大数 —— 这一行要回答的就是「还有几天」。 */
.drow{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;
  padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.drow .g{flex:1 1 auto;min-width:0}
.drow .nm{display:block;font-size:14px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.drow .dt{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.drow .n{flex:0 0 auto;font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--src)}
/* v36 节假日:与「下一个假期」卡同一张表(生成器注入,见 xb:holi 标记);条长 = 距今天数,180 天封顶 */
.hrow{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px}
.hrow .g{flex:1 1 auto;min-width:0}
.hrow .nm{display:block;font-size:14px;font-weight:600}
.hrow .dt{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.hrow .br{height:4px;border-radius:2px;background:var(--rail,rgba(128,128,128,.2));margin-top:7px;position:relative;max-width:180px}
.hrow .br i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--src);opacity:.55}
.hrow .n{flex:0 0 auto;font-size:20px;font-weight:700;color:var(--fg)}
.hrow .n small{font-size:11px;color:var(--sub);font-weight:600;margin-left:2px}
.hrow.first .n{color:var(--src)}
.drow .u{font-size:10.5px;color:var(--sub);margin-left:3px;font-weight:600}
/* 世界时钟一段:与 42 组件同构(昼夜标 · 城市 · 「明天 · +13 小时」· 当地时间)。表与算法由 gen_moment_clock.py 注入(xb:clock) */
.crow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px}
.crow .g{flex:1 1 auto;min-width:0}
.crow .nm{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .d{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.crow .d.x{color:var(--src)}
.crow .n{flex:0 0 auto;font-size:20px;font-weight:700;color:var(--fg)}
.crow .ic{flex:0 0 auto;width:11px;height:11px;border-radius:50%;display:inline-block;background:#F59E0B}
html[data-theme="dark"] .crow .ic{background:#F2B655}
.crow .ic.moon,html[data-theme="dark"] .crow .ic.moon{background:transparent;box-shadow:inset 4px -2px 0 0 var(--src)}
/* 已经过去的日子不再是「还剩」,数字也不该继续用源色抢注意力 */
.drow.gone .n{color:var(--sub)}
/* 「就是今天」那一格放的是文字不是数字,收一档字号 —— 22px 会把它挤成两行 */
.drow.now .n{font-size:15px;letter-spacing:0}
/* 一个倒数日都没有时,整段塌成「入口行 + 一句 11pt 说明」——
   **不铺一屏引导**:那时三条时间进度就是这一页的全部内容,该由它们承接注意力。 */
.hint{color:var(--sub);font-size:11px;margin:8px 0 0;line-height:1.55}

/* 段可点:箭头是唯一信号(这一页格子已经很密,再加底色会把「数据」与「控件」搅在一起) */
.seg[data-k]{cursor:pointer}
.seg .lab .ar{color:var(--sub);font-size:12px;opacity:.55;margin-left:4px}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
.foot{color:var(--sub);font-size:11px;margin-top:22px;line-height:1.7}

.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}

   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */

.fresh,.pickb,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}

   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

    transition-duration:.01ms!important;scroll-behavior:auto!important}

/* 与 clock.df 同一算法(gen_moment_clock.py 的 ref_offset 是第三份,三方对拍见 verify_moment_clock.py)。
   不用 Intl 的 timeZone:页面与组件必须说同一个时间,哪怕某地改了制 —— 改表时两边一起改。 */
function clkFl(a,b){ return Math.floor(a/b); }
function clkA(Y){ return 365*Y+clkFl(Y,4)-clkFl(Y,100)+clkFl(Y,400)-719468; }
function clkCm(M){ return clkFl(153*(M-3)+2,5); }
function clkDay(Y,M,N,W){
  var A=clkA(Y);

  var L=A+clkCm(M+1)-1; return L-(((L+4)%7+7-W)%7);

function clkOffset(i,u,Y){
  if (u>=CLK.cut[i]) return CLK.cutOff[i];

  var R=CLK.rules[r], s=clkDay(Y,R[0],R[1],R[2])*1440+R[3]-std*R[8], e=clkDay(Y,R[4],R[5],R[6])*1440+R[7]-std*R[8];
  var on = R[0]>R[4] ? (u>=s||u<e) : (u>=s&&u<e);
  return std+(on?60:0);
}
function clkIdx(id){ var i=CLK.ids.indexOf(String(id||"")); return i; }

function clkDefaults(env){
  var g = nbCnDefault(env) ? 0 : (CLK.cg[String(env&&env.country||"").toUpperCase()]||0);
  return CLK.def[g].slice();
}
/* 一个城市此刻:{name,time,dd,night,diff,utc,dst} */
function clkNow(i,lang,nowMs){

           utc:"UTC"+(off>=0?"+":"−")+oh+(om?":"+(om<10?"0":"")+om:"") };

/* 容器内导航走 xbridge.route(裸 path 会被补成 numable://<self>/page<path>);拿不到桥时回落相对路径 ——
   ⚠️ 这里原本写的是 `xbridge.navigate`:**桥上没有这个方法**(全表只有 route),`if(xbridge.x)` 守卫不报错,
      于是一直静默走相对路径兜底。三 native 的 WebView 有真 URL 还能跳过去;**Win 的 H5 页是 srcdoc iframe**,
      相对路径按宿主 origin 解析 → 把整个 App 装进容器 iframe(2026-09-11 用户报「点详情崩溃」的真因)。 编辑器预览与
   浏览器里没有桥,但那两处也该点得开。 */
function go(path, q){
  q = q || "";
  try{ if (window.xbridge && xbridge.route) return xbridge.route(path+q); }catch(e){}
  location.href = "../"+path.replace(/^\//,"")+"/index.html"+q;
}
document.addEventListener("click", function(e){
  /* 右上角「重新读取」圆钮:拿设备时钟重算三段进度与节假日,再重读倒数日列表
     (loadList 末尾自带 paintList + paintHead;没有桥时它直接返回,故先画一遍兜底)。
     ⚠️ 判据用 closest 不用 e.target.id —— 按钮里是 xbAt 画的 svg,点在它身上 e.target 不是按钮(G12)。 */
  if (e.target.closest && e.target.closest("#fresh")){
    paintSegs(); paintHoli(); paintClock(); paintList(); paintHead(); void loadList(); return; }
  var seg = e.target.closest && e.target.closest("[data-k]");
  if (seg){ go("/span","?k="+encodeURIComponent(seg.dataset.k)); return; }
  var row = e.target.closest && e.target.closest("[data-id]");
  if (row){ go("/count","?id="+encodeURIComponent(row.dataset.id)); return; }
  if (e.target.closest && e.target.closest("#toCount")){ go("/count",""); return; }
  if (e.target.closest && e.target.closest("#toClock")){ go("/clock",""); return; }
  /* 加卡入口 = **一个按钮**(§8.1a)。⚠️ 这里**不带 params**:首页没有「当前这一个倒数日」
     (配置器已经搬走),硬塞一个默认日期进去就是替用户回答他还没做的选择。
     带日期的加卡入口在 `/count` —— 那一页讲的就是他刚填的那个日子。
     ⚠️ 判据用 closest 而不是 e.target.id:按钮里有 `<span class="pk">＋</span>` 等子元素,
     点在它们身上时 e.target 是那个 span、id 为空 —— 会「点了没反应」且不报错(G12)。 */
  if (e.target.closest && e.target.closest("#pickw")){
    if (window.xbridge && xbridge.pickWidgets) xbridge.pickWidgets();
    return; }
});

/* 启动顺序照 market boot()(doc/overseas-first.md §1–§2):先读宿主写好的 <html data-lang>,
   再等 appInfo(nbInfo 处理信封);**缺省英文**。 */
(async function boot(){
  var de=document.documentElement;
  if (de.getAttribute("data-lang")) LANG=nbLang(de.getAttribute("data-lang"));
  ENV=await nbInfo();
  applyTheme(ENV.theme || de.getAttribute("data-theme") || undefined);
  LANG=nbLang(ENV.language||ENV.locale);
  paint();
  setInterval(paintClock, 20000);   /* 世界时钟一段每 20 秒重算(只重画这一段) */
  await loadList();
})();

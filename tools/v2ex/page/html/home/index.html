<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V2EX</title>
<style>
/* 与组件同源(infosource-standard §4.2b):同一套块、同一条热度条、同一个源色。
   首页是**内容页**:打开就是今天的列表;加组件入口降为页尾次要区。 */
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --tile:#E7E9EE;--rail:#D6DAE1;--src:#34495E;--rank:#34495E;--srcSoft:rgba(52,73,94,.12)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--tile:#20232A;--rail:#2C313A;--src:#8FA9C4;--rank:#8FA9C4;--srcSoft:rgba(143,169,196,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:10px;min-height:19px}
.tabs{display:flex;gap:6px;margin:2px 0 12px}
.tabs button{flex:1 1 0;border:0;border-radius:10px;padding:8px 0;font:inherit;font-size:13px;font-weight:600;
  background:var(--tile);color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--srcSoft);color:var(--src)}
.legend{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:11px;margin-bottom:10px}
.legend i{width:22px;height:3px;border-radius:2px;background:var(--src);display:inline-block}
/* 一行 = 一块 tile。整行主体是一个 <a href="原站">(容器把 http(s) 链接当外部页打开);
   有独立讨论页的源在右侧给一个次入口 —— 两个 <a> 并排而不是嵌套(嵌套 <a> 是非法 HTML)。 */
.story{display:flex;align-items:stretch;background:var(--tile);border-radius:12px;margin-bottom:8px;overflow:hidden}
.story .lk{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:10px;padding:12px 12px 11px;
  color:inherit;text-decoration:none}
.story .rk{flex:0 0 18px;color:var(--rank);font-weight:700;font-size:12px;line-height:1.4}
.story .grow{flex:1 1 auto;min-width:0}
.story b{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.story .host{display:block;color:var(--sub);font-size:11.5px;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story .foot2{display:flex;align-items:center;gap:10px;margin-top:7px}
.story .bar{flex:0 0 56px;height:3px;border-radius:2px;background:var(--rail);position:relative}
.story .bar i{position:absolute;left:0;top:0;height:3px;border-radius:2px;background:var(--src)}
.story .meta{flex:1 1 auto;color:var(--sub);font-size:11.5px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story .dz{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:54px;padding:0 8px;border-left:1px solid var(--line);color:var(--src);text-decoration:none;
  font-size:11px;font-weight:600}
.story .dz svg{width:16px;height:16px;fill:currentColor}
.state{color:var(--sub);font-size:13px;text-align:center;padding:26px}
.foot{color:var(--sub);font-size:11px;margin-top:22px;line-height:1.7}
.foot b{color:var(--fg);font-weight:600}
/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
/* xb:anchor v1 — 由 tools/infosource/mk_anchor.py 生成,别手改(页面时效锚 §1.1) */

.xb-at svg{flex:0 0 auto;display:block;width:13px;height:13px;fill:currentColor}
.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的
   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */
.xb-at.hide,.xb-at[hidden]{display:none}
@keyframes xb-at-spin{to{transform:rotate(360deg)}}
.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.xb-at.busy svg{animation:none;opacity:.5}}
/* xb:anchor end */
/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */
:root{--xb-in:60ms;--xb-out:140ms;--xb-ease:cubic-bezier(.2,0,.2,1);--xb-wash:rgba(11,12,14,.055);--xb-dim:.72;--xb-scale:.96;--xb-enter:180ms;--xb-sheen:1.4s;--xb-sheet:260ms;--xb-mask:220ms;--xb-ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="dark"]{--xb-wash:rgba(255,255,255,.075)}

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */
.story .lk,.xb-tap{position:relative}
.story .lk::after,.xb-tap::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;background:var(--xb-wash);opacity:0;pointer-events:none;transition:opacity var(--xb-out) var(--xb-ease)}
.story .lk:active::after,.xb-tap:active::after{opacity:1;transition-duration:var(--xb-in)}

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.tabs button,.story .dz,.pickb,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}

/* ③ 数据换了才过渡的内容淡入。谁来判「换没换」见本页 <head> 里的 xbMotion:
   首屏不过渡、命中缓存的毫秒级返回不过渡、边打字边筛不过渡。 */

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

/* ⑤ 无障碍底线:系统开了「减少动效」就全部降级为无动画。

    transition-duration:.01ms!important;scroll-behavior:auto!important}

/* xb:motion end */

      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* 语言:缺省英文;先用宿主写在 <html data-lang> 的值,appInfo 回来再以它为准(doc/overseas-first.md §1–§2)。 */
var LANG = nbLang(document.documentElement.getAttribute("data-lang"));
/* ⚠️ 空串是合法译文,不兜底(xbundle-i18n:A 表空串 = 刻意为空)。缺键回落英文表。 */
function t(k){
  var m = I18N[LANG];
  if (m && Object.prototype.hasOwnProperty.call(m, k)) return m[k];
  return I18N.en[k] !== undefined ? I18N.en[k] : k;
}
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* yyyy-MM-dd → 中文「9月25日」/ 英文「Sep 25」(doc/overseas-first.md §5,不出现纯数字月日)。 */
function fmtMD(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || "")); if (!m) return "";
  return LANG === "zh" ? (+m[2]) + "月" + (+m[3]) + "日" : MON[+m[2] - 1] + " " + (+m[3]);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
/* 只放行 http(s) 链接:行里的 href 来自第三方接口,别让一个 `javascript:` 混进来。 */
function safeUrl(u){ u = String(u || ""); return /^https?:\/\//i.test(u) ? u : ""; }
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return ""; } }
/* V2EX 的标题可以带换行(实测 hot 第 1 条三行)—— 页面里压成一行空格分隔。 */
function cleanTitle(s){ return String(s || "").replace(/\s*[\r\n]+\s*/g, " ").trim(); }
function applyTheme(th){
  var dark = th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
async function ready(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  return !!window.xbridge;
}
/* 行的次级信息分两行:「网站 · 标签」一行,「热度条 + 分数 · 评论 · 多久前」一行 ——
   塞进一行时最要紧的「多久前」恰好在末尾被省略号吃掉(渲图实测英文档只剩「an…」)。 */
/* 发帖时刻 → 毫秒:Lobsters 是带偏移的 ISO(Date 能直接解析),V2EX 是秒级时间戳,HF 没有。 */
function tsMs(v){
  if (v == null || v === "") return 0;
  if (typeof v === "number" || /^\d+$/.test(String(v))){ var n = Number(v); return n < 1e11 ? n * 1000 : n; }
  var d = Date.parse(String(v)); return isNaN(d) ? 0 : d;
}
function agoText(ms, now){
  if (!ms) return "";
  var m = Math.max(Math.floor((now - ms) / 60000), 1);
  /* 英文紧排「14h ago」(页面行宽比组件紧,「14 hr ago」在英文档会被省略号吃掉末尾)。 */
  var sp = t("agoSp");
  if (m < 60) return m + sp + t("uM");
  if (m < 2880) return Math.floor(m / 60) + sp + t("uH");
  return Math.floor(m / 1440) + sp + t("uD");
}
/* 「网站 · 标签」。只有 Lobsters 的链接指向各家网站;V2EX / HF 每行都是自家域名,写出来是噪音,只留标签。 */
function hostLine(r){
  var h = CFG.kind === "lobsters" ? hostOf(r.u) : "";
  /* V2EX 节点:非中文界面用接口自带的英文名(ga),缺了才退回中文名。 */
  var g = LANG === "zh" ? r.g : (r.ga || r.g);
  return [h, g].filter(function(x){ return x; }).join(" · ");
}
function rowsOf(d){
  var L = (d && d.list) || [];
  var out = [];
  for (var i = 0; i < L.length; i++){
    var r = L[i] || {}; var ti = cleanTitle(r.t), u = safeUrl(r.u);
    if (ti && u) out.push({t:ti, u:u, d:safeUrl(r.d), s:Number(r.s) || 0, c:r.c, g:r.g || "", ga:r.ga || "", ts:r.ts});
  }
  return out;
}
function paintList(d){
  var box = document.getElementById("list");
  var rows = rowsOf(d);
  if (!rows.length){ box.innerHTML = '<div class="state">' + esc(t("fail")) + "</div>"; return; }
  var now = Number(d.fetchedMs) || Date.now();
  var vmax = Math.max.apply(null, rows.map(function(r){ return r.s; }).concat([1]));
  box.innerHTML = rows.map(function(r, i){
    /* 英文单复数:1 comment / 2 comments(中文两份同值)。 */
    var parts = [r.s + " " + t(r.s === 1 ? "unit1" : "unit")];
    if (CFG.sub && r.c !== "" && r.c != null) parts.push(Number(r.c) + " " + t(Number(r.c) === 1 ? "cmt1" : "cmt"));
    var ag = agoText(tsMs(r.ts), now); if (ag) parts.push(ag);
    var w = Math.max(r.s / vmax * 100, 7);
    var dz = r.d ? '<a class="dz" href="' + esc(r.d) + '">' + CFG.chat + '<span>' + esc(t("discuss")) + "</span></a>" : "";
    return '<div class="story"><a class="lk" href="' + esc(r.u) + '"><span class="rk">' + (i + 1) + '</span>' +
      '<span class="grow"><b>' + esc(r.t) + '</b><span class="host">' + esc(hostLine(r)) + '</span>' +
      '<span class="foot2"><span class="bar"><i style="width:' + w.toFixed(1) + '%"></i></span>' +
      '<span class="meta">' + esc(parts.join(" · ")) + "</span></span></span></a>" + dz + "</div>";
  }).join("");
}
function paintSub(d){
  var el = document.getElementById("sub"), rows = rowsOf(d);
  if (!rows.length){ el.textContent = ""; return; }                /* 不知道就不说 */
  if (CFG.kind === "hf" && d.day){
    el.textContent = t("dayPre") + fmtMD(d.day) + t("daySuf").replace("{n}", rows.length);
    return;
  }
  el.textContent = t("sub_" + FEED).replace("{n}", rows.length);
}
function paintAt(d){ xbAt.set(document.getElementById("xbAt"), d && d.fetchedMs ? Number(d.fetchedMs) : null); }
function paintStatic(){
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k = el.dataset.i;
    if (k === "foot") el.innerHTML = t(k); else el.textContent = t(k);
  });
}

var FEED = CFG.feeds[0], seq = 0, HAS = false;
document.addEventListener("click", function(e){
  var tb = e.target.closest && e.target.closest("#tabs button");
  if (tb){
    if (tb.dataset.f !== FEED){
      FEED = tb.dataset.f;
      document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b === tb); });
      HAS = false; refresh(false);
    }
    return;
  }
  if (e.target.closest && e.target.closest("#xbAt")){ refresh(true); return; }
  if (e.target.closest && e.target.closest("#pickw")){
    /* 加组件入口 = 一个按钮(§8.1a):打开系统面板,由用户在面板里挑;调用后不提示「已添加」。 */
    if (window.xbridge && xbridge.pickWidgets) xbridge.pickWidgets();
  }
});

/* useCache=true → 走 .df 的三态缓存(命中即毫秒级);false → 穿透,必打网络(G23 契约 2)。 */
async function fetchFeed(useCache){
  if (!(window.xbridge && xbridge.runDataFlow)) return null;
  try { var r = await xbridge.runDataFlow(FEED, { _cache: useCache ? 1 : 0 });
        return (r && r.code === 0) ? r.data : null; } catch(e){ return null; }
}
function paintAll(d){ paintList(d); paintSub(d); paintAt(d); }
/* G23 页面侧三件套(infosource-standard §5.5.6):① `_cache` 开关 ② 骨架延迟 150ms 才铺(有内容就不铺)
   ③ 时效锚兼刷新入口(H5 页拿不到容器的下拉刷新)。stale 时后台再真取一次,回来原地替换。 */
async function refresh(force){
  var my = ++seq, done = false;
  setTimeout(function(){
    if (done || my !== seq || HAS) return;
    document.getElementById("list").innerHTML = '<div class="state">' + esc(t("loading")) + "</div>";
  }, 150);
  if (force) xbAt.busy("xbAt", true);
  var d = await fetchFeed(!force);
  done = true; xbAt.busy("xbAt", false);
  if (my !== seq) return;
  if (d || !HAS){ paintAll(d); HAS = !!(d && rowsOf(d).length); }
  if (!force && d && String(d._stale) === "1"){
    var f = await fetchFeed(false);
    if (my === seq && f && rowsOf(f).length) paintAll(f);
  }
}
(async function boot(){
  if (!(await ready())){ applyTheme(); paintStatic();
    document.getElementById("list").innerHTML = '<div class="state">' + esc(t("fail")) + "</div>"; return; }
  var a = await nbInfo();
  applyTheme(a.theme);
  LANG = nbLang(a.language || a.locale);
  paintStatic();
  refresh(false);
})();
</script>
</body></html>

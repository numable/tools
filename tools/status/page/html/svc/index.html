<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Service</title>
<style>
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;--tile:#E7E9EE;--add:#EEF0F4;
  --src:#7A4FD8;--srcSoft:rgba(122,79,216,.11);--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--line:#262A31;--tile:#20232A;
  --add:#252930;--src:#B49BFF;--srcSoft:rgba(180,155,255,.15);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 段标题 = 左名字 + 右摘要/动作(github 同款:13/700,上 22 下 8,不做 uppercase) */
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.sec em{font-style:normal;font-weight:500;font-size:12px}
.lnk{border:0;background:none;color:var(--src);font-size:13px;font-weight:700;padding:8px 2px;margin:-8px 0;cursor:pointer}
/* 卡片:无描边 + 极浅投影;列表型卡片 overflow:hidden 让按压洗色跟着圆角走 */
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--f);flex:0 0 auto}
.lw{color:var(--c);font-weight:600}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.foot b{color:var(--fg);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.orig{font-size:10.5px;color:var(--sub);font-weight:500;border:1px solid var(--line);border-radius:5px;padding:0 5px;
  margin-left:6px;white-space:nowrap}
/* 近 N 天日格:无事故 = tile;有事故 = 当天最重影响的状态色 */
.days{display:flex;gap:3px;flex:0 0 auto}
.days i{display:block;width:11px;height:11px;border-radius:3px;background:var(--tile)}
.days i[class*="lv"]{background:var(--f)}
.days.sk i{opacity:.5}
.days i.na,.bar i.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
/* 次要动作:源色浅底胶囊;已关注 = 中性灰;满额 = 灰且不可点 */
.chip{flex:0 0 auto;border:0;border-radius:999px;background:var(--srcSoft);color:var(--src);
  font-size:12.5px;font-weight:600;min-height:30px;min-width:64px;padding:0 13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tile);color:var(--sub)}
.chip:disabled{background:var(--tile);color:var(--sub);opacity:.55;cursor:default}
.ib{flex:0 0 auto;width:30px;height:30px;border:0;border-radius:15px;background:var(--tile);color:var(--sub);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:disabled{opacity:.35;cursor:default}
.lv0{--c:#1E9E62;--f:#1E9E62}
.lv1{--c:#2F6FDB;--f:#2F6FDB}
.lv2{--c:#A86E00;--f:#E0A100}
.lv3{--c:#D9600F;--f:#D9600F}
.lv4{--c:#D93A34;--f:#D93A34}
.lvU{--c:#6B7280;--f:#6B7280}
html[data-theme="dark"] .lv0{--c:#3DD68C;--f:#3DD68C}
html[data-theme="dark"] .lv1{--c:#6EA8FE;--f:#6EA8FE}
html[data-theme="dark"] .lv2{--c:#E8B339;--f:#E8B339}
html[data-theme="dark"] .lv3{--c:#FF9148;--f:#FF9148}
html[data-theme="dark"] .lv4{--c:#FF6B61;--f:#FF6B61}
html[data-theme="dark"] .lvU{--c:#8E939B;--f:#8E939B}

.hero{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:14px;margin-top:10px}
.hero .big{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:700;color:var(--c)}
.hero .big .dot{width:12px;height:12px}
.hero .meta{color:var(--sub);font-size:12.5px;margin-top:4px}
/* 近 30 天:每天一格(状态页「可用性条」的同款读法),下面一行统计 */
.m30{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bar{display:flex;gap:2px;height:22px}
.bar i{flex:1 1 0;border-radius:2px;background:var(--tile)}
.bar i[class*="lv"]{background:var(--f)}
.bar.sk i{opacity:.5}
.ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:4px}
.m30 .st{font-size:12.5px;margin-top:6px;color:var(--fg)}
.m30 .st small{color:var(--sub);font-size:12.5px}
/* 提醒入口:一行卡片按钮(图标 + 两行字 + ›),与列表行同一套内边距 */
.alert{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border:0;text-align:left;
  background:var(--card);box-shadow:var(--shadow);border-radius:14px;cursor:pointer;position:relative}
.alert .ic{flex:0 0 auto;width:34px;height:34px;border-radius:17px;background:var(--srcSoft);color:var(--src);
  display:flex;align-items:center;justify-content:center}
.alert .tx{flex:1 1 auto;min-width:0}
.alert b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.alert small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.inc{border-left:3px solid var(--c)}
.inc .it{font-size:14.5px;font-weight:650;line-height:1.4}
.inc .im{font-size:12px;color:var(--sub);margin-top:3px}
.upd{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.upd .uh{font-size:11.5px;color:var(--sub);font-weight:600}
.upd .ub{font-size:13px;line-height:1.5;margin-top:3px;white-space:pre-line;word-break:break-word}
.more{border:0;background:none;color:var(--src);font-size:12.5px;font-weight:600;padding:10px 0 2px;min-height:40px;cursor:pointer}
.li{display:flex;align-items:center;gap:9px;padding:11px 14px;position:relative}
.li+.li::before{content:"";position:absolute;left:32px;right:0;top:0;border-top:1px solid var(--line)}
.li b{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .lw{font-size:12px;white-space:nowrap}
.li.two{align-items:flex-start}
.li.two .dot{margin-top:6px}
.li.two div{flex:1 1 auto;min-width:0}
.li.two div b{display:block;white-space:normal;font-weight:600;line-height:1.4}
.li.two small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.li[data-u]{cursor:pointer}
.li .go{flex:0 0 auto;color:var(--sub);opacity:.6;display:flex;align-self:center}
.cnote{font-size:12px;color:var(--sub);padding:11px 14px;position:relative}
.li+.cnote::before{content:"";position:absolute;left:32px;right:0;top:0;border-top:1px solid var(--line)}
.grp .more{display:block;width:100%;text-align:left;padding:11px 14px;margin:0;border-top:1px solid var(--line);min-height:0}
.act{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;margin-top:22px;border:0;
  border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;color:var(--fg);cursor:pointer}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}

/* ── 首屏缓存三态(G23,JS 层 flowCached):有缓存必先渲(过期也先渲),过期则后台校新,失败不覆盖 ── */
async function cacheGet(key){
  try { var v = (await xbridge.getData(key).then(un)); if (typeof v==="string") v = JSON.parse(v);
    return (v && v.schema===SCHEMA && v.ts) ? v : null; } catch(e){ return null; }
}
async function cacheSet(key, model){
  try { await xbridge.setData(key, JSON.stringify({schema:SCHEMA, ts:Date.now(), m:model})); } catch(e){}
}
async function flowCached(key, ttl, hard, fetcher, paint, force){
  var c = force ? null : await cacheGet(key), age = c ? Date.now()-c.ts : 1e15;
  if (c && age < hard){ paint(c.m, c.ts, false); if (age < ttl) return; }
  var fresh = null;
  try { fresh = await fetcher(); } catch(e){ fresh = null; }
  if (fresh){ await cacheSet(key, fresh); paint(fresh, Date.now(), false); }
  else if (!c || age >= hard) paint(null, 0, true);
}
/* 一个服务的事故历史(1 小时新鲜;首页与详情页共用这份缓存)。 */
function histOf(id, force, paint){
  var c = byId(id);
  return flowCached("c.hist."+id, 3600000, 24*3600000, async function(){
    var d = (await xbridge.runDataFlow("hist", { id: id, p2: needP2(Date.now()) }, 30000).then(un));
    return d && d.h && (d.h.months||d.h.incidents) ? histFrom(d, c) : null;
  }, paint, force);
}
/* 并发上限:同时最多 n 个 runDataFlow,别一口气打 22 个状态页。 */
async function pool(items, n, fn){
  var i = 0;
  async function worker(){ while (i < items.length){ var k = i++; try { await fn(items[k], k); } catch(e){} } }
  var ws = []; for (var j=0;j<Math.min(n, items.length);j++) ws.push(worker());
  await Promise.all(ws);
}

function legendHtml(){
  return '<div class="legend">'+[0,1,2,3,4].map(function(l){
    return '<span class="lv'+l+'"><i class="dot"></i>'+esc(lvWord(l))+'</span>'; }).join("")+'</div>';
}

var ID = new URLSearchParams(location.search).get("id") || "github";
var C = byId(ID) || byId("github"); ID = C.id;
var HAS = false, seq = 0, OPEN = {}, ALLC = false, HIST = undefined, SVCST = 0;
var CHEV = "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"/></svg>";
function textOf(html){ var d=document.createElement("div"); d.innerHTML=String(html||"").replace(/<br\s*\/?>/gi,"\n"); return (d.textContent||"").trim(); }
function modelFrom(d){
  var sm = d.sm || {}, now = Number(d.nowMs)||Date.now();
  var comps = (sm.components||[]).filter(function(c){ return !c.group_id && !/^visit /i.test(c.name||""); })
    .map(function(c){ var l = compLv(c.status); return { n: c.name, l: l==null ? -1 : l }; });
  var rawInc = C.k==="sp" ? (sm.incidents||[]) : ((d.hj||{}).incidents||[]).filter(openOf);
  var incs = rawInc.map(function(x){
    return { id: x.id, n: x.name, l: impLv(x.impact), s: x.status, st: Date.parse(x.started_at||x.created_at)||0,
      u: x.shortlink || "",
      ups: (x.incident_updates||[]).slice(0,4).map(function(u){
        return { s: u.status, t: Date.parse(u.display_at||u.created_at)||0, b: String(u.body||"").slice(0,900) }; }) };
  });
  var maint = (sm.scheduled_maintenances||[]).slice(0,4).map(function(x){
    return { n: x.name, s: x.status, a: Date.parse(x.scheduled_for)||0, b: Date.parse(x.scheduled_until)||0 }; });
  var base = indLv(sm.status && sm.status.indicator);
  var lv = base==null ? -1 : Math.max.apply(null, [base].concat(incs.map(function(x){ return x.l; })));
  return { now: now, lv: lv, desc: sm.status && sm.status.description || "", comps: comps, incs: incs, maint: maint };
}
async function fetchSvc(){
  var d = (await xbridge.runDataFlow("svc", { id: ID }, 30000).then(un));
  return d && d.sm ? modelFrom(d) : null;
}
function paintAt(ts){ xbAt.set("xbAt", ts || null); }
function secHtml(title, inner, orig){
  return '<div class="sec"><span>'+esc(title)+(orig ? '<span class="orig">'+esc(t("orig"))+'</span>' : "")+'</span></div>'+inner;
}
/* 近 30 天:每天一格 + 「近 30 天 N 起事故 · 最近一次在 X 天前」。历史还没到时画灰格骨架,取不到写一句。 */
function m30Html(){
  var now = Date.now();
  if (HIST === undefined) return '<div class="m30"><div class="bar sk">'+new Array(31).join("<i></i>")+'</div>'+
    '<div class="st"><small class="xb-sk">'+esc(t("m30Load"))+'</small></div></div>';
  if (!HIST) return '<div class="m30"><div class="st"><small>'+esc(t("m30Fail"))+'</small></div></div>';
  var st = dayStats(HIST, 30, now), cells = "";
  for (var i=29;i>=0;i--){ var l = st.cells[i]; cells += '<i'+(i >= st.cover ? ' class="na"' : l>=2 ? ' class="lv'+l+'"' : '')+'></i>'; }
  var head = st.cnt ? (st.atLeast ? t("m30MinPre") : t("m30Pre"))+st.cnt+t(st.cnt===1 && !st.atLeast ? "m30Suf1" : "m30Suf") : t("m30None");
  var tail = st.last===null ? "" : " · "+lastWord(st.last);
  return '<div class="m30"><div class="bar">'+cells+'</div><div class="ax"><span>'+esc(t("ax30"))+'</span><span>'+esc(t("axNow"))+'</span></div>'+
    '<div class="st">'+esc(head)+'<small>'+esc(tail)+'</small></div></div>';
}
var LAST = null;
function paintHero(m){
  var el = document.getElementById("hero");
  if (!m){ el.innerHTML = '<div class="hero"><div class="state">'+esc(t("fail"))+'</div>'+m30Html()+'</div>'; return; }
  var k = lvKey(m.lv);
  el.innerHTML = '<div class="hero lv'+k+'"><div class="big"><i class="dot"></i>'+esc(lvWord(m.lv))+'</div><div class="meta">'+
    esc(m.incs.length ? t("iPre")+m.incs.length+t("iSuf") : t("iNone"))+
    (m.desc ? " · "+esc(t("offDesc"))+'“'+esc(m.desc)+'”' : "")+'</div>'+m30Html()+'</div>';
}
function paintRoot(m){
  var root = document.getElementById("root");
  if (!m){ root.innerHTML = ""; return; }
  var h = [];
  if (m.incs.length){
    h.push(secHtml(t("secInc"), m.incs.map(function(x){
      var ups = OPEN[x.id] ? x.ups : x.ups.slice(0,1);
      return '<div class="card inc lv'+lvKey(x.l)+'"><div class="it">'+esc(x.n)+'</div><div class="im">'+
        esc(lvWord(x.l)+" · "+stWord(x.s)+(x.st ? " · "+t("durPre")+fmtDur(m.now-x.st)+" · "+t("sincePre")+fmtTime(x.st,m.now)+t("sinceSuf") : ""))+'</div>'+
        ups.map(function(u){ return '<div class="upd"><div class="uh">'+esc(stWord(u.s)+(u.t ? " · "+fmtTime(u.t,m.now) : ""))+
          '</div><div class="ub">'+esc(textOf(u.b))+'</div></div>'; }).join("")+
        (x.ups.length>1 ? '<button class="more" data-tg="'+esc(x.id)+'">'+esc(OPEN[x.id] ? t("less") : t("allUpd"))+'</button>' : "")+
        '</div>';
    }).join(""), true));
  }
  if (m.maint.length){
    h.push(secHtml(t("secMt"), '<div class="grp">'+m.maint.map(function(x){
      return '<div class="li two lv1"><i class="dot"></i><div><b>'+esc(x.n)+'</b><small>'+
        esc(stWord(x.s)+(x.a ? " · "+fmtTime(x.a,m.now) : "")+(x.b ? " – "+fmtTime(x.b,m.now) : ""))+'</small></div></div>'; }).join("")+'</div>', true));
  }
  if (m.comps.length){
    var bad = m.comps.filter(function(c){ return c.l!==0; }), ok = m.comps.length-bad.length;
    var show = (ALLC || m.comps.length<=12) ? m.comps : bad;
    var rows = show.map(function(c){ return '<div class="li lv'+lvKey(c.l)+'"><i class="dot"></i><b>'+esc(c.n)+
      '</b><span class="lw">'+esc(lvWord(c.l))+'</span></div>'; }).join("");
    if (!ALLC && m.comps.length>12) rows += '<div class="cnote">'+esc(bad.length ? t("restPre")+ok+t("restSuf") : t("allPre")+ok+t("allSuf"))+
      '</div><button class="more" id="allc">'+esc(t("showAll"))+'</button>';
    h.push(secHtml(t("secComp")+" · "+m.comps.length, '<div class="grp">'+rows+'</div>'));
  }
  root.innerHTML = h.join("");
}
/* 近期事故:来自事故历史(与首页同一份缓存),进行中的那几起已在上面,不重复列 */
function paintHist(){
  var box = document.getElementById("histBox");
  if (HIST === undefined){ box.innerHTML = ""; return; }
  var now = Date.now(), openN = (LAST ? LAST.incs : []).map(function(x){ return x.n; });
  var list = HIST ? HIST.list.filter(function(x){ return openN.indexOf(x.n) < 0; }).slice(0, 8) : [];
  var inner = !HIST ? '<div class="state">'+esc(t("histFail"))+'</div>' : !list.length ? '<div class="state">'+esc(t("noHist"))+'</div>' :
    list.map(function(x){
      var span = x.e ? fmtTime(x.s, now)+" – "+(new Date(x.e).toDateString()===new Date(x.s).toDateString() ? pad(new Date(x.e).getHours())+":"+pad(new Date(x.e).getMinutes()) : fmtTime(x.e, now)) : fmtTime(x.s, now);
      var meta = (x.m ? t("maintW") : lvWord(x.l))+" · "+span+(x.e && x.e > x.s ? " · "+t("tookPre")+fmtDur(x.e - x.s) : "");
      return '<div class="li two lv'+lvKey(x.l)+'"'+(x.u ? ' data-u="'+esc(x.u)+'"' : '')+'><i class="dot"></i><div><b>'+esc(x.n)+
        '</b><small>'+esc(meta)+'</small></div>'+(x.u ? '<span class="go">'+CHEV+'</span>' : '')+'</div>';
    }).join("");
  box.innerHTML = secHtml(t("secHist"), '<div class="grp">'+inner+'</div>', true);
}
function paint(){
  document.getElementById("name").textContent = C.n;
  document.title = C.n;
  document.querySelectorAll("[data-i]").forEach(function(el){ var k=el.dataset.i; if (k==="foot") el.innerHTML=t(k); else el.textContent=t(k); });
  if (C.k === "io") document.querySelector('.foot[data-i="foot"]').innerHTML = t("foot")+esc(t("footIo"));
  document.querySelector("#pickw b").textContent = t("pickSvcPre")+C.n+t("pickSvcSuf");
  document.getElementById("off").textContent = t("openOff");
  document.getElementById("bell").innerHTML = ICO.bell;
  document.getElementById("aGo").innerHTML = CHEV;
  /* 宿主没有 alertAdd(老版本)就整块不画 —— 画出来点了没反应比不画更糟 */
  document.getElementById("alertBtn").style.display = (window.xbridge && xbridge.alertAdd) ? "" : "none";
}
async function refresh(force){
  var my = ++seq;
  var p1 = flowCached("c.svc."+ID, 120000, 6*3600000, fetchSvc, function(m, ts, failed){
    if (my !== seq) return;
    if (failed && HAS) return;
    LAST = m; SVCST = 1; paintHero(m); paintRoot(m); paintHist(); paintAt(ts); HAS = !!m;
  }, force);
  var p2 = histOf(ID, force, function(H, ts, failed){
    if (my !== seq) return;
    if (failed && HIST) return;
    HIST = H || null; if (SVCST) paintHero(LAST); paintHist();
  });
  await Promise.all([p1, p2]);
}
async function addAlert(){
  xbridge.haptic && xbridge.haptic();
  try {
    var r = await xbridge.alertAdd({ id: "down", params: { svc: ID } });
    var d = (r && typeof r==="object" && "code" in r) ? (r.code===0 ? r.data : null) : r;
    if (d==="ok") toast(t("aOk")); else if (d==="quota") toast(t("aQuota"));
  } catch(e){}
}
document.addEventListener("click", function(e){
  var el;
  if ((el = e.target.closest("[data-tg]"))){ var id = el.dataset.tg; OPEN[id] = !OPEN[id]; paintRoot(LAST); return; }
  if (e.target.closest("#allc")){ ALLC = true; paintRoot(LAST); return; }
  if ((el = e.target.closest(".li[data-u]")) && el.dataset.u){ xbridge.route(el.dataset.u); return; }
  if (e.target.closest("#alertBtn")){ addAlert(); return; }
  if (e.target.closest("#off")){ xbridge.route("https://"+C.h+"/"); return; }
  if (e.target.closest("#xbAt")){ xbridge.haptic && xbridge.haptic(); xbAt.busy("xbAt", true);
    refresh(true).then(function(){ xbAt.busy("xbAt", false); }, function(){ xbAt.busy("xbAt", false); }); return; }
  if (e.target.closest("#pickw")){ xbridge.pickWidgets([{ id: "svc", params: { svc: ID } }]); }
});
addEventListener("languagechange", async function(){ await env(); paint(); if (SVCST) paintHero(LAST); paintRoot(LAST); paintHist(); });
(async function boot(){
  if (!(await ready())){ paint(); document.getElementById("hero").innerHTML='<div class="hero"><div class="state">'+esc(t("fail"))+'</div></div>'; return; }
  await env(); paint(); refresh(false);
})();

</script>

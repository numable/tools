<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Service Status</title>
<style>
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;--tile:#E7E9EE;--add:#EEF0F4;
  --src:#7A4FD8;--srcSoft:rgba(122,79,216,.11);--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--line:#262A31;--tile:#20232A;
  --add:#252930;--src:#B49BFF;--srcSoft:rgba(180,155,255,.15);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 段标题 = 左名字 + 右摘要/动作(github 同款:13/700,上 22 下 8,不做 uppercase) */
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.sec em{font-style:normal;font-weight:500;font-size:12px}
.lnk{border:0;background:none;color:var(--src);font-size:13px;font-weight:700;padding:8px 2px;margin:-8px 0;cursor:pointer}
/* 卡片:无描边 + 极浅投影;列表型卡片 overflow:hidden 让按压洗色跟着圆角走 */
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--f);flex:0 0 auto}
.lw{color:var(--c);font-weight:600}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.foot b{color:var(--fg);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.orig{font-size:10.5px;color:var(--sub);font-weight:500;border:1px solid var(--line);border-radius:5px;padding:0 5px;
  margin-left:6px;white-space:nowrap}
/* 近 N 天日格:无事故 = tile;有事故 = 当天最重影响的状态色 */
.days{display:flex;gap:3px;flex:0 0 auto}
.days i{display:block;width:11px;height:11px;border-radius:3px;background:var(--tile)}
.days i[class*="lv"]{background:var(--f)}
.days.sk i{opacity:.5}
.days i.na,.bar i.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
/* 次要动作:源色浅底胶囊;已关注 = 中性灰;满额 = 灰且不可点 */
.chip{flex:0 0 auto;border:0;border-radius:999px;background:var(--srcSoft);color:var(--src);
  font-size:12.5px;font-weight:600;min-height:30px;min-width:64px;padding:0 13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tile);color:var(--sub)}
.chip:disabled{background:var(--tile);color:var(--sub);opacity:.55;cursor:default}
.ib{flex:0 0 auto;width:30px;height:30px;border:0;border-radius:15px;background:var(--tile);color:var(--sub);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:disabled{opacity:.35;cursor:default}
.lv0{--c:#1E9E62;--f:#1E9E62}
.lv1{--c:#2F6FDB;--f:#2F6FDB}
.lv2{--c:#A86E00;--f:#E0A100}
.lv3{--c:#D9600F;--f:#D9600F}
.lv4{--c:#D93A34;--f:#D93A34}
.lvU{--c:#6B7280;--f:#6B7280}
html[data-theme="dark"] .lv0{--c:#3DD68C;--f:#3DD68C}
html[data-theme="dark"] .lv1{--c:#6EA8FE;--f:#6EA8FE}
html[data-theme="dark"] .lv2{--c:#E8B339;--f:#E8B339}
html[data-theme="dark"] .lv3{--c:#FF9148;--f:#FF9148}
html[data-theme="dark"] .lv4{--c:#FF6B61;--f:#FF6B61}
html[data-theme="dark"] .lvU{--c:#8E939B;--f:#8E939B}

.hero{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:14px;margin-top:10px}
.hero .big{font-size:22px;font-weight:700;color:var(--c);line-height:1.3}
.hero .meta{color:var(--sub);font-size:12.5px;margin-top:2px}
.strip{display:flex;gap:4px;margin-top:12px}
.strip i{flex:1 1 0;height:8px;border-radius:4px;background:var(--f)}
/* 关注列表:一张卡、一行一个服务。行左右内边距 14 对称;分隔线从名字起点(14 + 点 9 + 间距 9 = 32)缩进 */
.row{position:relative;padding:12px 14px;cursor:pointer}
.row+.row::before{content:"";position:absolute;left:32px;right:0;top:0;border-top:1px solid var(--line)}
.r1{display:flex;align-items:center;gap:9px}
.r1 b{flex:1 1 auto;min-width:0;font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 .lw{font-size:12.5px;white-space:nowrap}
.go{flex:0 0 auto;color:var(--sub);opacity:.6;display:flex}
.r2{display:flex;align-items:center;gap:8px;margin:7px 0 0 18px;min-height:16px}
.r2 small{flex:1 1 auto;min-width:0;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc{margin:9px 0 0 18px;padding:8px 10px;background:var(--tile);border-radius:10px;border-left:3px solid var(--c)}
.inc .it{font-size:13px;font-weight:600;line-height:1.4}
.inc .im{font-size:11.5px;color:var(--sub);margin-top:3px}
.more{margin:6px 0 0 18px;font-size:11.5px;color:var(--sub)}
.mt{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;position:relative}
.mt+.mt::before{content:"";position:absolute;left:32px;right:0;top:0;border-top:1px solid var(--line)}
.mt .dot{margin-top:6px}
.mt div{flex:1 1 auto;min-width:0}
.mt b{display:block;font-size:13.5px;font-weight:600;line-height:1.4}
.mt small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.empty{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:22px 16px;text-align:center}
.empty b{display:block;font-size:16px;margin-bottom:6px}
.empty p{color:var(--sub);font-size:13px;margin:0 0 14px}
.btn{border:0;background:var(--srcSoft);color:var(--src);border-radius:999px;padding:0 18px;min-height:40px;font-weight:600;cursor:pointer}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */

.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}

.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */

</style>

<div id="hero"></div>
<div class="sec"><span data-i="secW"></span><button class="lnk" id="mg" data-i="manage"></button></div>
<div id="list"><div class="state xb-sk" data-i="loading"></div></div>

var MON3 = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

    var ago = x.s >= t0 ? 0 : Math.floor((t0 - x.s)/86400000) + 1;
    if (last===null || ago < last) last = ago;

async function flowCached(key, ttl, hard, fetcher, paint, force){

  if (c && age < hard){ paint(c.m, c.ts, false); if (age < ttl) return; }

/* 并发上限:同时最多 n 个 runDataFlow,别一口气打 22 个状态页。 */
async function pool(items, n, fn){
  var i = 0;

  var ws = []; for (var j=0;j<Math.min(n, items.length);j++) ws.push(worker());
  await Promise.all(ws);

}

/* 首页 = 每天要看的内容:关注的服务此刻怎么样、这一周稳不稳、哪个在出事、出的什么事、持续多久。
   加组件入口只是页尾一个按钮;需要选对象的「单个服务」组件挂在服务详情页。
   两段取数:① 此刻状态(home.df,2 分钟新鲜)先画;② 各服务近 7 天(hist.df,按服务缓存 1 小时)随后逐行补上。 */
var FOLLOW = [], HAS = false, seq = 0, WK = {};
var CHEV = "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"/></svg>";
async function fetchHome(ids){
  if (!ids.length) return { now: Date.now(), svcs: [] };
  var d = (await xbridge.runDataFlow("home", { ids: ids.join("~") }, 30000).then(un)) || {};
  var m = statusModel(d, ids);
  if (!m.svcs.some(function(s){ return s.lv >= 0; })) return null;   /* 一个都没取到 = 失败,不覆盖缓存 */
  return m;
}
function paintHero(m){
  var el = document.getElementById("hero");
  if (!m || !m.svcs.length){ el.innerHTML = ""; return; }
  var n = m.svcs.length, bad=0, mt=0, unk=0, inc=0, worst=-1;
  m.svcs.forEach(function(s){ if (s.lv>=2) bad++; else if (s.lv===1) mt++; else if (s.lv<0) unk++; inc += s.nInc; worst=Math.max(worst,s.lv); });
  var head = bad ? t("hBadPre")+bad+t("hBadSuf") : mt ? t("hMtPre")+mt+t("hMtSuf") : unk ? t("hUnkPre")+unk+t("hUnkSuf") : t("hAll");
  var cls = bad ? "lv"+lvKey(worst) : mt ? "lv1" : unk ? "lvU" : "lv0";
  el.innerHTML = '<div class="hero '+cls+'"><div class="big">'+esc(head)+'</div><div class="meta">'+
    esc(t("wPre")+n+t("wSuf"))+" · "+esc(inc ? t("iPre")+inc+t("iSuf") : t("iNone"))+'</div>'+
    '<div class="strip">'+m.svcs.map(function(s){ return '<i class="lv'+lvKey(s.lv)+'"></i>'; }).join("")+'</div></div>';
}
function wkLine(id, now){
  var H = WK[id];
  if (H === undefined) return daysHtml(null, 7)+'<small class="xb-sk">'+esc(t("wkLoad"))+'</small>';
  if (!H) return daysHtml(null, 7)+'<small>'+esc(t("wkFail"))+'</small>';
  var st = dayStats(H, 7, now);
  var txt = st.cnt ? (st.atLeast ? t("wkMinPre") : t("wkPre"))+st.cnt+t(st.cnt===1 && !st.atLeast ? "wkSuf1" : "wkSuf") : t("wkNone");
  return daysHtml(st, 7)+'<small>'+esc(txt)+'</small>';
}
var LASTM = null;
function paintList(m){
  var box = document.getElementById("list");
  if (!FOLLOW.length){
    box.innerHTML = '<div class="empty"><b>'+esc(t("noneT"))+'</b><p>'+esc(t("noneS"))+'</p><button class="btn" id="go1">'+esc(t("noneBtn"))+'</button></div>';
    return;
  }
  if (!m){ box.innerHTML = '<div class="grp"><div class="state">'+esc(t("fail"))+'</div></div>'; return; }
  LASTM = m;
  box.innerHTML = '<div class="grp">'+m.svcs.map(function(s){
    var c = byId(s.id), k = lvKey(s.lv);
    var incs = s.incs.map(function(x){
      return '<div class="inc lv'+lvKey(x.l)+'"><div class="it">'+esc(x.n)+'</div><div class="im">'+
        esc(lvWord(x.l)+" · "+stWord(x.s)+(x.st ? " · "+t("durPre")+fmtDur(m.now-x.st)+" · "+t("sincePre")+fmtTime(x.st,m.now)+t("sinceSuf") : ""))+
        '</div></div>';
    }).join("");
    var more = s.nInc > s.incs.length ? '<div class="more">'+esc(t("morePre")+(s.nInc-s.incs.length)+t("moreSuf"))+'</div>' : "";
    return '<div class="row" data-id="'+esc(s.id)+'"><div class="r1 lv'+k+'"><i class="dot"></i><b>'+esc(c.n)+'</b>'+
      '<span class="lw">'+esc(lvWord(s.lv))+'</span><span class="go">'+CHEV+'</span></div>'+
      '<div class="r2" data-wk="'+esc(s.id)+'">'+wkLine(s.id, m.now)+'</div>'+incs+more+'</div>';
  }).join("")+'</div>';
}
function paintWk(id){
  var el = document.querySelector('[data-wk="'+id+'"]');
  if (el) el.innerHTML = wkLine(id, Date.now());
  paintMaint();
}
/* 即将进行的计划维护(只有 Statuspage 原生那几家给得出来):有才画,按开始时间排 */
function paintMaint(){
  var all = [];
  FOLLOW.forEach(function(id){ var H = WK[id]; if (H && H.up) H.up.forEach(function(x){ all.push({ id: id, x: x }); }); });
  all.sort(function(a,b){ return a.x.a - b.x.a; });
  var el = document.getElementById("maint");
  if (!all.length){ el.innerHTML = ""; return; }
  var now = Date.now();
  el.innerHTML = '<div class="sec"><span>'+esc(t("secMt"))+'</span></div><div class="grp">'+all.slice(0,4).map(function(o){
    return '<div class="mt lv1"><i class="dot"></i><div><b>'+esc(byId(o.id).n+" · "+o.x.n)+'</b><small>'+
      esc((o.x.a ? fmtTime(o.x.a, now) : "")+(o.x.b ? " – "+fmtTime(o.x.b, now) : ""))+'</small></div></div>';
  }).join("")+'</div>';
}
function paintAt(ts){ xbAt.set("xbAt", ts || null); }
function paint(){
  document.querySelectorAll("[data-i]").forEach(function(el){ var k=el.dataset.i; if (k==="foot") el.innerHTML=t(k); else el.textContent=t(k); });
  document.getElementById("leg").innerHTML = legendHtml();
}
async function loadWeeks(ids, force, my){
  await pool(ids, 3, function(id){
    return histOf(id, force, function(H, ts, failed){
      if (my !== seq) return;
      if (failed && WK[id]) return;
      WK[id] = H || null; paintWk(id);
    });
  });
}
async function refresh(force){
  var my = ++seq;
  FOLLOW = await getFollow();
  var key = "c.home", ids = FOLLOW.slice();
  /* 两段并行:近 7 天(按服务缓存)与首页此刻状态互不依赖。⚠️ 别写成先 await 首页再 loadWeeks ——
     首页缓存一过 2 分钟就要等它那趟网络回来,7 天那栏的缓存明明在盘上,却一直挂着「加载中」。
     行还没画出来时 paintWk 找不到格子也没关系:WK 已经记下,paintList 画行时按 WK 出。 */
  var weeks = ids.length ? loadWeeks(ids, force, my) : null;
  await flowCached(key, 120000, 6*3600000, function(){ return fetchHome(ids); }, function(m, ts, failed){
    if (my !== seq) return;
    if (m && (!m.svcs || m.svcs.map(function(s){ return s.id; }).join("~") !== ids.join("~"))) return;  /* 关注列表变了:旧缓存不渲 */
    if (failed && HAS) return;                                   /* 失败不覆盖已有内容 */
    paintHero(m); paintList(m); paintAt(ts); HAS = !!m;
  }, force);
  if (weeks) await weeks;
}
document.addEventListener("click", function(e){
  var r = e.target.closest && e.target.closest(".row");
  if (r && r.dataset.id){ xbridge.haptic && xbridge.haptic(); var rc = byId(r.dataset.id), rn = rc && rc.n ? String(rc.n) : "";
    xbridge.route("/svc?id="+encodeURIComponent(r.dataset.id)+(rn ? "&name="+encodeURIComponent(rn) : "")); return; }
  if (e.target.closest && (e.target.closest("#mg") || e.target.closest("#go1"))){ xbridge.route("/manage"); return; }
  if (e.target.closest && e.target.closest("#xbAt")){ xbridge.haptic && xbridge.haptic(); xbAt.busy("xbAt", true);
    refresh(true).then(function(){ xbAt.busy("xbAt", false); }, function(){ xbAt.busy("xbAt", false); }); return; }
  if (e.target.closest && e.target.closest("#pickw")){
    /* 加组件入口 = 一个按钮(§8.1a);「单个服务」要先选服务,放在服务详情页 */
    xbridge.pickWidgets([{id:"board"},{id:"week"},{id:"incidents"},{id:"glance"}]);
  }
});
var BOOTED = false;
function resync(){ if (BOOTED) refresh(false); }
document.addEventListener("visibilitychange", function(){ if (document.visibilityState==="visible") resync(); });
addEventListener("pageshow", resync);
addEventListener("languagechange", async function(){ await env(); paint(); if (LASTM){ paintHero(LASTM); paintList(LASTM); } paintMaint(); });
addEventListener("themechange", function(){});
(async function boot(){
  if (!(await ready())){ paint(); document.getElementById("list").innerHTML='<div class="grp"><div class="state">'+esc(t("fail"))+'</div></div>'; return; }
  await env(); paint(); await refresh(false); BOOTED = true;
})();

</script>
</body></html>

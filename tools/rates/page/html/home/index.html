<title>Rates</title>
<style>
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;

  --src:#9A5B2E;--srcSoft:rgba(154,91,46,.10);--up:#FF5C4D;--dn:#1FC77D;--shadow:0 1px 2px rgba(15,20,30,.06),0 8px 22px rgba(15,20,30,.06)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--line:#262A31;--tile:#20232A;--bar:#4A505A;
  --src:#D9A27A;--srcSoft:rgba(217,162,122,.14);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--xb-content-top) + 12px) 14px calc(var(--xb-content-bottom) + 28px)}
button{font:inherit;color:inherit}
svg{display:block}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;font-weight:700;margin:0;letter-spacing:-.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{color:var(--sub);font-size:13px;margin:2px 0 0}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:22px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px}
.sec em{font-style:normal;font-weight:500;font-size:12px}
.grp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px 14px}
.foot{color:var(--sub);font-size:11px;line-height:1.7;margin-top:18px;background:var(--tile);border-radius:14px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;padding:10px 14px;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row[data-s]{cursor:pointer}
.row .n{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.row .v{flex:0 0 64px;text-align:right;font-size:14px;font-weight:700}
.row .c{flex:0 0 46px;text-align:right;font-size:12.5px;color:var(--sub)}
.row.h{padding-top:8px;padding-bottom:6px}
.row.h .n,.row.h .v,.row.h .c{font-size:11px;color:var(--sub);font-weight:600}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}
.chip{display:inline-block;font-size:11px;font-weight:700;background:var(--tile);border-radius:9px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:8px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
.kv{display:flex;gap:24px;margin-top:6px}
.kv div{font-size:15px;font-weight:700}
.kv i{display:block;font-style:normal;font-size:11px;color:var(--sub);font-weight:400}
.ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:4px}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}

.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的
   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */

/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */

   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */

.pickb:active,.xb-press:active{transform:scale(var(--xb-scale));opacity:var(--xb-dim);transition-duration:var(--xb-in)}

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

.xb-sk{opacity:0;animation:xb-sheen var(--xb-sheen) linear 150ms infinite}

  .xb-in{animation:none!important}

/* xb:motion end */

var NCOL = {"1m":1,"3m":4,"6m":6,"1y":7,"2y":8,"3y":9,"5y":10,"7y":11,"10y":12,"20y":13,"30y":14}, RCOL = {"5y":1,"7y":2,"10y":3,"20y":4,"30y":5};

/* ── 解析:财政部 CSV(倒序,当年 + 上一年接成一列)→ [{d:"YYYY-MM-DD", v:[…列]}],最新在前 ── */
function num(x){ var n = parseFloat(x); return (x==null || x==="" || isNaN(n)) ? null : n; }
function tsyRows(cur, prev){
  var out = [];

    String(txt||"").split(/\r?\n/).forEach(function(line){
      var m = /^(\d\d)\/(\d\d)\/(\d{4}),/.exec(line); if (!m) return;

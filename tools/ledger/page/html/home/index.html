<!DOCTYPE html>
<!--
  记账首页(路由 /)。
  ⚠️ 本文件由 tools/ledger/build.py 生成:源在 tools/ledger/pages/home.html,共享件(model.js / ui.js / kit.css /
     加组件按钮)在生成时注入。别直接改 bundles/ledger/page/html 下的产物。

  信息优先级与组件一致(page-design-system §0):本月支出 + 预算进度在最上面,其次分类占比、近 30 天、明细。
  记一笔 / 改一笔都走 /add(贴底面板);回到本页靠 U.watch() 轮询小键 rev,变了才重读。
  CSP:离线 html 被注入 `default-src 'self'; connect-src 'none'` —— 本页全自包含,零网络。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ledger</title>
<style>
/* ── ledger kit.css(单一真源 = tools/ledger/src/kit.css,build.py 注入每个页面)──
   色值承 design-tokens.md;源色 = 本包身份(账本橄榄绿)。页面规范见 doc/page-design-system.md:
   左右内边距 14 · 组件圆角 14 · 行 / tile 12 · chip 8 · 段标题 13 粗 sub · 元信息 11。骨架照 tools/todo/src/kit.css。 */
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--faint:#9AA0A6;--line:#E4E7EC;
  --tile:#EEF0F3;--tile2:#E7E9EE;--rail:#D6DAE1;
  --src:#5C8A0A;--srcInk:#4E7A08;--srcOn:#FFFFFF;--srcSoft:rgba(92,138,10,.10);--srcSoft2:rgba(92,138,10,.16);--srcBar:#B9D48C;
  --red:#E5484D;--redSoft:rgba(229,72,77,.10);--amber:#B37A00;--green:#2E9E6B;
  --shadow:0 1px 2px rgba(15,20,30,.05),0 6px 18px rgba(15,20,30,.05);
  --sheet:#FFFFFF;--scrim:rgba(0,0,0,.38)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--faint:#5E636B;--line:#262A31;
  --tile:#1D2025;--tile2:#23272E;--rail:#2C313A;
  --src:#A6D65A;--srcInk:#A6D65A;--srcOn:#12180A;--srcSoft:rgba(166,214,90,.12);--srcSoft2:rgba(166,214,90,.2);--srcBar:#4F6A2A;
  --red:#FF6369;--redSoft:rgba(255,99,105,.13);--amber:#F5C23B;--green:#45C793;
  --shadow:none;--sheet:#1A1C20;--scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;
  padding:calc(var(--xb-content-top) + 14px) 14px calc(var(--xb-content-bottom) + 34px);
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input,select,textarea{font-size:16px;font-family:inherit;color:var(--fg)}
.g{width:18px;height:18px;display:block;flex:0 0 auto}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* §1 页头 */
.hd{display:flex;align-items:flex-start;gap:8px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;margin:0 0 3px;letter-spacing:-.3px;line-height:1.25}
.sub{color:var(--sub);font-size:13px;margin:0 0 12px}

/* 月份切换 */
.mnav{display:flex;align-items:center;gap:4px;margin:0 0 12px}
.mnav b{font-size:15px;font-weight:700;min-width:0;text-align:center;padding:0 6px}
.mnav button{width:32px;height:32px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--sub)}
.mnav button:disabled{opacity:.35;cursor:default}
.mnav button .g{width:15px;height:15px}
.mnav .now{margin-left:auto;width:auto;padding:0 12px;font-size:13px;font-weight:600;color:var(--srcInk)}

/* §2 段 */
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:20px 4px 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec .r{font-weight:400;font-variant-numeric:tabular-nums}
.sec .lk{border:0;background:none;padding:0;color:var(--srcInk);font-weight:600;font-size:13px;cursor:pointer}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:10px}
.meta{color:var(--sub);font-size:11px;line-height:1.5;margin:18px 4px 0}

/* 概览 */
.ov{padding:16px 16px 14px}
.ov .l{font-size:13px;color:var(--sub);font-weight:600}
.ov .big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin:2px 0 0;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov .big small{font-size:18px;font-weight:700;margin-right:2px}
.bar{height:8px;border-radius:4px;background:var(--tile2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--src)}
.bar.warn i{background:var(--amber)}
.bar.over i{background:var(--red)}
.ov .bt{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.ov .bt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ov .bt b{color:var(--fg);font-weight:600}
.ov .bt .over{color:var(--red);font-weight:700}
.ov .bt .warn{color:var(--amber);font-weight:700}
.ov .set{border:0;background:none;padding:0;color:var(--srcInk);font-weight:600;font-size:13px;cursor:pointer;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tl{background:var(--tile);border-radius:12px;padding:9px 10px;min-width:0}
.tl span{display:block;font-size:11.5px;color:var(--sub)}
.tl b small{font-size:11px;font-weight:700;margin-right:1px}
.tl b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl b.inc{color:var(--green)}
.tl b.neg{color:var(--red)}

/* 分类占比 */
.cb{display:flex;gap:2px;height:12px;margin:14px 14px 4px;border-radius:6px;overflow:hidden}
.cb i{display:block;height:100%}
.cr{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;position:relative}
.cr+.cr::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.cr:active{background:var(--tile)}
.cr.on{background:var(--srcSoft)}
.ci{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.ci .g{width:16px;height:16px}
.cr .cn{flex:1 1 auto;min-width:0}
.cr .cn b{display:block;font-size:15px;font-weight:500}
.cr .cn .pb{display:block}
.cr .cn .pb{height:4px;border-radius:2px;background:var(--tile2);margin-top:5px;overflow:hidden}
.cr .cn .pb i{display:block;height:100%;border-radius:2px}
.cr .ca{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.cr .ca b{display:block;font-size:15px;font-weight:600}
.cr .ca small{display:block;font-size:12px;color:var(--sub)}

/* 每日柱 */
.dch{padding:14px 14px 10px}
.dch .hl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);gap:8px}
.dch .hl b{color:var(--fg);font-weight:600}
.dbars{display:flex;align-items:flex-end;gap:2px;height:84px;margin-top:12px}
.dbars i{flex:1 1 0;border-radius:2px 2px 1px 1px;background:var(--srcBar);min-height:2px}
.dbars i.z{background:var(--rail)}
.dbars i.t{background:var(--src)}
.dax{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}

/* 明细 */
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--sub);font-weight:700;margin:16px 4px 6px}
.dh .r{font-weight:400;font-variant-numeric:tabular-nums}
.rr{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;position:relative;border:0;background:none;width:100%;text-align:left}
.rr+.rr::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.rr:active{background:var(--tile)}
.rr .rb{flex:1 1 auto;min-width:0}
.rr .rt{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .rm{font-size:12px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .ra{flex:0 0 auto;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}
.rr .ra.inc{color:var(--green)}

/* 空态 */
.empty{text-align:center;padding:30px 20px 24px}
.empty .ei{width:56px;height:56px;border-radius:28px;background:var(--srcSoft);color:var(--src);margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center}
.empty .ei .g{width:26px;height:26px}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.empty p{margin:0 auto;color:var(--sub);font-size:13px;max-width:300px}
.empty .btn{margin-top:18px}

/* 设置行 */
.sr{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;position:relative;border:0;background:none;
  width:100%;text-align:left}
.sr+.sr::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.sr:active{background:var(--tile)}
.sr .si{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--srcSoft);color:var(--src)}
.sr .si .g{width:16px;height:16px}
.sr .sb{flex:1 1 auto;min-width:0}
.sr .sb b{display:block;font-size:15px;font-weight:500}
.sr .sb small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.sr .sv{flex:0 0 auto;color:var(--sub);font-size:14px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right;font-variant-numeric:tabular-nums}
.sr .sv.on{color:var(--srcInk);font-weight:600}
.sr .cv{flex:0 0 auto;color:var(--faint)}
.sr .cv .g{width:14px;height:14px}

/* 撤销条 */
.snack{position:fixed;left:14px;right:14px;bottom:calc(var(--xb-content-bottom) + 16px);z-index:50;
  display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:14px;
  background:#1C1E22;color:#F3F4F6;box-shadow:0 8px 28px rgba(0,0,0,.25);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:520px;margin:0 auto}
html[data-theme="dark"] .snack{background:#2A2D33}
.snack.on{opacity:1;transform:none;pointer-events:auto}
.snack .sm{flex:1 1 auto;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snack .sa{flex:0 0 auto;border:0;background:rgba(255,255,255,.12);color:#C4E58C;font-weight:700;font-size:14px;
  padding:7px 12px;border-radius:10px;cursor:pointer}

/* 页内底部面板(挂页面 body,天然在容器边界内) */
.shbg{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;transition:opacity .2s;display:flex;
  align-items:flex-end;justify-content:center}
.shbg.on{opacity:1}
.sh{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;
  padding:8px 16px calc(var(--xb-safe-bottom, 0px) + 22px);transform:translateY(40px);transition:transform .22s}
.shbg.on .sh{transform:none}
.shh{width:36px;height:5px;border-radius:3px;background:var(--rail);margin:0 auto 12px}
.sh h3{font-size:17px;margin:2px 2px 6px}
.sh .hint{font-size:12.5px;color:var(--sub);margin:0 2px 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;border:0;background:none;text-align:left;cursor:pointer;
  border-radius:12px;font-size:15.5px}
.opt:active{background:var(--tile)}
.opt .cd{width:44px;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.opt .ck{margin-left:auto;color:var(--src);opacity:0}
.opt.on .ck{opacity:1}
.opt .ck .g{width:18px;height:18px}
.row2{display:flex;gap:10px;margin-top:14px}
.row2 .btn{flex:1 1 0}

/* 表单件 */
.field{display:block;width:100%;border:0;outline:0;background:var(--tile);border-radius:12px;padding:12px 14px}
.field::placeholder{color:var(--faint)}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1 1 0;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  color:var(--sub)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:17px;border:0;cursor:pointer;
  background:var(--tile);font-size:14px;font-weight:500;color:var(--fg)}
.chip.on{background:var(--srcSoft2);color:var(--srcInk);font-weight:600}
.chip .g{width:15px;height:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;border:0;border-radius:14px;
  background:var(--src);color:var(--srcOn);font-size:16px;font-weight:700;cursor:pointer}
.btn .g{width:18px;height:18px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.btn.danger{background:var(--card);color:var(--red);box-shadow:var(--shadow);font-weight:600}

/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
#addb{margin-top:12px}
.fchip{display:flex;align-items:center;gap:8px;margin:14px 2px 0;font-size:13px;color:var(--sub)}
.fchip b{color:var(--fg)}
.fchip button{border:0;background:none;padding:0;color:var(--srcInk);font-weight:600;font-size:13px;cursor:pointer}
.amtIn{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:12px;padding:0 14px}
.amtIn span{color:var(--sub);font-weight:700}
.amtIn input{flex:1 1 auto;min-width:0;border:0;outline:0;background:none;padding:12px 0;font-weight:700}
</style>
</head>

<div class="hd"><h1 id="h1">记账</h1></div>
<p class="sub" id="sub">&nbsp;</p>
<div class="mnav hide" id="mnav"><button type="button" id="mPrev"></button><b id="mLbl"></b><button type="button" id="mNext"></button><button type="button" class="now hide" id="mNow"></button></div>

<script>
// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* ── ledger model(纯逻辑,不碰 DOM / 桥)──────────────────────────────────────────
 * 单一真源 = tools/ledger/src/model.js,由 tools/ledger/build.py 逐字注入每个页面;
 * 同一份也被 fixture.js 用 node 跑,产出 render 夹具 —— 页面写盘的形状与组件读到的形状是**同一份代码**。
 *
 * 为什么组件读一份「页面算好的视图」`w`(同 todo):flow 没有 filter / sort / groupBy,
 * 而「本月合计」「按分类汇总」「近 30 天每天多少」全是这类运算。派生量在 JS 里算完整份写回,
 * 组件的 .df 只剩「今天是保存那天之后第几天 → index:: 取格」这一步。
 *
 * ⚠️ 随日子变的量按天摊开 H 天(下标 k = 距保存那天的天数):跨过零点「今天花了多少」归零、跨过月初「本月」
 *    换成新的一个月、近 30 天窗口挪一格 —— 不开页面,组件在第二天也拿得到对的数。超出 H 天 = 组件显示「数据未更新」。
 * ⚠️ 文案不烤进 `w`(切语言时组件重取数、页面不会重写 `w`):分类名、日期、货币符号都存中英两份(z / e),
 *    RCN 按 App 语言挑;金额串只有数字与千分位,与语言无关。
 * ⚠️ 金额一律存整数「分」(最小货币单位 × 100),不存浮点:0.1 + 0.2 这类误差在合计里会露出来。
 */
var LedgerModel = (function () {
  var DAY = 86400000;
  var H = 31;          // 按天摊开的视野:一个月不开页面,组件仍是对的
  var WIN = 30;        // 近 N 天柱
  var REC_MAX = 8;     // 「最近几笔」带几条(组件最多画 6 行)
  var CAT_TOP = 4;     // 分类占比最多几格(第 4 格起合成「其他」)
  var MAX_CENTS = 9999999999;   // 单笔上限 99,999,999.99

  // ── 色板(浅|深)。wash = 该色压在卡底上的淡底,预先算死(RCN 没有颜色运算)──
  var CARD_L = "#FFFFFF", CARD_D = "#15171A";
  var PAL_BASE = {
    orange: ["#F2701F", "#FF8B3E"], blue: ["#2F7CF6", "#6EA8FE"], pink: ["#D6336C", "#F06595"],
    teal: ["#0D9488", "#2DD4BF"], indigo: ["#5B5BD6", "#A5A3FF"], amber: ["#C98A00", "#F5C23B"],
    purple: ["#9C36B5", "#DA77F2"], red: ["#E5484D", "#FF6369"], cyan: ["#0B7285", "#3BC9DB"],
    green: ["#2E9E6B", "#45C793"], brown: ["#8D5A3B", "#D19A72"], grey: ["#6B7280", "#9CA3AF"]
  };
  function mix(a, b, t) {
    function h(c, i) { return parseInt(c.substr(i, 2), 16); }
    var o = "#";
    for (var i = 1; i < 7; i += 2) {
      var v = Math.round(h(a, i) + (h(b, i) - h(a, i)) * t);
      o += (v < 16 ? "0" : "") + v.toString(16).toUpperCase();
    }
    return o;
  }
  var PAL = {};

      if (!U.inApp) return;
      U.haptic();
      xbridge.pickWidgets(["month", "cats", "daily", "recent", "month21", "month11", "add"].map(function (id) { return { id: id }; }));
    };
    $("setSec").innerHTML = "<span>" + esc(t("settings")) + "</span>";
    function srow(id, icon, title, desc, val, cls) {
      return '<button class="sr" type="button" id="' + id + '"><span class="si">' + U.ui(icon) + '</span><span class="sb"><b>' + esc(title) +
        "</b><small>" + esc(desc) + '</small></span><span class="sv ' + (cls || "") + '">' + esc(val || "") + '</span><span class="cv">' + U.ui("chev") + "</span></button>";
    }
    var bud = S().cfg.bud > 0 ? S().cfg.bud : 0;
    $("set").innerHTML = srow("sBud", "wallet", t("budget"), t("budgetD"), bud ? U.moneyBig(bud) : t("budgetNone"), bud ? "on" : "") +
      srow("sCur", "coins", t("currency"), t("currencyD"), M.curOf(S()), "");
    $("sBud").onclick = budgetSheet;
    $("sCur").onclick = currencySheet;
    $("priv").textContent = t("privacy");
  }

  function render() { renderHead(); renderNav(); renderOverview(); renderCats(); renderDaily(); renderList(); renderSettings(); }

  // ── 面板 ──
  function openAdd() { U.haptic(); U.route("/add"); }

  function budgetSheet() {
    U.haptic();
    var bud = S().cfg.bud > 0 ? S().cfg.bud : 0;
    U.sheet('<h3>' + esc(t("budget")) + '</h3><p class="hint">' + esc(t("budgetHint")) + '</p><div class="amtIn"><span>' + esc(U.sym()) +
      '</span><input id="budIn" inputmode="decimal" autocomplete="off" enterkeyhint="done" maxlength="14" placeholder="' + esc(t("budgetPh")) + '" value="' +
      (bud ? esc(M.fmt(bud, U.dp()).replace(/,/g, "")) : "") + '"></div><div class="row2">' +
      (bud ? '<button class="btn ghost" type="button" id="budClr">' + esc(t("clear")) + "</button>" : "") +
      '<button class="btn" type="button" id="budOk">' + esc(t("saveEdit")) + "</button></div>", function (el, close) {
      var inp = el.querySelector("#budIn");
      function ok() {
        var c = M.parseAmount(inp.value);
        if (c <= 0) { U.toast(t("badAmt")); return; }
        S().cfg.bud = c; U.save(); U.haptic("success"); close(); render(); U.toast(t("budgetSet"));
      }
      el.querySelector("#budOk").onclick = ok;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); ok(); } });
      var clr = el.querySelector("#budClr");
      if (clr) clr.onclick = function () { delete S().cfg.bud; U.save(); U.haptic(); close(); render(); U.toast(t("budgetCleared")); };
      setTimeout(function () { inp.focus(); }, 250);
    });
  }

  function currencySheet() {
    U.haptic();
    var cur = M.curOf(S()), zh = U.lang() === "zh";
    U.sheet('<h3>' + esc(t("currency")) + '</h3><p class="hint">' + esc(t("currencyHint")) + "</p>" + M.CUR_KEYS.map(function (k) {
      var c = M.CUR[k];
      return '<button class="opt' + (k === cur ? " on" : "") + '" type="button" data-cur="' + k + '"><span class="cd">' + k + "</span><span>" +
        esc((zh ? c.z : c.e).trim()) + '</span><span class="ck">' + U.ui("check") + "</span></button>";
    }).join(""), function (el, close) {
      el.addEventListener("click", function (e) {
        var b = e.target.closest("[data-cur]"); if (!b) return;
        S().cfg.cur = b.getAttribute("data-cur"); U.save(); U.haptic("selection"); close(); render();
      });
    });
  }

  // ── 事件 ──
  document.addEventListener("click", function (e) {
    var c = e.target.closest("[data-cat]");
    if (c) { var k = c.getAttribute("data-cat"); filt = filt === k ? "" : k; U.haptic("selection"); render();
      var l = $("list"); if (filt && l.scrollIntoView) l.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
    var r = e.target.closest(".rr[data-id]");
    if (r) { U.haptic(); U.route("/add?id=" + encodeURIComponent(r.getAttribute("data-id"))); }
  });
  $("addb").addEventListener("click", openAdd);
  $("mPrev").addEventListener("click", function () { VM--; if (VM < 0) { VM = 11; VY--; } filt = ""; U.haptic("selection"); render(); });
  $("mNext").addEventListener("click", function () { if (isCur()) return; VM++; if (VM > 11) { VM = 0; VY++; } filt = ""; U.haptic("selection"); render(); });
  $("mNow").addEventListener("click", function () { var c = curYM(); VY = c[0]; VM = c[1]; filt = ""; U.haptic("selection"); render(); });
  U.onEnv(render);

  (async function () {
    var c = curYM(); VY = c[0]; VM = c[1];
    await U.bootEnv();
    try { await U.load(); } catch (e) {}
    render();
    U.watch(render);
  })();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  组件设置(路由 /edit 与 /pick;.xwidget events.onEdit 指到这里,长按组件 →「编辑参数」)。
    /edit?brickId=…  列表组件:这张显示哪个范围(今天 / 全部 / 某清单 / 某标签…)→ updateParams {scope}
    /pick?brickId=…  单件组件:这张盯住哪一件待办 → updateParams {id}
  桥上没有「读实例当前参数」,所以不预选中:点一项立即写回并提示,关掉这页组件就换了。
  ⚠️ 本文件由 tools/todo/build.py 生成:源在 tools/todo/pages/edit.html(生成成 html/edit 与 html/pick 两份,只差 mode 一个常量 —— onEdit 只能写裸路由,带不了 ?mode)。
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Widget settings</title>
<style>
/* ── todo kit.css(单一真源 = tools/todo/src/kit.css,build.py 注入每个页面)──
   色值承 design-tokens.md;源色 = 本包身份(玫红)。页面规范见 doc/page-design-system.md:
   左右内边距 14 · 组件圆角 14 · 行 / tile 12 · chip 8 · 段标题 13 粗 sub · 元信息 11。 */
:root{color-scheme:light dark;--xb-content-top:0px;--xb-content-bottom:0px;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--faint:#9AA0A6;--line:#E4E7EC;
  --tile:#EEF0F3;--tile2:#E7E9EE;--rail:#D6DAE1;
  --src:#D6336C;--srcOn:#FFFFFF;--srcSoft:rgba(214,51,108,.10);--srcSoft2:rgba(214,51,108,.16);
  --red:#E5484D;--redSoft:rgba(229,72,77,.10);--green:#2E9E6B;--greenSoft:rgba(46,158,107,.12);
  --shadow:0 1px 2px rgba(15,20,30,.05),0 6px 18px rgba(15,20,30,.05);
  --sheet:#FFFFFF;--scrim:rgba(0,0,0,.38)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;--faint:#5E636B;--line:#262A31;
  --tile:#1D2025;--tile2:#23272E;--rail:#2C313A;
  --src:#F06595;--srcOn:#1A0B11;--srcSoft:rgba(240,101,149,.13);--srcSoft2:rgba(240,101,149,.2);
  --red:#FF6369;--redSoft:rgba(255,99,105,.13);--green:#45C793;--greenSoft:rgba(69,199,147,.14);
  --shadow:none;--sheet:#1A1C20;--scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;
  padding:calc(var(--xb-content-top) + 14px) 14px calc(var(--xb-content-bottom) + 34px);
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input,select,textarea{font-size:16px;font-family:inherit;color:var(--fg)}
.g{width:18px;height:18px;display:block;flex:0 0 auto}
.hide{display:none!important}

/* §1 页头 */
.hd{display:flex;align-items:flex-start;gap:8px}
.hd h1{flex:1 1 auto;min-width:0;font-size:24px;margin:0 0 3px;letter-spacing:-.3px;line-height:1.25}
.hbtn{flex:0 0 auto;width:26px;height:26px;border-radius:13px;border:0;padding:0;cursor:pointer;
  background:rgba(14,17,22,.055);color:var(--sub);display:flex;align-items:center;justify-content:center}
html[data-theme="dark"] .hbtn{background:rgba(243,244,246,.08)}
.hbtn .g{width:14px;height:14px}
.sub{color:var(--sub);font-size:13px;margin:0 0 14px}
.sub b{color:var(--fg);font-weight:600}
.sub .ov{color:var(--red);font-weight:600}

/* §2 段 */
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:20px 4px 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec .r{font-weight:400;font-variant-numeric:tabular-nums}
.sec.over{color:var(--red)}
.sec.today{color:var(--src)}
.sec .lk{border:0;background:none;padding:0;color:var(--src);font-weight:600;font-size:13px;cursor:pointer}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:10px}
.meta{color:var(--sub);font-size:11px;line-height:1.5;margin:18px 4px 0}

/* 待办行 */
.tr{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 4px;position:relative;cursor:pointer;
  transition:opacity .25s,transform .25s}
.tr+.tr::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line)}
.tr:active{background:var(--tile)}
.tr.gone{opacity:0;transform:translateX(24px)}
.chk{flex:0 0 auto;width:44px;height:44px;border:0;padding:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.chk i{width:22px;height:22px;border-radius:11px;border:2px solid var(--pc,var(--rail));display:flex;
  align-items:center;justify-content:center;transition:background .18s,border-color .18s,transform .18s}
.chk i .g{width:13px;height:13px;color:transparent}
.chk.on i{background:var(--pc,var(--src));border-color:var(--pc,var(--src))}
.chk.on i .g{color:#fff}
html[data-theme="dark"] .chk.on i .g{color:#101114}
.chk:active i{transform:scale(.9)}
.tic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.tic .g{width:16px;height:16px}
.tb{flex:1 1 auto;min-width:0}
.tt{font-size:15.5px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.dn .tt{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--faint)}
.tm{display:flex;align-items:center;flex-wrap:wrap;gap:3px 9px;margin-top:2px;color:var(--sub);font-size:12px;line-height:1.35}
.tm span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tm .g{width:12px;height:12px}
.tm .over{color:var(--red);font-weight:600}
.tm .today{color:var(--src);font-weight:600}
.pring{flex:0 0 auto;width:30px;height:30px;position:relative}
.pring svg{width:30px;height:30px;transform:rotate(-90deg)}
.pring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--sub)}
.flag{flex:0 0 auto;width:14px;height:14px}

/* 输入 */
.qa{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:4px 6px 4px 12px;
  box-shadow:var(--shadow)}
.qa input{flex:1 1 auto;min-width:0;border:0;outline:0;background:none;padding:10px 0}
.qa input::placeholder{color:var(--faint)}
.qa .go{flex:0 0 auto;width:34px;height:34px;border-radius:17px;border:0;background:var(--src);color:var(--srcOn);
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.35;transition:opacity .15s}
.qa .go.on{opacity:1}
.qa .go .g{width:16px;height:16px}
.qa .lead{flex:0 0 auto;color:var(--src)}

/* 筛选条 */
.fb{display:flex;gap:6px;overflow-x:auto;margin:12px -14px 0;padding:2px 14px 4px;scrollbar-width:none}
.fb::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;border:0;
  background:var(--card);color:var(--fg);font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.fc .n{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.fc .g{width:14px;height:14px}
.fc.on{background:var(--fg);color:var(--bg)}
.fc.on .n{color:var(--bg);opacity:.7}
.fsep{flex:0 0 1px;background:var(--line);margin:6px 2px}

/* 概览(今天视图顶部) */
.ov{display:flex;align-items:center;gap:14px;padding:14px 16px}
.ov .ring{flex:0 0 auto;width:58px;height:58px;position:relative}
.ov .ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ov .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums}
.ov .ot{flex:1 1 auto;min-width:0}
.ov .o1{font-size:17px;font-weight:700;line-height:1.3}
.ov .o2{font-size:13px;color:var(--sub);margin-top:2px}
.ov .o2.bad{color:var(--red);font-weight:600}
.ov .o2.good{color:var(--green);font-weight:600}

/* 空态 */
.empty{text-align:center;padding:34px 20px 30px}
.empty .ei{width:52px;height:52px;border-radius:26px;background:var(--srcSoft);color:var(--src);margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center}
.empty .ei .g{width:24px;height:24px}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.empty p{margin:0;color:var(--sub);font-size:13px}

/* 设置行 */
.sr{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;position:relative;border:0;background:none;
  width:100%;text-align:left}
.sr+.sr::before{content:"";position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line)}
.sr:active{background:var(--tile)}
.sr .si{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--srcSoft);color:var(--src)}
.sr .si .g{width:16px;height:16px}
.sr .sb{flex:1 1 auto;min-width:0}
.sr .sb b{display:block;font-size:15px;font-weight:500}
.sr .sb small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.sr .sv{flex:0 0 auto;color:var(--sub);font-size:14px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right}
.sr .sv.on{color:var(--src);font-weight:600}
.sr .sv.bad{color:var(--red);font-weight:600}
.sr .cv{flex:0 0 auto;color:var(--faint)}
.sr .cv .g{width:14px;height:14px}

/* 撤销条 */
.snack{position:fixed;left:14px;right:14px;bottom:calc(var(--xb-content-bottom) + 16px);z-index:50;
  display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:14px;
  background:#1C1E22;color:#F3F4F6;box-shadow:0 8px 28px rgba(0,0,0,.25);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:520px;margin:0 auto}
html[data-theme="dark"] .snack{background:#2A2D33}
.snack.on{opacity:1;transform:none;pointer-events:auto}
.snack .sm{flex:1 1 auto;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snack .sa{flex:0 0 auto;border:0;background:rgba(255,255,255,.12);color:#FF8FB5;font-weight:700;font-size:14px;
  padding:7px 12px;border-radius:10px;cursor:pointer}

/* 页内底部面板(挂页面 body,天然在容器边界内) */
.shbg{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;transition:opacity .2s;display:flex;
  align-items:flex-end;justify-content:center}
.shbg.on{opacity:1}
.sh{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;
  padding:8px 16px calc(var(--xb-safe-bottom, 0px) + 22px);transform:translateY(40px);transition:transform .22s}
.shbg.on .sh{transform:none}
.shh{width:36px;height:5px;border-radius:3px;background:var(--rail);margin:0 auto 12px}
.sh h3{font-size:17px;margin:2px 2px 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;border:0;background:none;text-align:left;cursor:pointer;
  border-radius:12px;font-size:15.5px}
.opt:active{background:var(--tile)}
.opt .ck{margin-left:auto;color:var(--src);opacity:0}
.opt.on .ck{opacity:1}
.opt .ck .g{width:18px;height:18px}
.opt .dot{width:12px;height:12px;border-radius:6px;flex:0 0 auto}

/* 表单件 */
.field{display:block;width:100%;border:0;outline:0;background:var(--tile);border-radius:12px;padding:12px 14px}
.field::placeholder{color:var(--faint)}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1 1 0;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;
  color:var(--sub)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;border:0;cursor:pointer;
  background:var(--tile);font-size:13.5px;font-weight:500;color:var(--fg)}
.chip.on{background:var(--srcSoft2);color:var(--src)}
.chip .g{width:14px;height:14px}
.sw{position:relative;width:46px;height:28px;flex:0 0 46px;border-radius:14px;background:var(--rail);border:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--src)}
.sw.on::after{transform:translateX(18px)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;border:0;border-radius:14px;
  background:var(--src);color:var(--srcOn);font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.btn.danger{background:var(--card);color:var(--red);box-shadow:var(--shadow);font-weight:600}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icg button{aspect-ratio:1;border:0;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--sub)}
.icg button .g{width:20px;height:20px}
.icg button.on{outline:2px solid var(--src);outline-offset:-2px;background:var(--srcSoft)}
.swg{display:flex;flex-wrap:wrap;gap:10px}
.swg button{width:34px;height:34px;border-radius:17px;border:0;cursor:pointer;position:relative}
.swg button.on::after{content:"";position:absolute;inset:-4px;border-radius:21px;border:2px solid var(--fg)}

.lic{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.lic .g{width:17px;height:17px}
.sr.on{background:var(--srcSoft)}
</style>
</head>
<body>
<div class="hd"><h1 id="h1"></h1></div>
<p class="sub" id="sub"></p>
<div id="body"></div>
<script>
// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;
  if (r === "cn") return true;
  if (r === "overseas") return false;
  return nbLang(info && (info.language || info.locale)) === "zh";
}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* ── todo model(纯逻辑,不碰 DOM / 桥)────────────────────────────────────────────
 * 单一真源 = tools/todo/src/model.js,由 tools/todo/build.py 逐字注入每个页面;
 * 同一份也被 build.py 用 node 跑一遍,产出 render 夹具 —— 页面写盘的形状与组件读到的形状因此是**同一份代码**。
 *
 * 为什么组件要读一份「页面算好的视图」`w`:flow 没有 filter / sort / groupBy,而「今天还剩几件」「按清单分组」
 * 全是这类运算。所以派生量在 JS 里算完整份写回,组件的 .df 只剩「按今天是第几天挑一格」这一步。
 *
 * ⚠️ `w` 里凡是**随日子变**的量都按天摊开(H 天,下标 k = 距保存那天的天数):组件在第二天、第三天
 *    渲染时,不开页面也拿得到那一天正确的「今天」。超出 H 天 → 组件显示「数据未更新」(打开一次页面就回来)。
 *    随日子变的只有「集合成员」与计数;每条待办相对今天的标签(逾期 N 天 / 明天 / 周五)由 RCN 用 `dm`
 *    对 `tdm` 现算,所以记录本身不随日子变、不必按天复制。
 * ⚠️ 文案一律不烤进 `w`:切语言时组件会重取数但页面不会重写 `w` —— 烤进去的中文会在英文界面上留着。
 *    `w` 里只放代码(dk / wd / mo)与用户自己写的内容,组件的 i18n 表负责成句。
 */
var TodoModel = (function () {
  var DAY = 86400000;
  var H = 14;          // 按天摊开的视野
  var PAST = 21;       // 完成历史往前带几天(组件画「近 7 天」+ 连续天数够用)
  var SCOPE_MAX = 8;   // 每个范围最多带几条进 `w`(最大的列表组件画 7 行)
  var TODAY_MAX = 24;  // 「今天」按截止日升序的前缀,要够盖住 H 天里任何一天的 7 行
  var AG_MAX = 9;      // 日程组件的行数(含日期头)

  // ── 色板:清单 / 标签的颜色键 → 浅|深。wash = 该色在卡底上 14% 的淡底,预先算死(RCN 没有颜色运算) ──
  var CARD_L = "#FFFFFF", CARD_D = "#15171A";
  var PAL_BASE = {
    red: ["#E5484D", "#FF6369"], orange: ["#F2701F", "#FF8B3E"], amber: ["#C98A00", "#F5C23B"],
    green: ["#2E9E6B", "#45C793"], teal: ["#0D9488", "#2DD4BF"], blue: ["#2F7CF6", "#6EA8FE"],
    indigo: ["#5B5BD6", "#A5A3FF"], pink: ["#D6336C", "#F06595"], grey: ["#6B7280", "#9CA3AF"]
  };
  var PAL_KEYS = ["blue", "red", "orange", "amber", "green", "teal", "indigo", "pink", "grey"];
  function mix(a, b, t) {
    function h(c, i) { return parseInt(c.substr(i, 2), 16); }
    var o = "#";
    for (var i = 1; i < 7; i += 2) {
      var v = Math.round(h(a, i) + (h(b, i) - h(a, i)) * t);
      o += (v < 16 ? "0" : "") + v.toString(16).toUpperCase();
    }
    return o;
  }
  var PAL = {};
  PAL_KEYS.forEach(function (k) {
    var c = PAL_BASE[k];
    PAL[k] = { l: c[0], d: c[1], c: c[0] + "|" + c[1],
               w: mix(CARD_L, c[0], 0.14) + "|" + mix(CARD_D, c[1], 0.20) };
  });
  // 包的源色(身份)。没有清单的待办用它。
  var SRC = { l: "#D6336C", d: "#F06595" };
  SRC.c = SRC.l + "|" + SRC.d;
  SRC.w = mix(CARD_L, SRC.l, 0.12) + "|" + mix(CARD_D, SRC.d, 0.18);
  // 优先级:0 无 / 1 低 / 2 中 / 3 高。勾选圈的描边色(Todoist 那一套读法:越急越暖)。
  var PRC = ["#AEB4BE|#565C66", "#2F7CF6|#6EA8FE", "#F2701F|#FF8B3E", "#E5484D|#FF6369"];

  // ── 日期(一律本地时区;页面与组件的 parseDate 都按设备时区,两边对得上) ──
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseYmd(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function mid(ms) { var d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function addDays(ms, n) { var d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); }

  function row(val, icon, color, wash, title, sub) {
    return '<button class="sr' + (chosen === val ? " on" : "") + '" type="button" data-v="' + esc(val) + '"><span class="lic" style="background:' + wash + ";color:" + color + '">' + icon +
      '</span><span class="sb"><b>' + esc(title) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + '</span><span class="cv">' + U.ui("chev") + "</span></button>";
  }
  function n(f) { return S().todos.filter(function (x) { return !x.st && f(x); }).length; }
  function render() {
    document.documentElement.lang = U.lang() === "zh" ? "zh" : "en";
    var src = U.palC(""), srcW = U.palW("");
    var h = "", td = M.mid(Date.now());
    if (mode === "pick") {
      $("h1").textContent = t("pickTodo"); $("sub").textContent = t("pickTodoD");
      var op = S().todos.filter(function (x) { return !x.st; }).sort(M.cmp);
      h = op.length ? '<div class="card">' + op.map(function (x) {
        var rd = U.relDay(x.due, Date.now());
        return row(x.id, x.ic ? U.ic(x.ic) : U.ui("check"), U.todoColor(S(), x), U.todoWash(S(), x), x.t || "—",
          [rd.txt, (M.listOf(S(), x.cat) || {}).n].filter(Boolean).join(" · "));
      }).join("") + "</div>" : '<div class="card empty"><div class="ei">' + U.ui("tray") + "</div><b>" + esc(t("emptyAllT")) + "</b><p></p></div>";
    } else {
      $("h1").textContent = t("editTitle"); $("sub").textContent = t("editDesc");
      h += '<div class="sec"><span>' + esc(t("builtin")) + '</span></div><div class="card">';
      h += row("today", U.ui("sun"), src, srcW, t("today"), t("nOpen", n(function (x) { var d = M.dueMs(x); return d && d <= td; })));
      h += row("over", U.ui("warn"), U.palC("red"), U.palW("red"), t("overdue"), t("nOpen", n(function (x) { var d = M.dueMs(x); return d && d < td; })));
      h += row("all", U.ui("list"), src, srcW, t("all"), t("nOpen", n(function () { return true; })));
      h += row("doing", U.ui("progress"), src, srcW, t("doing"), t("nOpen", n(function (x) { var p = M.progress(x); return p > 0 && p < 100; })));
      h += row("star", U.ui("flag"), U.palC("red"), U.palW("red"), t("star"), t("nOpen", n(function (x) { return (x.pr || 0) >= 3; })));
      h += row("nodate", U.ui("cal"), src, srcW, t("nodate"), t("nOpen", n(function (x) { return !M.dueMs(x); })));
      h += row("inbox", U.ui("tray"), src, srcW, t("inbox"), t("nOpen", n(function (x) { return !M.listOf(S(), x.cat); })));
      h += "</div>";
      if (S().lists.length) {
        h += '<div class="sec"><span>' + esc(t("lists")) + '</span></div><div class="card">' + S().lists.map(function (l) {
          return row("L" + l.id, l.ic ? U.ic(l.ic) : U.ui("list"), U.palC(l.c), U.palW(l.c), l.n, t("nOpen", n(function (x) { return x.cat === l.id; })));
        }).join("") + "</div>";
      }
      if (S().tags.length) {
        h += '<div class="sec"><span>' + esc(t("tags")) + '</span></div><div class="card">' + S().tags.map(function (g) {
          return row("G" + g.id, U.ui("tag"), U.palC(g.c), U.palW(g.c), "#" + g.n, t("nOpen", n(function (x) { return (x.tags || []).indexOf(g.id) >= 0; })));
        }).join("") + "</div>";
      }
    }
    $("body").innerHTML = h;
  }
  document.addEventListener("click", async function (e) {
    var b = e.target.closest("[data-v]"); if (!b) return;
    if (!U.inApp) return;
    if (!brick) { U.toast(t("noBrick")); return; }
    chosen = b.getAttribute("data-v"); render();
    try {
      await U.call(xbridge.updateParams(brick, mode === "pick" ? { id: chosen } : { scope: chosen }));
      await U.call(xbridge.refreshWidget());
      U.haptic("success"); U.toast(t("applied"), "success");
    } catch (err) { U.toast(U.lang() === "zh" ? "没能切换，请重试" : "Couldn't switch. Try again", "error"); }
  });
  U.onEnv(render);
  (async function () { await U.bootEnv(); try { await U.load(); } catch (e) {} render(); })();
})();
</script>
</body>
</html>

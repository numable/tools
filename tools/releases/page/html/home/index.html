<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Release Watch</title>
<style>
/* 与组件同源(infosource-standard §4.2b):同一套块、同一个源色。首页 = 关注列表本身:
   按最近发布排序的仓库行 + 顶部添加框;加组件与提醒入口在页尾。 */
:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#FFFFFF;--fg:#0E1116;--sub:#6B7280;--line:#E4E7EC;
  --tile:#E7E9EE;--rail:#D6DAE1;--src:#8250DF;--srcSoft:rgba(130,80,223,.12);--danger:#D92D20;
  --shadow:0 1px 2px rgba(14,17,22,.05),0 2px 8px rgba(14,17,22,.04)}
html[data-theme="dark"]{--bg:#0B0C0E;--card:#15171A;--fg:#F3F4F6;--sub:#8E939B;
  --line:#262A31;--tile:#20232A;--rail:#2C313A;--src:#A371F7;--srcSoft:rgba(163,113,247,.16);--danger:#FF6B5E;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:var(--xb-content-top,calc(env(safe-area-inset-top) + 56px)) 14px
          var(--xb-content-bottom,calc(28px + env(safe-area-inset-bottom)))}
.hide{display:none!important}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd h1{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:12px;min-height:19px}
/* 添加框:输入字号 16(G15,iOS 聚焦时 <16 会整页放大) */
.addf{display:flex;gap:8px;margin-bottom:6px}
.addf input{flex:1 1 auto;min-width:0;height:44px;border:0;border-radius:12px;padding:0 14px;
  font:inherit;font-size:16px;background:var(--card);color:var(--fg);box-shadow:var(--shadow);outline:none}
.addf input::placeholder{color:var(--sub)}
.addf button{flex:0 0 auto;height:44px;min-width:72px;border:0;border-radius:12px;padding:0 16px;
  font:inherit;font-size:14px;font-weight:600;background:var(--srcSoft);color:var(--src);cursor:pointer}
.addf button[disabled]{opacity:.55}
.msg{color:var(--sub);font-size:12.5px;margin:2px 2px 8px}
.msg:empty{display:none}
.msg.err{color:var(--danger)}
.lh{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px;
  color:var(--sub);font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase}
.lh button{border:0;background:none;color:var(--src);font:inherit;font-size:13px;font-weight:600;letter-spacing:0;
  text-transform:none;min-height:44px;padding:0 4px;cursor:pointer}
/* 一行 = 一块 tile。整行主体是一个 <a href="GitHub 上的这个版本">(容器把 http(s) 链接当外部页打开)。 */
.rel{display:flex;align-items:stretch;background:var(--card);border-radius:14px;margin-bottom:8px;
  overflow:hidden;box-shadow:var(--shadow)}
.rel .lk{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;
  color:inherit;text-decoration:none}
.rel .dot{flex:0 0 8px;width:8px;height:8px;border-radius:4px;background:var(--rail)}
.rel .dot.new{background:var(--src)}
.rel .grow{flex:1 1 auto;min-width:0}
.rel .l1{display:flex;align-items:baseline;gap:6px;min-width:0}
.rel .l1 b{font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .l1 .ow{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.rel .l2{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.rel .ver{font-size:13.5px;font-weight:650;color:var(--src);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rel .ver.none{color:var(--sub);font-weight:500}
.rel .tag{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--sub);background:var(--tile);border-radius:6px;padding:1px 6px}
.rel .ago{flex:0 0 auto;margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.rel .ago.new{color:var(--src);font-weight:600}
.rel .del{flex:0 0 auto;min-width:64px;min-height:44px;border:0;border-left:1px solid var(--line);background:none;
  color:var(--danger);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.editing .rel .lk{pointer-events:none}
.state{color:var(--sub);font-size:13px;text-align:center;padding:22px}
.empty{background:var(--card);border-radius:14px;padding:18px 16px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.empty h2{font-size:16px;margin:0 0 6px}
.empty p{color:var(--sub);font-size:13px;margin:0 0 14px}
.empty .rt{color:var(--sub);font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:0;border-radius:10px;min-height:36px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;
  background:var(--tile);color:var(--fg);cursor:pointer}
.chips button[disabled]{opacity:.5}
.alert{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--card);box-shadow:var(--shadow);
  border-radius:14px;padding:12px 14px;margin-top:14px;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.alert b{display:block;font-size:13.5px}
.alert small{display:block;color:var(--sub);font-size:11.5px}
.alert .ic{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--srcSoft);color:var(--src);
  display:flex;align-items:center;justify-content:center}
.alert .go{margin-left:auto;color:var(--sub);opacity:.6;display:flex}
.pickb{margin-top:10px}
.foot{color:var(--sub);font-size:11px;margin-top:22px;line-height:1.7}
.foot b{color:var(--fg);font-weight:600}
/* xb:addbtn v1 — 由 tools/infosource/mk_addbtn.py 生成,别手改(§8.1a) */
.pickb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:56px;padding:0 16px;margin:22px 0 0;background:#128F661F;border:0;border-radius:14px;
  text-align:left;font:inherit;color:#0E1116;cursor:pointer}
.pickb .pk{flex:0 0 auto;font-size:19px;font-weight:700;line-height:1;color:#128F66}
.pickb .pg{flex:1 1 auto;min-width:0}
.pickb b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#128F66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb .d{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;color:#6B7280;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickb:active{opacity:.7}
html[data-theme="dark"] .pickb{background:#6FE8BE29;color:#F3F4F6}
html[data-theme="dark"] .pickb .pk{color:#6FE8BE}
html[data-theme="dark"] .pickb b{color:#6FE8BE}
html[data-theme="dark"] .pickb .d{color:#8E939B}
/* xb:addbtn end */
/* xb:anchor v1 — 由 tools/infosource/mk_anchor.py 生成,别手改(页面时效锚 §1.1) */

html[data-theme="dark"]{--xb-at-bg:rgba(243,244,246,.08);--xb-at-fg:#8E939B;--xb-at-live:#6FE8BE;--xb-at-idle:#4A4F58}
.xb-at{flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;box-sizing:border-box;height:26px;min-width:26px;padding:0 10px 0 8px;margin:0 0 0 auto;border:0;border-radius:13px;background:var(--xb-at-bg);color:var(--xb-at-fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform var(--xb-out,140ms) ease,opacity var(--xb-out,140ms) ease}

.xb-at svg{flex:0 0 auto;display:block;width:13px;height:13px;fill:currentColor}
.xb-at .lv{flex:0 0 auto;width:6px;height:6px;margin:0 1px 0 2px;border-radius:50%;background:var(--xb-at-live)}
.xb-at .lv.off{background:var(--xb-at-idle)}
/* 没有时间 = 只剩图标的圆钮 */
.xb-at.ic{width:26px;padding:0;justify-content:center}
/* 页面用 .hide / [hidden] 藏锚(未接入、空态)时,单类 .hide 写在本块之前、同特异性会被上面的
   display:inline-flex 盖掉 —— 锚就藏不住了(ccusage 首页 2026-09-25 实测)。双类钉住。 */

.xb-at.busy svg{animation:xb-at-spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.xb-at.busy svg{animation:none;opacity:.5}}
/* xb:anchor end */
/* xb:motion v1 — 由 tools/infosource/mk_motion.py 生成,别手改(页面交互基准) */

/* ① 大面积可点区:按下变底色(不是变透明 —— 整块变透明会「闪」)。
   洗色走 ::after,不动元素自己的 background:各行底色本来就不同,
   写死一个 tile 会让「本来就在 tile 上的行」按下去毫无变化。 */

/* ② 小控件:按下轻微缩放 + 变暗。按下 60ms 跟手,抬起 140ms 留余韵。 */
.addf button,.chips button,.del,#edit,.pickb,.xb-press{transition:transform var(--xb-out) var(--xb-ease),opacity var(--xb-out) var(--xb-ease)}

.xb-in{animation:xb-in var(--xb-enter) var(--xb-ease) both}

/* ④ 骨架:一套形状之外,更要紧的是**延迟 150ms 才铺** —— 命中缓存整条链路 3ms,
   先铺一屏骨架再瞬间换掉比不铺更糟(doc/infosource-standard.md §5.5)。
   靠 animation-delay 实现:延迟期间元素用自己的 opacity:0,一个字节 JS 都不用。 */

    transition-duration:.01ms!important;scroll-behavior:auto!important}

/* xb:motion end */

<body>
  <div class="hd">
    <h1 data-i="title"></h1>
    <button class="xb-at" id="xbAt" type="button"></button>
  </div>
  <div class="sub" id="sub"></div>
  <form class="addf" id="addf" autocomplete="off">
    <input id="q" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
           enterkeyhint="done" data-ph="ph">
    <button id="addB" type="submit" data-i="add"></button>
  </form>
  <div class="msg" id="msg"></div>
  <div id="wrap">
    <div class="lh hide" id="lh"><span data-i="listT"></span><button id="edit" type="button" data-i="edit"></button></div>
    <div id="list"></div>
  </div>
  <div class="empty hide" id="empty">
    <h2 data-i="emptyT"></h2>
    <p data-i="emptyS"></p>
    <div class="rt" data-i="recoT"></div>
    <div class="chips" id="chips"></div>
  </div>
  <button class="alert hide" id="alertBtn" type="button"><span class="ic" id="bell"></span><span><b data-i="aT"></b><small data-i="aS"></small></span><span class="go" id="aGo"></span></button>
  <button class="pickb" id="pickw"><span class="pk">＋</span><span class="pg"><b data-i="pickT"></b><span class="d" data-i="pickS"></span></span></button>

// numable-env v1 · doc/overseas-first.md §1–§2
function nbLang(v){ v = String(v || "").toLowerCase(); return v.slice(0, 2) === "zh" ? "zh" : "en"; }
function nbCnDefault(info){
  var r = info && info.region;

}
/* 宿主信息(market boot() 同法):等桥 → appInfo(带信封且 code≠0 = 没拿到)→ 缺语言时退回 <html data-lang>。 */
async function nbInfo(){
  for (var i = 0; i < 24 && !window.xbridge; i++) await new Promise(function(r){ setTimeout(r, 50); });
  var d = {};
  if (window.xbridge && xbridge.appInfo) {
    try {
      var x = xbridge.appInfo();
      if (x && typeof x.then === "function") x = await x;
      d = (x && x.code != null && x.code !== 0) ? {} : ((x && (x.data || x)) || {});
    } catch(e){ d = {}; }
  }
  if (!d.language && !d.locale) d.language = document.documentElement.getAttribute("data-lang") || "";
  return d;
}
/* 语言:缺省英文;先用 <html data-lang>,appInfo 回来再以它为准(doc/overseas-first.md §1–§2)。 */
var LANG = nbLang(document.documentElement.getAttribute("data-lang"));
/* ⚠️ 空串是合法译文,不兜底(xbundle-i18n:A 表空串 = 刻意为空)。缺键回落英文表。 */
function t(k, a){
  var m = I18N[LANG], s;
  if (m && Object.prototype.hasOwnProperty.call(m, k)) s = m[k]; else s = I18N.en[k] !== undefined ? I18N.en[k] : k;
  if (a != null) s = String(s).replace("{x}", a);
  return s;
}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
/* 只放行 github.com 的 https 链接:行里的 href 来自 feed,别让一个 `javascript:` 混进来。 */
function safeUrl(u){ u = String(u || ""); return /^https:\/\/github\.com\//i.test(u) ? u : ""; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function ready(){ for (var i = 0; i < 30 && !window.xbridge; i++) await sleep(50); return !!window.xbridge; }
/* G49:call 型桥方法回的是信封 {code,msg,data};老宿主可能直接给 data —— 两种都吃。 */
function un(r){ if (r && typeof r === "object" && "code" in r){ if (r.code !== 0) throw new Error(r.msg || ("code " + r.code)); return r.data; } return r; }
function toast(s){ try { xbridge.toast(s); } catch(e){} }
function haptic(k){ try { xbridge.haptic(k || "selection"); } catch(e){} }
function applyTheme(th){
  var dark = th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function paintStatic(){
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k = el.dataset.i; if (k === "foot") el.innerHTML = t(k); else el.textContent = t(k); });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.setAttribute("placeholder", t(el.dataset.ph)); });
  $("edit").textContent = t(EDIT ? "done" : "edit");
}

/* ── 关注列表:data.rl_list = [{o, r}](组件与提醒读同一个键;存正名)── */
var LIST = [], INFO = {}, EDIT = false, seq = 0;
function key(o, r){ return (o + "/" + r).toLowerCase(); }
function full(x){ return x.o + "/" + x.r; }
async function loadList(){
  try { var v = un(await xbridge.getData("rl_list"));
    if (typeof v === "string"){ try { v = JSON.parse(v); } catch(e){ v = null; } }
    var out = [], seen = {};
    (Array.isArray(v) ? v : []).forEach(function(x){
      if (!x || !x.o || !x.r) return; var k = key(x.o, x.r);
      if (!seen[k] && out.length < CFG.max){ seen[k] = 1; out.push({ o: String(x.o), r: String(x.r) }); } });
    return out;
  } catch(e){ return []; }
}
async function saveList(drop){
  try { un(await xbridge.runFlow("save", { list: LIST.slice(0, CFG.max), drop: drop || "" })); return true; }
  catch(e){ return false; }
}
/* 输入 → {o, r}:owner/repo、https://github.com/o/r(/任意后缀)、github.com/o/r、git@github.com:o/r.git 都认。 */
function parseRepo(s){
  s = String(s || "").trim().replace(/^git@github\.com:/i, "").replace(/^(?:https?:\/\/)?(?:www\.)?github\.com\//i, "");
  var p = s.split(/[\/\s?#]+/).filter(Boolean);
  if (p.length < 2) return null;
  var o = p[0], r = p[1].replace(/\.git$/i, "");
  if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(o)) return null;
  if (!/^[A-Za-z0-9._-]{1,100}$/.test(r) || r === "." || r === "..") return null;
  return { o: o, r: r };
}

/* ── 取数:每个仓库一条 repo.df(带三态缓存),并行 ── */
async function fetchOne(o, r, useCache){
  if (!(window.xbridge && xbridge.runDataFlow)) return null;
  try { return un(await xbridge.runDataFlow("repo", { o: o, r: r, _cache: useCache ? 1 : 0 })); }
  catch(e){ return null; }
}
function good(d){ return !!(d && String(d.ok) === "1" && d.cn); }
var painting = false;
function schedulePaint(){ if (painting) return; painting = true; requestAnimationFrame(function(){ painting = false; paint(); }); }
async function loadAll(force){
  var my = ++seq;
  if (force) xbAt.busy("xbAt", true);
  await Promise.all(LIST.map(async function(x){
    var d = await fetchOne(x.o, x.r, !force);
    if (my !== seq) return;
    if (d && (good(d) || !INFO[key(x.o, x.r)])) { INFO[key(x.o, x.r)] = d; schedulePaint(); }
    /* stale:先出旧货,后台再真取一次,回来原地替换(G23 三态的中间那一行) */
    if (!force && d && String(d._stale) === "1"){
      var f = await fetchOne(x.o, x.r, false);
      if (my === seq && good(f)){ INFO[key(x.o, x.r)] = f; schedulePaint(); }
    }
  }));
  if (my !== seq) return;
  xbAt.busy("xbAt", false);
  await adoptCanonical();
  schedulePaint();
}
/* 改名仓库(301)照样取得到,feed 给出正名 —— 发现存的是旧名就改成正名,组件与提醒随之用新名。 */
async function adoptCanonical(){
  var changed = false, seen = {};
  LIST = LIST.filter(function(x){
    var d = INFO[key(x.o, x.r)];
    if (good(d) && d.cn.toLowerCase() !== key(x.o, x.r)){
      var p = d.cn.split("/"); INFO[d.cn.toLowerCase()] = d; x.o = p[0]; x.r = p[1]; changed = true; }
    var k = key(x.o, x.r); if (seen[k]) { changed = true; return false; } seen[k] = 1; return true;
  });
  if (changed) await saveList("");
}

/* ── 时间 ── */
function agoText(ms, now){
  if (!ms) return "";
  var m = Math.max(Math.floor((now - ms) / 60000), 1), sp = t("sp");
  if (m < 60) return m + sp + t("uM");
  if (m < 1440) return Math.floor(m / 60) + sp + t("uH");   /* ≥ 24 小时写「1 天前」(组件同口径,2026-10-08) */
  if (m < 86400) return Math.floor(m / 1440) + sp + t("uD");
  if (m < 1051200) return Math.floor(m / 43200) + sp + t("uMo");
  return Math.floor(m / 525600) + sp + t("uY");
}
function dateText(ms){
  var d = new Date(ms), now = new Date();
  var y = d.getFullYear() !== now.getFullYear();
  if (LANG === "zh") return (y ? d.getFullYear() + "年" : "") + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  return M + " " + d.getDate() + (y ? ", " + d.getFullYear() : "");
}

/* ── 画 ── */
function rowsSorted(){
  return LIST.map(function(x, i){
    var d = INFO[key(x.o, x.r)];
    var st = !d ? "w" : good(d) ? (d.tg ? "o" : "n") : "f";
    return { x: x, i: i, d: d, st: st, ms: st === "o" ? Number(d.ms) || 0 : 0 };
  }).sort(function(a, b){ return (b.ms - a.ms) || (a.i - b.i); });
}
function rowHtml(r, now){
  var x = r.x, d = r.d || {}, name = esc(x.r), owner = esc(x.o);
  var href = r.st === "o" ? (safeUrl(d.href) || ("https://github.com/" + full(x) + "/tags"))
                          : "https://github.com/" + full(x);
  var isNew = r.st === "o" && (now - r.ms) < CFG.newMs;
  var ver, tail = "";
  if (r.st === "o"){
    ver = '<span class="ver">' + esc(d.tg) + "</span>" + (String(d.pr) === "1" ? '<span class="tag">' + esc(t("pre")) + "</span>" : "");
    tail = '<span class="ago' + (isNew ? " new" : "") + '">' + esc(agoText(r.ms, now) + " · " + dateText(r.ms)) + "</span>";
  } else if (r.st === "n"){
    ver = '<span class="ver none">' + esc(t("noVer")) + "</span>";
  } else if (r.st === "f"){
    ver = '<span class="ver none">' + esc(t("failRow")) + "</span>";
  } else {
    ver = '<span class="ver none">' + esc(t("loading")) + "</span>";
  }
  var del = EDIT ? '<button class="del" type="button" data-k="' + esc(key(x.o, x.r)) + '">' + esc(t("remove")) + "</button>" : "";
  return '<div class="rel"><a class="lk" href="' + esc(href) + '"><span class="dot' + (isNew ? " new" : "") + '"></span>' +
    '<span class="grow"><span class="l1"><b>' + name + '</b><span class="ow">' + owner + "</span></span>" +
    '<span class="l2">' + ver + tail + "</span></span></a>" + del + "</div>";
}
function paint(){
  var n = LIST.length, now = Date.now();
  $("sub").textContent = n ? t("sub", n) : "";
  $("lh").classList.toggle("hide", !n);
  $("empty").classList.toggle("hide", !!n);
  $("wrap").classList.toggle("editing", EDIT);
  $("alertBtn").classList.toggle("hide", !(n && window.xbridge && xbridge.alertAdd));
  /* 一个都没关注时组件加出来也是空的(§8.1a 第 4 条:加不出数据的组件不进候选)—— 按钮先不出 */
  $("pickw").classList.toggle("hide", !n);
  $("q").disabled = false;
  if (!n){ $("list").innerHTML = ""; EDIT = false; paintChips(); xbAt.set($("xbAt"), null); return; }
  $("list").innerHTML = rowsSorted().map(function(r){ return rowHtml(r, now); }).join("");
  var oldest = null;
  LIST.forEach(function(x){ var d = INFO[key(x.o, x.r)]; var f = d && Number(d.fetchedMs);
    if (f && good(d) && (oldest == null || f < oldest)) oldest = f; });
  xbAt.set($("xbAt"), oldest);
}
function paintChips(){
  var has = {}; LIST.forEach(function(x){ has[key(x.o, x.r)] = 1; });
  $("chips").innerHTML = CFG.reco.map(function(s){
    return '<button type="button" data-r="' + esc(s) + '"' + (has[s.toLowerCase()] ? " disabled" : "") + ">" + esc(s) + "</button>"; }).join("");
}
function say(s, err){ var m = $("msg"); m.textContent = s || ""; m.classList.toggle("err", !!err); }

/* ── 增删 ── */
var adding = false;
async function addRepo(text, fromChip){
  if (adding) return;
  var p = parseRepo(text);
  if (!p){ say(t("bad"), true); return; }
  if (LIST.some(function(x){ return key(x.o, x.r) === key(p.o, p.r); })){ say(t("dup", full(p)), true); return; }
  if (LIST.length >= CFG.max){ say(t("full"), true); return; }
  adding = true; haptic(); $("addB").disabled = true; say(t("finding"));
  var d = await fetchOne(p.o, p.r, false);
  adding = false; $("addB").disabled = false;
  if (!good(d)){ say(t("notFound", full(p)), true); return; }
  var c = d.cn.split("/"), np = { o: c[0], r: c[1] };
  if (LIST.some(function(x){ return key(x.o, x.r) === key(np.o, np.r); })){ say(t("dup", d.cn), true); return; }
  LIST.push(np); INFO[key(np.o, np.r)] = d;
  if (!fromChip) $("q").value = "";
  say("");
  paint();
  await saveList("");
  toast(t("added", d.cn));
}
async function removeRepo(k){
  var i = -1; LIST.forEach(function(x, j){ if (key(x.o, x.r) === k) i = j; });
  if (i < 0) return;
  var gone = LIST.splice(i, 1)[0]; delete INFO[k];
  haptic(); say(""); if (!LIST.length) EDIT = false; paintStatic(); paint();
  await saveList(full(gone));
  toast(t("removed", full(gone)));
}
async function addAlert(){
  haptic();
  try { var d = un(await xbridge.alertAdd({ id: "new" }));
    if (d === "ok") toast(t("aOk")); else if (d === "quota") toast(t("aQuota")); } catch(e){}
}

document.addEventListener("submit", function(e){ e.preventDefault(); addRepo($("q").value, false); });
document.addEventListener("click", function(e){
  var c = e.target.closest && e.target.closest("#chips button");
  if (c){ if (!c.disabled) addRepo(c.dataset.r, true); return; }
  var dl = e.target.closest && e.target.closest(".del");
  if (dl){ e.preventDefault(); removeRepo(dl.dataset.k); return; }
  if (e.target.closest && e.target.closest("#edit")){ EDIT = !EDIT; haptic(); say(""); paintStatic(); paint(); return; }
  if (e.target.closest && e.target.closest("#xbAt")){ if (LIST.length) loadAll(true); return; }
  if (e.target.closest && e.target.closest("#alertBtn")){ addAlert(); return; }
  if (e.target.closest && e.target.closest("#pickw")){
    /* 加组件入口 = 一个按钮(§8.1a):打开系统面板,由用户在面板里挑;调用后不提示结果。 */
    if (window.xbridge && xbridge.pickWidgets) xbridge.pickWidgets();
  }
});
document.addEventListener("input", function(e){ if (e.target && e.target.id === "q") say(""); });

(async function boot(){
  $("bell").innerHTML = CFG.bell; $("aGo").innerHTML = CFG.chev;
  if (!(await ready())){ applyTheme(); paintStatic(); $("list").innerHTML = '<div class="state">' + esc(t("notX")) + "</div>"; return; }
  var a = await nbInfo();
  applyTheme(a.theme); LANG = nbLang(a.language || a.locale);
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  addEventListener("languagechange", function(e){
    LANG = nbLang((e && e.detail && e.detail.language) || document.documentElement.getAttribute("data-lang") || LANG);
    paintStatic(); paint(); });
  addEventListener("themechange", function(e){ if (e && e.detail && e.detail.theme) applyTheme(e.detail.theme); });
  paintStatic();
  LIST = await loadList();
  paint();
  if (LIST.length) loadAll(false);
})();

    var b=rows.map(function(r){ return {t:r[0]*1000,o:+r[3],h:+r[2],l:+r[1],c:+r[4],v:+r[5]}; });
    var span=bar==="4H"?144e5:(bar==="1Wutc"?6048e5:0);
    if(span){ var agg=[], cur=null;
      b.slice().reverse().forEach(function(x){
        var k=bar==="4H" ? x.t-x.t%span : x.t-(((Math.floor(x.t/864e5)+3)%7)*864e5);   /* 周 = UTC 周一 */
        if(!cur||cur.t!==k){ cur={t:k,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v}; agg.push(cur); }
        else { cur.h=Math.max(cur.h,x.h); cur.l=Math.min(cur.l,x.l); cur.c=x.c; cur.v+=x.v; } });
      b=agg.reverse(); }
    var lim=parseInt(q.limit,10)||300;
    return b.slice(0,lim).map(function(x,i){ var a=String(x.v*x.c);
      return [String(x.t),String(x.o),String(x.h),String(x.l),String(x.c),String(x.v),a,a,i?"1":"0"]; }); }
  return null;
}
async function rawFlow(flow, to){
  var d=await call(xbridge.runDataFlow(flow,{},to||15000));
  return JSON.parse(String(d&&d.raw||"null"));
}
/* G23 首屏缓存:存的是**解析后的精简模型**(不是原始响应),s = 结构版本,对不上当没有。 */
var SCHEMA=2;
async function cacheGet(k){ var o=await sGetJ(k); return (o&&o.s===SCHEMA&&o.t&&o.d)?o:null; }
function cachePut(k,d){ sSet(k,{s:SCHEMA,t:Date.now(),d:d}); }

/* 可见才轮询:隐藏时不打网络;离开本页(压栈进详情)后降频到 60 秒,
   回来时靠 visibilitychange / focus / pageshow / 任何一次触摸恢复原速 ——
   有的宿主在栈底页上不派发可见性事件,那就退到「慢慢刷」,而不是一直全速或永远停住。 */
function Poller(fn, ms){
  var timer=null, busy=false, away=false, base=ms;
  async function tick(force){ if(busy) return; if(!force&&document.visibilityState==="hidden") return;
    busy=true; try{ await fn(force); }catch(e){} busy=false; }
  function arm(){ if(timer) clearInterval(timer); timer=setInterval(tick, away?Math.max(60000,base):base); }
  function back(){ if(away){ away=false; arm(); tick(); } }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"){ back(); tick(); } });
  addEventListener("focus",back); addEventListener("pageshow",back);
  document.addEventListener("pointerdown",back,true);
  return {start:function(){ arm(); }, tick:tick, leave:function(){ away=true; arm(); },
          setMs:function(m){ base=m; arm(); }};
}

/* ── 格式化 ── */
function num(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
function pxDp(p){ var a=Math.abs(p); if(a>=1000) return 1; if(a>=100) return 2; if(a>=1) return 3;
  if(a>=0.1) return 4; if(a>=0.01) return 5; if(a>=0.001) return 6; if(a>=0.0001) return 7; return 9; }
function grp(n,dp){ return n.toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
/* 价格按量级给小数位:BTC 84,012.4、SOL 142.37、DOGE 0.15321、PEPE 0.0000091 —— 一个固定 2 位会把山寨币全抹成 0.00。 */
function fpx(v,dp){ var n=num(v); if(n===null) return "--"; return grp(n, dp==null?pxDp(n):dp); }
function signed(v,dp,unit){ var n=num(v); if(n===null) return "--";
  return (n>0?"+":n<0?"−":"")+Math.abs(n).toFixed(dp)+(unit||""); }
function pct(v,dp){ return signed(v,dp==null?2:dp,"%"); }
/* 大数:中文收成「万 / 亿 / 万亿」,英文按千进制 K/M/B/T(⚠️ 不能直译:1 亿 = 100M)。 */
function big(v,cur){ var n=num(v); if(n===null) return "--"; var a=Math.abs(n), s=n<0?"−":"", c=cur||"";
  if(LANG!=="zh"){ if(a>=1e12) return s+c+(a/1e12).toFixed(2)+"T"; if(a>=1e9) return s+c+(a/1e9).toFixed(2)+"B";
    if(a>=1e6) return s+c+(a/1e6).toFixed(2)+"M"; if(a>=1e3) return s+c+(a/1e3).toFixed(1)+"K"; return s+c+a.toFixed(a<10?2:0); }
  if(a>=1e12) return s+c+(a/1e12).toFixed(2)+t("wanyi"); if(a>=1e8) return s+c+(a/1e8).toFixed(2)+t("yi");
  if(a>=1e4) return s+c+(a/1e4).toFixed(a>=1e6?0:1)+t("wan"); return s+c+a.toFixed(a<10?2:0); }
function cls(v){ var n=num(v); if(n===null||Math.abs(n)<0.005) return ""; return n>0?"up":"dn"; }
function pillStyle(v){ var n=num(v); if(n===null||Math.abs(n)<0.005) return "background:var(--tile);color:var(--sub)";
  return n>0?"background:var(--cuBg);color:var(--cu)":"background:var(--cdBg);color:var(--cd)"; }
function hhmm(ms){ var d=new Date(+ms); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function hhmmss(ms){ var d=new Date(+ms); return hhmm(ms)+":"+("0"+d.getSeconds()).slice(-2); }
var MON_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* 月日(overseas-first §5):中文「10月1日」、英文「Oct 1」。utc=true 按 UTC 日历日(日 / 周 K 的 ts 是 UTC 零点)。 */
function mdOf(mo,dd){ return LANG==="zh" ? (mo+1)+"月"+dd+"日" : MON_EN[mo]+" "+dd; }
function mmdd(ms,utc){ var d=new Date(+ms); return utc ? mdOf(d.getUTCMonth(),d.getUTCDate()) : mdOf(d.getMonth(),d.getDate()); }
function ymd(ms,utc){ var d=new Date(+ms), y=utc?d.getUTCFullYear():d.getFullYear();
  return LANG==="zh" ? y+"年"+mmdd(ms,utc) : mmdd(ms,utc)+", "+y; }
function ago(ms){ var s=Math.max(0,Math.round((Date.now()-ms)/1000)); if(s<5) return t("now");
  if(s<60) return t("secAgo",s); return t("minAgo",Math.round(s/60)); }

/* ── 币对 ── */
/* 老版本(Bitstamp)写下的是 `btcusd` 这种形状;OKX 是 `BTC-USDT`。两种都认,USD 一律落到 USDT。 */
function normInst(p){ p=String(p||"").trim(); if(!p) return ""; if(p.indexOf("-")>=0) return p.toUpperCase();
  var s=p.toLowerCase(), q="USDT", b=s, m;
  if((m=/^(.+?)(usdt|usdc)$/.exec(s))){ b=m[1]; q=m[2].toUpperCase(); }
  else if((m=/^(.+?)usd$/.exec(s))){ b=m[1]; }
  else if((m=/^(.+?)(eur|btc|eth)$/.exec(s))){ b=m[1]; q=m[2].toUpperCase(); }
  return b.toUpperCase()+"-"+q; }
/* 稳定币不进涨跌 / 成交额榜与「热门」:USDC 永远 ±0.01%,却能排进成交额第二,占掉一个真正在动的币的位置。 */
var STABLE=/^(USDC|USDT|DAI|FDUSD|TUSD|USDG|PYUSD|USDE|RLUSD|EURC|USD1|USDS|FRAX|BUSD|USDP|USDD|USTC|GUSD|LUSD|SUSD|CRVUSD|USDX|USDB)$/;
function isStable(id){ return STABLE.test(baseOf(id)); }
function baseOf(id){ return String(id||"").split("-")[0]; }
function quoteOf(id){ return String(id||"").split("-")[1]||"USDT"; }
function isSwap(id){ return /-SWAP$/.test(id); }
function spotOf(id){ return isSwap(id)?id.replace(/-SWAP$/,""):id; }
function swapOf(id){ return isSwap(id)?id:(baseOf(id)+"-"+(quoteOf(id)==="USDC"?"USDC":"USDT")+"-SWAP"); }
/* 头像 = 字母兜底 + OKX 币种图标叠加(取不到 onerror 自摘、字母仍在)。图标域 = www.okx.com,已在 manifest.network(img-src 由它拼出)。 */
function avEl(id,sz){ var b=baseOf(id), st=sz?' style="width:'+sz+'px;height:'+sz+'px"':"";
  return '<span class="av"'+st+'>'+esc(b.charAt(0))+'<img loading="lazy" alt="" src="https://www.okx.com/cdn/oksupport/asset/currency/icon/'+
    esc(b.toLowerCase())+'.png" onerror="this.remove()"></span>'; }

/* ── 自选 ── */
/* 真源 = data.wl(JSON 数组,OKX instId,≤30)。另镜像到老槽位 w.p1…w.p8 / w.n* / w.total / w.ids ——
   `top`、`heat` 两个组件的取数流按槽位读(.df 没有数组迭代),不镜像它们就停在旧自选上。 */
var WL_MAX=30, WL_DEF=["BTC-USDT","ETH-USDT","SOL-USDT","XRP-USDT","DOGE-USDT","ADA-USDT"];
async function wlLoad(){
  var a=await sGetJ("wl"), out=[];
  if(!(Array.isArray(a)&&a.length)){
    a=[]; var n=parseInt(await sGet("w.total"),10)||0;
    for(var i=1;i<=Math.min(6,n||6);i++){ var p=await sGet("w.p"+i); if(p) a.push(p); }
    if(!a.length) a=WL_DEF.slice();
  }
  a.forEach(function(x){ x=normInst(x); if(x&&out.indexOf(x)<0) out.push(x); });
  return out.slice(0,WL_MAX);
}
function wlSave(a){
  sSet("wl",JSON.stringify(a));
  var n=a.length||1;
  for(var i=0;i<8;i++){ var id=a[i]||a[i%n]||"BTC-USDT"; sSet("w.p"+(i+1),id); sSet("w.n"+(i+1),baseOf(id)); }
  sSet("w.total",String(a.length)); sSet("w.ids",a.join(","));
  try{ xbridge.refreshWidget(); }catch(e){}
}

/* ── 可选币对全集(管理页 / 换币页的搜索用)── 现货 USDT 优先,只有永续的币补进来;按 24h 成交额排序。
   存 c.cx.uni(精简成 [id, 成交额, 最新价, 24h%]),6 小时内直接用 —— 搜索框不该每开一次就拉 170KB。 */
async function loadUniverse(force){
  var c=await cacheGet("c.cx.uni");
  if(c&&!force&&Date.now()-c.t<6*3600e3) return c.d;
  try{
    var r=await Promise.all([okx("market/tickers?instType=SPOT",20000), okx("market/tickers?instType=SWAP",20000).catch(function(){ return []; })]);
    var seen={}, out=[];
    r[0].forEach(function(x){ if(!/-USDT$/.test(x.instId)) return; var l=num(x.last), o=num(x.open24h);
      seen[baseOf(x.instId)]=1; out.push([x.instId, Math.round(num(x.volCcy24h)||0), l, (l!=null&&o)?+((l-o)/o*100).toFixed(2):null]); });
    r[1].forEach(function(x){ if(!/-USDT-SWAP$/.test(x.instId)||seen[baseOf(x.instId)]) return; var l=num(x.last), o=num(x.open24h);
      out.push([x.instId, Math.round((num(x.volCcy24h)||0)*(l||0)), l, (l!=null&&o)?+((l-o)/o*100).toFixed(2):null]); });
    out.sort(function(a,b){ return b[1]-a[1]; });
    cachePut("c.cx.uni",out); return out;
  }catch(e){ return c?c.d:[]; }
}
/* 搜索:符号前缀命中排最前,其次包含;空关键词 = 成交额前 40(「热门」)。 */
function searchUni(uni,kw){
  kw=String(kw||"").trim().toUpperCase().replace(/[\s\/]/g,"").replace(/-?USDT?$/,"");
  if(!kw) return uni.filter(function(u){ return !isStable(u[0]); }).slice(0,40);
  var a=[],b=[]; uni.forEach(function(u){ var s=baseOf(u[0]); if(s.indexOf(kw)===0) a.push(u); else if(s.indexOf(kw)>0) b.push(u); });
  return a.concat(b).slice(0,60);
}
(function(){
i18n({zh:{title:"管理自选",mine:"我的自选",addT:"添加币种",hot:"按 24h 成交额",found:"%s 个结果",ph:"搜索币种，如 BTC、SOL、PEPE",
   empty:"还没有自选，从下面搜一个加进来",none:"没有找到这个币",add:"添加",added:"已添加",full:"自选最多 30 个",perp:"永续",
   up:"上移",del:"删除",vol:"额 %s",saved:"已加入自选",removed:"已移出",last:"至少留一个"},
 en:{title:"My Coins",mine:"Watchlist",addT:"Add coins",hot:"by 24h volume",found:"%s results",ph:"Search coins, e.g. BTC, SOL, PEPE",
   empty:"No coins yet — search below to add one",none:"No coin matches",add:"Add",added:"Added",full:"Watchlist holds up to 30",perp:"Perp",

var WL=[], UNI=[], IDX={};
var UP='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>';
var X='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function meta(id){ var u=IDX[id]; if(!u) return ""; return fpx(u[2])+' · <span class="'+cls(u[3])+'">'+pct(u[3])+'</span> · '+esc(t("vol",big(u[1],"$"))); }
function name(id){ return esc(baseOf(id))+'<small>'+esc(isSwap(id)?t("perp"):"/"+quoteOf(id))+'</small>'; }
function paintMine(){
  $("cnt").textContent=WL.length+" / "+WL_MAX;
  $("mine").innerHTML=WL.length?WL.map(function(id,i){ return '<div class="mrow">'+avEl(id)+'<div class="g"><b>'+name(id)+'</b><span class="m">'+meta(id)+'</span></div>'+

    '<button class="ib" data-del="'+i+'" title="'+esc(t("del"))+'">'+X+'</button></div>'; }).join(""):'<div class="state">'+esc(t("empty"))+'</div>';
}
function paintHits(){
  var kw=$("q").value, a=searchUni(UNI,kw);
  $("hint").textContent=kw.trim()?t("found",a.length):t("hot");
  if(!UNI.length){ $("hits").innerHTML='<div class="state">'+esc(window.xbridge?t("failCold"):t("notX"))+'</div>'; return; }
  $("hits").innerHTML=a.length?a.map(function(u){ var on=WL.indexOf(u[0])>=0;
    return '<div class="hit">'+avEl(u[0])+'<div class="g"><b>'+name(u[0])+'</b><span class="m">'+meta(u[0])+'</span></div>'+
      '<button class="btn'+(on?" on":"")+'" data-add="'+esc(u[0])+'">'+esc(t(on?"added":"add"))+'</button></div>'; }).join(""):'<div class="state">'+esc(t("none"))+'</div>';
}
document.addEventListener("click",function(e){
  var up=e.target.closest("[data-up]"), del=e.target.closest("[data-del]"), add=e.target.closest("[data-add]");
  if(up){ var i=+up.getAttribute("data-up"); if(i>0){ var x=WL.splice(i,1)[0]; WL.splice(i-1,0,x); haptic(); wlSave(WL); paintMine(); } return; }
  if(del){ if(WL.length<=1){ toast(t("last")); return; } WL.splice(+del.getAttribute("data-del"),1); haptic(); wlSave(WL); paintMine(); paintHits(); toast(t("removed")); return; }
  if(add){ var id=add.getAttribute("data-add"), j=WL.indexOf(id);
    if(j>=0){ if(WL.length<=1){ toast(t("last")); return; } WL.splice(j,1); toast(t("removed")); }
    else { if(WL.length>=WL_MAX){ toast(t("full")); return; } WL.push(id); toast(t("saved")); }
    haptic("success"); wlSave(WL); paintMine(); paintHits(); }
});
$("q").addEventListener("input",paintHits);
function paintAll(){ document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent=t(e.getAttribute("data-i")); }); $("q").placeholder=t("ph"); paintMine(); paintHits(); }
(async function(){
  var has=await ready(); await bootEnv(paintAll); paintAll();

  var h='<div class="bhead"><span class="up">'+esc(t("bidR",br.toFixed(1)+"%"))+'</span><span class="dn">'+esc(t("askR",(100-br).toFixed(1)+"%"))+'</span></div>'+
    '<div class="ratio"><span style="flex:'+br+';background:var(--cu)"></span><span style="flex:'+(100-br)+';background:var(--cd)"></span></div>';
  /* 深度图:画布只建一次、之后原地重画 —— 每轮 innerHTML 重建 <canvas> 会先露出一帧空白,2 秒闪一下(2026-09-30)。 */
  if(S.bmode==="depth"){ var spT=esc(t("spread",sp==null?"--":fpx(sp)+" · "+(sp/mid*100).toFixed(4)+"%"));
    if(!$("depth")||!$("dhd")){ el.innerHTML='<div id="dhd"></div><canvas id="depth"></canvas><div class="spread" id="dsp"></div>'; el.__h=null; }
    setHTML($("dhd"),h); setHTML($("dsp"),spT); drawDepth(bids,asks); return; }
  h+='<div class="bth"><div><span>'+esc(t("qty"))+'</span><span>'+esc(t("bidP"))+'</span></div><div><span>'+esc(t("askP"))+'</span><span>'+esc(t("qty"))+'</span></div></div><div class="book"><div class="col bid">';
  bids.forEach(function(x){ h+='<div><i style="width:'+(x[2]/mx*100).toFixed(1)+'%;background:var(--cu)"></i><span>'+qty(x[1])+'</span><span class="up">'+fpx(x[0])+'</span></div>'; });
  h+='</div><div class="col ask">';
  asks.forEach(function(x){ h+='<div><i style="width:'+(x[2]/mx*100).toFixed(1)+'%;background:var(--cd)"></i><span class="dn">'+fpx(x[0])+'</span><span>'+qty(x[1])+'</span></div>'; });
  h+='</div></div><div class="spread">'+esc(t("spread",sp==null?"--":fpx(sp)+" · "+(sp/mid*100).toFixed(4)+"%"))+'</div>';
  setHTML(el,h);
}
function drawDepth(bids,asks){
  var c=$("depth"); if(!c) return; var w=c.clientWidth||320, h=170, dpr=window.devicePixelRatio||1, g=c.getContext("2d");
  c.width=w*dpr; c.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  if(!bids.length||!asks.length) return;
  var lo=bids[bids.length-1][0], hi=asks[asks.length-1][0], mx=Math.max(bids[bids.length-1][2],asks[asks.length-1][2]);
  function X(p){ return (p-lo)/(hi-lo)*w; } function Y(v){ return h-16-(v/mx)*(h-26); }
  [[bids,upC()],[asks,dnC()]].forEach(function(s){ var a=s[0], col=s[1]; g.beginPath(); g.moveTo(X(a[0][0]),h-16);
    a.forEach(function(x){ g.lineTo(X(x[0]),Y(x[2])); }); g.lineTo(X(a[a.length-1][0]),h-16); g.closePath();
    g.fillStyle=col; g.globalAlpha=.18; g.fill(); g.globalAlpha=1; g.strokeStyle=col; g.lineWidth=1.4; g.beginPath();
    a.forEach(function(x,i){ if(i) g.lineTo(X(x[0]),Y(x[2])); else g.moveTo(X(x[0]),Y(x[2])); }); g.stroke(); });
  g.fillStyle=cssVar("--sub"); g.font="10px -apple-system,system-ui,sans-serif"; g.textBaseline="bottom";
  g.textAlign="left"; g.fillText(fpx(lo),2,h-2); g.textAlign="right"; g.fillText(fpx(hi),w-2,h-2);
  g.textAlign="center"; g.fillText(fpx((bids[0][0]+asks[0][0])/2),w/2,h-2); g.textAlign="left"; g.textBaseline="top"; g.fillText(qty(mx),2,4);
}
function paintTrades(){
  var a=S.trades||[], el=$("trades"), m=szMul();
  if(!a.length){ el.innerHTML='<div class="state">'+esc(S.fail?t("failCold"):t("kLoading"))+'</div>'; $("trInfo").textContent=""; return; }
  var rows=a.map(function(x){ var p=num(x.px), s=num(x.sz)*m; return {ts:+x.ts,p:p,s:s,v:p*s,buy:x.side==="buy"}; });
  var vs=rows.map(function(r){return r.v;}).sort(function(x,y){return x-y;}), th=Math.max(10000,vs[Math.floor(vs.length*0.9)]||0);
  var bv=rows.filter(function(r){return r.buy;}).reduce(function(s,r){return s+r.v;},0), tv=rows.reduce(function(s,r){return s+r.v;},0);
  $("trInfo").textContent=t("trSum",rows.length).replace("%s",tv?(bv/tv*100).toFixed(0)+"%":"--");
  var h='<div class="tr th"><span>'+esc(t("tTime"))+'</span><span>'+esc(t("tPx"))+'</span><span>'+esc(t("tQty"))+'</span><span>'+esc(t("tAmt"))+'</span></div>';
  rows.slice(0,16).forEach(function(r){ h+='<div class="tr'+(r.v>=th?" big":"")+'"><span>'+hhmmss(r.ts)+'</span><span class="'+(r.buy?"up":"dn")+'">'+fpx(r.p)+'</span><span>'+qty(r.s)+'</span><span>'+big(r.v,"$")+'</span></div>'; });
  el.innerHTML=h;
}
function spark(id,vals,opt){
  var c=$(id); if(!c) return; var w=c.clientWidth||150, h=46, dpr=window.devicePixelRatio||1, g=c.getContext("2d");
  c.width=w*dpr; c.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  var v=vals.filter(function(x){return x!=null;}); if(v.length<2) return;
  if(opt&&opt.bars){ var mx=Math.max.apply(null,v.map(Math.abs))||1, bw=w/vals.length; var z=opt.twoSide?h/2:h-1;
    vals.forEach(function(x,i){ if(x==null) return; var bh=Math.abs(x)/mx*(opt.twoSide?h/2-2:h-3); g.fillStyle=x>=0?upC():dnC();
      g.fillRect(i*bw+bw*0.15,x>=0?z-bh:z,Math.max(1,bw*0.7),Math.max(1,bh)); }); return; }
  var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v); if(hi===lo){ hi+=1; lo-=1; }
  var col=opt&&opt.col||cssVar("--src"); g.strokeStyle=col; g.lineWidth=1.6; g.beginPath();
  vals.forEach(function(x,i){ var X=i/(vals.length-1)*w, Y=3+(hi-x)/(hi-lo)*(h-6); if(i) g.lineTo(X,Y); else g.moveTo(X,Y); }); g.stroke();
  if(opt&&opt.ref!=null&&opt.ref>lo&&opt.ref<hi){ var ry=3+(hi-opt.ref)/(hi-lo)*(h-6); g.strokeStyle=cssVar("--line"); g.setLineDash([2,3]); g.beginPath(); g.moveTo(0,ry); g.lineTo(w,ry); g.stroke(); g.setLineDash([]); }
}
function paintDeriv(){
  $("derivw").classList.toggle("hidden",!S.hasSwap); if(!S.hasSwap) return;
  $("dInfo").textContent=t("allC");
  var f=S.fund, fr=num(f&&f.fundingRate), iv=fundIv(), h="";
  h+='<div class="dcard"><small>'+esc(t("fHist"))+'</small><b class="'+(fr!=null&&Math.abs(fr)>=0.00005?(fr>0?"up":"dn"):"")+'">'+(fr==null?"--":signed(fr*100,4,"%"))+'</b><em>'+
    esc(t("every",iv))+' · '+esc(t("annual",fr==null?"--":signed(fr*(24/iv)*365*100,1,"%")))+'</em><canvas id="spF"></canvas></div>';
  var o=S.rOi||[], oiL=o.length?o[o.length-1][1]:null, oi0=o.length?o[0][1]:null, oiC=oiL&&oi0?(oiL-oi0)/oi0*100:null;
  h+='<div class="dcard"><small>'+esc(t("oiC"))+'</small><b>'+big(oiL,"$")+'</b><em><span class="'+cls(oiC)+'">'+pct(oiC)+'</span> · 24h</em><canvas id="spO"></canvas></div>';
  var l=S.rLsr||[], lv=l.length?l[l.length-1][1]:null, lp=lv!=null?lv/(1+lv)*100:null;
  h+='<div class="dcard"><small>'+esc(t("lsr"))+'</small><b>'+(lv==null?"--":lv.toFixed(2))+'</b><em>'+esc(lp==null?t("noData"):t("lsrSub",lp.toFixed(1)+"%").replace("%s",(100-lp).toFixed(1)+"%"))+'</em><canvas id="spL"></canvas></div>';
  var tk=S.rTk||[], net=tk.reduce(function(s,x){ return s+(x[2]||0)-(x[1]||0); },0);
  /* rubik taker-volume:[ts, sellVol, buyVol](USD)。 */
  h+='<div class="dcard"><small>'+esc(t("taker"))+'</small><b class="'+cls(net)+'">'+(tk.length?(net>=0?"+":"−")+big(Math.abs(net),"$"):"--")+'</b><em>'+esc(tk.length?t(net>=0?"takerSub":"takerSubS",""):t("noData")).replace(/\s*$/,"")+'</em><canvas id="spT"></canvas></div>';
  $("deriv").innerHTML=h;
  spark("spF",(S.fhist||[]).map(function(x){return x[1];}),{bars:true,twoSide:true});
  spark("spO",o.map(function(x){return x[1];}));
  spark("spL",l.map(function(x){return x[1];}),{ref:1,col:cssVar("--accent")});
  spark("spT",tk.map(function(x){ return (x[2]||0)-(x[1]||0); }),{bars:true,twoSide:true});
  paintLiq();
}
function paintLiq(){
  var a=(S.liq||[]).filter(function(x){ return Date.now()-(+x.ts)<3600e3; }), m=S.ctVal||1, lv=0, sv=0;
  a.forEach(function(x){ var v=num(x.sz)*m*num(x.bkPx); if(x.posSide==="long") lv+=v; else sv+=v; });
  var h='<div class="liqsum"><div><small>'+esc(t("longL"))+'</small><b class="dn">'+big(lv,"$")+'</b></div><div><small>'+esc(t("shortL"))+'</small><b class="up">'+big(sv,"$")+'</b></div></div>';
  if(!a.length) h+='<div class="state" style="padding:6px">'+esc(t("noLiq"))+'</div>';
  a.slice(0,8).forEach(function(x){ var lg=x.posSide==="long"; h+='<div class="lrow"><span>'+hhmm(+x.ts)+'</span><span class="'+(lg?"dn":"up")+'">'+esc(t(lg?"longL":"shortL"))+'</span><span>'+fpx(x.bkPx)+'</span><span>'+big(num(x.sz)*m*num(x.bkPx),"$")+'</span></div>'; });
  $("liq").innerHTML=h;
}
function paintBars(){
  var B=I18N[LANG].bars||I18N.zh.bars;
  setHTML($("bars"),BARS.map(function(b){ return '<button data-bar="'+b+'" class="'+(CH.bar===b?"on":"")+'">'+esc(B[b])+'</button>'; }).join(""));
  setHTML($("ovs"),OVS.map(function(b){ return '<button data-ov="'+b+'" class="'+(CH.ov===b?"on":"")+'">'+esc(b==="none"?t("none"):b)+'</button>'; }).join(""));
  setHTML($("subs"),SUBS.filter(function(b){ return b!=="FUND"||S.hasSwap; }).map(function(b){ return '<button data-sub="'+b+'" class="'+(CH.sub===b?"on":"")+'">'+esc(b==="FUND"?t("fundBtn"):b)+'</button>'; }).join(""));
}
var ICO={bell:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  zap:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  pct:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>'};
function paintAlerts(){
  var a=[["price",ICO.bell,"aPrice","aPriceS"],["move",ICO.zap,"aMove","aMoveS"]]; if(S.hasSwap) a.push(["funding",ICO.pct,"aFund","aFundS"]);
  $("alerts").style.gridTemplateColumns="repeat("+a.length+",1fr)";
  setHTML($("alerts"),a.map(function(x){ return '<button class="abtn" data-alert="'+x[0]+'" type="button">'+x[1]+'<span>'+esc(t(x[2]))+'</span><small>'+esc(t(x[3]))+'</small></button>'; }).join(""));
}
/* 实时页:绿点 + HH:mm:ss(xbAt live 档);10 秒没拉成 / 这一轮失败 → 灰点;还没拉成过 → 只剩图标。 */
function paintAnchor(busy){ var el=$("anchor");
  if(S.lastOk) xbAt.set(el,S.lastOk,{live:1,off:!(Date.now()-S.lastOk<10000&&!S.fail)}); else xbAt.set(el,null);
  xbAt.busy(el,busy); }
function paintAll(){ paintHead(); paintPx(); paintStats(); paintBars(); draw(); paintBook(); paintTrades(); paintDeriv(); paintAlerts(); paintAnchor(false);
  document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent=t(e.getAttribute("data-i")); });
  $("foot").textContent=t("foot"); $("kinfo").textContent=CH.data.length?CH.data.length+" · "+(I18N[LANG].bars||I18N.zh.bars)[CH.bar]:""; }

/* ─────────────── 节律 ─────────────── */
var nT=0;
async function refresh(force){
  nT++; if(force) paintAnchor(true);
  var swapP=loadSwapInfo().catch(function(e){ if(S.hasSwap==null&&/okx 5\d/.test(String(e&&e.message))) S.hasSwap=false; });
  var jobs=[loadLive(), swapP];
  if(force||nT%5===0) jobs.push(loadK(false).catch(function(){}));
  /* 慢数据要等 loadSwapInfo 判出「有没有永续」再取;取完单独重画合约区,不拖住 2 秒那一轮。 */
  if(force||nT%5===1) swapP.then(loadSlow).then(paintDeriv,paintDeriv);
  var rs=await Promise.all(jobs.map(function(p){ return p.then(function(){return 1;},function(){return 0;}); }));
  S.fail=!rs[0]; if(!S.fail){ S.lastOk=Date.now(); if(Date.now()-(S.cachedAt||0)>15000){ S.cachedAt=Date.now(); cachePut("c.cx.coin.tk."+INST,{tk:S.tk,fund:S.fund,oi:S.oi,hasSwap:S.hasSwap,ctVal:S.ctVal}); } }
  else if(force) toast(t(S.lastOk?"fail":"failCold"));
  paintHead(); paintPx(); paintStats(); draw(); paintBook(); paintTrades(); paintAnchor(false);
  paintAlerts(); if(S.hasSwap&&!$("spF")) paintDeriv();
}
var poll=Poller(refresh,1000);

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-bar]"); if(b){ CH.bar=b.getAttribute("data-bar"); CH.data=[]; CH.follow=true; CH.count=64; sSet("c.pref.bar",CH.bar); haptic(); paintBars(); draw(); loadK(true).then(function(){ paintAll(); ensureFundCover(); }); return; }
  var o=e.target.closest("[data-ov]"); if(o){ CH.ov=o.getAttribute("data-ov"); sSet("c.pref.ov",CH.ov); paintBars(); draw(); return; }
  var s=e.target.closest("[data-sub]"); if(s){ CH.sub=s.getAttribute("data-sub"); sSet("c.pref.sub",CH.sub); paintBars(); draw(); ensureFundCover(); return; }
  var bm=e.target.closest("[data-bm]"); if(bm){ S.bmode=bm.getAttribute("data-bm"); paintBook(); return; }
  var md=e.target.closest("[data-mode]"); if(md){ var m=md.getAttribute("data-mode"); if(m!==S.mode){ S.mode=m; CH.data=[]; CH.follow=true; S.book=null; S.trades=[];
      haptic(); paintAll(); loadK(true); refresh(true); } return; }
  var al=e.target.closest("[data-alert]"); if(al){ addAlert(al.getAttribute("data-alert")); return; }
});
async function addAlert(id){
  if(!window.xbridge) return;
  /* params 只是预填:币种填成这一页的币,价格提醒再把价位预填成现价(改一个数就是自己的线)。 */
  var k=tkOf(cur()), last=num(k&&k.last), p={pair:SPOT||SWAP};
  if(id==="price"&&last!=null) p.price=String(+last.toPrecision(4));
  try{ var r=await call(xbridge.alertAdd({id:id,params:p})); if(r==="ok") toast(t("aOk")); else if(r==="quota") toast(t("aQuota")); }catch(e){}
}
$("star").addEventListener("click",function(){
  var key=SPOT||SWAP, i=-1; [INST,SPOT,SWAP].forEach(function(x){ if(i<0&&x) i=S.wl.indexOf(x); });
  if(i>=0){ S.wl.splice(i,1); toast(t("removed")); } else { if(S.wl.length>=WL_MAX){ toast(t("full")); return; } S.wl.push(key); toast(t("added")); }
  haptic("success"); wlSave(S.wl); paintHead();
});
$("anchor").addEventListener("click",function(){ haptic(); refresh(true); });
$("pickw").addEventListener("click",function(){
  if(!window.xbridge) return; var p={pair:SPOT||SWAP,name:BASE};
  var items=[{id:"term",params:p},{id:"mini",params:p},{id:"coin",params:p},{id:"detail",params:p},{id:"perf",params:p},{id:"flow",params:p}];
  if(S.hasSwap) items.push({id:"deriv",params:p});
  /* K 线两张带上此刻图表的周期(1 分 / 5 分 / 15 分组件不支持,落回日线)。 */
  var st={"1H":"3600","4H":"14400","1Dutc":"86400","1Wutc":"604800"}[CH.bar]||"86400", pk={pair:p.pair,name:p.name,step:st};
  items.push({id:"kday",params:pk},{id:"kmid",params:pk}); xbridge.pickWidgets(items);
});
addEventListener("resize",function(){ draw(); if(S.bmode==="depth") paintBook(); });

(async function(){
  var has=await ready();
  await bootEnv(function(){ paintAll(); });
  paintAll();
  if(!has){ $("book").innerHTML='<div class="state">'+esc(t("notX"))+'</div>'; return; }
  S.wl=await wlLoad();
  var pb=await sGet("c.pref.bar"), po=await sGet("c.pref.ov"), ps=await sGet("c.pref.sub");
  if(BARS.indexOf(pb)>=0) CH.bar=pb; if(OVS.indexOf(po)>=0) CH.ov=po; if(SUBS.indexOf(ps)>=0) CH.sub=ps;
  var c=await cacheGet("c.cx.coin.tk."+INST);
  if(c){ S.tk=c.d.tk||{}; S.fund=c.d.fund; S.oi=c.d.oi; S.hasSwap=c.d.hasSwap; S.ctVal=c.d.ctVal; S.lastOk=c.t; }
  paintAll();
  await Promise.all([loadK(true), refresh(true)]);
  paintAll();
  poll.start();
  setInterval(function(){ if(document.visibilityState==="hidden") return; var el=$("cd"); if(el&&S.fund) el.textContent=cdown(+S.fund.fundingTime);
    paintAnchor($("anchor").classList.contains("busy")); },1000);
})();
})();

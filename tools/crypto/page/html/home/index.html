}
/* 按行更新:行序(data-go)没变就逐行替换有变化的行,并把**旧的头像节点**搬进新行 ——
   整块 innerHTML 每 5 秒重建一遍,<img> 跟着重新加载,图标会一直闪。行序变了(换 tab / 排序 / 增删)才整块重建。 */
function patchRows(el,h){
  var tmp=document.createElement("div"); tmp.innerHTML=h;
  var olds=el.children, news=tmp.children, same=olds.length===news.length;
  for(var i=0;same&&i<news.length;i++){ var k=news[i].getAttribute("data-go"); if(!k||olds[i].getAttribute("data-go")!==k) same=false; }
  if(!same){ el.innerHTML=h; return; }
  for(var j=news.length-1;j>=0;j--){ var o=olds[j], n=news[j]; if(o.innerHTML===n.innerHTML) continue;
    var oa=o.querySelector(".av"), na=n.querySelector(".av"); if(oa&&na) na.parentNode.replaceChild(oa,na);
    el.replaceChild(n,o); }
}
function paintAll(){ paintAnchor(false); paintLede(); paintMood(); paintBreadth(); paintTabs(); paintHead(); paintList();
  $("addrow").textContent=t("addrow"); $("foot").textContent=t("foot");
  document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent=t(e.getAttribute("data-i")); }); }

/* ── 刷新 ── */
function snapshot(){ var tk={}; S.wl.forEach(function(id){ if(S.tk[id]) tk[id]=S.tk[id]; });
  var fund={}; S.wl.concat(["BTC-USDT"]).forEach(function(id){ var s=swapOf(id); if(S.fund[s]) fund[s]=S.fund[s]; });
  return {tk:tk,fund:fund,macro:S.macro,spotLite:S.spot?S.spot.map(function(r){ return [r.id,r.c,r.k.volq,r.k.last]; }):null,lastOk:S.lastOk}; }
var nTick=0;
async function refresh(force){
  S.lastTry=Date.now(); paintAnchor(true); nTick++;
  var tab=S.tab, jobs=[loadWatch()];
  jobs.push(loadSpot(force,(tab==="gain"||tab==="lose"||tab==="vol")?15000:60000).catch(function(){}));
  jobs.push(loadFund().catch(function(){}));
  jobs.push(loadMacro().catch(function(){}));
  if(tab==="fund"||tab==="oi") jobs.push(loadSwap().catch(function(){}));
  if(tab==="oi") jobs.push(loadOi().catch(function(){}));
  var rs=await Promise.all(jobs.map(function(p){ return p.then(function(){return true;},function(){return false;}); }));
  S.fail=!rs[0]; if(!S.fail) S.lastOk=Date.now();
  if(S.fail&&force) toast(t(S.lastOk?"fail":"failCold"));
  paintAll();
  if(!S.fail&&Date.now()-(S.cachedAt||0)>15000){ S.cachedAt=Date.now(); cachePut(CKEY,snapshot()); }
}
var poll=Poller(refresh,3000);

/* ── 交互 ── */
document.addEventListener("click",function(e){
  var st=e.target.closest("[data-star]"); if(st){ e.stopPropagation(); toggleWatch(st.getAttribute("data-star")); return; }
  var tb=e.target.closest("[data-tab]"); if(tb){ var k=tb.getAttribute("data-tab"); if(k!==S.tab){ S.tab=k; S.sort={k:"",d:-1}; sSet("c.pref.tab",k); haptic(); paintAll(); refresh(false); } return; }
  var fs=e.target.closest("[data-fs]"); if(fs){ S.fundSide=fs.getAttribute("data-fs"); paintAll(); return; }
  var so=e.target.closest("[data-sort]"); if(so){ var k2=so.getAttribute("data-sort");
    if(S.sort.k!==k2) S.sort={k:k2,d:k2==="name"?1:-1}; else if(S.sort.d===(k2==="name"?1:-1)) S.sort.d=-S.sort.d; else S.sort={k:"",d:-1};
    paintList(); paintHead(); return; }
  var g=e.target.closest("[data-go]"); if(g){ var id=g.getAttribute("data-go"); poll.leave();
    go("/coin?pair="+encodeURIComponent(id)+"&name="+encodeURIComponent(baseOf(id))); return; }
});
function toggleWatch(id){
  var sp=spotOf(id), key=S.tk[sp]||!isSwap(id)?sp:id, i=S.wl.indexOf(key);
  if(i<0&&S.wl.indexOf(id)>=0){ key=id; i=S.wl.indexOf(id); }
  if(i>=0){ S.wl.splice(i,1); toast(t("removed")); }
  else { if(S.wl.length>=WL_MAX){ toast(t("full")); return; } S.wl.push(key); toast(t("added")); }
  haptic("success"); wlSave(S.wl); paintList(); paintLede();
}
$("anchor").addEventListener("click",function(){ haptic(); refresh(true); });
$("addrow").addEventListener("click",function(){ poll.leave(); go("/manage"); });
$("pickw").addEventListener("click",function(){
  if(!window.xbridge) return;
  var p=S.wl[0]||"BTC-USDT", nm=baseOf(p);
  /* 首页没有「当前对象」:单币类组件带自选第一个,面板里可再换。 */
  var o={pair:p,name:nm}, w5={};
  S.wl.slice(0,5).forEach(function(id,i){ w5["p"+(i+1)]=id; w5["n"+(i+1)]=baseOf(id); });
  /* 先放「看全局」的(自选 / 看板 / 情绪),再放单币的;五币类组件带上自选前五个(不足五个时组件自己用默认值补)。 */
  xbridge.pickWidgets([{id:"top",params:w5},{id:"heat"},{id:"dboard",params:w5},{id:"moodw"},{id:"mood"},
    {id:"term",params:o},{id:"mini",params:o},{id:"coin",params:o},{id:"detail",params:o},{id:"perf",params:o},
    {id:"flow",params:o},{id:"deriv",params:o},{id:"kday",params:o},{id:"kmid",params:o}]);
});
/* 从管理页 / 详情页(☆)回来时自选可能变了。 */
async function resync(){ var w=await wlLoad(); if(w.join(",")!==S.wl.join(",")){ S.wl=w; paintAll(); refresh(false); } }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") resync(); });
addEventListener("focus",resync); addEventListener("pageshow",resync);

(async function(){
  var has=await ready();
  await bootEnv(function(){ paintAll(); });
  paintAll();
  if(!has){ $("list").innerHTML='<div class="state">'+esc(t("notX"))+'</div>'; return; }
  S.wl=await wlLoad();
  var tab=await sGet("c.pref.tab"); if(TABS.indexOf(tab)>=0) S.tab=tab;
  var c=await cacheGet(CKEY);
  if(c){ var d=c.d; S.tk=d.tk||{}; S.fund=d.fund||{}; S.macro=d.macro||null; S.lastOk=d.lastOk||c.t;
    if(d.spotLite) S.spot=d.spotLite.map(function(r){ return {id:r[0],c:r[1],k:{volq:r[2],last:r[3]}}; }); }
  paintAll();
  await refresh(false);
  poll.start();
  setInterval(function(){ if(document.visibilityState!=="hidden"){ paintAnchor($("anchor").classList.contains("busy")); if(S.tab==="fund") paintMood(); } },1000);
})();
})();
</script>
